"Medium", "sourceType": "Standards Question"}, {"id": 330, "question": "Diagnostic, formative and summative assessment take place, in that order:", "options": ["At the end, before and during training, in that order", "Only at the end of training, when marks are final", "Before, during and at the end of training", "During, after and before training, in that order"], "correctAnswer": "C", "explanation": "Standard 5.1.1: the three assessment types and when they are applied.", "category": "Evaluation & Reporting", "domain": "Professional Practices", "difficulty": "Medium", "sourceType": "Standards Question"}, {"id": 331, "question": "Why are several assessment tools used within one programme?", "options": ["To avoid giving feedback until the programme has ended", "To measure different outcomes and levels of performance", "To collect less evidence so that reporting is quicker", "To make the course longer and give trainees more to do"], "correctAnswer": "B", "explanation": "Standard 5.1: varied tools give a fuller picture of achievement.", "category": "Evaluation & Reporting", "domain": "Professional Practices", "difficulty": "Medium", "sourceType": "Standards Question"}, {"id": 332, "question": "Which action shows that a trainer applies the code of ethics?", "options": ["Ignoring organisational policies when they slow the course down", "Treating all trainees fairly and keeping assessments honest", "Publishing every trainee's marks on an open noticeboard", "Favouring trainees who agree with the trainer's own views"], "correctAnswer": "B", "explanation": "Standard 6.1.1: commitment to the training code of ethics in practice.", "category": "Ethics & Quality Assurance", "domain": "Professional Values and Responsibilities", "difficulty": "Medium", "sourceType": "Standards Question"}, {"id": 333, "question": "Quality assurance in training means:", "options": ["Applying systems and procedures that keep standards consistent and improving", "Reducing the number of course hours to cut running costs", "Testing trainees only once, at the end of the programme", "Ignoring feedback unless a formal complaint is made"], "correctAnswer": "A", "explanation": "Standard 6.1.3: apply quality assurance systems and procedures.", "category": "Ethics & Quality Assurance", "domain": "Professional Values and Responsibilities", "difficulty": "Medium", "sourceType": "Standards Question"}, {"id": 334, "question": "A trainer often arrives late and misses deadlines. Which professional value is affected?", "options": ["Discipline and responsibility", "Generosity towards colleagues and visitors", "Respect for national symbols and ceremonies", "Creativity in the design of lesson materials"], "correctAnswer": "A", "explanation": "Standard 6.2.2: discipline and responsibility, finishing tasks on time.", "category": "Ethics & Quality Assurance", "domain": "Professional Values and Responsibilities", "difficulty": "Easy", "sourceType": "Standards Question"}, {"id": 335, "question": "Which is a trainee's right that the trainer must respect?", "options": ["Seeing the personal data and results of other trainees", "Choosing their own marks after the assessment is complete", "Fair treatment and clear information about how they will be assessed", "Skipping any assessment they dislike without consequences"], "correctAnswer": "C", "explanation": "Standard 6.2.1: awareness of professional rights and duties on both sides.", "category": "Ethics & Quality Assurance", "domain": "Professional Values and Responsibilities", "difficulty": "Medium", "sourceType": "Standards Question"}, {"id": 336, "question": "A new regulation changes how training records must be kept. What should the trainer do?", "options": ["Keep using the old method because it has always worked", "Wait for trainees to ask about the change in practice", "Follow the regulation and update practice and records", "Ignore it until an audit or inspection takes place"], "correctAnswer": "C", "explanation": "Standard 6.1.2: apply the policies and regulations that govern training.", "category": "Ethics & Quality Assurance", "domain": "Professional Values and Responsibilities", "difficulty": "Medium", "sourceType": "Standards Question"}, {"id": 337, "question": "How can a trainer show responsible citizenship through training?", "options": ["Put personal views above regulations when they conflict", "Avoid any discussion of values to prevent disagreement", "Respect national values and regulations, and prepare trainees to contribute to the community", "Treat regulations as optional guidance for experienced trainers"], "correctAnswer": "C", "explanation": "Standard 7.1: citizenship values in professional relationships and practice.", "category": "Citizenship, Integrity & Confidentiality", "domain": "Professional Values and Responsibilities", "difficulty": "Medium", "sourceType": "Standards Question"}, {"id": 338, "question": "A trainer copies a colleague's worksheet and presents it as their own. Which value is breached?", "options": ["Academic integrity and intellectual property", "Teamwork and shared responsibility", "Hospitality towards visitors and guests", "Punctuality and reliable timekeeping"], "correctAnswer": "A", "explanation": "Standard 7.2: integrity, academic honesty and intellectual-property principles.", "category": "Citizenship, Integrity & Confidentiality", "domain": "Professional Values and Responsibilities", "difficulty": "Medium", "sourceType": "Standards Question"}, {"id": 339, "question": "Which practice breaches confidentiality?", "options": ["Sharing results only with the trainee concerned", "Keeping records in secure systems with restricted access", "Discussing a trainee's results with colleagues who have no need to know", "Protecting digital files with passwords and encryption"], "correctAnswer": "C", "explanation": "Standard 7.2.4: protect the confidentiality of trainee data.", "category": "Citizenship, Integrity & Confidentiality", "domain": "Professional Values and Responsibilities", "difficulty": "Medium", "sourceType": "Standards Question"}, {"id": 340, "question": "In a heated discussion, which response best shows moderation?", "options": ["Allow all views, keep to evidence, and insist on respectful language", "Let the loudest participant decide the direction of the discussion", "Ban the topic so that no disagreement can arise", "Ridicule the most extreme view so that others stay quiet"], "correctAnswer": "A", "explanation": "Standard 7.1.2: tolerance and moderation, justice and objectivity.", "category": "Citizenship, Integrity & Confidentiality", "domain": "Professional Values and Responsibilities", "difficulty": "Medium", "sourceType": "Standards Question"}, {"id": 341, "question": "What is the first step in preparing a professional development plan?", "options": ["Choose the cheapest available course and enrol immediately", "Copy a colleague's plan and apply it without changes", "Wait until a supervisor assigns a plan for the year", "Analyse your own practice and evaluation feedback to identify needs"], "correctAnswer": "D", "explanation": "Standard 8.3: the plan is based on analysis of practice and feedback.", "category": "Professional Development", "domain": "Professional Values and Responsibilities", "difficulty": "Medium", "sourceType": "Standards Question"}, {"id": 342, "question": "What is a professional learning community?", "options": ["A list of certificates and courses a trainer has completed", "A social group of colleagues who meet only to relax", "A group of professionals who share practice and learn together to improve their work", "A group of trainees who attend the same class together"], "correctAnswer": "C", "explanation": "Standard 8.2.2: participate in professional learning communities.", "category": "Professional Development", "domain": "Professional Values and Responsibilities", "difficulty": "Easy", "sourceType": "Standards Question"}, {"id": 343, "question": "Which habit best helps a trainer keep up with developments in training and the labour market?", "options": ["Relying on older textbooks that are known and trusted", "Avoiding new tools until the organisation requires them", "Following current research, journals and market trends", "Reusing the same notes every year to keep content stable"], "correctAnswer": "C", "explanation": "Standard 8.1: follow scientific developments and labour-market trends.", "category": "Professional Development", "domain": "Professional Values and Responsibilities", "difficulty": "Medium", "sourceType": "Standards Question"}, {"id": 344, "question": "A trainer wants to tackle a recurring problem, such as low participation. Which action fits professional development?", "options": ["Wait for the problem to disappear by itself over time", "Investigate the problem, test solutions and share the findings", "Blame the trainees and raise the pass mark", "Ignore it because every group is slightly different"], "correctAnswer": "B", "explanation": "Standard 8.2.1: research training problems and propose solutions.", "category": "Professional Development", "domain": "Professional Values and Responsibilities", "difficulty": "Hard", "sourceType": "Standards Question"}, {"id": 345, "question": "How should a trainer monitor progress against a development plan?", "options": ["Never review the plan, to avoid becoming discouraged", "Review indicators and evidence of progress at set intervals", "Ask only the trainees, who may not know the plan", "Check progress once at the end of five years"], "correctAnswer": "B", "explanation": "Standard 8.3.3–8.3.4: the plan has indicators, and progress is tracked with tools.", "category": "Professional Development", "domain": "Professional Values and Responsibilities", "difficulty": "Medium", "sourceType": "Standards Question"}, {"id": 346, "question": "Self-reflection supports development mainly by:", "options": ["Avoiding change so that practice stays consistent", "Replacing all outside feedback with the trainer's own opinion", "Counting attendance figures as the main measure of quality", "Analysing practice and setting development goals and priorities"], "correctAnswer": "D", "explanation": "Standard 8.3.1: self-reflection to analyse practice and set priorities.", "category": "Professional Development", "domain": "Professional Values and Responsibilities", "difficulty": "Medium", "sourceType": "Standards Question"}, {"id": 347, "question": "Which source of feedback is MOST useful for identifying development needs?", "options": ["Anonymous social-media comments about the programme", "One trainee's comment, taken as the whole picture", "The trainer's own mood on the day of the session", "Trainees, stakeholders and the training provider, analysed together"], "correctAnswer": "D", "explanation": "Standard 8.3.2: gather and analyse feedback from trainees, stakeholders and the provider.", "category": "Professional Development", "domain": "Professional Values and Responsibilities", "difficulty": "Hard", "sourceType": "Standards Question"}, {"id": 348, "question": "A trainer wants trainees to feel understood. Which behaviour shows empathy?", "options": ["Listening, acknowledging feelings and responding to needs", "Ignoring emotions so the session keeps to schedule", "Interrupting to correct them as soon as they make a mistake", "Moving quickly through the plan without pausing for reactions"], "correctAnswer": "A", "explanation": "Standard 9.3.2: empathy towards others in the training environment.", "category": "Social & Emotional Skills", "domain": "Future Skills", "difficulty": "Medium", "sourceType": "Standards Question"}, {"id": 349, "question": "The schedule changes at short notice. Which response shows adaptability?", "options": ["Stay calm, adjust the plan, and keep the learning outcomes", "Cancel the session until a better time can be arranged", "Blame others for the change and wait for instructions", "Carry on unchanged as though nothing had happened"], "correctAnswer": "A", "explanation": "Standard 9.3.3: adapt to change and work flexibly under pressure.", "category": "Social & Emotional Skills", "domain": "Future Skills", "difficulty": "Medium", "sourceType": "Standards Question"}, {"id": 350, "question": "Which is an example of active listening?", "options": ["Looking away to show that the point is understood", "Paraphrasing the trainee's point to confirm understanding", "Finishing the trainee's sentences to save time", "Checking messages while the trainee is speaking"], "correctAnswer": "B", "explanation": "Standard 9.1.1: listening and effective dialogue skills.", "category": "Social & Emotional Skills", "domain": "Future Skills", "difficulty": "Easy", "sourceType": "Standards Question"}, {"id": 351, "question": "A trainer wants to check that an online article is reliable. Which action is best?", "options": ["Trust the first search result because search engines rank by quality", "Trust the best-designed page because it looks professional", "Check the author, date, evidence and publisher", "Trust the most-shared version because many people agree with it"], "correctAnswer": "C", "explanation": "Standard 10.1.2 and 10.3.1: evaluate evidence and sources of information.", "category": "Thinking & Digital Skills", "domain": "Future Skills", "difficulty": "Medium", "sourceType": "Standards Question"}, {"id": 352, "question": "Which practice supports safe and responsible use of digital tools in training?", "options": ["Installing unknown software from unverified sources for a demo", "Using strong passwords and sharing content only with permission", "Using one familiar password everywhere to avoid forgetting it", "Posting trainees' ID numbers on a shared board for convenience"], "correctAnswer": "B", "explanation": "Standard 10.3.4: safe and responsible use of devices, software and online applications.", "category": "Thinking & Digital Skills", "domain": "Future Skills", "difficulty": "Medium", "sourceType": "Standards Question"}, {"id": 353, "question": "A trainer asks trainees to reflect on a past work problem before introducing a new method. Which idea does this use?", "options": ["Linking new learning to prior experience and reflection", "Testing trainees before any teaching has taken place", "Replacing experience with memorisation of the new method", "Avoiding any reference to what trainees did in the past"], "correctAnswer": "A", "explanation": "Standard 1.1 and 1.2: reflection on experience supports adult learning (compare Kolb's cycle).", "category": "Learning Theories & Trainees", "domain": "Professional Knowledge", "difficulty": "Medium", "sourceType": "Standards Question"}, {"id": 354, "question": "Which is an advantage of blended training over fully online training?", "options": ["It combines face-to-face practice with flexible online study", "It avoids assessment because trainees learn informally", "It needs no technology because most work is in class", "It removes the need for planning because trainees study alone"], "correctAnswer": "A", "explanation": "Standard 2.1: blended mode combines direct and e-training features.", "category": "Training Modes & Strategies", "domain": "Professional Knowledge", "difficulty": "Medium", "sourceType": "Standards Question"}, {"id": 355, "question": "A trainer wants to use a new digital tool in class. What should they do first?", "options": ["Use it live without testing, to save preparation time", "Avoid any backup plan, to keep the session simple", "Ask the trainees to fix any problems that appear", "Test it beforehand and prepare a fallback if it fails"], "correctAnswer": "D", "explanation": "Standard 10.3 and 3.1.2: safe, prepared use of digital tools with contingency planning.", "category": "Thinking & Digital Skills", "domain": "Future Skills", "difficulty": "Medium", "sourceType": "Standards Question"}, {"id": 356, "question": "A trainer labels three assessment moments in a course: a pre-course quiz, weekly quizzes, and a final exam. Which labels apply, in that order?", "options": ["Summative, diagnostic, formative", "Diagnostic, summative, formative", "Formative, summative, diagnostic", "Diagnostic, formative, summative"], "correctAnswer": "D", "explanation": "A pre-course quiz is diagnostic (finds starting points), weekly quizzes are formative (guide learning), the final exam is summative (judges achievement). Standard 2.3 and 5.1.", "category": "Professional Knowledge", "domain": "Professional Knowledge", "difficulty": "Medium", "sourceType": "Main Exam 2"}, {"id": 357, "question": "A trainer must choose an assessment tool for a hands-on skill. Which is MOST appropriate, and why?", "options": ["A multiple-choice test, because it is quick and easy to mark", "A practical observation checklist, because it measures real performance against criteria", "A reflective essay, because it gives detailed written evidence", "A satisfaction survey, because it shows whether trainees enjoyed it"], "correctAnswer": "B", "explanation": "Tools are chosen to fit what is being measured: a practical skill is judged by observing performance against criteria. Standard 2.3.2.", "category": "Professional Knowledge", "domain": "Professional Knowledge", "difficulty": "Hard", "sourceType": "Main Exam 2"}, {"id": 358, "question": "Before a hands-on workshop that uses sharp tools, which trainer action best applies occupational health and safety practice?", "options": ["Brief hazards and safe procedures, check protective equipment, and demonstrate correct use before practice", "Assume experienced trainees need no briefing and start practising", "Email written warnings after the session and check they were read", "Let trainees explore the tools first and correct any mistakes afterwards"], "correctAnswer": "A", "explanation": "Safety briefing, equipment checks and demonstration come BEFORE practice. Standard 4.1.4.", "category": "Professional Practices", "domain": "Professional Practices", "difficulty": "Medium", "sourceType": "Main Exam 2"}, {"id": 359, "question": "While researching for a course, an instructional designer finds a striking statistic with no author, date or source. What should they do?", "options": ["Use it if several social media posts repeat the same figure", "Use it with a note that it is unverified, and move on", "Verify it against reliable sources before using it", "Use it, because it makes the lesson more convincing"], "correctAnswer": "C", "explanation": "Critical thinking means evaluating evidence and sources before using information. Standard 10.1.2 and 10.3.1.", "category": "Future Skills", "domain": "Future Skills", "difficulty": "Medium", "sourceType": "Main Exam 2"}, {"id": 360, "question": "A trainee becomes visibly upset after critical feedback given in front of the group. Which response best shows empathy and emotional regulation?", "options": ["Tell them to be less sensitive and focus on the content", "Defend the feedback firmly in front of the group so others learn", "Ignore the reaction and carry on to keep the session on time", "Stay calm, acknowledge their feelings, and offer to talk privately"], "correctAnswer": "D", "explanation": "Empathy plus self-control protects the relationship and the learning climate. Standard 9.3.1–9.3.2.", "category": "Future Skills", "domain": "Future Skills", "difficulty": "Medium", "sourceType": "Main Exam 2"}, {"id": 361, "question": "A trainer's words are encouraging, but their arms are folded and their eyes stay on their notes. Which statement is MOST accurate?", "options": ["Non-verbal communication has little relevance in a training room", "The mismatched non-verbal cues weaken the message and the trainer's credibility", "Trainees will attend only to the words, so the cues do not matter", "Folded arms always show confidence and strong authority"], "correctAnswer": "B", "explanation": "Verbal and non-verbal messages should agree. Standard 9.1.2.", "category": "Future Skills", "domain": "Future Skills", "difficulty": "Medium", "sourceType": "Main Exam 2"}, {"id": 362, "question": "Which of these is a recognised principle of adult learning (andragogy)?", "options": ["Adults need rewards for every answer to stay engaged", "Adults prefer content that is unrelated to their jobs", "Adults learn best when every decision is made for them", "Adults are self-directed and want to know why they need to learn something"], "correctAnswer": "D", "explanation": "Knowles' principles stress self-direction, relevance and the need to know why. Standard 1.1.", "category": "Learning Theories & Concepts", "domain": "Professional Knowledge", "difficulty": "Medium", "sourceType": "Main Exam 3"}, {"id": 363, "question": "Which output is produced at the end of the Design stage and used in Development?", "options": ["A delivery report written after the course", "A course blueprint or storyboard", "Final trainee results and evaluation data", "A needs analysis summary of the performance gap"], "correctAnswer": "B", "explanation": "Design = blueprint. Development then builds the materials from it.", "category": "Instructional Design (ADDIE)", "domain": "Professional Knowledge", "difficulty": "Medium", "sourceType": "Main Exam 3"}, {"id": 364, "question": "Which feature does CIRO include that Kirkpatrick does NOT explicitly include?", "options": ["Behavior, which observes use of skills at work", "Learning, which tests knowledge after the course", "Reaction, which gathers trainee feedback after delivery", "Context and Input, which look at needs and resources"], "correctAnswer": "D", "explanation": "Kirkpatrick starts after delivery; CIRO also evaluates what comes before and during design.", "category": "Training Evaluation Models", "domain": "Professional Knowledge", "difficulty": "Hard", "sourceType": "Main Exam 3"}, {"id": 365, "question": "Which is the LEAST appropriate way to handle a trainee who keeps arriving late?", "options": ["Mocking them in front of colleagues", "Speaking to them privately", "Reminding everyone of the start time", "Asking about barriers"], "correctAnswer": "A", "explanation": "Public humiliation is never professional.", "category": "Least Important / Least Appropriate", "domain": "Professional Values and Responsibilities", "difficulty": "Medium", "sourceType": "Main Exam 3"}, {"id": 366, "question": "A TNA survey of 200 staff shows 70% are confident with the new software and 30% are not. Which response is MOST efficient?", "options": ["Replacing the software with something else", "Targeted training for the 30% only", "No action, since most are confident", "A full course for all 200 staff"], "correctAnswer": "B", "explanation": "Train only where the gap is.", "category": "Percentage & Training Method", "domain": "Professional Practices", "difficulty": "Medium", "sourceType": "Main Exam 3"}, {"id": 367, "question": "A trainee's result is judged against a fixed standard, not against other trainees' results. What is this called?", "options": ["Norm-referenced assessment", "Criterion-referenced assessment", "Self-assessment", "Diagnostic assessment"], "correctAnswer": "B", "explanation": "Criterion-referenced assessment compares each performance with set criteria. Standard 2.3.", "category": "Assessment Quality", "domain": "Professional Knowledge", "difficulty": "Medium", "sourceType": "Main Exam 3"}, {"id": 368, "question": "A course has two aims: (1) trainees learn product specifications at their own pace, and (2) trainees practise handling customer objections with live feedback. Which choice meets BOTH aims?", "options": ["Asynchronous only, with a discussion forum for questions", "Face-to-face only, with no pre-work for trainees", "Blended: self-paced modules plus a live practice session", "Synchronous only, with the specifications read aloud"], "correctAnswer": "C", "explanation": "Aim 1 suits self-paced study, aim 2 needs live feedback. Only a blend serves both.", "category": "Learning Delivery Methods", "domain": "Future Skills", "difficulty": "Hard", "sourceType": "Main Exam 3"}, {"id": 369, "question": "Which trend adapts content to each learner using data and AI?", "options": ["Adaptive, AI-powered learning", "A single annual exam for everyone", "One-size-fits-all lectures", "Fixed paper timetables"], "correctAnswer": "A", "explanation": "Personalisation is a major future trend.", "category": "Future Trends in Training", "domain": "Future Skills", "difficulty": "Medium", "sourceType": "Main Exam 3"}, {"id": 370, "question": "Which activity best reflects a constructivist approach to training?", "options": ["Trainees analyse cases from their own workplaces and build a new procedure from them", "Trainees copy a model procedure from the board word for word", "Trainees listen to a lecture and take the final test straight after", "Trainees repeat a drill until the trainer is satisfied with speed"], "correctAnswer": "A", "explanation": "Constructivism has learners build new knowledge on prior experience. Standard 1.2.", "category": "Learning Theories & Concepts", "domain": "Professional Knowledge", "difficulty": "Medium", "sourceType": "Main Exam 3"}, {"id": 371, "question": "Which statement about formative assessment is the LEAST accurate?", "options": ["It happens during training while learning is in progress", "It gives feedback that trainees can act on", "It helps the trainer adjust the next session", "Its main purpose is to give a final grade at the end of the programme"], "correctAnswer": "D", "explanation": "A final grade is the job of summative assessment; formative assessment supports learning during training. Standard 5.1.", "category": "Assessment Quality", "domain": "Professional Knowledge", "difficulty": "Medium", "sourceType": "Main Exam 3"}, {"id": 372, "question": "Which statement best distinguishes training from general education?", "options": ["Training builds specific job-related skills and knowledge for a defined purpose", "Training aims only to give general background knowledge", "Training is always delivered online", "Training has no objectives or assessment"], "correctAnswer": "A", "explanation": "Training is targeted at skills for a job or task. Standard 1.2: training concepts.", "category": "Learning Theories & Concepts", "domain": "Professional Knowledge", "difficulty": "Easy", "sourceType": "Main Exam 3"}, {"id": 373, "question": "A company wants employees to get quick answers on their phones while they work. Which trend is this?", "options": ["Residential seminars", "An annual classroom course", "Mobile and just-in-time learning", "Printed binders for each desk"], "correctAnswer": "C", "explanation": "Learning in the flow of work.", "category": "Future Trends in Training", "domain": "Future Skills", "difficulty": "Hard", "sourceType": "Main Exam 3"}, {"id": 374, "question": "Which action is the LEAST appropriate when a trainer cannot attend because of a personal issue?", "options": ["Arranging a replacement trainer where possible", "Informing the coordinator as early as possible", "Not telling anyone and failing to appear", "Proposing a new date for the session"], "correctAnswer": "C", "explanation": "Silence is the least professional option.", "category": "Least Important / Least Appropriate", "domain": "Professional Values and Responsibilities", "difficulty": "Medium", "sourceType": "Main Exam 3"}, {"id": 375, "question": "A survey shows 85% of trainees prefer practice to theory. Which method is best?", "options": ["A hands-on workshop with short theory", "A three-hour lecture with slides", "A long passive video marathon", "A reading-only course with a final test"], "correctAnswer": "A", "explanation": "Use the data to choose the method.", "category": "Percentage & Training Method", "domain": "Professional Practices", "difficulty": "Medium", "sourceType": "Main Exam 3"}, {"id": 376, "question": "To emphasise a key point, which gesture is best?", "options": ["Pointing at one individual in the group", "Rapid, repeated waving of both hands", "An open gesture between waist and shoulders", "Slapping the table to get attention"], "correctAnswer": "C", "explanation": "Purposeful, controlled gestures support the message.", "category": "Hand Placement", "domain": "Professional Practices", "difficulty": "Medium", "sourceType": "Main Exam 3"}, {"id": 377, "question": "When you are not gesturing, which hand position is generally recommended while presenting?", "options": ["Relaxed and visible, at your sides", "Clasped firmly behind your back", "Folded across your chest the whole time", "Tucked into your pockets for comfort"], "correctAnswer": "A", "explanation": "Neutral, visible hands look confident.", "category": "Hand Placement", "domain": "Professional Practices", "difficulty": "Easy", "sourceType": "Main Exam 3"}, {"id": 378, "question": "A trainer uses a vocabulary quiz to decide whether trainees can operate a machine safely. Which quality is lacking?", "options": ["Validity, because the quiz does not measure the skill claimed", "Reliability, because the quiz was marked twice", "Practicality, because quizzes are too slow to mark", "Fairness, because everyone took the same quiz"], "correctAnswer": "A", "explanation": "Validity means the tool measures what it is meant to measure; a vocabulary quiz does not measure operating skill. Standard 2.3.2.", "category": "Assessment Quality", "domain": "Professional Knowledge", "difficulty": "Hard", "sourceType": "Main Exam 3"}, {"id": 379, "question": "Trainees start packing up 20 minutes before the end, saying the content is finished. What is the BEST response?", "options": ["Extend the session by an hour as a punishment", "Let everyone leave because the content is finished", "Ignore the packing up and carry on teaching", "Remind them of the end time and use the time for a summary"], "correctAnswer": "D", "explanation": "Keep to the agreed schedule and add value to the remaining time.", "category": "Managing Training Sessions", "domain": "Professional Values and Responsibilities", "difficulty": "Medium", "sourceType": "Main Exam 3"}, {"id": 380, "question": "A nervous trainer is unsure what to do with their hands at the start. Which approach is recommended?", "options": ["Keep them in pockets until nerves pass", "Pick one neutral position and practise it", "Grip the podium tightly for support until the nerves have passed", "Fold them across the chest so that they are out of sight"], "correctAnswer": "B", "explanation": "A practised neutral position removes the worry about where to put them.", "category": "Hand Placement", "domain": "Professional Practices", "difficulty": "Hard", "sourceType": "Main Exam 3"}, {"id": 381, "question": "A trainer's hands keep circling ('washing machine') while searching for words. What is the best correction?", "options": ["Fold the arms across the chest so that the hands are hidden from the audience", "Pause, reset the hands, and use fewer, purposeful gestures", "Grip the lectern firmly to keep them still for the rest of the session", "Speak faster so nobody notices"], "correctAnswer": "B", "explanation": "Remove repetitive, meaningless movement.", "category": "Hand Placement", "domain": "Professional Practices", "difficulty": "Hard", "sourceType": "Main Exam 3"}, {"id": 382, "question": "What is the MOST appropriate purpose of gamification?", "options": ["To remove the trainer's role entirely", "To raise motivation and engagement, e.g. points and badges", "To shorten the legal training requirements by making the content more fun", "To replace all forms of assessment because points and badges already show who has learned"], "correctAnswer": "B", "explanation": "Gamification supports engagement; it does not replace objectives or assessment.", "category": "Future Trends in Training", "domain": "Future Skills", "difficulty": "Hard", "sourceType": "Main Exam 3"}, {"id": 383, "question": "A pre-test and post-test comparison is used mainly to evaluate which Kirkpatrick level?", "options": ["Level 4 – Results", "Level 1 – Reaction", "Level 2 – Learning", "Level 3 – Behavior"], "correctAnswer": "C", "explanation": "Measuring knowledge or skill gained = Learning.", "category": "Training Evaluation Models", "domain": "Professional Knowledge", "difficulty": "Medium", "sourceType": "Main Exam 3"}, {"id": 384, "question": "What is the main purpose of a Training Needs Analysis (TNA)?", "options": ["To find the gap between current and required performance and decide if training is needed", "To measure how satisfied trainees were with the programme once it has finished and report the scores", "To schedule the trainer's holidays and teaching hours for the year", "To produce certificates and attendance records for the organisation"], "correctAnswer": "A", "explanation": "A TNA finds the gap, its cause, and whether training is the right solution.", "category": "Training Needs Analysis", "domain": "Professional Practices", "difficulty": "Easy", "sourceType": "Main Exam 3"}, {"id": 385, "question": "What is the best eye-contact approach with a group?", "options": ["Staring at one friendly person throughout the whole session", "Looking only at the slides", "Avoiding eye contact completely by looking at the notes", "Brief, natural eye contact with different people"], "correctAnswer": "D", "explanation": "Share eye contact around the room. Note that norms vary between cultures.", "category": "Non-Verbal Cues", "domain": "Future Skills", "difficulty": "Easy", "sourceType": "Main Exam 3"}, {"id": 386, "question": "Attendance data: 90% on Monday, 60% on Tuesday, 40% on Wednesday (the 3 p.m. sessions). What should the trainer do first?", "options": ["Do nothing and wait to see what happens", "Cancel the Wednesday sessions immediately because so few trainees are attending them", "Blame the trainees for poor commitment and warn them about their future attendance", "Investigate why attendance falls; consider rescheduling or shortening"], "correctAnswer": "D", "explanation": "Find the cause before changing the programme.", "category": "Percentage & Training Method", "domain": "Professional Practices", "difficulty": "Medium", "sourceType": "Main Exam 3"}, {"id": 387, "question": "Which factor is the LEAST relevant when selecting a delivery method?", "options": ["Trainees' availability and time zones", "Trainees' access to technology and internet", "The learning objectives of the course", "The trainer's favourite font"], "correctAnswer": "D", "explanation": "Choose by objectives, learners and constraints, not by preference.", "category": "Least Important / Least Appropriate", "domain": "Professional Knowledge", "difficulty": "Medium", "sourceType": "Main Exam 3"}, {"id": 388, "question": "A trainee who is also a friend asks for a hint about the final test. What is the best response?", "options": ["Give a small hint because they are a friend", "Decline, and apply the same assessment rules to every trainee", "Give the hint only if other trainees will not find out", "Change the test to match what the friend has studied"], "correctAnswer": "B", "explanation": "Fair, impartial treatment and assessment integrity apply to every trainee. Standard 6.2 and 7.2.", "category": "Ethics & Confidentiality", "domain": "Professional Values and Responsibilities", "difficulty": "Medium", "sourceType": "Main Exam 3"}, {"id": 389, "question": "A trainer's illness means a session must be rescheduled, but two trainees have exams on the proposed new date. What is the best approach?", "options": ["Run the session on the original date with a substitute who is not qualified in the subject", "Offer alternative dates, choose the one that suits most, and share materials with those who cannot attend", "Cancel the course permanently and refund everyone", "Insist on the proposed date because it is already in the official schedule and trainees must adapt"], "correctAnswer": "B", "explanation": "Reschedule flexibly and support those who still cannot attend.", "category": "Managing Training Sessions", "domain": "Professional Values and Responsibilities", "difficulty": "Hard", "sourceType": "Main Exam 3"}, {"id": 390, "question": "Which activity is a typical part of identifying training needs?", "options": ["Reviewing performance data and interviewing managers", "Printing certificates for the final day of training", "Choosing the colour scheme and the font for the course slides before the course", "Counting the chairs and tables in the training room"], "correctAnswer": "A", "explanation": "Needs are identified from evidence about performance and from the people involved.", "category": "Training Needs Analysis", "domain": "Professional Practices", "difficulty": "Medium", "sourceType": "Main Exam 3"}, {"id": 391, "question": "Unknown people might join a public training link. Which Zoom setting MOST reduces this risk?", "options": ["Record the session and store it", "Enable a waiting room and a passcode", "Disable the chat function", "Turn on virtual backgrounds for all participants"], "correctAnswer": "B", "explanation": "The waiting room and passcode control who enters.", "category": "Online Training & Digital Tools", "domain": "Future Skills", "difficulty": "Medium", "sourceType": "Main Exam 3"}, {"id": 392, "question": "Which technology lets trainees practise high-risk tasks safely?", "options": ["Email newsletters", "Audio podcasts", "VR/AR simulations", "PDF manuals"], "correctAnswer": "C", "explanation": "Immersive simulations allow repeatable, safe practice.", "category": "Future Trends in Training", "domain": "Future Skills", "difficulty": "Medium", "sourceType": "Main Exam 3"}, {"id": 393, "question": "Which task is Canva MOST suited to?", "options": ["Securing a website with an encrypted connection", "Running statistical tests on survey data", "Hosting live video classes with breakout rooms", "Designing infographics, posters and slides"], "correctAnswer": "D", "explanation": "Canva is a design tool for visuals and training materials.", "category": "Online Training & Digital Tools", "domain": "Future Skills", "difficulty": "Easy", "sourceType": "Main Exam 3"}, {"id": 394, "question": "A colleague asks to see a trainee's personal file 'just out of interest'. What is the MOST professional response?", "options": ["Show it if the colleague promises not to tell anyone", "Show only the pages with the trainee's marks", "Decline politely and explain the file is shared only for a legitimate, authorised purpose", "Show it, since both of you work for the same centre"], "correctAnswer": "C", "explanation": "Confidential trainee data is shared only with those authorised and with a need to know. Standard 7.2.", "category": "Ethics & Confidentiality", "domain": "Professional Values and Responsibilities", "difficulty": "Medium", "sourceType": "Main Exam 3"}, {"id": 395, "question": "Which is the BEST way to record CPD?", "options": ["The trainees' attendance lists for each course", "A log of activities, learning and the change in practice", "A list of course titles with no reflection", "Memory only, with nothing written down or kept anywhere as evidence of what was learned"], "correctAnswer": "B", "explanation": "Good CPD records show impact on practice, not only attendance.", "category": "Professional Development (CPD)", "domain": "Professional Values and Responsibilities", "difficulty": "Medium", "sourceType": "Main Exam 3"}, {"id": 396, "question": "Why should a trainer avoid keeping hands in pockets while presenting?", "options": ["It can look nervous or too casual and limits gestures", "It stops the voice from projecting properly", "It prevents trainees from reading the slides", "It breaks health and safety rules in training rooms"], "correctAnswer": "A", "explanation": "It affects perception, not safety or voice.", "category": "Hand Placement", "domain": "Professional Practices", "difficulty": "Medium", "sourceType": "Main Exam 3"}, {"id": 397, "question": "In CIRO, a trainer asks: 'Were the right resources and delivery method chosen to meet the objectives?' Which component is this?", "options": ["Reaction", "Outcome", "Input", "Context"], "correctAnswer": "C", "explanation": "Input = design, resources and strategy.", "category": "Training Evaluation Models", "domain": "Professional Knowledge", "difficulty": "Medium", "sourceType": "Main Exam 3"}, {"id": 398, "question": "In a practical test, 64 of 80 trainees pass first time. What is the pass rate, and what is the best response to the rest?", "options": ["16%; repeat the whole course for everyone, including those who already passed", "64%; cancel the course and start the whole programme again from the beginning", "80%; support or re-assessment for the 16 who did not pass", "20%; take no further action at all"], "correctAnswer": "C", "explanation": "64 ÷ 80 = 80%. Target the 16 who need support.", "category": "Percentage & Training Method", "domain": "Professional Practices", "difficulty": "Hard", "sourceType": "Main Exam 3"}, {"id": 399, "question": "What is the BEST reason for a trainer to keep doing CPD?", "options": ["To reuse the same slides for another ten years", "Only to collect certificates for the file", "To avoid being evaluated by the organisation", "To keep skills up to date and improve training quality"], "correctAnswer": "D", "explanation": "CPD's purpose is better practice, not paperwork.", "category": "Professional Development (CPD)", "domain": "Professional Values and Responsibilities", "difficulty": "Medium", "sourceType": "Main Exam 3"}, {"id": 400, "question": "In CIRO, a company checks whether a sales course changed individual, team and company results six months later. Which component is this?", "options": ["Reaction", "Outcome", "Context", "Input"], "correctAnswer": "B", "explanation": "Outcome = results at individual, team or organisational level (as worded in your study guide).", "category": "Training Evaluation Models", "domain": "Professional Knowledge", "difficulty": "Hard", "sourceType": "Main Exam 3"}, {"id": 401, "question": "A trainee asks to leave early every day this week. What is the most professional response?", "options": ["Mark them absent for every session without any discussion and report the pattern to their managers", "Agree without asking why they must leave", "Speak privately, learn the reason, and agree a plan for missed content", "Refuse loudly in front of the whole class and tell everyone that leaving early is not allowed"], "correctAnswer": "C", "explanation": "Private, respectful, and routed through the proper channel.", "category": "Managing Training Sessions", "domain": "Professional Values and Responsibilities", "difficulty": "Hard", "sourceType": "Main Exam 3"}, {"id": 402, "question": "At 6 a.m. a trainer learns of a family emergency and cannot deliver the 9 a.m. session. What should happen FIRST?", "options": ["Contact the coordinator immediately so trainees can be told", "Wait until 9 a.m. to see whether things improve", "Ask one of the trainees to lead the session instead", "Send no message and reschedule the session later"], "correctAnswer": "A", "explanation": "Early notice to the right person protects trainees and the organisation.", "category": "Managing Training Sessions", "domain": "Professional Values and Responsibilities", "difficulty": "Medium", "sourceType": "Main Exam 3"}, {"id": 403, "question": "Which behaviour shows active listening non-verbally?", "options": ["Checking notes while they speak", "Interrupting to finish their sentence so the discussion moves faster", "Turning away to prepare the next slide while the trainee is still talking", "Facing the speaker, open posture, eye contact"], "correctAnswer": "D", "explanation": "Orientation, posture and eye contact show attention.", "category": "Non-Verbal Cues", "domain": "Future Skills", "difficulty": "Medium", "sourceType": "Main Exam 3"}, {"id": 404, "question": "Which data source gives the MOST objective evidence of a skill gap?", "options": ["Length of employment in the department", "The trainer's own personal opinion", "Observed performance against the required standard", "Trainees' wishes for topics they might enjoy"], "correctAnswer": "C", "explanation": "Measured performance against a standard is evidence; wishes and opinions are not.", "category": "Training Needs Analysis", "domain": "Professional Practices", "difficulty": "Medium", "sourceType": "Main Exam 3"}, {"id": 405, "question": "Which trainer behaviour best supports learning by modelling (social learning)?", "options": ["Describing the task once and leaving the room", "Correcting errors only after the final test", "Demonstrating the task correctly while explaining each step aloud", "Handing out a written procedure without a demonstration"], "correctAnswer": "C", "explanation": "Learners copy observed behaviour, so a clear demonstration with commentary supports it. Standard 1.2 (Bandura).", "category": "Learning Theories & Concepts", "domain": "Professional Knowledge", "difficulty": "Medium", "sourceType": "Main Exam 3"}, {"id": 406, "question": "Post-test: 30% of trainees scored below 50%, 50% scored 50–79%, and 20% scored 80% or more. What is the BEST decision?", "options": ["Repeat the whole course for every trainee, including those who scored well in the test", "Congratulate everyone and stop the training", "Remedial support for the lowest group, extension for the top group", "Lower the pass standard so more trainees pass"], "correctAnswer": "C", "explanation": "Differentiate by the data.", "category": "Percentage & Training Method", "domain": "Professional Practices", "difficulty": "Hard", "sourceType": "Main Exam 3"}, {"id": 407, "question": "After a customer-care course, monthly complaints fall from 50 to 35. What is the percentage decrease?", "options": ["70%", "35%", "15%", "30%"], "correctAnswer": "D", "explanation": "(50 − 35) ÷ 50 = 30%. This evidences Level 4 (Results).", "category": "Percentage & Training Method", "domain": "Professional Practices", "difficulty": "Hard", "sourceType": "Main Exam 3"}, {"id": 408, "question": "A trainee sits with arms crossed, looking at the floor, while the trainer explains. What should the trainer conclude?", "options": ["It may signal disengagement, so check in or change the activity", "They definitely disagree with the trainer, so the trainer should confront them at once", "They are an expert, so ignore them", "Non-verbal cues never matter in training"], "correctAnswer": "A", "explanation": "Cues are clues, not proof. Check before concluding.", "category": "Non-Verbal Cues", "domain": "Future Skills", "difficulty": "Medium", "sourceType": "Main Exam 3"}, {"id": 409, "question": "Data: 75% of trainees work in other cities and 25% work at head office. The course must be completed within a month. Which approach is MOST suitable?", "options": ["Weekly face-to-face sessions at head office", "Mostly asynchronous online, plus a few live sessions", "One live lecture at head office only", "Printed manuals posted to each trainee with a deadline to return the workbook"], "correctAnswer": "B", "explanation": "The majority cannot attend in person.", "category": "Percentage & Training Method", "domain": "Professional Practices", "difficulty": "Medium", "sourceType": "Main Exam 3"}, {"id": 410, "question": "A TNA shows employees know the procedure but lack the tools to follow it. What is the best conclusion?", "options": ["It is not a skill gap, so providing tools is better than training", "Training should be run immediately to fix the procedure", "The TNA should be repeated until it shows a skill gap", "The employees should be replaced with more highly skilled staff who already know the tools"], "correctAnswer": "A", "explanation": "Not every performance problem is a training problem (see Human Performance Improvement in your study guide).", "category": "Training Needs Analysis", "domain": "Professional Practices", "difficulty": "Medium", "sourceType": "Main Exam 3"}, {"id": 411, "question": "After 90 minutes of an online class, participants look fatigued. What is the best action?", "options": ["A 10-minute break, then a short poll or breakout", "Add 20 more slides to keep them busy", "Talk faster so the class finishes sooner", "Disable the chat so nobody is distracted"], "correctAnswer": "A", "explanation": "Break plus interaction restores attention.", "category": "Managing Training Sessions", "domain": "Future Skills", "difficulty": "Medium", "sourceType": "Main Exam 3"}, {"id": 412, "question": "Which learning objective is the MOST measurable?", "options": ["Appreciate the value of calibration", "Understand how pressure gauges work", "Calibrate the pressure gauge to within 2% tolerance", "Be familiar with gauge types"], "correctAnswer": "C", "explanation": "A measurable objective uses an observable verb and a standard. 'Understand', 'appreciate' and 'be familiar with' cannot be observed. Standard 3.2.", "category": "Learning Objectives", "domain": "Professional Knowledge", "difficulty": "Medium", "sourceType": "Main Exam 3"}, {"id": 413, "question": "A trainee scores 90% on the end test, but six months later still uses the old method because the supervisor insists on it. Which statement is MOST accurate?", "options": ["Learning (Level 2) failed, because the trainee did not learn", "Results (Level 4) are guaranteed, because the test score was high", "Learning (Level 2) succeeded, but Behavior (Level 3) did not occur", "Reaction (Level 1) failed, because the trainee disliked the course"], "correctAnswer": "C", "explanation": "Transfer depends on the workplace as well as on the course.", "category": "Training Evaluation Models", "domain": "Professional Knowledge", "difficulty": "Hard", "sourceType": "Main Exam 3"}, {"id": 414, "question": "Which method is MOST suitable for Level 3 (Behavior) evaluation?", "options": ["Workplace observation and manager feedback", "The attendance register for each session", "An immediate multiple-choice quiz at the end", "An end-of-course satisfaction sheet handed out on day one"], "correctAnswer": "A", "explanation": "Behavior is judged on the job, some time after training.", "category": "Training Evaluation Models", "domain": "Professional Knowledge", "difficulty": "Medium", "sourceType": "Main Exam 3"}, {"id": 415, "question": "After a failed calibration attempt, a trainee sits quietly and works out why the readings drifted. Which stage of Kolb's cycle is this?", "options": ["Abstract Conceptualisation", "Concrete Experience", "Active Experimentation", "Reflective Observation"], "correctAnswer": "D", "explanation": "Reviewing what happened and why is Reflective Observation. Concrete Experience is doing the task; the other two are forming a theory and testing it. Standard 1.2.", "category": "Learning Theories & Concepts", "domain": "Professional Knowledge", "difficulty": "Medium", "sourceType": "Main Exam 3"}, {"id": 416, "question": "Two assessors give very different marks to the same practical performance using the same checklist. Which quality of the assessment is weak?", "options": ["Practicality", "Diagnostic value", "Validity", "Reliability"], "correctAnswer": "D", "explanation": "Reliability is consistency of marking across assessors and occasions. Standard 2.3 and 5.1.", "category": "Assessment Quality", "domain": "Professional Knowledge", "difficulty": "Hard", "sourceType": "Main Exam 3"}, {"id": 417, "question": "Which is the LEAST effective way to evaluate Level 3 (Behavior)?", "options": ["Workplace observation after the course", "Performance reviews some months afterwards", "Interviews with managers about changes", "A last-day satisfaction survey"], "correctAnswer": "D", "explanation": "A last-day survey measures Reaction, not on-the-job behavior.", "category": "Least Important / Least Appropriate", "domain": "Professional Knowledge", "difficulty": "Hard", "sourceType": "Main Exam 3"}, {"id": 418, "question": "Which sequence is the most logical for a TNA?", "options": ["Deliver training, test learners, define the standards, then work out the causes", "Define the standard, measure current performance, find the gap, analyse the cause, recommend", "Select the trainer, book the venue, choose the topics, then define the needs", "Design the course, deliver it, survey satisfaction, then look for any gaps in performance and decide what went wrong"], "correctAnswer": "B", "explanation": "Analysis always comes before design and delivery.", "category": "Training Needs Analysis", "domain": "Professional Practices", "difficulty": "Hard", "sourceType": "Main Exam 3"}, {"id": 419, "question": "During a Zoom session the trainer wants a quick, anonymous multiple-choice check of understanding. Which feature suits best?", "options": ["Cloud storage settings", "Polling", "Mute all", "Virtual background"], "correctAnswer": "B", "explanation": "Polls give instant formative feedback.", "category": "Online Training & Digital Tools", "domain": "Future Skills", "difficulty": "Medium", "sourceType": "Main Exam 3"}, {"id": 420, "question": "Trainees in a remote region have unreliable internet, and live video sessions often freeze. Which adjustment is MOST appropriate?", "options": ["Require everyone to travel to the capital for classroom sessions", "Extend each live session to four hours so nothing is missed", "Move theory online for self-study and keep short live sessions", "Cancel the training until internet access improves"], "correctAnswer": "C", "explanation": "Match the method to the constraint: reduce dependence on live bandwidth but keep interaction where it matters most.", "category": "Learning Delivery Methods", "domain": "Future Skills", "difficulty": "Medium", "sourceType": "Main Exam 3"}, {"id": 421, "question": "A trainer wants a consistent look across handouts, slides and social posts. Which Canva feature helps?", "options": ["Brand kit and templates", "Waiting room for admitting learners", "HTTPS certificate for the website", "Breakout rooms for group work"], "correctAnswer": "A", "explanation": "A brand kit stores colours, fonts and logos so materials stay consistent.", "category": "Online Training & Digital Tools", "domain": "Future Skills", "difficulty": "Medium", "sourceType": "Main Exam 3"}, {"id": 422, "question": "Which gesture best signals openness and honesty?", "options": ["Hands hidden", "Clenched fists", "Open palms", "A pointing finger"], "correctAnswer": "C", "explanation": "Open palms are widely read as open and trustworthy.", "category": "Hand Placement", "domain": "Professional Practices", "difficulty": "Medium", "sourceType": "Main Exam 3"}, {"id": 423, "question": "A survey shows 60% of trainees prefer self-paced study and 40% prefer live interaction. Which approach balances both?", "options": ["Fully asynchronous learning", "Blended learning", "Cancelling the course", "Fully synchronous learning"], "correctAnswer": "B", "explanation": "Both needs are substantial, so blend.", "category": "Percentage & Training Method", "domain": "Professional Practices", "difficulty": "Medium", "sourceType": "Main Exam 3"}, {"id": 424, "question": "Evaluation shows low trainee scores on a topic the trainer teaches. Which CPD plan is best?", "options": ["Focus only on the trainer's existing strengths", "Target that weakness, apply it later and review results", "Avoid teaching that topic again in future courses", "Choose development activities completely at random"], "correctAnswer": "B", "explanation": "CPD should be needs-based and checked for impact.", "category": "Professional Development (CPD)", "domain": "Professional Values and Responsibilities", "difficulty": "Hard", "sourceType": "Main Exam 3"}, {"id": 425, "question": "What is a typical limitation of fully asynchronous training?", "options": ["It can only be used in a classroom", "Learners cannot study at their own pace", "It needs every trainee to be present at the same hour", "Feedback and interaction are slower because trainer and learners are not online together"], "correctAnswer": "D", "explanation": "Asynchronous study is flexible but gives delayed feedback and less live interaction. Standard 2.1.2.", "category": "Training Modes & Strategies", "domain": "Professional Knowledge", "difficulty": "Medium", "sourceType": "Main Exam 3"}, {"id": 426, "question": "Which hand position is the LEAST suitable while presenting?", "options": ["Relaxed and visible when not gesturing", "Open-palm gestures", "Holding a clicker lightly", "Hands clasped tightly behind the back"], "correctAnswer": "D", "explanation": "Hidden or clasped hands reduce openness.", "category": "Least Important / Least Appropriate", "domain": "Professional Practices", "difficulty": "Medium", "sourceType": "Main Exam 3"}, {"id": 427, "question": "Which CPD approach involves a trainer examining and learning from their own sessions?", "options": ["Marking attendance", "Booking rooms", "Reflective practice", "Photocopying handouts"], "correctAnswer": "C", "explanation": "Reflection on practice is a core CPD habit.", "category": "Professional Development (CPD)", "domain": "Professional Values and Responsibilities", "difficulty": "Medium", "sourceType": "Main Exam 3"}, {"id": 428, "question": "A trainer wants to put a diagram from a published textbook into handouts. Which action respects intellectual property?", "options": ["Use it freely because the handout is for training only", "Redraw it slightly and present it as the trainer's own", "Remove the source so that the handout looks original", "Obtain permission or use it within the permitted licence, with a proper citation"], "correctAnswer": "D", "explanation": "Respecting intellectual property means permission or licence plus attribution. Standard 7.2.", "category": "Ethics & Confidentiality", "domain": "Professional Values and Responsibilities", "difficulty": "Medium", "sourceType": "Main Exam 3"}, {"id": 429, "question": "In which ADDIE stage does a trainer enrol trainees, arrange the room and deliver the sessions?", "options": ["Evaluation of results", "Implementation", "Analysis of the audience", "Design of the blueprint"], "correctAnswer": "B", "explanation": "Implementation = delivery and logistics.", "category": "Instructional Design (ADDIE)", "domain": "Professional Knowledge", "difficulty": "Medium", "sourceType": "Main Exam 3"}, {"id": 430, "question": "A trainer must postpone a course for personal reasons. Which message to trainees is MOST professional?", "options": ["A short, polite notice with a new date and an apology", "A detailed account of the trainer's personal problems", "A message blaming the organisation for the problem", "One word: 'Cancelled', with no explanation"], "correctAnswer": "A", "explanation": "Be clear, courteous and solution-focused; keep private details private.", "category": "Managing Training Sessions", "domain": "Professional Values and Responsibilities", "difficulty": "Medium", "sourceType": "Main Exam 3"}, {"id": 431, "question": "A trainer skips Analysis and starts building slides immediately. What is the MOST likely risk?", "options": ["Slides that are shorter than they should be", "Training that misses the real performance gap", "Faster delivery with no risk at all", "Evaluation becoming unnecessary at the end"], "correctAnswer": "B", "explanation": "Without analysis you may solve the wrong problem.", "category": "Instructional Design (ADDIE)", "domain": "Professional Knowledge", "difficulty": "Hard", "sourceType": "Main Exam 3"}, {"id": 432, "question": "Which is the LEAST likely to count as CPD?", "options": ["Reading current research on adult learning", "Attending a workshop on new methods", "Repeating the same session with no feedback", "Observing a colleague's session and reflecting"], "correctAnswer": "C", "explanation": "CPD requires learning and change.", "category": "Least Important / Least Appropriate", "domain": "Professional Values and Responsibilities", "difficulty": "Medium", "sourceType": "Main Exam 3"}, {"id": 433, "question": "A learner is asked to enter personal data on a page whose address begins with http:// (no S). What is the best advice?", "options": ["Avoid it, because the connection is not encrypted", "Enter the data twice to be safe", "Proceed if the page looks very professional", "Proceed, because all web pages are secure"], "correctAnswer": "A", "explanation": "HTTPS encrypts data in transit; plain HTTP does not.", "category": "Online Training & Digital Tools", "domain": "Future Skills", "difficulty": "Medium", "sourceType": "Main Exam 3"}, {"id": 434, "question": "Forty pilots train on rotating overseas flights and can only study when they are on the ground, at unpredictable times. Which delivery method is MOST appropriate?", "options": ["Synchronous classroom sessions every Sunday", "A one-day face-to-face seminar at head office", "A live Zoom lecture at 10:00 every Monday", "Asynchronous learning with online modules"], "correctAnswer": "D", "explanation": "Unpredictable availability rules out every fixed-time option. Asynchronous lets learners study whenever they are free.", "category": "Learning Delivery Methods", "domain": "Future Skills", "difficulty": "Medium", "sourceType": "Main Exam 3"}, {"id": 435, "question": "What is continuing professional development (CPD)?", "options": ["An ongoing process of developing and documenting professional skills", "A one-time qualification gained at the start of a career that never needs to be renewed", "A training evaluation model with four stages", "A report of trainee attendance after each course"], "correctAnswer": "A", "explanation": "CPD is continuous, not a one-off.", "category": "Professional Development (CPD)", "domain": "Professional Values and Responsibilities", "difficulty": "Easy", "sourceType": "Main Exam 3"}, {"id": 436, "question": "Which is the LEAST important purpose of a TNA?", "options": ["To link training to organisational goals", "To decide which snacks to provide", "To identify skill gaps", "To prioritise training needs"], "correctAnswer": "B", "explanation": "Read the word LEAST. The other three are core purposes.", "category": "Least Important / Least Appropriate", "domain": "Professional Practices", "difficulty": "Easy", "sourceType": "Main Exam 3"}];

  { front: "Six weeks after a negotiation skills workshop, an evaluator conducts workplace observations and interviews managers to check whether sales representatives are using the new questioning techniques during actual client meetings. Which Kirkpatrick level is being evaluated?", back: "Level 3 (Behaviour)\n\nLearning = What did they acquire? Behaviour = Are they applying it at work?", note: "[Professional Knowledge]" },
