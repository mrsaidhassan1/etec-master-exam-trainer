  { front: "What design features does the guide associate with good e-training?", back: "Short modules, clear navigation, interaction, appropriate multimedia, feedback, and evaluation tools.\n\nTechnology should support a coherent learning experience.", note: "Keep it navigable, interactive, and assessable.  [Future Skills]" },
  { front: "How do safe digital use and confidentiality connect across the domains?", back: "Safe digital use is a Future Skills requirement; confidentiality and data security are Professional Values and Responsibilities requirements.\n\nA digital training action can involve both skillful use and ethical information handling.", note: "Skill and responsibility work together.  [Future Skills]" },
  { front: "A trainer chooses a tool because it is fashionable without considering content or teaching approach. Which framework highlights the missing connection?", back: "TPACK.\n\nTechnology integration should bring technology, pedagogy, and content together.", note: "Choose the tool with the content and teaching in mind.  [Future Skills]" },
  { front: "A trainer has a useful existing resource that would help colleagues deliver a common program. What behavior fits 9.2.2?", back: "Take the initiative to share the resource and relevant expertise with the team.\n\nThe standard encourages proactive transfer of available knowledge and resources.", note: "Do not wait to be asked to help.  [Future Skills]" },
  { front: "A trainer must take a different role after an unexpected staffing change. Which future skill is most directly involved?", back: "Professional adaptability and flexibility.\n\nIndicator 9.3.3 includes adapting to changes in roles and responsibilities.", note: "A changed role calls for adaptation.  [Future Skills]" },
  { front: "Asynchronous learning: what is the key feature, and what is its main weakness?", back: "Learners study at different times and their own pace (recorded videos, LMS modules, forums). Weakness: feedback and interaction are delayed.", note: "Memory: A = Anytime.", topic: "Learning Delivery Methods" },
  { front: "Synchronous learning: what is the key feature, and what does it need?", back: "Trainer and trainees take part at the same time, live (classroom, Zoom, webinar). It allows instant feedback but needs a fixed schedule and, online, a stable connection.", note: "Memory: S = Same time.", topic: "Learning Delivery Methods" },
  { front: "Blended learning: what is it?", back: "A planned mix of face-to-face or live sessions with online self-paced work, such as weekly classroom teaching plus LMS quizzes.", note: "Trap: blended is a designed mix, not just 'some online work added'.", topic: "Learning Delivery Methods" },
  { front: "Scenario: trainees in a remote area have unreliable internet. Which delivery method fits best?", back: "Asynchronous, with downloadable or recorded content, so learning does not depend on a live connection.", note: "Rule: unreliable connection or different time zones → asynchronous.", topic: "Learning Delivery Methods" },
  { front: "Scenario: trainees need instant feedback and group discussion on a complex topic. Which method?", back: "Synchronous (live classroom or Zoom).", note: "Rule: need for immediate interaction → synchronous.", topic: "Learning Delivery Methods" },
  { front: "Scenario: a course has hands-on skills plus theory that can be studied alone. Which method?", back: "Blended: practise the hands-on skills face to face, and study the theory online at their own pace.", note: "Rule: mixed aims → blended.", topic: "Learning Delivery Methods" },
  { front: "Scenario: shift workers can only study when they are free, at different hours. Which method?", back: "Asynchronous, so each trainee studies at their own time.", note: "Rule: scattered availability → asynchronous.", topic: "Learning Delivery Methods" },
  { front: "How do you pick the right delivery method in a scenario question?", back: "Find the constraint (time, place, connection, need for interaction or practice), then choose the method that removes it.", note: "Steps: constraint → need → method.", topic: "Learning Delivery Methods" },
  { front: "What is the purpose of a Training Needs Analysis?", back: "To find the gap between current and required performance, and decide whether and what training is needed.", note: "Gap = required performance − current performance.", topic: "Training Needs Analysis (TNA)" },
  { front: "Which data source gives the most objective evidence of a skill gap?", back: "Performance data, direct observation or a skills test measured against a standard.", note: "Self-reports and opinions are weaker evidence.", topic: "Training Needs Analysis (TNA)" },
  { front: "Name common ways to identify training needs.", back: "Surveys, interviews, observation, performance records and appraisals, skills tests, and talking with managers.", note: "Use more than one source to cross-check.", topic: "Training Needs Analysis (TNA)" },
  { front: "Staff know the procedure but lack the tools to follow it. Is training the answer?", back: "No. This is a resource problem, so fix the tools, not the training.", note: "Human Performance Improvement: training is not always the answer.", topic: "Training Needs Analysis (TNA)" },
  { front: "What does a TNA lead to next?", back: "Prioritised training needs, which become learning objectives and the training plan.", note: "Order: TNA → objectives → design.", topic: "Training Needs Analysis (TNA)" },
  { front: "Which levels does a TNA commonly look at?", back: "The organisation (goals), the job or task (required skills) and the person (current skills).", note: "A widely used framework; check wording in your own ETEC material.", topic: "Training Needs Analysis (TNA)" },
  { front: "LEAST: which is NOT a purpose of a TNA?", back: "Deciding the venue or catering. A TNA identifies needs and gaps, not logistics.", note: "Read LEAST questions as 'find the odd one out'.", topic: "Training Needs Analysis (TNA)" },
  { front: "How is a TNA different from a diagnostic assessment?", back: "A TNA looks at organisation, job and people to decide whether training is needed. A diagnostic assessment checks trainees' starting knowledge before a course.", note: "Both happen before training.", topic: "Training Needs Analysis (TNA)" },
  { front: "What is Zoom mainly used for in training?", back: "Live video meetings, so synchronous online teaching, with screen sharing, chat, polls and breakout rooms.", note: "Zoom = synchronous tool.", topic: "Online Training & Digital Tools" },
  { front: "Which Zoom feature creates small-group discussion in an online class?", back: "Breakout rooms.", note: "Purpose: raise participation and collaboration.", topic: "Online Training & Digital Tools" },
  { front: "Which Zoom feature gives a quick multiple-choice check of understanding?", back: "Polls, which can be anonymous.", note: "Good for quick formative checks.", topic: "Online Training & Digital Tools" },
  { front: "How can trainees who missed a live Zoom session catch up?", back: "Record the session and share the recording.", note: "A recording turns a synchronous session into asynchronous content.", topic: "Online Training & Digital Tools" },
  { front: "Which Zoom settings stop uninvited people joining a public link?", back: "A waiting room and a passcode, with the host admitting people.", note: "Security settings, not content settings.", topic: "Online Training & Digital Tools" },
  { front: "What is Canva used for in training?", back: "Designing visuals: posters, infographics, slides and handouts from templates.", note: "Canva = design tool, not a meeting tool or an LMS.", topic: "Online Training & Digital Tools" },
  { front: "Why use Canva for training materials?", back: "It makes clear, consistent, professional visuals quickly, which helps trainees understand and remember.", note: "Use one set of colours and fonts across materials.", topic: "Online Training & Digital Tools" },
  { front: "Which tool would you use to analyse data in dashboards, not Canva?", back: "Microsoft Power BI (or a spreadsheet).", note: "Match the tool to the task.", topic: "Online Training & Digital Tools" },
  { front: "What does HTTPS stand for, and what does it do?", back: "HyperText Transfer Protocol Secure. It encrypts the data between your browser and the site.", note: "http:// is not encrypted; https:// is.", topic: "Online Training & Digital Tools" },
  { front: "A page asks for personal data and its address begins with http:// (no S). What should you do?", back: "Do not enter the data; use only a secure https:// page.", note: "Look for https:// and the padlock.", topic: "Online Training & Digital Tools" },
  { front: "Does HTTPS prove a website is trustworthy?", back: "No. It protects data in transit, but fake or phishing sites can also use HTTPS, so still check the address and source.", note: "A blind spot: secure connection ≠ trustworthy site.", topic: "Online Training & Digital Tools" },
  { front: "Kirkpatrick Level 1 (Reaction): what does it ask, and how is it measured?", back: "How trainees felt about the training. Measured with feedback forms straight after the session.", note: "Positive reactions do not prove learning.", topic: "Training Evaluation Models" },
  { front: "Kirkpatrick Level 2 (Learning): what does it measure, and how?", back: "Knowledge and skills gained. Measured with pre-tests and post-tests or practical tests.", note: "Pre/post comparison = Level 2.", topic: "Training Evaluation Models" },
  { front: "Kirkpatrick Level 3 (Behaviour): what does it measure, and how?", back: "Whether trainees apply the learning on the job, weeks or months later. Measured by observation and supervisor feedback.", note: "Memory: B = Back at work.", topic: "Training Evaluation Models" },
  { front: "Kirkpatrick Level 4 (Results): what does it measure?", back: "The impact on the organisation, such as productivity, quality, cost or fewer errors.", note: "Memory: R = Return for the organisation.", topic: "Training Evaluation Models" },
  { front: "Trainees scored 90% on the end test but still use the old method six months later. Which level has failed?", back: "Level 3 (Behaviour). They learned it (Level 2) but did not apply it.", note: "Learned ≠ applied.", topic: "Training Evaluation Models" },
  { front: "Trainees loved the course but cannot do the task. Which level is the problem?", back: "Level 2 (Learning).", note: "Positive Level 1 does not guarantee Level 2.", topic: "Training Evaluation Models" },
  { front: "What are the four parts of CIRO, and what does each ask?", back: "Context (what needs and objectives?), Input (right design and resources?), Reaction (how did trainees respond?), Outcome (what results at individual, team and organisation level?).", note: "Your study guide uses 'Outcome'; some sources say 'Output'.", topic: "Training Evaluation Models" },
  { front: "What does CIRO include that Kirkpatrick does not explicitly include?", back: "The pre-training stages: Context and Input, which evaluate needs and design.", note: "CIRO also looks before the course; Kirkpatrick looks after.", topic: "Training Evaluation Models" },
  { front: "Which CIRO stage asks 'Were the right resources and delivery method chosen?'", back: "Input.", note: "Input = design, resources, delivery plan.", topic: "Training Evaluation Models" },
  { front: "How do CIRO and Kirkpatrick roughly line up?", back: "Reaction ≈ Level 1; Outcome covers Levels 2–4; Context and Input have no Kirkpatrick equivalent.", note: "An approximate match, not an exact one.", topic: "Training Evaluation Models" },
  { front: "What happens in the Analysis stage of ADDIE?", back: "Identify the need, the audience, the constraints and the learning gaps.", note: "Skipping Analysis risks building the wrong training.", topic: "Instructional Design (ADDIE)" },
  { front: "What happens in the Design stage of ADDIE?", back: "Plan the objectives, structure, activities, assessments and materials outline (a blueprint).", note: "Output: the design plan used in Development.", topic: "Instructional Design (ADDIE)" },
  { front: "What happens in the Development stage of ADDIE?", back: "Create the actual materials: slides, handouts, activities, tests and online content.", note: "Development builds what Design planned.", topic: "Instructional Design (ADDIE)" },
  { front: "What happens in the Implementation stage of ADDIE?", back: "Deliver the training: enrol trainees, set up the room or platform, and run the sessions.", note: "Implementation = delivery.", topic: "Instructional Design (ADDIE)" },
  { front: "What happens in the Evaluation stage of ADDIE?", back: "Review how effective the training was, and use the results to improve it.", note: "Evaluation can also happen during each stage.", topic: "Instructional Design (ADDIE)" },
  { front: "Give the ADDIE stages in order, with one keyword each.", back: "Analysis (needs) → Design (plan) → Development (build) → Implementation (deliver) → Evaluation (review).", note: "Memory keywords: Needs, Plan, Build, Deliver, Review.", topic: "Instructional Design (ADDIE)" },
  { front: "A trainer skips Analysis and starts building slides at once. What is the main risk?", back: "The training may not match the real needs or audience, wasting time and effort.", note: "Analysis first, always.", topic: "Instructional Design (ADDIE)" },
  { front: "Which ADDIE stage does a TNA belong to?", back: "Analysis.", note: "TNA = Analysis stage.", topic: "Instructional Design (ADDIE)" },
  { front: "Trainees want to leave 30 minutes early because they finished their work. Best response?", back: "Explain that trainees stay until the scheduled end unless officially permitted, and give a meaningful extension activity.", note: "Follow policy, keep them learning.", topic: "Managing Training Sessions" },
  { front: "What is the WRONG response when trainees ask to leave early?", back: "Letting everyone go at once, ignoring the request, or ending the class early for everyone.", note: "LEAST appropriate = ignore, abandon, or break policy.", topic: "Managing Training Sessions" },
  { front: "Trainees look tired or fatigued. What should the trainer do?", back: "Give a short break or an energiser, change to an interactive activity, and adjust the pace.", note: "Change the activity, do not just push on.", topic: "Managing Training Sessions" },
  { front: "LEAST appropriate response when trainees look tired?", back: "Scolding them, ignoring it, or continuing the same lecture unchanged.", note: "Never shame trainees.", topic: "Managing Training Sessions" },
  { front: "How can a trainer prevent fatigue in a long session?", back: "Plan breaks, vary activities, keep lectures short, and use interaction.", note: "Good design prevents fatigue.", topic: "Managing Training Sessions" },
  { front: "A trainer has a personal issue and must postpone a session. What is the most professional approach?", back: "Tell the coordinator or supervisor first and early, then give trainees notice with a new date or alternative, courteously and with minimal private detail.", note: "Order: Policy → People → Plan.", topic: "Managing Training Sessions" },
  { front: "LEAST appropriate response when the trainer cannot attend because of a personal issue?", back: "Not telling anyone until the last minute, or leaving trainees waiting without a message.", note: "Silence is the worst option.", topic: "Managing Training Sessions" },
  { front: "How do you spot the most professional response in a scenario?", back: "It follows policy, informs the right people early, protects the learning and respects privacy and trainees.", note: "Professional = policy + communication + continuity.", topic: "Managing Training Sessions" },
  { front: "What is continuing professional development (CPD)?", back: "The ongoing process of developing and maintaining a trainer's knowledge, skills and practice throughout their career.", note: "Continuous, not one-off.", topic: "Professional Development (CPD)" },
  { front: "Why is CPD important for a trainer?", back: "It keeps knowledge current, improves training quality, meets professional standards and supports career growth.", note: "Standard 8: continuing professional development.", topic: "Professional Development (CPD)" },
  { front: "Name ways a trainer can maintain and improve their skills.", back: "Courses and workshops, reading and research, peer observation, mentoring, professional learning communities, reflective practice and analysing feedback.", note: "Mix formal and informal learning.", topic: "Professional Development (CPD)" },
  { front: "What is reflective practice?", back: "Examining your own sessions to see what worked and what to improve, then acting on it.", note: "Reflection → action.", topic: "Professional Development (CPD)" },
  { front: "What is a professional learning community?", back: "A group of professionals who share practice, reflect and use data to improve training together.", note: "Standard 8.2.2.", topic: "Professional Development (CPD)" },
  { front: "What is the best way to record CPD?", back: "Keep a log or portfolio with the activity, date, what you learned and how you applied it.", note: "Evidence plus reflection.", topic: "Professional Development (CPD)" },
  { front: "Low trainee scores in one topic: which CPD action fits best?", back: "Investigate the cause, then study and practise better ways to teach that topic.", note: "Link CPD to evaluation results.", topic: "Professional Development (CPD)" },
  { front: "LEAST likely to count as CPD?", back: "Reusing the same notes every year, or attending an event with no learning or application.", note: "CPD needs new learning applied to practice.", topic: "Professional Development (CPD)" },
  { front: "What does a LEAST / NOT / EXCEPT question ask you to do?", back: "Find the odd one out: three options are good or true, and the answer is the one that is not.", note: "Do not choose the 'best' answer by reflex.", topic: "Least Important / Least Appropriate" },
  { front: "How should you read a LEAST question?", back: "Circle the word LEAST, test each option as good or bad, then pick the one that differs.", note: "Re-read the stem before you answer.", topic: "Least Important / Least Appropriate" },
  { front: "What is the difference between 'least important' and 'least appropriate'?", back: "Least important means lowest priority or value. Least appropriate means the most unprofessional or unsuitable action.", note: "Check which word the stem uses.", topic: "Least Important / Least Appropriate" },
  { front: "Which responses are usually the LEAST appropriate?", back: "Ignoring the problem, shaming trainees, forcing them, breaking policy, or cancelling without notice.", note: "These patterns repeat across scenarios.", topic: "Least Important / Least Appropriate" },
  { front: "Why do trainees lose marks on LEAST questions?", back: "They read quickly, spot a good answer and choose it without noticing the word LEAST.", note: "Slow down on the first line.", topic: "Least Important / Least Appropriate" },
  { front: "LEAST appropriate when handling a trainee who is repeatedly late?", back: "Publicly ridiculing them.", note: "Private, respectful conversation is the professional route.", topic: "Least Important / Least Appropriate" },
  { front: "LEAST relevant factor when choosing a delivery method?", back: "The trainer's personal preference or habit. Learners' needs, access and outcomes matter more.", note: "Learner needs first.", topic: "Least Important / Least Appropriate" },
  { front: "How do you work out a percentage?", back: "Part ÷ whole × 100. For example 64 of 80 passed = 80%.", note: "Always check what the 'whole' is.", topic: "Percentage Calculations" },
  { front: "Complaints fell from 50 to 35. What is the percentage change?", back: "A 30% decrease: (50 − 35) ÷ 50 × 100.", note: "Change ÷ original × 100.", topic: "Percentage Calculations" },

// ================= Core state / storage =================
const STORAGE_KEY = "etecMasterTrainer_v1";
const TOTAL_Q = QUESTIONS.length;
const CATEGORIES = Array.from(new Set(QUESTIONS.map(q => q.category)));
const QMAP = {}; QUESTIONS.forEach(q => QMAP[q.id] = q);

function todayStr(){ return new Date().toISOString().slice(0,10); }

function defaultState(){
  return {
    answers: {},        // qid -> {selected, correct, confidence, lastAt, attempts:[{selected,correct,at}]}
    bookmarks: {},       // qid -> {important:bool, reviewLater:bool, difficult:bool}
    mistakeStatus: {},   // qid -> 'active' | 'learned'
    review: {},          // qid -> {bucket:'today'|'soon'|'mastered', dangerous:bool}
    mockAttempts: [],    // {id, mode, dateStarted, dateFinished, correct, incorrect, unanswered, total, pct, timeTakenSec, topicBreakdown, answers:{qid:{selected,flagged}}}
    sessionHistory: [],  // {date, type, pct, count}
    streak: { lastActiveDate: null, current: 0, best: 0 },
    daily: { lastDate: null, streak: 0, best: 0, history: [] }, // history: {date, pct}
    lastSessionScore: null,
    bestMockScore: null,
    learnOrder: null,
    learnIndex: 0,
    learnCompletedAt: null, // ISO date the Learn section was finished (needed for the certificate)
    certificate: null       // {name, issuedAt, via} once the trainee has created a certificate
  };
}

let STATE = loadState();

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultState();
    const parsed = JSON.parse(raw);
    return Object.assign(defaultState(), parsed);
  }catch(e){ return defaultState(); }
}
function saveState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE)); }catch(e){}
}

function resetAllProgress(){
  STATE = defaultState();
  saveState();
  try{ localStorage.removeItem("etecMasterTrainer_exam_v1"); }catch(e){}
}

// ================= Utilities =================
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function fmtTime(sec){
  sec = Math.max(0, Math.round(sec));
  const m = Math.floor(sec/60), s = sec%60;
  return String(m).padStart(2,"0") + ":" + String(s).padStart(2,"0");
}
function fmtDate(iso){
  if(!iso) return "—";
  const d = new Date(iso);
  return d.toLocaleDateString(getLang()==="ar" ? "ar-u-ca-gregory-nu-arab" : undefined, {month:"short", day:"numeric", year:"numeric"});
}
function pct(n,d){ return d>0 ? Math.round((n/d)*100) : 0; }

// Per-question runtime shuffle cache (so options stay stable while the question is on screen,
// but reshuffle is fresh every time a new question instance is served)
const optionShuffleCache = {};
function getShuffledOptions(q, freshKey){
  const key = q.id + "::" + freshKey;
  if(!optionShuffleCache[key]){
    const idxs = shuffle([0,1,2,3]);
    optionShuffleCache[key] = idxs;
  }
  const idxs = optionShuffleCache[key];
  const letters = ["A","B","C","D"];
  return idxs.map((origIdx,i) => ({
    text: q.options[origIdx],
    letter: letters[i],
    origLetter: letters[origIdx],
    isCorrect: letters[origIdx] === q.correctAnswer
  }));
}

// ================= Derived stats =================
function getLatestOutcome(qid){
  const a = STATE.answers[qid];
  if(!a) return null;
  return a.correct;
}
function attemptedIds(){ return Object.keys(STATE.answers).map(Number); }
function computeOverall(){
  const ids = attemptedIds();
  const attempted = ids.length;
  const correct = ids.filter(id => getLatestOutcome(id) === true).length;
  const incorrect = attempted - correct;
  return { attempted, correct, incorrect, pct: pct(correct, attempted) };
}
function computeCategoryStats(){
  const out = {};
  CATEGORIES.forEach(cat => {
    const qs = QUESTIONS.filter(q => q.category === cat);
    const ids = qs.map(q=>q.id).filter(id => STATE.answers[id]);
    const correct = ids.filter(id => getLatestOutcome(id) === true).length;
    out[cat] = { total: qs.length, attempted: ids.length, correct, pct: pct(correct, ids.length) };
  });
  return out;
}
function strongestWeakest(){
  const cs = computeCategoryStats();
  const withData = Object.entries(cs).filter(([,v]) => v.attempted >= 2);
  if(withData.length === 0) return { strongest: "—", weakest: "—" };
  const sorted = withData.sort((a,b) => b[1].pct - a[1].pct);
  return { strongest: sorted[0][0], weakest: sorted[sorted.length-1][0] };
}
function readinessLabel(){
  const { attempted, pct: overallPct } = computeOverall();
  if(attempted < 10) return { label: "Low", note: "Answer at least 10 questions to unlock a readiness estimate." };
  if(overallPct >= 90) return { label: "Exam Ready", note: "Excellent accuracy across attempted questions." };
  if(overallPct >= 80) return { label: "Very Good", note: "Strong performance — polish remaining weak areas." };
  if(overallPct >= 70) return { label: "Good", note: "Solid base — keep drilling weaker topics." };
  if(overallPct >= 60) return { label: "Developing", note: "Making progress — more mock practice recommended." };
  return { label: "Low", note: "Needs more preparation before sitting the exam." };
}
function readinessColorVar(label){
  if(label === "Exam Ready") return "good";
  if(label === "Very Good") return "good";
  if(label === "Good") return "navy";
  if(label === "Developing") return "gold";
  return "bad";
}
function classify(scorePct){
  if(scorePct >= 90) return "Excellent / Exam Ready";
  if(scorePct >= 80) return "Very Good";
  if(scorePct >= 70) return "Good";
  if(scorePct >= 60) return "Developing";
  return "Needs More Preparation";
}

// Spaced-repetition bucket update
function updateReviewBucket(qid, correct, confidence){
  let bucket;
  if(!correct) bucket = "today";
  else if(confidence === "guessing" || confidence === "not-sure" || !confidence) bucket = "soon";
  else bucket = "mastered";
  const dangerous = (!correct && confidence === "very-sure");
  STATE.review[qid] = { bucket, dangerous, lastConfidence: confidence || null };
}
function reviewBuckets(){
  const out = { today: [], soon: [], mastered: [] };
  Object.entries(STATE.review).forEach(([qid, v]) => {
    if(out[v.bucket]) out[v.bucket].push(Number(qid));
  });
  return out;
}
function dangerousIds(){
  return Object.entries(STATE.review).filter(([,v]) => v.dangerous).map(([qid]) => Number(qid));
}

// Study streak (calendar-day based, any activity counts)
function touchStreak(){
  const today = todayStr();
  const s = STATE.streak;
  if(s.lastActiveDate === today) return;
  const yest = new Date(Date.now() - 86400000).toISOString().slice(0,10);
  if(s.lastActiveDate === yest) s.current += 1;
  else s.current = 1;
  s.best = Math.max(s.best, s.current);
  s.lastActiveDate = today;
}

// Record a completed study session (practice / mock / daily) into history + mistakes/answers
function recordAnswer(qid, selectedLetter, confidence){
  const q = QMAP[qid];
  const correct = selectedLetter === q.correctAnswer;
  const prev = STATE.answers[qid];
  const attempts = prev ? prev.attempts.slice() : [];
  attempts.push({ selected: selectedLetter, correct, at: Date.now() });
  STATE.answers[qid] = { selected: selectedLetter, correct, confidence: confidence || null, lastAt: Date.now(), attempts };
  if(!correct) STATE.mistakeStatus[qid] = "active";
  else if(STATE.mistakeStatus[qid] === "active") { /* leave history, but it's no longer "current" wrong */ }
  updateReviewBucket(qid, correct, confidence);
  touchStreak();
  saveState();
  track("answer", { category: q.category, correct: correct, confidence: confidence || null, mode: (STUDY && ROUTE !== "mock") ? STUDY.mode : "mock" });
}
function wrongAttemptCount(qid){
  const a = STATE.answers[qid];
  if(!a) return 0;
  return a.attempts.filter(x => !x.correct).length;
}
function activeMistakes(){
  return Object.keys(STATE.answers)
    .map(Number)
    .filter(id => STATE.answers[id].correct === false && STATE.mistakeStatus[id] !== "learned");
}
function learnedMistakes(){
  return Object.keys(STATE.mistakeStatus).map(Number).filter(id => STATE.mistakeStatus[id] === "learned");
}

function toggleBookmark(qid, kind){
  const b = STATE.bookmarks[qid] || { important:false, reviewLater:false, difficult:false };
  b[kind] = !b[kind];
  STATE.bookmarks[qid] = b;
  saveState();
}
function isBookmarked(qid, kind){
  return !!(STATE.bookmarks[qid] && STATE.bookmarks[qid][kind]);
}

function logSession(type, correct, total){
  STATE.sessionHistory.push({ date: todayStr(), type, pct: pct(correct,total), count: total });
  if(STATE.sessionHistory.length > 200) STATE.sessionHistory.shift();
  STATE.lastSessionScore = pct(correct,total);
  saveState();
  if(type !== "mock") track("session_complete", { mode: type, pct: pct(correct,total), n: total });
}

// ================= Usage statistics (anonymous, opt-out) =================
// Sends anonymous usage events to a Google Apps Script web app (see usage-collector/).
// Collected: random browser ID, sections visited, answers' topic + right/wrong + confidence,
// study/mock sessions, mock scores by domain, active time, device class.
// NOT collected: names, emails, IP addresses, question text, which option was picked.
const TELEMETRY = {
  ENDPOINT: "https://script.google.com/macros/s/AKfycbzCiLlR0LB0hkrO8S5TFTCZZPTXOull8v5WnFGu7A636NtaPEEslkmNPjuiNwswyXUM/exec",   // Apps Script web-app URL (empty = collection disabled)
  TOKEN: "mEcOFPqsdHLBUSBMehhGPc2W3s_ROORw44BUjyYReaM",      // shared token, must match TOKEN in the Apps Script
  VERSION: "v2-2026-11-16",
  KEY: "etecMasterTrainer_usage_v1",
  FLUSH_MS: 20000, MAX_QUEUE: 300, BATCH: 40
};
const T = (function(){
  let s = null;
  try{ s = JSON.parse(localStorage.getItem(TELEMETRY.KEY)); }catch(e){}
  if(!s || typeof s !== "object") s = {};
  if(!s.uid) s.uid = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : ("u" + Date.now().toString(36) + Math.random().toString(36).slice(2,10));
  if(!s.first) s.first = new Date().toISOString();
  if(!Array.isArray(s.queue)) s.queue = [];
  if(s.consent !== "yes" && s.consent !== "no") s.consent = null;
  return s;
})();
const T_SID = "s" + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const T_OFF = /[?&]notrack\b/.test(location.search);   // add ?notrack to the URL to disable for that visit
let T_FLUSHING = false, T_ACTIVE_MS = 0, T_LAST_VISIBLE = Date.now();

function tSave(){ try{ localStorage.setItem(TELEMETRY.KEY, JSON.stringify(T)); }catch(e){} }
function tEnabled(){ return !!TELEMETRY.ENDPOINT && !T_OFF && T.consent !== "no"; }
function tDevice(){ const w = window.innerWidth || 1024; return w < 700 ? "mobile" : (w < 1100 ? "tablet" : "desktop"); }

function track(event, data){
  if(!tEnabled()) return;
  try{
    const ev = Object.assign({
      eid: Date.now().toString(36) + Math.random().toString(36).slice(2,8),
      ts: new Date().toISOString(), uid: T.uid, sid: T_SID, v: TELEMETRY.VERSION, event: event,
      day: Math.floor((Date.now() - Date.parse(T.first)) / 86400000), device: tDevice(),
      route: (typeof ROUTE !== "undefined") ? ROUTE : null
    }, data || {});
    T.queue.push(ev);
    if(T.queue.length > TELEMETRY.MAX_QUEUE) T.queue.splice(0, T.queue.length - TELEMETRY.MAX_QUEUE);
    tSave();
    if(T.consent === "yes" && T.queue.length >= TELEMETRY.BATCH) tFlush();
  }catch(e){}
}

function tFlush(){
  if(!tEnabled() || T.consent !== "yes" || T_FLUSHING || !T.queue.length) return;
  if(authEnabled() && !signedIn()) return;   // keep the queue until someone is signed in
  T_FLUSHING = true;
  const batch = T.queue.slice(0, TELEMETRY.BATCH);
  const body = JSON.stringify(authEnabled() ? { session: SESSION.token, events: batch } : { token: TELEMETRY.TOKEN, events: batch });
  fetch(TELEMETRY.ENDPOINT, { method:"POST", mode:"no-cors", keepalive:true, headers:{ "Content-Type":"text/plain;charset=utf-8" }, body: body })
    .then(function(){
      const sent = {}; batch.forEach(function(e){ sent[e.eid] = 1; });
      T.queue = T.queue.filter(function(e){ return !sent[e.eid]; });
      tSave(); T_FLUSHING = false;
      if(T.queue.length) setTimeout(tFlush, 500);
    })
    .catch(function(){ T_FLUSHING = false; });   // offline: keep the queue, retry on next tick
}

function tActiveSec(){ return Math.round((T_ACTIVE_MS + (document.hidden ? 0 : Date.now() - T_LAST_VISIBLE)) / 1000); }

function tSetConsent(v){
  T.consent = v;
  if(v === "no") T.queue = [];
  tSave();
  const b = document.getElementById("usage-banner"); if(b) b.remove();
  if(v === "yes") tFlush();
}

function tShowBanner(){
  if(document.getElementById("usage-banner")) return;

    '<div style="display:flex;gap:8px;justify-content:flex-end;">' +

  document.getElementById("usage-no").addEventListener("click", function(){ tSetConsent("no"); render(); });
}

function telemetryFootHtml(){
  // The "Usage statistics: On/Off" footer link was removed on request (20 Nov 2026).
  return "";
}

function telemetryInit(){
  if(!TELEMETRY.ENDPOINT || T_OFF) return;
  document.addEventListener("click", function(e){
    const a = e.target.closest && e.target.closest('[data-action="usage-settings"]');
    if(!a) return;
    e.preventDefault();
    const on = T.consent === "yes";
    openModal({
      title: authEnabled() ? "Usage statistics" : "Anonymous usage statistics",
      body: "These are " + (on ? "currently <b>on</b>" : "currently <b>off</b>") + ". " + (authEnabled()
        ? "When on, the sections you use, topic-level scores, Main Exam results and time spent are linked to your account so the administrator can follow your preparation. Question text and the option you picked are never sent. Your study progress stays in this browser either way."
        : "When on, this browser sends a random ID plus which sections you use, topic-level scores, mock exam results and time spent. No name, email or answer content is sent. Your study progress stays in this browser either way."),
      confirmLabel: on ? "Turn off" : "Turn on",
      danger: on,
      onConfirm: function(){ tSetConsent(on ? "no" : "yes"); render(); toast(on ? "Usage statistics off." : "Usage statistics on. Thank you."); }
    });
  });
  document.addEventListener("visibilitychange", function(){
    if(document.hidden){
      T_ACTIVE_MS += Date.now() - T_LAST_VISIBLE;
      track("active", { sec: tActiveSec() });
      tFlush();
    } else { T_LAST_VISIBLE = Date.now(); }
  });
  window.addEventListener("pagehide", function(){ tFlush(); });
  setInterval(tFlush, TELEMETRY.FLUSH_MS);
  if(T.consent === null && !authEnabled()) tShowBanner();   // with sign-in, consent is given on the profile form
  const returning = !!(T.queue.length || localStorage.getItem(TELEMETRY.KEY + "_seen"));
  try{ localStorage.setItem(TELEMETRY.KEY + "_seen", "1"); }catch(e){}
  track("app_open", { returning: returning });
  // One-time report of study done in this browser BEFORE it started sending usage (counts only).
  // Version 2 replaces the first version, whose counts the collector did not store.
  if(!T.baselineV2Sent){
    T.baselineSent = true; T.baselineV2Sent = true; tSave();
    const report = preTrackingReport();
    if(report) track("baseline", { data: report });
  }
}

// Counts of everything this browser recorded before T.first (when it first loaded the tracked version).
// Sends no question IDs, question text or chosen options: only totals and answers per day.
function preTrackingReport(){
  const cutoff = Date.parse(T.first);
  if(isNaN(cutoff)) return null;
  const cutoffDay = new Date(cutoff).toISOString().slice(0, 10);
  const toMs = function(v){ return typeof v === "number" ? v : Date.parse(v); };
  const day = function(ms){ return new Date(ms).toISOString().slice(0, 10); };

  let attempts = 0, correct = 0, questions = 0, first = null;
  const days = {};
  Object.keys(STATE.answers).forEach(function(qid){
    let counted = false;
    (STATE.answers[qid].attempts || []).forEach(function(a){
      const at = toMs(a.at);
      if(isNaN(at) || at >= cutoff) return;
      attempts++; if(a.correct) correct++;
      if(!counted){ questions++; counted = true; }
      if(first === null || at < first) first = at;
      const d = day(at); days[d] = days[d] || [0, 0]; days[d][0]++; if(a.correct) days[d][1]++;
    });
  });

  const sessions = (STATE.sessionHistory || []).filter(function(s){ return s.date && s.date < cutoffDay && s.type !== "mock"; });
  const mocks = (STATE.mockAttempts || []).filter(function(m){ const t = toMs(m.dateFinished); return !isNaN(t) && t < cutoff; });
  const before = function(iso){ const t = toMs(iso); return !isNaN(t) && t < cutoff; };
  const learnDone = !!STATE.learnCompletedAt && before(STATE.learnCompletedAt);
  const cert = !!(STATE.certificate && before(STATE.certificate.issuedAt));
  if(!attempts && !sessions.length && !mocks.length && !learnDone && !cert) return null;

  let dayKeys = Object.keys(days).sort().slice(-180);
  const perDay = {}; dayKeys.forEach(function(d){ perDay[d] = days[d]; });
  // Keep the report under the collector's 6,000-character cell limit by dropping the oldest days if needed.
  while(dayKeys.length && JSON.stringify(perDay).length > 4800){ delete perDay[dayKeys.shift()]; }
  sessions.forEach(function(s){ if(s.date < (first === null ? "9999" : day(first))) first = Date.parse(s.date); });
  const scores = mocks.map(function(m){ return Number(m.pct); }).filter(function(n){ return !isNaN(n); });
  return {
    v: 2,
    before: T.first,                       // everything counted happened before this moment
    first_activity: first === null ? null : day(first),
    active_days: Object.keys(days).length,
    questions_answered: questions,         // distinct questions
    attempts: attempts, correct: correct,
    sessions: sessions.length,
    sessions_by_type: sessions.reduce(function(o, s){ o[s.type] = (o[s.type] || 0) + 1; return o; }, {}),
    mocks_finished: mocks.length,
    mock_best: scores.length ? Math.max.apply(null, scores) : null,
    mock_avg: scores.length ? Math.round(scores.reduce(function(a, b){ return a + b; }, 0) / scores.length) : null,
    learn_completed: learnDone,
    certificate: cert,
    per_day: perDay                        // "YYYY-MM-DD": [answers, correct]
  };
}

// Sign-in is on when AUTH.ENABLED is true and TELEMETRY.ENDPOINT points at the Apps Script (usage-collector/Code.gs).
// Until then the app works exactly as before, with no sign-in.
// People type their email address and receive a one-time code. The server checks the code, decides each person's
// role and signs the session. Nothing on this page can make someone an admin: admin data is only ever returned
// by the server after it checks the role.
const AUTH = {
  ENABLED: true,   // set to true after the Apps Script is updated and deployed (see usage-collector/SETUP.md)
  KEY: "etecMasterTrainer_session_v1",
  UI_KEY: "etecMasterTrainer_authui_v1",
  CONSENT_VERSION: "2026-11-20"
};
function authEnabled(){ return AUTH.ENABLED === true && !!TELEMETRY.ENDPOINT; }

let SESSION = (function(){
  try{
    const s = JSON.parse(localStorage.getItem(AUTH.KEY));
    if(s && s.token && s.user && s.expires > Date.now()) return s;
  }catch(e){}
  return null;
})();
let AUTH_UI = (function(){
  try{ const v = JSON.parse(localStorage.getItem(AUTH.UI_KEY)); if(v && typeof v === "object") return v; }catch(e){}
  return {};
})();
let ANNOUNCEMENT = null;
let APP_STARTED = false;

function saveSession(){ try{ if(SESSION) localStorage.setItem(AUTH.KEY, JSON.stringify(SESSION)); else localStorage.removeItem(AUTH.KEY); }catch(e){} }
function saveAuthUi(){ try{ localStorage.setItem(AUTH.UI_KEY, JSON.stringify(AUTH_UI)); }catch(e){} }
function signedIn(){ return !!(SESSION && SESSION.expires > Date.now()); }
function isAdmin(){ return signedIn() && SESSION.user.role === "admin"; }

};
function authMessage(code){ return AUTH_MESSAGES[code] || "Something went wrong. Please try again."; }

function isAuthAction(action){ return action === "request_code" || action === "verify_code"; }

function api(action, payload){
  const body = Object.assign({ action: action }, payload || {});
  if(SESSION && !isAuthAction(action)) body.session = SESSION.token;
  return fetch(TELEMETRY.ENDPOINT, { method:"POST", headers:{ "Content-Type":"text/plain;charset=utf-8" }, body: JSON.stringify(body) })
    .then(function(r){ return r.json(); })
    .catch(function(){ return { ok:false, error:"network" }; })
    .then(function(res){
      if(res && res.ok) return res;
      const code = (res && res.error) || "server_error";
      if(!isAuthAction(action) && ["bad_session","session_expired","account_inactive","suspended"].indexOf(code) !== -1){
        signOut(authMessage(code));
      }
      const err = new Error(authMessage(code)); err.code = code; throw err;
    });
}

  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
}

          '<button class="linkbtn" type="button" id="si-change">Use a different email</button></div>'

        '<p class="auth-sub">Enter your email address and we\'ll email you a code to sign in. No password needed. Practice questions, Main Exams, revision and your progress are all inside.</p>' +
        '<form id="email-form" novalidate>' +
          '<div class="pf-field"><label for="si-email">Email address</label>' +
            '<input class="pf-input" id="si-email" type="email" inputmode="email" autocomplete="email" maxlength="100" required value="'+escapeHtml(SIGNIN.email)+'"></div>' +
          '<button class="btn btn-primary auth-wide" type="submit" id="si-send">Email me a code</button>' +
        '</form>') +
      '<div class="auth-msg" id="auth-msg" role="status" aria-live="polite"></div>' +
      '<p class="auth-fine">By signing in you agree to the <a href="#" data-action="privacy">privacy notice</a><span class="ar-dup"> · <a href="#" data-action="privacy" lang="ar" dir="rtl">إشعار الخصوصية</a></span></p>' +
      '<p class="auth-fine">Independent ETEC preparation resource, not an official ETEC platform.</p>' +
    '</div></div>';
  if(message) setAuthMsg(message, true);
  const first = document.getElementById(codeStep ? "si-code" : "si-email");
  if(first) first.focus();
  if(codeStep){
    document.getElementById("code-form").addEventListener("submit", submitCode);
    // Keep only digits and show them as "123 456" while typing or pasting.
    document.getElementById("si-code").addEventListener("input", function(){
      const d = codeDigits(this.value).slice(0, 6);
      this.value = d.length > 3 ? d.slice(0, 3) + " " + d.slice(3) : d;
    });
    document.getElementById("si-change").addEventListener("click", function(){ SIGNIN.step = "email"; drawSignIn(); });
    document.getElementById("si-resend").addEventListener("click", function(){ sendCode(SIGNIN.email, true); });
    tickResend();
    SIGNIN.timer = setInterval(tickResend, 1000);
  } else {
    document.getElementById("email-form").addEventListener("submit", function(e){
      e.preventDefault();
      sendCode(document.getElementById("si-email").value, false);
    });
  }
}

function tickResend(){
  const b = document.getElementById("si-resend");
  if(!b){ if(SIGNIN.timer){ clearInterval(SIGNIN.timer); SIGNIN.timer = null; } return; }
  const left = Math.ceil((SIGNIN.resendAt - Date.now()) / 1000);
  b.disabled = left > 0;
  b.textContent = left > 0 ? "Send a new code (" + left + "s)" : "Send a new code";
}

function sendCode(email, resend){
  email = String(email || "").trim();
  if(!/^\S+@\S+\.\S+$/.test(email)){ setAuthMsg(authMessage("invalid_email"), true); return; }
  const btn = document.getElementById(resend ? "si-resend" : "si-send");
  if(btn) btn.disabled = true;
  setAuthMsg("Sending…");
  api("request_code", { email: email }).then(function(){
    SIGNIN.email = email.toLowerCase(); SIGNIN.step = "code"; SIGNIN.resendAt = Date.now() + CODE_RESEND_SECONDS * 1000;
    drawSignIn();
    setAuthMsg("Code sent. Check your inbox.");
  }).catch(function(e){
    setAuthMsg(e.message, true);
    if(btn && !resend) btn.disabled = false;
  });
}

// Keeps only the digits of a pasted code: drops spaces and hidden direction marks, and turns Arabic-Indic digits into 0-9.
function codeDigits(v){
  return String(v||"").replace(/[٠-٩]/g,function(c){return c.charCodeAt(0)-0x660;}).replace(/[۰-۹]/g,function(c){return c.charCodeAt(0)-0x6F0;}).replace(/\D/g,"");
}
function submitCode(e){
  e.preventDefault();
  const code = codeDigits(document.getElementById("si-code").value);
  if(!/^\d{6}$/.test(code)){ setAuthMsg(authMessage("bad_code"), true); return; }
  const btn = document.getElementById("si-verify");
  btn.disabled = true;
  setAuthMsg("Signing in…");
  api("verify_code", { email: SIGNIN.email, code: code, uid: T.uid }).then(completeSignIn).catch(function(err){
    setAuthMsg(err.message, true);
    const b = document.getElementById("si-verify");
    if(b) b.disabled = false;
  });
}

function completeSignIn(res){
  SESSION = { token: res.session, expires: res.expires, user: res.user };
  saveSession();
  ANNOUNCEMENT = res.announcement || null;
  AUTH_UI.resetSeen = AUTH_UI.resetSeen || {};
  if(!(res.user.user_id in AUTH_UI.resetSeen)){ AUTH_UI.resetSeen[res.user.user_id] = res.user.reset_at || ""; saveAuthUi(); }
  if(!res.user.profile_done) renderProfileForm(true);
  else startApp();
}

function signOut(message){
  // Send this person's unsent events under their own session now, so they are never credited to the next person.
  if(SESSION && T.queue.length && T.consent === "yes" && !T_OFF){
    for(let i = 0; i < T.queue.length; i += TELEMETRY.BATCH){
      try{
        fetch(TELEMETRY.ENDPOINT, { method:"POST", mode:"no-cors", keepalive:true, headers:{ "Content-Type":"text/plain;charset=utf-8" },
          body: JSON.stringify({ session: SESSION.token, events: T.queue.slice(i, i + TELEMETRY.BATCH) }) }).catch(function(){});
      }catch(e){}
    }
  }
  T.queue = []; tSave();
  SESSION = null; saveSession(); examSavedClear();
  SUBVIEW = null; ROUTE = "dashboard";
  if(EXAM && examTimerHandle){ clearInterval(examTimerHandle); }
  renderSignIn(message);
}

// Exam date is picked as Day / Month / Year (browser date pickers follow the device language and are ambiguous).
// It is still stored and sent as YYYY-MM-DD.
const EXAM_MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
function examDateSelectsHtml(iso){
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(iso || ""));
  const y = m ? +m[1] : 0, mo = m ? +m[2] : 0, d = m ? +m[3] : 0;
  let days = '<option value="">Day</option>', months = '<option value="">Month</option>', years = '<option value="">Year</option>';
  for(let i = 1; i <= 31; i++) days += '<option value="'+i+'"'+(i === d ? " selected" : "")+'>'+i+'</option>';
  for(let i = 1; i <= 12; i++) months += '<option value="'+i+'"'+(i === mo ? " selected" : "")+'>'+EXAM_MONTHS[i-1]+'</option>';
  for(let i = 2024; i <= 2030; i++) years += '<option value="'+i+'"'+(i === y ? " selected" : "")+'>'+i+'</option>';
  return '<div class="pf-date" role="group" aria-label="Planned exam date">' +
    '<select class="pf-input" id="pf-exam-d" aria-label="Day">'+days+'</select>' +
    '<select class="pf-input" id="pf-exam-m" aria-label="Month">'+months+'</select>' +
    '<select class="pf-input" id="pf-exam-y" aria-label="Year">'+years+'</select></div>';
}
// Returns "" (none chosen), "YYYY-MM-DD", or null (incomplete or impossible date).
function readExamDate(){
  const d = document.getElementById("pf-exam-d").value, m = document.getElementById("pf-exam-m").value, y = document.getElementById("pf-exam-y").value;
  if(!d && !m && !y) return "";
  if(!d || !m || !y) return null;
  const dt = new Date(Date.UTC(+y, +m - 1, +d));
  if(dt.getUTCFullYear() !== +y || dt.getUTCMonth() !== +m - 1 || dt.getUTCDate() !== +d) return null;
  return y + "-" + ("0" + m).slice(-2) + "-" + ("0" + d).slice(-2);
}

  const needsConsent = first || !user.profile_done;
  return (

function attachProfileForm(first){
  const form = document.getElementById("profile-form");
  if(!form) return;
  form.addEventListener("submit", function(e){
    e.preventDefault();
    const msg = document.getElementById("pf-msg");
    const name = document.getElementById("pf-name").value.trim();
    const exam = readExamDate();
    const consentBox = document.getElementById("pf-consent");
    const show = function(t, err){ msg.textContent = t; msg.classList.toggle("err", !!err); };
    if(exam === null){ show(authMessage("bad_exam_date"), true); document.getElementById("pf-exam-d").focus(); return; }
    if(!name){ show(authMessage("name_required"), true); document.getElementById("pf-name").focus(); return; }
    if(consentBox && !consentBox.checked){ show(authMessage("consent_required"), true); consentBox.focus(); return; }
    const btn = document.getElementById("pf-save"); btn.disabled = true; show("Saving…");
    api("profile", {
      name: name,
      organisation: document.getElementById("pf-org").value,
      city: document.getElementById("pf-city").value,
      exam_date: exam,
      consent: consentBox ? consentBox.checked : undefined
    }).then(function(res){
      SESSION.user = res.user; saveSession();
      if(consentBox && T.consent !== "no"){ T.consent = "yes"; tSave(); }
      if(first){ startApp(); toast("Welcome, " + res.user.name + "."); }
      else { render(); toast("Profile saved."); }
    }).catch(function(e2){ if(document.getElementById("pf-msg")){ show(e2.message, true); btn.disabled = false; } });
  });
}

function renderProfileForm(first){
  closeModal();
  const app = document.getElementById("app");
  app.innerHTML =
    '<div class="auth-screen"><div class="auth-card auth-card-wide">' +
      '<div class="auth-lang">'+langToggle("lang-link")+'</div>' +
      brandMarkHtml() +
      '<h1>' + (first ? "Welcome" : "Your profile") + '</h1>' +
      '<p class="auth-sub">Signed in as <b>'+escapeHtml(SESSION.user.email)+'</b>. Tell us a little about yourself so the trainer can support your preparation.</p>' +
      profileFormHtml(SESSION.user, true) +
    '</div></div>';
  attachProfileForm(true);
}

// ---------- Starting the app ----------
function startApp(){
  if(!APP_STARTED){
    APP_STARTED = true;
    telemetryInit();
    setInterval(function(){ if(SESSION && SESSION.expires < Date.now()) signOut(authMessage("session_expired")); }, 60000);
  }
  render();
  refreshMe();
}

function refreshMe(){
  if(!authEnabled() || !signedIn()) return;
  api("me").then(function(res){
    const before = JSON.stringify([SESSION.user, ANNOUNCEMENT]);
    SESSION.user = res.user; saveSession();
    ANNOUNCEMENT = res.announcement || null;
    applyReset(res.user);
    if(!res.user.profile_done){ renderProfileForm(true); return; }
    const busy = SUBVIEW === "study" || SUBVIEW === "mock-session";
    if(!busy && before !== JSON.stringify([SESSION.user, ANNOUNCEMENT])) render();
  }).catch(function(){});
}

function applyReset(user){
  AUTH_UI.resetSeen = AUTH_UI.resetSeen || {};
  const seen = AUTH_UI.resetSeen[user.user_id];
  if(user.reset_at && seen !== undefined && user.reset_at !== seen){
    resetAllProgress();
    AUTH_UI.resetSeen[user.user_id] = user.reset_at; saveAuthUi();
    SUBVIEW = null; ROUTE = "dashboard"; render();
    toast("Your progress was reset by the administrator.");
  } else if(seen === undefined){
    AUTH_UI.resetSeen[user.user_id] = user.reset_at || ""; saveAuthUi();
  }
}

function adminError(tab, e){ adminBody(tab, '<div class="empty">'+escapeHtml(e.message)+'</div>'); }
function fmtWhen(iso){
  if(!iso) return "—";
  const d = new Date(iso); if(isNaN(d)) return "—";
  return d.toLocaleDateString("en-GB", { day:"numeric", month:"short", year:"numeric" }) + " " + d.toLocaleTimeString(undefined, { hour:"2-digit", minute:"2-digit" });
}
function fmtDay(s){
  if(!s) return "—";
  const d = new Date(String(s).slice(0,10) + "T00:00:00Z"); if(isNaN(d)) return escapeHtml(s);
  return d.toLocaleDateString("en-GB", { day:"numeric", month:"short", year:"numeric", timeZone:"UTC" });
}
function tableHtml(head, rows, empty){
  if(!rows.length) return '<div class="empty">'+(empty||"Nothing yet.")+'</div>';
  return '<div class="admin-table-wrap"><table class="admin-table"><thead><tr>' +
    head.map(function(h){ return '<th'+(h.num?' class="num"':'')+'>'+h.label+'</th>'; }).join("") +
    '</tr></thead><tbody>' + rows.join("") + '</tbody></table></div>';
}

const USER_OPS = {
  suspend:    { label: "Suspend", title: "Suspend this user?", body: "They are signed out and can't sign in until you reactivate them.", danger: true },
  reactivate: { label: "Reactivate", title: "Reactivate this user?", body: "They can sign in again straight away." },
  reset:      { label: "Reset progress", title: "Reset this user's progress?", body: "Their answers, bookmarks and exam history are cleared on each device the next time they open the trainer. This cannot be undone.", danger: true },
  "delete":   { label: "Delete", title: "Delete this user?", body: "They are signed out and can't sign in. You can restore the account for 30 days; after that it is erased and their usage history is unlinked from them.", danger: true },
  restore:    { label: "Restore", title: "Restore this user?", body: "The account becomes active again." }
};

function adminUsers(){
  const draw = function(){
    const q = ADMIN_FILTER.q.trim().toLowerCase();
    const list = (ADMIN_USERS || []).filter(function(u){
      if(ADMIN_FILTER.status !== "all" && u.status !== ADMIN_FILTER.status) return false;
      if(!q) return true;
      return [u.name, u.email, u.organisation, u.city].join(" ").toLowerCase().indexOf(q) !== -1;
    });
    const rows = list.map(function(u){
      const ops = u.role === "admin" ? [] :
        u.status === "active" ? ["suspend", "reset", "delete"] :
        u.status === "suspended" ? ["reactivate", "delete"] : ["restore"];
      const statusPill = u.status === "active" ? '<span class="pill pill-good">Active</span>' :
        u.status === "suspended" ? '<span class="pill pill-bad">Suspended</span>' : '<span class="pill pill-muted">Deleted</span>';
      return '<tr>' +
        '<td><div>'+escapeHtml(u.name || "—")+(u.role==="admin"?' <span class="pill pill-gold">Admin</span>':'')+'</div><div class="sub">'+escapeHtml(u.email)+'</div></td>' +
        '<td>'+escapeHtml(u.organisation || "—")+'<div class="sub">'+escapeHtml(u.city || "")+'</div></td>' +
        '<td>'+fmtDay(u.exam_date)+'</td>' +
        '<td>'+statusPill+(u.status==="deleted"&&u.deleted_at?'<div class="sub">'+fmtDay(u.deleted_at)+'</div>':'')+'</td>' +
        '<td>'+fmtWhen(u.last_active || u.last_login)+'</td>' +
        '<td class="num">'+u.answers+'</td>' +
        '<td class="num">'+(u.accuracy===null?'—':u.accuracy+'%')+'</td>' +
        '<td class="num">'+(u.best_mock===null?'—':u.best_mock+'%')+'</td>' +
        '<td><div class="admin-actions">'+ops.map(function(op){
          return '<button class="btn btn-sm '+(USER_OPS[op].danger?'btn-danger':'btn-ghost')+'" type="button" data-uop="'+op+'" data-uid="'+escapeHtml(u.user_id)+'">'+USER_OPS[op].label+'</button>';
        }).join("")+'</div></td>' +
      '</tr>';
    });
    const el = adminBody("users",
      '<div class="admin-toolbar">' +
        '<input class="pf-input admin-search" id="admin-q" type="search" placeholder="Search name, email, organisation or city" aria-label="Search users" value="'+escapeHtml(ADMIN_FILTER.q)+'">' +
        '<select class="pf-input admin-select" id="admin-status" aria-label="Filter by status">' +
          [["all","All statuses"],["active","Active"],["suspended","Suspended"],["deleted","Deleted"]].map(function(o){
            return '<option value="'+o[0]+'"'+(ADMIN_FILTER.status===o[0]?' selected':'')+'>'+o[1]+'</option>'; }).join("") +
        '</select>' +
        '<span class="admin-note">'+list.length+' of '+(ADMIN_USERS||[]).length+' users</span>' +
      '</div>' +
      tableHtml([{label:"User"},{label:"Organisation"},{label:"Exam date"},{label:"Status"},{label:"Last active"},{label:"Answers",num:1},{label:"Accuracy",num:1},{label:"Best exam",num:1},{label:"Actions"}],
        rows, ADMIN_USERS && ADMIN_USERS.length ? "No users match." : "No one has signed in yet."));
    if(!el) return;
    const qi = document.getElementById("admin-q");
    qi.addEventListener("input", function(){ ADMIN_FILTER.q = qi.value; const pos = qi.selectionStart; draw(); const n = document.getElementById("admin-q"); if(n){ n.focus(); try{ n.setSelectionRange(pos, pos); }catch(x){} } });
    document.getElementById("admin-status").addEventListener("change", function(e){ ADMIN_FILTER.status = e.target.value; draw(); });
    el.querySelectorAll("[data-uop]").forEach(function(b){
      b.addEventListener("click", function(){
        const op = b.getAttribute("data-uop"), uid = b.getAttribute("data-uid");
        const target = (ADMIN_USERS || []).find(function(x){ return x.user_id === uid; });
        const def = USER_OPS[op];
        openModal({
          title: def.title,
          body: '<b>'+escapeHtml(target ? (target.name || target.email) : uid)+'</b>'+(target?' ('+escapeHtml(target.email)+')':'')+'<br><br>'+def.body,
          confirmLabel: def.label, danger: !!def.danger,
          onConfirm: function(){
            api("admin_user_action", { target: uid, op: op }).then(function(){ toast(def.label + " done."); load(); })
              .catch(function(e){ toast(e.message); });
          }
        });
      });
    });
  };
  const load = function(){
    api("admin_users").then(function(r){ ADMIN_USERS = r.users; draw(); }).catch(function(e){ adminError("users", e); });
  };
  if(ADMIN_USERS) draw();
  load();
}

function adminAnnounce(){
  const cur = ANNOUNCEMENT && ANNOUNCEMENT.text ? ANNOUNCEMENT : null;
  const el = adminBody("announce",
    '<div class="card card-pad" style="max-width:640px;">' +
      '<h3 class="admin-h">Announcement for all users</h3>' +
      '<p class="admin-note">Shown at the top of the trainer until each user dismisses it. Up to 280 characters.</p>' +

    '</div>');
  if(!el) return;
  const send = function(text){
    api("admin_announce", { text: text }).then(function(r){
      ANNOUNCEMENT = r.announcement || null;
      AUTH_UI.dismissed = null; saveAuthUi();
      render(); toast(text ? "Announcement published." : "Announcement removed.");
    }).catch(function(e){ toast(e.message); });
  };

    '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="'+stroke+'"/>' +
    '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="'+colorVar+'" stroke-width="'+stroke+'" stroke-linecap="round" stroke-dasharray="'+c+'" stroke-dashoffset="'+off+'"/>' +

}

let STUDY = null;
// STUDY = { mode:'learn'|'practice'|'daily'|'retry', ids:[...], index:0, title, correctCount:0,

//           freshKey: <string unique per question instance>, returnRoute }

function newFreshKey(){ return Date.now()+"_"+Math.random().toString(36).slice(2,7); }

function startLearnMode(){
  if(!STATE.learnOrder || STATE.learnOrder.length !== TOTAL_Q){
    STATE.learnOrder = shuffle(QUESTIONS.map(function(q){return q.id;}));
    STATE.learnIndex = 0; saveState();
  }
  STUDY = { mode:"learn", ids: STATE.learnOrder, index: STATE.learnIndex||0, title:"Learn Mode",
    correctCount:0, locked:false, selectedLetter:null, showConfidence:false, explainMore:false, freshKey:newFreshKey(), returnRoute:"learn" };
  SUBVIEW = "study"; ROUTE = "learn"; render(); track("study_start", { mode: STUDY.mode, n: STUDY.ids.length });
}
function startPracticeSession(ids, title){
  if(ids.length===0){ toast("No questions match that filter yet."); return; }
  STUDY = { mode:"practice", ids: ids, index:0, title: title||"Practice Session",
    correctCount:0, locked:false, selectedLetter:null, showConfidence:false, explainMore:false, freshKey:newFreshKey(), returnRoute:"practice" };
  SUBVIEW = "study"; ROUTE = "practice"; render(); track("study_start", { mode: STUDY.mode, n: STUDY.ids.length });
}
function startDailyChallenge(){
  const today = todayStr();
  if(STATE.daily.lastDate === today){
    toast("You already completed today's challenge. Come back tomorrow!");
    navigate("dashboard");
    return;
  }
  const ids = shuffle(QUESTIONS.map(function(q){return q.id;})).slice(0,10);
  STUDY = { mode:"daily", ids: ids, index:0, title:"Daily ETEC Challenge",
    correctCount:0, locked:false, selectedLetter:null, showConfidence:false, explainMore:false, freshKey:newFreshKey(), returnRoute:"dashboard" };
  SUBVIEW = "study"; ROUTE = "dashboard"; render(); track("study_start", { mode: STUDY.mode, n: STUDY.ids.length });
}
function startRetry(qid){
  STUDY = { mode:"retry", ids:[qid], index:0, title:"Retry Question",
    correctCount:0, locked:false, selectedLetter:null, showConfidence:false, explainMore:false, freshKey:newFreshKey(), returnRoute:"mistakes" };
  SUBVIEW = "study"; ROUTE = "mistakes"; render(); track("study_start", { mode: STUDY.mode, n: STUDY.ids.length });
}

function currentStudyQuestion(){ return QMAP[STUDY.ids[STUDY.index]]; }

function renderStudyScreen(){
  if(!STUDY) return '<div class="empty">No active session.</div>';
  if(STUDY.done) return renderSessionSummary();
  const q = currentStudyQuestion();
  const opts = getShuffledOptions(q, STUDY.freshKey);
  const total = STUDY.ids.length;
  const revKey = CATEGORY_TO_REVISION[q.category] || QUESTION_TO_REVISION[q.id];

  let html = '<div class="qcard">';
  html += '<div class="qcard-meta">';
  html += '<span class="qcard-counter">Question '+(STUDY.index+1)+' of '+total+'</span>';
  html += '<span class="pill pill-navy">'+q.category+'</span>';
  html += '<span class="pill pill-muted">'+q.difficulty+'</span>';
  if(q.sourceType === "Practice Variation") html += '<span class="pill pill-gold">Practice Variation</span>';
  html += '<span style="flex:1;"></span>';
  html += '<button class="icon-btn '+(isBookmarked(q.id,"important")?"on":"")+'" data-bm="important" title="Mark important">★</button>';
  html += '<button class="icon-btn '+(isBookmarked(q.id,"reviewLater")?"on":"")+'" data-bm="reviewLater" title="Review later">🔖</button>';
  html += '<button class="icon-btn '+(isBookmarked(q.id,"difficult")?"on":"")+'" data-bm="difficult" title="Difficult">⚠</button>';
  html += '</div>';
  html += '<div class="stem">'+escapeHtml(q.question)+'</div>';
  html += '<div class="options">';
  opts.forEach(function(o){
    let cls = "option";
    if(STUDY.locked){
      cls += " locked";
      if(o.isCorrect) cls += " correct";
      else if(o.letter === STUDY.selectedLetter) cls += " incorrect";
    } else if(o.letter === STUDY.selectedLetter){ cls += " selected"; }
    html += '<button class="'+cls+'" data-letter="'+o.letter+'" '+(STUDY.locked?"disabled":"")+'>' +
      '<span class="letter">'+o.letter+'</span><span class="txt">'+escapeHtml(o.text)+'</span>' +
      (STUDY.locked && o.isCorrect ? '<span style="margin-left:auto;color:var(--good);font-weight:700;">✓</span>' : "") +
      (STUDY.locked && !o.isCorrect && o.letter===STUDY.selectedLetter ? '<span style="margin-left:auto;color:var(--bad);font-weight:700;">✕</span>' : "") +
    '</button>';
  });
  html += '</div>';

  if(!STUDY.locked){
    html += '<div class="qcard-actions">';
    html += '<button class="btn btn-primary" id="submit-answer" '+(STUDY.selectedLetter?"":"disabled")+'>Submit Answer</button>';
    if(STUDY.mode==="learn" && STUDY.index>0) html += '<button class="btn btn-ghost" id="prev-q">Previous</button>';
    html += '</div>';
  } else {
    const correctOpt = opts.find(function(o){ return o.isCorrect; });
    const wasCorrect = STUDY.selectedLetter === correctOpt.letter;
    html += '<div class="feedback-banner '+(wasCorrect?"good":"bad")+'">'+(wasCorrect?"✅ Correct!":"❌ Incorrect")+'</div>';
    html += '<div class="feedback-block"><div class="k">Answer</div><div class="ct">'+correctOpt.letter+'. '+escapeHtml(correctOpt.text)+'</div></div>';
    html += '<div class="feedback-block"><div class="k">Explanation</div><div class="ct">'+escapeHtml(q.explanation)+'</div></div>';
    html += '<div class="feedback-block"><div class="k">Topic / Model</div><div class="ct">'+q.category+'</div></div>';
    if(STUDY.explainMore){
      const sec = REVISION_SECTIONS.find(function(s){return s.id===revKey;});
      html += '<div class="feedback-block"><div class="k">From Revision Notes — '+(sec?sec.title:q.category)+'</div><div class="ct">' + renderRevisionSectionInline(sec) + '</div></div>';
    }

    if(STUDY.mode !== "retry"){
      html += '<div class="confidence-row" id="confidence-row">';
      html += '<div style="width:100%;font-size:11.5px;color:var(--ink-muted);margin-bottom:2px;">How confident were you? (optional)</div>';
      ["Guessing","Not Sure","Fairly Sure","Very Sure"].forEach(function(c){
        const val = c.toLowerCase().replace(" ","-");
        html += '<button class="btn btn-ghost btn-sm" data-conf="'+val+'">'+c+'</button>';
      });
      html += '</div>';
    }

    html += '<div class="qcard-actions">';
    if(STUDY.mode==="learn" && STUDY.index>0) html += '<button class="btn btn-ghost" id="prev-q">Previous</button>';
    html += '<button class="btn btn-primary" id="next-q">'+(STUDY.index+1<total?"Next Question":"Finish")+'</button>';
    html += '<button class="btn btn-soft" id="save-q">Save Question</button>';
    html += '<button class="btn btn-soft" id="add-revision">Add to Revision</button>';
    if(!STUDY.explainMore) html += '<button class="btn btn-ghost" id="explain-more">Explain More</button>';
    html += '</div>';
  }
  html += '</div>';
  return html;
}

function renderRevisionSectionInline(sec){
  if(!sec) return "No revision card covers this topic yet. Use the explanation above and check your Study Guide or the ETEC Standards PDF.";
  let out = "";
  if(sec.cards) out += sec.cards.map(function(c){ return "<strong>"+escapeHtml(c.title)+"</strong> — "+escapeHtml(c.body)+(c.memory?" <em>("+escapeHtml(c.memory)+")</em>":""); }).join("<br><br>");
  if(sec.flow){
    out += (out?"<br><br>":"") + "<strong>"+(sec.flow.title||sec.title)+"</strong>: " + sec.flow.steps.join(" → ");
    if(sec.flow.memory) out += " <em>("+escapeHtml(sec.flow.memory)+")</em>";
    if(sec.flow.callout) out += "<br>"+escapeHtml(sec.flow.callout);
  }
  if(sec.pyramid) out += (out?"<br><br>":"") + sec.pyramid.map(function(p){return p.name+": "+p.q;}).join("<br>");
  return out;
}

function renderSessionSummary(){
  const total = STUDY.ids.length;
  const correct = STUDY.correctCount;

  return '<div class="card card-pad" style="max-width:560px;margin:20px auto;text-align:center;">' +
    '<div style="font-family:var(--font-display);font-size:22px;margin-bottom:6px;">'+STUDY.title+' complete</div>' +

    '<div style="color:var(--ink-muted);font-size:13.5px;margin-bottom:18px;">'+correct+' correct out of '+total+' — '+classify(scorePct)+'</div>' +

function titleCase(s){ return s.charAt(0).toUpperCase()+s.slice(1); }

function attachStudyHandlers(){
  if(!STUDY || STUDY.done){
    const doneBtn = document.getElementById("summary-done");
    if(doneBtn) doneBtn.addEventListener("click", function(){
      const rr = STUDY.returnRoute; STUDY = null; SUBVIEW = null; navigate(rr);
    });
    const againBtn = document.getElementById("summary-again");
    if(againBtn) againBtn.addEventListener("click", function(){ STUDY=null; SUBVIEW=null; navigate("practice"); });
    return;
  }
  document.querySelectorAll(".option").forEach(function(btn){
    btn.addEventListener("click", function(){
      if(STUDY.locked) return;
      STUDY.selectedLetter = btn.getAttribute("data-letter");
      renderView();
    });
  });
  const submitBtn = document.getElementById("submit-answer");
  if(submitBtn) submitBtn.addEventListener("click", function(){
    if(!STUDY.selectedLetter) return;
    STUDY.locked = true;
    const q = currentStudyQuestion();
    const opts = getShuffledOptions(q, STUDY.freshKey);
    const chosen = opts.find(function(o){ return o.letter === STUDY.selectedLetter; });
    const correct = chosen.isCorrect;
    if(correct) STUDY.correctCount++;
    if(STUDY.mode !== "retry"){
      recordAnswer(q.id, chosen.origLetter, null);
    } else {
      recordAnswer(q.id, chosen.origLetter, null);
      if(correct) toast("Nice — marking progress on this question.");
    }
    renderView();
  });
  document.querySelectorAll("[data-conf]").forEach(function(btn){
    btn.addEventListener("click", function(){
      const q = currentStudyQuestion();
      const val = btn.getAttribute("data-conf");
      updateReviewBucket(q.id, STATE.answers[q.id].correct, val);
      STATE.answers[q.id].confidence = val;
      saveState();
      track("confidence", { category: q.category, correct: STATE.answers[q.id].correct, confidence: val });
      document.getElementById("confidence-row").innerHTML = '<span style="font-size:12px;color:var(--good);font-weight:600;">Noted — thanks.</span>';
    });
  });
  const explainBtn = document.getElementById("explain-more");
  if(explainBtn) explainBtn.addEventListener("click", function(){ STUDY.explainMore = true; renderView(); });
  const saveBtn = document.getElementById("save-q");
  if(saveBtn) saveBtn.addEventListener("click", function(){ toggleBookmark(currentStudyQuestion().id,"important"); toast("Saved to Important Questions."); renderView(); });
  const addRevBtn = document.getElementById("add-revision");
  if(addRevBtn) addRevBtn.addEventListener("click", function(){ toggleBookmark(currentStudyQuestion().id,"reviewLater"); toast("Added to Review Later."); renderView(); });
  document.querySelectorAll('[data-bm]').forEach(function(btn){
    btn.addEventListener("click", function(){
      toggleBookmark(currentStudyQuestion().id, btn.getAttribute("data-bm"));
      renderView();
    });
  });
  const prevBtn = document.getElementById("prev-q");
  if(prevBtn) prevBtn.addEventListener("click", function(){
    STUDY.index = Math.max(0, STUDY.index-1);
    STUDY.locked=false; STUDY.selectedLetter=null; STUDY.explainMore=false; STUDY.freshKey=newFreshKey();
    if(STUDY.mode==="learn"){ STATE.learnIndex = STUDY.index; saveState(); }
    renderView();
  });
  const nextBtn = document.getElementById("next-q");
  if(nextBtn) nextBtn.addEventListener("click", function(){
    if(STUDY.index+1 >= STUDY.ids.length){
      if(STUDY.mode==="practice" || STUDY.mode==="daily"){
        logSession(STUDY.mode, STUDY.correctCount, STUDY.ids.length);
        if(STUDY.mode==="daily"){
          const today = todayStr();
          const y = new Date(Date.now()-86400000).toISOString().slice(0,10);
          STATE.daily.streak = (STATE.daily.lastDate===y) ? STATE.daily.streak+1 : 1;
          STATE.daily.best = Math.max(STATE.daily.best, STATE.daily.streak);
          STATE.daily.lastDate = today;
          STATE.daily.history.push({date:today, pct: pct(STUDY.correctCount, STUDY.ids.length)});
          saveState();
        }
      }
      if(STUDY.mode==="learn"){ STATE.learnCompletedAt = STATE.learnCompletedAt || new Date().toISOString(); STATE.learnIndex = 0; STATE.learnOrder = shuffle(QUESTIONS.map(function(q){return q.id;})); saveState(); }
      STUDY.done = true; renderView(); return;
    }
    STUDY.index++;
    STUDY.locked=false; STUDY.selectedLetter=null; STUDY.explainMore=false; STUDY.freshKey=newFreshKey();
    if(STUDY.mode==="learn"){ STATE.learnIndex = STUDY.index; saveState(); }
    renderView();
  });
}

// ---- Resume an unfinished Main Exam after a refresh or closed tab ----
// The exam is saved in this browser on every change. The part clock keeps running while the page is closed
// (same as the real exam): time away is subtracted when the exam is resumed.
const EXAM_SAVE_KEY = "etecMasterTrainer_exam_v1";
function examUid(){ return (SESSION && SESSION.user && SESSION.user.user_id) ? SESSION.user.user_id : ""; }
function examSave(){
  if(!EXAM || SUBVIEW !== "mock-session") return;
  try{ localStorage.setItem(EXAM_SAVE_KEY, JSON.stringify({ uid: examUid(), savedAt: Date.now(), exam: EXAM })); }catch(e){}
}
function examSavedClear(){ try{ localStorage.removeItem(EXAM_SAVE_KEY); }catch(e){} }
function examSavedLoad(){
  try{
    const s = JSON.parse(localStorage.getItem(EXAM_SAVE_KEY));
    if(!s || !s.exam || !Array.isArray(s.exam.parts) || !s.exam.parts.length || s.uid !== examUid()) return null;
    const ex = s.exam;
    if(typeof ex.partIndex !== "number" || !ex.parts[ex.partIndex] || !MAIN_EXAMS[ex.examKey]) return null;
    return s;
  }catch(e){ return null; }
}
function examProjection(s){
  const parts = s.exam.parts; let idx = s.exam.partIndex, rem = parts[idx].remainingSec, left = (Date.now() - s.savedAt) / 1000;
  while(left >= rem){
    left -= rem;
    if(idx >= parts.length - 1) return { over: true };
    idx++; rem = parts[idx].remainingSec;
  }
  return { over: false, partIdx: idx, remainingSec: Math.max(1, Math.round(rem - left)) };
}
function resumeMainExam(){
  const s = examSavedLoad();
  if(!s){ toast("No unfinished exam was found."); navigate("mock"); return; }
  EXAM = s.exam; SUBVIEW = "mock-session"; ROUTE = "mock";
  let left = (Date.now() - s.savedAt) / 1000, guard = 0;
  while(left > 0 && guard++ < 10){
    const p = currentExamPart();
    if(left >= p.remainingSec){
      left -= p.remainingSec; p.remainingSec = 0;
      finishExamPart(true);
      if(SUBVIEW !== "mock-session") return;
    } else { p.remainingSec -= left; left = 0; }
  }
  activateExamPart(EXAM.partIndex);
  render();
}

function examAttemptsFor(examKey){
  return STATE.mockAttempts.filter(function(a){ return (a.examKey || "1") === examKey; });
}
function examBestScore(examKey){
  const list = examAttemptsFor(examKey);
  if(list.length===0) return null;
  return list.reduce(function(m,a){ return Math.max(m,a.pct); }, 0);
}

      line = pt.label + " — about " + mins + " min " + (secs<10?"0":"") + secs + " s left. The clock kept running while you were away, like in the real exam.";
    }
    resumeCard = '<div class="card card-pad" style="margin-bottom:18px;border-color:var(--gold-border);background:var(--gold-bg);">' +
      '<div style="font-family:var(--font-display);font-size:18px;font-weight:600;">Unfinished exam: '+nm+'</div>' +
      '<div style="font-size:13px;color:var(--ink-muted);margin-top:6px;">'+line+'</div>' +
      '<div style="margin-top:12px;display:flex;gap:10px;flex-wrap:wrap;">' +
        '<button class="btn btn-primary" id="resume-exam-btn">'+(pj.over?"See my result":"Resume exam")+'</button>' +
        '<button class="btn btn-ghost" id="discard-exam-btn">Discard it</button>' +

function after_mock(){
  document.querySelectorAll(".start-main-exam-btn").forEach(function(btn){
    btn.addEventListener("click", function(){
      const key = btn.getAttribute("data-exam");
      const saved = examSavedLoad();
      if(!saved){ startMainExam(key); return; }
      openModal({
        title: "Start a new exam?",
        body: "You have an unfinished <strong>"+(saved.exam.examTitle||"Main Exam")+"</strong>. Starting a new exam will discard it.",
        confirmLabel: "Discard and start",
        onConfirm: function(){ examSavedClear(); startMainExam(key); }
      });
    });
  });
  const rb = document.getElementById("resume-exam-btn");
  if(rb) rb.addEventListener("click", resumeMainExam);
  const db = document.getElementById("discard-exam-btn");
  if(db) db.addEventListener("click", function(){
    openModal({
      title: "Discard the unfinished exam?",
      body: "Your answers in this attempt will be lost. This cannot be undone.",
      confirmLabel: "Discard",
      onConfirm: function(){ examSavedClear(); render(); }
    });
