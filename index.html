<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ETEC Master Exam Trainer</title>
<meta name="description" content="Interactive ETEC trainer/instructor exam prep app — practice questions, mock exams, revision notes, weak-area analysis, spaced practice and progress tracking.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ===== Design tokens ===== */
  :root{
    --bg:#F3F8F4;
    --surface:#FFFFFF;
    --surface-2:#E7F1EA;
    --sidebar:#163C2A;
    --sidebar-hover:#1F5E3A;
    --sidebar-text:#CFE3D6;
    --sidebar-text-active:#FFFFFF;
    --border:#D3E4D9;
    --border-strong:#B7D0BE;
    --ink:#16241C;
    --ink-muted:#4E6459;
    --ink-faint:#7C9285;
    --navy:#1880C8;
    --navy-strong:#145F99;
    --navy-tint:#E4F1FB;
    --brand-green:#4CAF3C;
    --brand-teal:#14A8B8;
    --brand-blue:#1880C8;
    --brand-indigo:#30308C;
    --gold:#9A6B0C;
    --gold-bg:#FBF1DA;
    --gold-border:#EBD39B;
    --good:#1E9150;
    --good-bg:#E4F5EA;
    --good-border:#B7E4C7;
    --bad:#B0362D;
    --bad-bg:#FBEAE8;
    --bad-border:#F0C2BD;
    --shadow-sm:0 1px 2px rgba(15,40,26,0.07);
    --shadow-md:0 6px 20px rgba(15,40,26,0.12);
    --focus-ring:0 0 0 3px rgba(24,128,200,0.35);
    --radius-sm:6px;
    --radius-md:10px;
    --radius-lg:16px;
    --font-display:"Source Serif 4", Georgia, "Times New Roman", serif;
    --font-body:"IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --font-mono:"IBM Plex Mono", "SF Mono", Consolas, monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0E1712;
      --surface:#152019;
      --surface-2:#1B2B21;
      --sidebar:#0B1911;
      --sidebar-hover:#16311F;
      --sidebar-text:#A9C2B3;
      --sidebar-text-active:#FFFFFF;
      --border:#2A4033;
      --border-strong:#395849;
      --ink:#E9F3EC;
      --ink-muted:#A9C2B3;
      --ink-faint:#7C9686;
      --navy:#3D9BDE;
      --navy-strong:#6AB7EA;
      --navy-tint:#16314A;
      --brand-green:#5FC450;
      --brand-teal:#2FC2D2;
      --brand-blue:#3D9BDE;
      --brand-indigo:#6A6AD1;
      --gold:#D9A237;
      --gold-bg:rgba(217,162,55,0.14);
      --gold-border:rgba(217,162,55,0.35);
      --good:#43B579;
      --good-bg:rgba(67,181,121,0.14);
      --good-border:rgba(67,181,121,0.35);
      --bad:#E2716A;
      --bad-bg:rgba(226,113,106,0.14);
      --bad-border:rgba(226,113,106,0.35);
      --shadow-sm:0 1px 2px rgba(0,0,0,0.3);
      --shadow-md:0 10px 30px rgba(0,0,0,0.45);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0E1712;
    --surface:#152019;
    --surface-2:#1B2B21;
    --sidebar:#0B1911;
    --sidebar-hover:#16311F;
    --sidebar-text:#A9C2B3;
    --sidebar-text-active:#FFFFFF;
    --border:#2A4033;
    --border-strong:#395849;
    --ink:#E9F3EC;
    --ink-muted:#A9C2B3;
    --ink-faint:#7C9686;
    --navy:#3D9BDE;
    --navy-strong:#6AB7EA;
    --navy-tint:#16314A;
    --brand-green:#5FC450;
    --brand-teal:#2FC2D2;
    --brand-blue:#3D9BDE;
    --brand-indigo:#6A6AD1;
    --gold:#D9A237;
    --gold-bg:rgba(217,162,55,0.14);
    --gold-border:rgba(217,162,55,0.35);
    --good:#43B579;
    --good-bg:rgba(67,181,121,0.14);
    --good-border:rgba(67,181,121,0.35);
    --bad:#E2716A;
    --bad-bg:rgba(226,113,106,0.14);
    --bad-border:rgba(226,113,106,0.35);
    --shadow-sm:0 1px 2px rgba(0,0,0,0.3);
    --shadow-md:0 10px 30px rgba(0,0,0,0.45);
  }

  *,*::before,*::after{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    font-size:15px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{font-family:var(--font-display);font-weight:600;margin:0;text-wrap:balance;color:var(--ink);}
  p{margin:0;}
  button{font-family:inherit;color:inherit;}
  .num{font-family:var(--font-mono);font-variant-numeric:tabular-nums;}
  a{color:inherit;}
  ::selection{background:var(--navy-tint);}
  :focus-visible{outline:none;box-shadow:var(--focus-ring);border-radius:var(--radius-sm);}

  /* ===== App shell ===== */
  #app{display:flex;min-height:100vh;}

  .sidebar{
    width:248px;flex:0 0 248px;background:var(--sidebar);color:var(--sidebar-text);
    display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;
  }
  .sidebar-brand{padding:20px 20px 16px;border-bottom:1px solid rgba(255,255,255,0.08);}
  .sidebar-brand .mark{
    display:flex;align-items:center;gap:10px;
  }
  .sidebar-brand .mark-badge{
    width:40px;height:auto;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
  }
  .sidebar-brand .mark-badge img{width:100%;height:auto;display:block;}
  .sidebar-brand .name{font-family:var(--font-display);font-weight:600;font-size:15.5px;color:#fff;line-height:1.25;}
  .sidebar-brand .sub{font-size:10.5px;letter-spacing:0.06em;text-transform:uppercase;color:var(--sidebar-text);margin-top:2px;}

  .sidebar-ring{padding:16px 20px;border-bottom:1px solid rgba(255,255,255,0.08);display:flex;align-items:center;gap:12px;}
  .ring-wrap{position:relative;width:52px;height:52px;flex:0 0 auto;}
  .ring-wrap svg{transform:rotate(-90deg);}
  .ring-label{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:12px;font-weight:600;color:#fff;}
  .ring-caption .t1{font-size:12px;color:#fff;font-weight:600;}
  .ring-caption .t2{font-size:11px;color:var(--sidebar-text);margin-top:1px;}

  nav.sidebar-nav{padding:10px 12px;display:flex;flex-direction:column;gap:2px;flex:1;}
  .nav-item{
    display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:8px;font-size:13.5px;
    font-weight:500;cursor:pointer;color:var(--sidebar-text);background:transparent;border:1px solid transparent;
    text-align:left;width:100%;
  }
  .nav-item .ic{width:17px;height:17px;flex:0 0 auto;opacity:0.9;}
  .nav-item:hover{background:var(--sidebar-hover);color:#fff;}
  .nav-item.active{background:var(--sidebar-hover);color:#fff;border-color:rgba(255,255,255,0.12);box-shadow:inset 2px 0 0 var(--navy-strong-active,#4CC2E0);}
  .nav-item.active{position:relative;}
  .nav-item.active::before{content:"";position:absolute;left:-12px;top:6px;bottom:6px;width:3px;background:#4CC2E0;border-radius:0 3px 3px 0;}
  .nav-section-label{font-size:10px;text-transform:uppercase;letter-spacing:0.08em;color:var(--ink-faint);padding:14px 12px 4px;color:#5A6C8C;}

  .sidebar-foot{padding:14px 20px 18px;border-top:1px solid rgba(255,255,255,0.08);font-size:11px;color:var(--sidebar-text);}
  .sidebar-foot button{background:transparent;border:1px solid rgba(255,255,255,0.18);color:var(--sidebar-text);padding:6px 10px;border-radius:7px;font-size:11.5px;cursor:pointer;width:100%;margin-top:8px;}
  .sidebar-foot button:hover{color:#fff;border-color:rgba(255,255,255,0.35);}

  .main{flex:1;min-width:0;display:flex;flex-direction:column;}
  .topbar{
    position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--border);
    display:flex;align-items:center;gap:14px;padding:12px 26px;
  }
  .topbar h1{font-size:19px;}
  .topbar .crumb{font-size:12px;color:var(--ink-muted);margin-top:1px;}
  .topbar-spacer{flex:1;}
  .search-box{
    display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--border);
    border-radius:8px;padding:7px 12px;min-width:220px;
  }
  .search-box input{border:none;background:transparent;outline:none;color:var(--ink);font-size:13px;width:100%;font-family:var(--font-body);}
  .search-box svg{flex:0 0 auto;color:var(--ink-muted);}
  .streak-chip{display:flex;align-items:center;gap:6px;background:var(--gold-bg);border:1px solid var(--gold-border);color:var(--gold);padding:6px 11px;border-radius:20px;font-size:12.5px;font-weight:600;}

  .view{padding:24px 26px 60px;max-width:1180px;}
  .view.wide{max-width:none;}

  /* ===== Generic building blocks ===== */
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);}
  .card-pad{padding:20px;}
  .grid{display:grid;gap:16px;}
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;}
  .stat-tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:14px 16px;}
  .stat-tile .label{font-size:11px;text-transform:uppercase;letter-spacing:0.05em;color:var(--ink-muted);font-weight:600;}
  .stat-tile .value{font-family:var(--font-mono);font-size:26px;font-weight:600;margin-top:6px;color:var(--ink);}
  .stat-tile .value.good{color:var(--good);}
  .stat-tile .value.bad{color:var(--bad);}
  .stat-tile .sub{font-size:11.5px;color:var(--ink-faint);margin-top:3px;}

  .section-title{display:flex;align-items:baseline;justify-content:space-between;margin:28px 0 14px;}
  .section-title h2{font-size:16.5px;}
  .section-title .hint{font-size:12px;color:var(--ink-muted);}
  .view > .section-title:first-child{margin-top:0;}

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 16px;border-radius:8px;
    font-size:13.5px;font-weight:600;cursor:pointer;border:1px solid transparent;line-height:1.2;white-space:nowrap;
  }
  .btn-primary{background:var(--navy);color:#fff;}
  .btn-primary:hover{background:var(--navy-strong);}
  :root[data-theme="dark"] .btn-primary, @media (prefers-color-scheme:dark){.btn-primary{color:#08132A;}}
  .btn-ghost{background:transparent;border-color:var(--border-strong);color:var(--ink);}
  .btn-ghost:hover{background:var(--surface-2);}
  .btn-soft{background:var(--navy-tint);color:var(--navy);border-color:transparent;}
  .btn-danger{background:transparent;border-color:var(--bad-border);color:var(--bad);}
  .btn-danger:hover{background:var(--bad-bg);}
  .btn:disabled{opacity:0.45;cursor:not-allowed;}
  .btn-sm{padding:6px 11px;font-size:12.5px;border-radius:7px;}
  .icon-btn{background:transparent;border:1px solid var(--border-strong);border-radius:7px;width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink-muted);}
  .icon-btn:hover{background:var(--surface-2);color:var(--ink);}
  .icon-btn.on{background:var(--gold-bg);border-color:var(--gold-border);color:var(--gold);}

  .pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:600;}
  .pill-navy{background:var(--navy-tint);color:var(--navy);}
  .pill-good{background:var(--good-bg);color:var(--good);border:1px solid var(--good-border);}
  .pill-bad{background:var(--bad-bg);color:var(--bad);border:1px solid var(--bad-border);}
  .pill-gold{background:var(--gold-bg);color:var(--gold);border:1px solid var(--gold-border);}
  .pill-muted{background:var(--surface-2);color:var(--ink-muted);}

  select,input[type="text"]{
    font-family:var(--font-body);background:var(--surface);border:1px solid var(--border-strong);color:var(--ink);
    border-radius:7px;padding:8px 11px;font-size:13px;
  }

  /* Question card */
  .qcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);padding:26px 28px;}
  .qcard-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px;}
  .qcard-counter{font-family:var(--font-mono);font-size:12.5px;color:var(--ink-muted);}
  .qcard .stem{font-family:var(--font-display);font-size:19px;line-height:1.45;color:var(--ink);margin:2px 0 22px;text-wrap:balance;}
  .options{display:flex;flex-direction:column;gap:10px;}
  .option{
    display:flex;align-items:flex-start;gap:12px;padding:13px 15px;border:1.5px solid var(--border-strong);
    border-radius:10px;cursor:pointer;background:var(--surface);text-align:left;width:100%;
  }
  .option:hover:not(.locked){border-color:var(--navy);background:var(--navy-tint);}
  .option .letter{
    font-family:var(--font-mono);font-weight:600;font-size:12.5px;width:24px;height:24px;border-radius:6px;
    background:var(--surface-2);color:var(--ink-muted);display:flex;align-items:center;justify-content:center;flex:0 0 auto;margin-top:1px;
  }
  .option .txt{flex:1;font-size:14.5px;padding-top:1px;}
  .option.selected{border-color:var(--navy);background:var(--navy-tint);}
  .option.selected .letter{background:var(--navy);color:#fff;}
  .option.correct{border-color:var(--good-border);background:var(--good-bg);}
  .option.correct .letter{background:var(--good);color:#fff;}
  .option.incorrect{border-color:var(--bad-border);background:var(--bad-bg);}
  .option.incorrect .letter{background:var(--bad);color:#fff;}
  .option.locked{cursor:default;}
  .option.locked:not(.correct):not(.incorrect):not(.selected){opacity:0.6;}

  .feedback-banner{display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:10px;font-weight:600;font-size:14px;margin-top:20px;}
  .feedback-banner.good{background:var(--good-bg);color:var(--good);border:1px solid var(--good-border);}
  .feedback-banner.bad{background:var(--bad-bg);color:var(--bad);border:1px solid var(--bad-border);}
  .feedback-block{margin-top:14px;padding:14px 16px;background:var(--surface-2);border-radius:10px;font-size:13.5px;color:var(--ink);}
  .feedback-block + .feedback-block{margin-top:10px;}
  .feedback-block .k{font-size:10.5px;text-transform:uppercase;letter-spacing:0.06em;font-weight:700;color:var(--ink-muted);margin-bottom:4px;}

  .qcard-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px;padding-top:18px;border-top:1px solid var(--border);}
  .confidence-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;}
  .confidence-row button{flex:1;min-width:110px;}

  /* Revision cards */
  .rev-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:18px 20px;}
  .rev-card h3{font-size:15px;margin-bottom:8px;}
  .rev-card .memory{margin-top:10px;font-size:12px;color:var(--navy);background:var(--navy-tint);display:inline-block;padding:4px 10px;border-radius:6px;font-weight:600;}
  .flow{display:flex;flex-direction:column;gap:0;}
  .flow-step{display:flex;align-items:center;gap:12px;padding:11px 14px;background:var(--surface-2);border-radius:9px;border:1px solid var(--border);}
  .flow-step .n{font-family:var(--font-mono);font-weight:700;color:var(--navy);width:20px;}
  .flow-step .t{font-weight:600;font-size:13.5px;}
  .flow-step .d{font-size:12px;color:var(--ink-muted);margin-top:1px;}
  .flow-arrow{text-align:center;color:var(--ink-faint);font-size:14px;padding:2px 0;}
  .flow-step.callout{background:var(--gold-bg);border-color:var(--gold-border);}
  .flow-step.callout .n{color:var(--gold);}

  .pyramid{display:flex;flex-direction:column;gap:6px;align-items:stretch;}
  .pyr-level{padding:14px 18px;border-radius:9px;border:1px solid var(--border);background:var(--surface-2);}
  .pyr-level .lv{font-family:var(--font-mono);font-size:11px;color:var(--ink-muted);}
  .pyr-level .name{font-family:var(--font-display);font-weight:600;font-size:15px;margin-top:2px;}
  .pyr-level .q{font-size:12.5px;color:var(--ink-muted);margin-top:2px;}
  .pyr-level:nth-child(1){background:var(--navy-tint);}

  .trap-pair{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:stretch;}
  .trap-side{background:var(--surface-2);border-radius:10px;padding:14px 16px;}
  .trap-side h4{font-size:13.5px;margin-bottom:5px;}
  .trap-side p{font-size:13px;color:var(--ink-muted);}
  .trap-vs{align-self:center;font-family:var(--font-mono);font-size:11px;color:var(--ink-faint);font-weight:700;}

  .flash-stage{display:flex;flex-direction:column;align-items:center;gap:18px;}
  .flash-card{width:100%;max-width:480px;height:230px;perspective:1200px;cursor:pointer;}
  .flash-inner{position:relative;width:100%;height:100%;transition:transform .5s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d;}
  .flash-card.flipped .flash-inner{transform:rotateY(180deg);}
  .flash-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:16px;border:1px solid var(--border);
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:26px;box-shadow:var(--shadow-md);}
  .flash-front{background:var(--surface);}
  .flash-back{background:var(--navy);color:#fff;transform:rotateY(180deg);}
  .flash-face .tag{font-size:10.5px;text-transform:uppercase;letter-spacing:0.08em;color:var(--ink-faint);margin-bottom:12px;}
  .flash-back .tag{color:rgba(255,255,255,0.65);}
  .flash-face .txt{font-family:var(--font-display);font-size:19px;font-weight:600;line-height:1.4;}
  .flash-face .hint{margin-top:14px;font-size:11.5px;color:var(--ink-faint);}
  @media (prefers-reduced-motion:reduce){.flash-inner{transition:none;}}

  .nav-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px;}
  .nav-grid button{
    aspect-ratio:1;border-radius:7px;border:1px solid var(--border-strong);background:var(--surface);
    font-family:var(--font-mono);font-size:12px;cursor:pointer;color:var(--ink-muted);
  }
  .nav-grid button.answered{background:var(--navy-tint);color:var(--navy);border-color:var(--navy);}
  .nav-grid button.flagged{background:var(--gold-bg);color:var(--gold);border-color:var(--gold-border);}
  .nav-grid button.current{outline:2px solid var(--navy);outline-offset:1px;}

  .modal-overlay{position:fixed;inset:0;background:rgba(8,16,32,0.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
  .modal{background:var(--surface);border-radius:var(--radius-lg);padding:26px;max-width:420px;width:100%;box-shadow:var(--shadow-md);border:1px solid var(--border);}
  .modal h3{font-size:17px;margin-bottom:10px;}
  .modal p{font-size:13.5px;color:var(--ink-muted);margin-bottom:20px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;}

  .toast{position:fixed;bottom:22px;right:22px;background:var(--navy-strong);color:#fff;padding:12px 18px;border-radius:10px;font-size:13px;font-weight:600;box-shadow:var(--shadow-md);z-index:200;}

  .empty{padding:40px 20px;text-align:center;color:var(--ink-muted);}
  .empty svg{margin-bottom:10px;opacity:0.5;}

  .disclaimer{margin-top:36px;padding:14px 18px;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;font-size:11.5px;color:var(--ink-muted);line-height:1.5;}

  table.data{width:100%;border-collapse:collapse;font-size:13px;}
  table.data th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:0.04em;color:var(--ink-muted);padding:8px 10px;border-bottom:1px solid var(--border);}
  table.data td{padding:10px 10px;border-bottom:1px solid var(--border);vertical-align:top;}
  table.data tr:last-child td{border-bottom:none;}
  .table-wrap{overflow-x:auto;}

  .bar-row{display:grid;grid-template-columns:170px 1fr 50px;gap:12px;align-items:center;padding:8px 0;}
  .bar-row .name{font-size:13px;font-weight:500;}
  .bar-track{height:9px;background:var(--surface-2);border-radius:6px;overflow:hidden;}
  .bar-fill{height:100%;border-radius:6px;background:var(--navy);}
  .bar-row .pct{font-family:var(--font-mono);font-size:12.5px;text-align:right;color:var(--ink-muted);}

  .chip-row{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{padding:6px 13px;border-radius:20px;border:1px solid var(--border-strong);font-size:12.5px;font-weight:600;cursor:pointer;background:var(--surface);color:var(--ink-muted);}
  .chip.on{background:var(--navy);border-color:var(--navy);color:#fff;}

  .progress-hero{display:flex;align-items:center;gap:26px;flex-wrap:wrap;}
  .progress-bar-wrap{flex:1;min-width:220px;}
  .progress-bar-track{height:14px;background:var(--surface-2);border-radius:8px;overflow:hidden;border:1px solid var(--border);}
  .progress-bar-fill{height:100%;background:linear-gradient(90deg,var(--navy),#0F5C93);border-radius:8px;}
  .readiness-badge{padding:10px 18px;border-radius:12px;font-weight:700;font-size:14px;text-align:center;min-width:150px;}

  .two-col{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;}
  @media (max-width:900px){
    .two-col{grid-template-columns:1fr;}
    .trap-pair{grid-template-columns:1fr;}
    .trap-vs{display:none;}
  }
  @media (max-width:760px){
    #app{flex-direction:column;}
    .sidebar{position:relative;width:100%;flex:none;height:auto;}
    nav.sidebar-nav{flex-direction:row;flex-wrap:wrap;}
    .search-box{min-width:0;}
    .view{padding:18px 16px 50px;}
    .qcard{padding:18px 16px;}
  }

er"], "correctAnswer": "C", "explanation": "Official ETEC study guide practice question (Part 4 — 120 Practice MCQs). Domain: Values & Responsibilities.", "category": "Professional Values and Responsibilities", "domain": "Professional Values and Responsibilities", "difficulty": "Medium", "sourceType": "Source Question"}, {"id": 196, "question": "Critical thinking helps the trainer to:", "options": ["Avoid evidence", "Memorize only", "Analyze situations and make reasoned decisions", "Ignore trainee problems"], "correctAnswer": "C", "explanation": "Official ETEC study guide practice question (Part 4 — 120 Practice MCQs). Domain: Future Skills.", "category": "Future Skills", "domain": "Future Skills", "difficulty": "Medium", "sourceType": "Source Question"}, {"id": 197, "question": "Innovation in training means:", "options": ["Changing activities randomly", "Using new or improved methods to enhance learning", "Removing assessment", "Avoiding technology"], "correctAnswer": "B", "explanation": "Official ETEC study guide practice question (Part 4 — 120 Practice MCQs). Domain: Future Skills.", "category": "Future Skills", "domain": "Future Skills", "difficulty": "Medium", "sourceType": "Source Question"}, {"id": 198, "question": "Digital skills are important because trainers need to:", "options": ["Replace all human interaction", "Avoid assessment", "Use technology effectively and safely in training and professional practice", "Ignore data security"], "correctAnswer": "C", "explanation": "Official ETEC study guide practice question (Part 4 — 120 Practice MCQs). Domain: Future Skills.", "category": "Future Skills", "domain": "Future Skills", "difficulty": "Medium", "sourceType": "Source Question"}, {"id": 199, "question": "Social-emotional skills help trainers to:", "options": ["Focus only on technical content", "Communicate, empathize, manage relationships, and support a positive environment", "Avoid interaction", "Eliminate participation"], "correctAnswer": "B", "explanation": "Official ETEC study guide practice question (Part 4 — 120 Practice MCQs). Domain: Future Skills.", "category": "Future Skills", "domain": "Future Skills", "difficulty": "Medium", "sourceType": "Source Question"}, {"id": 200, "question": "The best description of a modern trainer is:", "options": ["A speaker who only delivers information", "A facilitator of learning and designer of learning experiences", "A person who controls all discussion", "A certificate distributor"], "correctAnswer": "B", "explanation": "Official ETEC study guide practice question (Part 4 — 120 Practice MCQs). Domain: Future Skills.", "category": "Future Skills", "domain": "Future Skills", "difficulty": "Medium", "sourceType": "Source Question"}, {"id": 201, "question": "In the ARCS model, which element is most directly addressed when a trainer uses an unexpected case or question to capture trainee interest?", "options": ["Attention", "Relevance", "Confidence", "Satisfaction"], "correctAnswer": "A", "explanation": "Official ETEC study guide practice question (Part 4 — 120 Practice MCQs). Domain: Professional Knowledge.", "category": "Professional Knowledge", "domain": "Professional Knowledge", "difficulty": "Medium", "sourceType": "Source Question"}, {"id": 202, "question": "A trainee asks, “How does this course help my actual job?” Which ARCS element should the trainer strengthen first?", "options": ["Satisfaction", "Confidence", "Relevance", "Attention"], "correctAnswer": "C", "explanation": "Official ETEC study guide practice question (Part 4 — 120 Practice MCQs). Domain: Professional Knowledge.", "category": "Professional Knowledge", "domain": "Professional Knowledge", "difficulty": "Medium", "sourceType": "Source Question"}, {"id": 203, "question": "According to Self-Determination Theory, motivation is strengthened when training supports:", "options": ["Autonomy, competence, and relatedness", "Attendance, testing, and certificates", "Costs, benefits, and ROI", "Rules, penalties, and control"], "correctAnswer": "A", "explanation": "Official ETEC study guide practice question (Part 4 — 120 Practice MCQs). Domain: Professional Knowledge.", "category": "Professional Knowledge", "domain": "Professional Knowledge", "difficulty": "Medium", "sourceType": "Source Question"}, {"id": 204, "question": "In Expectancy Theory, motivation is weak if trainees believe that:", "options": ["Effort will lead to better performance", "Good performance will lead to valued outcomes", "The outcome is valuable", "Effort will not improve performance or outcomes"], "correctAnswer": "D", "explanation": "Official ETEC study guide practice question (Part 4 — 120 Practice MCQs). Domain: Professional Knowledge.", "category": "Professional Knowledge", "domain": "Professional Knowledge", "difficulty": "Medium", "sourceType": "Source Question"}, {"id": 205, "question": "Goal Setting Theory suggests that performance improves most when goals are:", "options": ["General and easy", "Specific, challenging, and supported by feedback", "Hidden from trainees", "Changed after evaluation"], "correctAnswer": "B", "explanation": "Official ETEC study guide practice question (Part 4 — 120 Practice MCQs). Domain: Professional Knowledge.", "category": "Professional Knowledge", "domain": "Professional Knowledge", "difficulty": "Medium", "sourceType": "Source Question"}, {"id": 206, "question": "Understanding by Design (UbD) is best described as:", "options": ["Starting with slides and then writing objectives", "Backward design: start with desired results and evidence, then plan learning", "A model used only for ROI calculation", "A seating arrangement method"], "correctAnswer": "B", "explanation": "Official ETEC study guide practice question (Part 4 — 120 Practice MCQs). Domain: Professional Knowledge.", "category": "Professional Knowledge", "domain": "Professional Knowledge", "difficulty": "Medium", "sourceType": "Source Question"}, {"id": 207, "question": "Merrill First Principles emphasize that effective instruction should be:", "options": ["Problem-centered with activation, demonstration, application, and integration", "Based only on lectures", "Focused only on trainee satisfaction", "Unstructured and informal"], "correctAnswer": "A", "explanation": "Official ETEC study guide practice question (Part 4 — 120 Practice MCQs). Domain: Professional Knowledge.", "category": "Professional Knowledge", "domain": "Professional Knowledge", "difficulty": "Medium", "sourceType": "Source Question"}, {"id": 208, "question": "Which of Gagne Nine Events should happen early to help trainees understand what they are expected to learn?", "options": ["Enhance retention only", "Inform learners of objectives", "Assess performance only", "Print certificates"], "correctAnswer": "B", "explanation": "Official ETEC study guide practice question (Part 4 — 120 Practice MCQs). Domain: Professional Knowledge.", "category": "Professional Knowledge", "domain": "Professional Knowledge", "difficulty": "Medium", "sourceType": "Source Question"}, {"id": 209, "question": "In Dick and Carey model, instruction is viewed mainly as:", "options": ["A collection of independent slides", "A systems approach linking goals, learners, context, instruction, assessment, and revision", "A trainer personality test", "A financial model"], "correctAnswer": "B", "explanation": "Official ETEC study guide practice question (Part 4 — 120 Practice MCQs). Domain: Professional Knowledge.", "category": "Professional Knowledge", "domain": "Professional Knowledge", "difficulty": "Medium", "sourceType": "Source Question"}, {"id": 210, "question": "A trainer removes irrelevant graphics and splits complex information into smaller steps. This mainly reduces:", "options": ["Intrinsic motivation", "Extraneous cognitive load", "Professional ethics", "Transfer support"], "correctAnswer": "B", "explanation": "Official ETEC study guide practice question (Part 4 — 120 Practice MCQs). Domain: Professional Knowledge.", "category": "Professional Knowledge", "domain": "Professional Knowledge", "difficulty": "Medium", "sourceType": "Source Question"}, {"id": 211, "question": "An assessment that asks trainees to handle a realistic workplace scenario is best described as:", "options": ["Authentic assessment", "Random assessment", "Norm-free assessment", "Attendance assessment"], "correctAnswer": "A", "explanation": "Official ETEC study guide practice question (Part 4 — 120 Practice MCQs). Domain: Professional Practices.", "category": "Professional Practices", "domain": "Professional Practices", "difficulty": "Medium", "sourceType": "Source Question"}, {"id": 212, "question": "Reliability of an evaluation tool means that it:", "options": ["Measures exactly what it should measure", "Produces consistent results under similar conditions", "Is always difficult", "Requires no criteria"], "correctAnswer": "B", "explanation": "Official ETEC study guide practice question (Part 4 — 120 Practice MCQs). Domain: Professional Knowledge.", "category": "Professional Knowledge", "domain": "Professional Knowledge", "difficulty": "Medium", "sourceType": "Source Question"}, {"id": 213, "question": "Validity of an evaluation tool means that it:", "options": ["Measures what it is intended to measure", "Gives the same score to everyone", "Is short", "Avoids evidence"], "correctAnswer": "A", "explanation": "Official ETEC study guide practice question (Part 4 — 120 Practice MCQs). Domain: Professional Knowledge.", "category": "Professional Knowledge", "domain": "Professional Knowledge", "difficulty": "Medium", "sourceType": "Source Question"}, {"id": 214, "question": "Root Cause Analysis is used to:", "options": ["Find underlying causes of a performance problem", "Select slide colors", "Increase attendance automatically", "Avoid asking stakeholders"], "correctAnswer": "A", "explanation": "Official ETEC study guide practice question (Part 4 — 120 Practice MCQs). Domain: Professional Practices.", "category": "Professional Practices", "domain": "Professional Practices", "difficulty": "Medium", "sourceType": "Source Question"}, {"id": 215, "question": "Human Performance Improvement (HPI) differs from a training-only approach because it:", "options": ["Assumes every problem is solved by a course", "Looks systemically at performance and may recommend non-training interventions", "Focuses only on learner satisfaction", "Eliminates evaluation"], "correctAnswer": "B", "explanation": "Official ETEC study guide practice question (Part 4 — 120 Practice MCQs). Domain: Professional Practices.", "category": "Professional Practices", "domain": "Professional Practices", "difficulty": "Medium", "sourceType": "Source Question"}, {"id": 216, "question": "Systems thinking in training means:", "options": ["Viewing problems as isolated events only", "Examining relationships, patterns, causes, and wider effects", "Ignoring organizational culture", "Avoiding data"], "correctAnswer": "B", "explanation": "Official ETEC study guide practice question (Part 4 — 120 Practice MCQs). Domain: Professional Knowledge.", "category": "Professional Knowledge", "domain": "Professional Knowledge", "difficulty": "Medium", "sourceType": "Source Question"}, {"id": 217, "question": "TPACK is about integrating:", "options": ["Technology, pedagogy, and content knowledge", "Training prices, attendance, and certificates", "Tests, policies, and compliance", "Time, people, and costs only"], "correctAnswer": "A", "explanation": "Official ETEC study guide practice question (Part 4 — 120 Practice MCQs). Domain: Future Skills.", "category": "Future Skills", "domain": "Future Skills", "difficulty": "Medium", "sourceType": "Source Question"}, {"id": 218, "question": "In the SAMR model, using technology to create tasks previously impossible is called:", "options": ["Substitution", "Augmentation", "Modification", "Redefinition"], "correctAnswer": "D", "explanation": "Official ETEC study guide practice question (Part 4 — 120 Practice MCQs). Domain: Future Skills.", "category": "Future Skills", "domain": "Future Skills", "difficulty": "Medium", "sourceType": "Source Question"}, {"id": 219, "question": "SCORM is mainly related to:", "options": ["E-learning content packaging and LMS interoperability", "Face-to-face seating design", "Trainer ethics code", "Classroom decoration"], "correctAnswer": "A", "explanation": "Official ETEC study guide practice question (Part 4 — 120 Practice MCQs). Domain: Future Skills.", "category": "Future Skills", "domain": "Future Skills", "difficulty": "Medium", "sourceType": "Source Question"}, {"id": 220, "question": "Professional Learning Communities are best described as:", "options": ["Individual work without sharing", "Collaborative groups using reflection, data, and shared learning for continuous improvement", "A final exam committee only", "A marketing channel"], "correctAnswer": "B", "explanation": "Official ETEC study guide practice question (Part 4 — 120 Practice MCQs). Domain: Values & Responsibilities.", "category": "Professional Values and Responsibilities", "domain": "Professional Values and Responsibilities", "difficulty": "Medium", "sourceType": "Source Question"}, {"id": 221, "question": "According to Standard 6.1 of the official ETEC trainer standards, a trainer's commitment to professional ethics and national regulations is primarily meant to ensure:", "options": ["Higher training fees", "Quality assurance systems in training", "Longer certificate validity periods", "Fewer required training hours"], "correctAnswer": "B", "explanation": "Additional Practice Question — not from source bank. Grounded directly in Standard 6.1: \"Commit to professional ethics, national regulations, and quality assurance systems in training.\"", "category": "Professional Values and Responsibilities", "domain": "Professional Values and Responsibilities", "difficulty": "Medium", "sourceType": "Additional Practice Question"}, {"id": 222, "question": "Standard 6.2 requires a trainer to be aware of which of the following in all their practices?", "options": ["Only their personal duties, not their rights", "Rights, duties, discipline, and responsibilities", "Only the training entity's holiday schedule", "Marketing procedures for new courses"], "correctAnswer": "B", "explanation": "Additional Practice Question — not from source bank. Grounded directly in Standard 6.2: \"Be aware of rights, duties, discipline, and responsibilities in all practices.\"", "category": "Professional Values and Responsibilities", "domain": "Professional Values and Responsibilities", "difficulty": "Medium", "sourceType": "Additional Practice Question"}, {"id": 223, "question": "Standard 7.1 (commitment to citizenship values) is meant to apply to a trainer's:", "options": ["Personal finances only", "All professional relationships and practices", "Only their relationship with the training entity's owner", "Only fully online training sessions"], "correctAnswer": "B", "explanation": "Additional Practice Question — not from source bank. Grounded directly in Standard 7.1: \"Commit to citizenship values in all professional relationships and practices.\"", "category": "Professional Values and Responsibilities", "domain": "Professional Values and Responsibilities", "difficulty": "Medium", "sourceType": "Additional Practice Question"}, {"id": 224, "question": "Which pair of values does Standard 7.2 require a trainer to commit to in all their practices?", "options": ["Marketing and sales technique", "Scientific integrity and confidentiality", "Punctuality and attendance only", "Creativity and innovation"], "correctAnswer": "B", "explanation": "Additional Practice Question — not from source bank. Grounded directly in Standard 7.2: \"Commit to scientific integrity and confidentiality in all practices.\"", "category": "Professional Values and Responsibilities", "domain": "Professional Values and Responsibilities", "difficulty": "Medium", "sourceType": "Additional Practice Question"}, {"id": 225, "question": "A trainer keeps trainee assessment records private and never shares them without proper authorization. This mainly reflects the domain of:", "options": ["Professional Knowledge", "Professional Practices", "Professional Values and Responsibilities", "Future Skills"], "correctAnswer": "C", "explanation": "Additional Practice Question — not from source bank. Confidentiality is named explicitly under the official definition of the Professional Values and Responsibilities domain.", "category": "Professional Values and Responsibilities", "domain": "Professional Values and Responsibilities", "difficulty": "Easy", "sourceType": "Additional Practice Question"}, {"id": 226, "question": "Standard 8.1 describes continuous professional development mainly as:", "options": ["Pursuing knowledge, training, and labor market developments and updates", "Repeating the same training content every year without change", "Avoiding the use of any new teaching tools", "Waiting for the training entity to assign development activities"], "correctAnswer": "A", "explanation": "Additional Practice Question — not from source bank. Grounded directly in Standard 8.1: \"Pursue knowledge, training, and labor market developments and updates.\"", "category": "Professional Values and Responsibilities", "domain": "Professional Values and Responsibilities", "difficulty": "Medium", "sourceType": "Additional Practice Question"}, {"id": 227, "question": "Standard 8.2 expects a trainer to develop professionally mainly by:", "options": ["Working in isolation from other trainers", "Conducting research and participating in professional learning activities and communities", "Focusing only on administrative paperwork", "Avoiding feedback from trainees and colleagues"], "correctAnswer": "B", "explanation": "Additional Practice Question — not from source bank. Grounded directly in Standard 8.2: \"Conduct research and participate in professional learning activities and communities.\"", "category": "Professional Values and Responsibilities", "domain": "Professional Values and Responsibilities", "difficulty": "Medium", "sourceType": "Additional Practice Question"}, {"id": 228, "question": "Per Standard 8.3, a trainer's professional development plan should be prepared and followed up mainly based on:", "options": ["Randomly chosen topics with no analysis", "Feedback and practice analysis", "Trainee attendance numbers only", "The training center's marketing calendar"], "correctAnswer": "B", "explanation": "Additional Practice Question — not from source bank. Grounded directly in Standard 8.3: \"Prepare, employ, and follow up professional development plans based on feedback and practice analysis.\"", "category": "Professional Values and Responsibilities", "domain": "Professional Values and Responsibilities", "difficulty": "Medium", "sourceType": "Additional Practice Question"}, {"id": 229, "question": "A trainer is designing a leadership module for senior supervisors. Instead of delivering a standard lecture on project management principles, the trainer asks participants to analyze a real, failed project from their own department and construct a new workflow based on their past operational experience. Which learning theory is the trainer primarily applying?", "options": ["Behaviourism", "Cognitivism", "Constructivism", "Social Learning Theory"], "correctAnswer": "C", "explanation": "Constructivism asserts that learners build new knowledge upon their existing knowledge and prior experiences rather than passively receiving information. By analyzing past operational failures and constructing new workflows, trainees actively construct understanding. Constructivism = Building knowledge from experience; Behaviourism = Stimulus-response conditioning; Cognitivism = Internal mental processing.", "category": "Learning Theories", "domain": "Professional Knowledge", "difficulty": "Medium", "sourceType": "Main Exam 2"}, {"id": 230, "question": "During a safety training session for technical staff, a trainer demonstrates the exact procedure for calibrating heavy machinery. The trainees observe the demonstration, rehearse the steps mentally, and then successfully perform the calibration under supervision. According to Bandura’s Social Learning Theory, which sequence BEST represents the process demonstrated in this scenario?", "options": ["Observation → Modelling → Imitation", "Conditioning → Reinforcement → Retention", "Concrete Experience → Abstract Thinking → Testing", "Context → Input → Reaction"], "correctAnswer": "A", "explanation": "Bandura’s Social Learning Theory emphasizes that learning occurs through observing others, modeling their behavior, and imitating the observed actions. Bandura = Observation + Modelling + Imitation.", "category": "Social Learning Theory", "domain": "Professional Knowledge", "difficulty": "Medium", "sourceType": "Main Exam 2"}, {"id": 231, "question": "A trainer utilizes an automated quiz system where trainees immediately receive positive verbal feedback and extra practice points each time they select a correct answer, leading to an increase in desired study habits. In Skinner’s Behaviourist framework, this instructional technique relies on:", "options": ["Negative Reinforcement", "Positive Reinforcement", "Positive Punishment", "Extinction"], "correctAnswer": "B", "explanation": "In Skinner’s Operant Conditioning, positive reinforcement involves presenting a rewarding stimulus (praise/points) immediately following a desired behavior to increase the frequency of that behavior. Positive Reinforcement = Adding a pleasant stimulus to increase behavior.", "category": "Behaviourism", "domain": "Professional Knowledge", "difficulty": "Easy", "sourceType": "Main Exam 2"}, {"id": 232, "question": "A group of trainees completes a complex data analysis exercise. Before moving to new theoretical content, the trainer asks them to write a journal entry reflecting on what challenges they encountered, what strategies worked, and how their thinking changed during the exercise. According to Kolb’s Experiential Learning Cycle, which stage are the trainees experiencing?", "options": ["Concrete Experience", "Abstract Conceptualisation", "Active Experimentation", "Reflective Observation"], "correctAnswer": "D", "explanation": "Kolb’s Experiential Learning Cycle consists of four stages: Concrete Experience (doing), Reflective Observation (reflecting on the experience), Abstract Conceptualisation (learning from the experience/theorizing), and Active Experimentation (trying out what was learned). Reflecting on challenges and changed thinking fits Reflective Observation. Concrete = Do; Reflective = Observe/Reflect; Abstract = Think/Theorize; Active = Test/Apply.", "category": "Experiential Learning", "domain": "Professional Knowledge", "difficulty": "Medium", "sourceType": "Main Exam 2"}, {"id": 233, "question": "Following a session on customer service protocols, trainees are given a new, unscripted scenario and instructed to test out different communication strategies to see which yields the highest customer satisfaction score. In Kolb’s model, this activity corresponds to:", "options": ["Concrete Experience", "Reflective Observation", "Active Experimentation", "Abstract Conceptualisation"], "correctAnswer": "C", "explanation": "Active Experimentation in Kolb's model involves applying theories or new ideas to real-world situations or new practical tests to see how they function. Active Experimentation = Testing new strategies in practical scenarios.", "category": "Experiential Learning", "domain": "Professional Knowledge", "difficulty": "Medium", "sourceType": "Main Exam 2"}, {"id": 234, "question": "An organization is updating its adult learning strategy. The instructional designer insists that adult learners must be involved in the planning and evaluation of their instruction, and that learning experiences must be centered around problem-solving rather than subject-matter memorization. Which framework supports this recommendation?", "options": ["Andragogy", "Pedagogy", "Operant Conditioning", "Behavioural Shaping"], "correctAnswer": "A", "explanation": "Malcolm Knowles’ Andragogy is the art and science of adult learning, emphasizing self-direction, prior experience, readiness to learn, and problem-centered learning. Andragogy = Adult self-directed problem-centered learning; Pedagogy = Teacher-led child education.", "category": "Adult Learning (Andragogy)", "domain": "Professional Knowledge", "difficulty": "Easy", "sourceType": "Main Exam 2"}, {"id": 235, "question": "A corporate training unit notices that employees who completed an advanced excel course are still making frequent errors in budget reporting. The head trainer decides to conduct job-task observations and document current performance gaps before updating the course content. In the ADDIE model, which phase is being conducted?", "options": ["Design", "Analysis", "Development", "Evaluation"], "correctAnswer": "B", "explanation": "The Analysis phase of the ADDIE framework involves identifying the business problem, performance gaps, target audience needs, job tasks, and learning goals before designing instruction. Analysis = Identifying gaps and needs first.", "category": "ADDIE Model", "domain": "Professional Knowledge", "difficulty": "Medium", "sourceType": "Main Exam 2"}, {"id": 236, "question": "During an instructional design project, the trainer specifies the learning objectives, selects the instructional strategy, creates the assessment blueprints, and sequences the lesson topics. Which ADDIE stage encompasses these deliverables?", "options": ["Analysis", "Development", "Implementation", "Design"], "correctAnswer": "D", "explanation": "In ADDIE, the Design phase translates analysis findings into instructional blueprints, specifying learning objectives, assessment instruments, media selection, and lesson sequencing. Design = Blueprinting, sequencing, and objective drafting.", "category": "ADDIE Model", "domain": "Professional Knowledge", "difficulty": "Easy", "sourceType": "Main Exam 2"}, {"id": 237, "question": "An evaluator is reviewing a corporate training program using the CIRO model. The evaluator focuses on assessing whether the organization's training objectives align with operational business needs and identifying the current performance environment. Which component of CIRO is being addressed?", "options": ["Context Evaluation", "Input Evaluation", "Reaction Evaluation", "Outcome Evaluation"], "correctAnswer": "A", "explanation": "The CIRO model components are Context, Input, Reaction, and Outcome. Context evaluation assesses the operational environment, training needs, and organizational objectives to define training goals. Context = Operational environment & goal setting; Input = Training resources & design options.", "category": "CIRO Model", "domain": "Professional Knowledge", "difficulty": "Medium", "sourceType": "Main Exam 2"}, {"id": 238, "question": "A training department evaluates a safety program using the CIRO model by examining whether the training resources, equipment, trainer qualifications, and budgets allocated were utilized efficiently to deliver the course. Which CIRO component is being evaluated?", "options": ["Context", "Input", "Reaction", "Outcome"], "correctAnswer": "B", "explanation": "Input evaluation in the CIRO framework analyzes the choice of training methods, budget, materials, trainer competence, and equipment utilized to execute the training. Input = Resources, budget, materials, and delivery feasibility.", "category": "CIRO Model", "domain": "Professional Knowledge", "difficulty": "Hard", "sourceType": "Main Exam 2"}, {"id": 239, "question": "An assessment specialist is evaluating a professional development workshop. The specialist collects end-of-course survey forms measuring participant satisfaction with the instructor, classroom facility, and pace. According to Kirkpatrick’s model, this evaluation operates at:", "options": ["Level 3 (Behaviour)", "Level 1 (Reaction)", "Level 2 (Learning)", "Level 4 (Results)"], "correctAnswer": "B", "explanation": "Level 1 of Kirkpatrick’s 4-Level Model measures trainees' degree of satisfaction and reaction to the training event (e.g., facilities, trainer, pacing). Level 1 (Reaction) = Trainee satisfaction; Level 2 (Learning) = Knowledge/skill acquisition.", "category": "Kirkpatrick Evaluation", "domain": "Professional Knowledge", "difficulty": "Easy", "sourceType": "Main Exam 2"}, {"id": 240, "question": "Six weeks after a negotiation skills workshop, an evaluator conducts workplace observations and interviews managers to check whether sales representatives are using the new questioning techniques during actual client meetings. Which Kirkpatrick level is being evaluated?", "options": ["Level 1 (Reaction)", "Level 2 (Learning)", "Level 3 (Behaviour)", "Level 4 (Results)"], "correctAnswer": "C", "explanation": "Level 3 (Behaviour) evaluates whether trainees apply what they learned during training when they return to their actual workplace environment. Learning = What did they acquire? Behaviour = Are they applying it at work?", "category": "Kirkpatrick Evaluation", "domain": "Professional Knowledge", "difficulty": "Medium", "sourceType": "Main Exam 2"}, {"id": 241, "question": "An organization measures a 15% reduction in workplace equipment accidents and a $200,000 savings in repair costs over six months following a mandatory safety recertification program. In Kirkpatrick's evaluation framework, this outcome represents:", "options": ["Level 1 (Reaction)", "Level 2 (Learning)", "Level 3 (Behaviour)", "Level 4 (Results)"], "correctAnswer": "D", "explanation": "Level 4 (Results) evaluates targeted business outcomes, such as reduced cost, higher quality, increased safety, or higher profitability resulting from training. Level 4 = Organisational impact and operational results.", "category": "Kirkpatrick Evaluation", "domain": "Professional Knowledge", "difficulty": "Hard", "sourceType": "Main Exam 2"}, {"id": 242, "question": "Before starting a 4-week advanced coding boot camp, a trainer administers a pre-test to measure incoming trainees' current programming knowledge and pinpoint specific prerequisite skill deficits. Which type of assessment is the trainer conducting?", "options": ["Diagnostic Assessment", "Formative Assessment", "Summative Assessment", "Performance-Based Evaluation"], "correctAnswer": "A", "explanation": "Diagnostic assessment is conducted before instruction begins to determine learners' baseline knowledge, strengths, weaknesses, and prerequisite skill levels. Diagnostic = Before training (identifies needs/gaps); Formative = During training (monitors progress).", "category": "Assessment Types", "domain": "Professional Knowledge", "difficulty": "Easy", "sourceType": "Main Exam 2"}, {"id": 243, "question": "During a 3-hour interactive workshop, the trainer uses quick, ungraded digital polls every 30 minutes to check trainee understanding and adjust the instructional pace accordingly. This practice is an example of:", "options": ["Diagnostic Assessment", "Formative Assessment", "Summative Assessment", "Outcome Evaluation"], "correctAnswer": "B", "explanation": "Formative assessment occurs during the instruction process to monitor learner progress, provide ongoing feedback, and allow instructors to modify teaching pacing. Formative = Conducted during instruction to adjust teaching.", "category": "Assessment Types", "domain": "Professional Knowledge", "difficulty": "Easy", "sourceType": "Main Exam 2"}, {"id": 244, "question": "A trainer is explaining the fundamental difference between \"assessment\" and \"evaluation\" in educational measurement. Which statement BEST expresses this distinction?", "options": ["Assessment measures trainer performance, while evaluation measures trainee learning.", "Assessment occurs after a course ends, while evaluation occurs before a course begins.", "Assessment focuses on gathering evidence of individual learner achievement, while evaluation judges the overall effectiveness or value of a training program.", "Assessment provides numerical grades, while evaluation provides qualitative comments."], "correctAnswer": "C", "explanation": "In measurement terminology, assessment focuses on individual learning and skill acquisition, whereas evaluation focuses on judging the merit, worth, or effectiveness of an entire program or curriculum. Assessment = Learner level; Evaluation = Program level.", "category": "Assessment vs Evaluation", "domain": "Professional Knowledge", "difficulty": "Hard", "sourceType": "Main Exam 2"}, {"id": 245, "question": "A trainer analyzes the post-test scores of two training cohorts. Cohort A has a mean score of 82 with a standard deviation of 3. Cohort B has a mean score of 82 with a standard deviation of 14. Which interpretation is MOST accurate?", "options": ["Cohort A has a wider spread of performance than Cohort B.", "Cohort B trainees performed more homogeneously than Cohort A.", "Cohort A trainees scored much lower overall than Cohort B.", "Trainee performance in Cohort A was clustered closely around the mean, whereas Cohort B exhibited high variance in achievement."], "correctAnswer": "D", "explanation": "Standard deviation measures the spread or variability of scores around the mean. A low standard deviation (SD = 3) indicates scores are tightly grouped near the average (82), whereas a high standard deviation (SD = 14) indicates wide dispersion. Low SD = High consistency/homogeneity; High SD = High variance/heterogeneity.", "category": "Educational Statistics", "domain": "Professional Knowledge", "difficulty": "Hard", "sourceType": "Main Exam 2"}, {"id": 246, "question": "An evaluation report indicates that test scores across five regions have a low standard deviation. What does a low standard deviation signify regarding trainee achievement?", "options": ["Trainee scores are tightly grouped around the average, indicating consistent learning outcomes.", "Trainee scores are widely dispersed, indicating significant gaps between high and low performers.", "The mean test score is lower than acceptable industry benchmarks.", "The assessment tool failed to measure higher-order cognitive skills."], "correctAnswer": "A", "explanation": "A low standard deviation reflects minimal variation among scores, meaning most trainees achieved similar performance levels around the mean. Low Standard Deviation = Scores close together.", "category": "Educational Statistics", "domain": "Professional Knowledge", "difficulty": "Medium", "sourceType": "Main Exam 2"}, {"id": 247, "question": "A data report shows a strong positive correlation ($r = +0.85$) between the number of hours trainees spent on interactive LMS simulations and their final practical exam scores. Which conclusion is MOST statistically justified?", "options": ["Completing simulations directly causes trainees to pass the practical exam.", "Higher simulation engagement is strongly associated with higher practical exam scores, though causation cannot be conclusively assumed.", "Trainees who scored lower on the practical exam spent more time on the LMS simulations.", "The simulation software is defective because the correlation is not +1.0."], "correctAnswer": "B", "explanation": "Correlation measures the strength and direction of a linear relationship between two variables, but statistical correlation does NOT establish a direct causal linkage. Correlation ≠ Causation.", "category": "Statistics & Correlation", "domain": "Professional Knowledge", "difficulty": "Hard", "sourceType": "Main Exam 2"}, {"id": 248, "question": "A corporate analyst notices that as trainer delivery hours increase, trainee satisfaction ratings slightly decrease, yielding a correlation of $-0.62$. How should the analyst interpret this result?", "options": ["There is no relationship between delivery hours and trainee satisfaction.", "Increasing delivery hours directly causes trainee dissatisfaction.", "There is an inverse relationship, meaning longer delivery hours tend to accompany lower satisfaction ratings.", "Trainee satisfaction causes trainers to work fewer hours."], "correctAnswer": "C", "explanation": "A negative correlation coefficient ($-0.62$) indicates an inverse relationship: as one variable increases (delivery hours), the other variable decreases (satisfaction). Negative Correlation = Variables move in opposite directions.", "category": "Statistics & Correlation", "domain": "Professional Knowledge", "difficulty": "Hard", "sourceType": "Main Exam 2"}, {"id": 249, "question": "In training design methodology, what is the key conceptual distinction between a \"training strategy\" and a \"training method\"?", "options": ["A training strategy is the overall overarching plan or approach aligned with learning objectives, while a training method is the specific instructional technique or activity used to deliver content.", "A training strategy refers to classroom rules, while a training method refers to assessment tools.", "A training strategy is used for online learning, while a training method is used strictly for face-to-face instruction.", "A training strategy is created by trainees, while a training method is determined by management."], "correctAnswer": "A", "explanation": "A strategy is the overarching instructional roadmap (e.g., inquiry-based learning framework), whereas a method is the specific practical tool or delivery format (e.g., role play, snowball, demonstration). Strategy = Overall plan/approach; Method = Specific delivery activity/technique.", "category": "Training Concepts", "domain": "Professional Knowledge", "difficulty": "Medium", "sourceType": "Main Exam 2"}, {"id": 250, "question": "An adult learner in a professional development program expresses frustration because the instructional tasks seem disconnected from her daily workplace responsibilities. Which core principle of adult learning theory is being overlooked?", "options": ["Adults require strict external reward systems to maintain focus.", "Adults learn best through passive repetition and rote memory.", "Adults require immediate physical practice in every single module.", "Adults are self-directed and motivated when learning is problem-centered and immediately applicable to their real-world context."], "correctAnswer": "D", "explanation": "Knowles' Andragogical principles highlight that adult learners are task- or problem-centered and require immediate contextual relevance to see the value in instructional tasks. Adult Motivation = Real-world relevance and immediate applicability.", "category": "Adult Learning Principles", "domain": "Professional Knowledge", "difficulty": "Medium", "sourceType": "Main Exam 2"}, {"id": 251, "question": "A trainer is conducting a technical software workshop. Half of the trainees are experienced IT staff who complete tasks in minutes, while the other half are non-technical beginners who struggle with basic navigation. What should the trainer do FIRST?", "options": ["Instruct the experienced IT staff to leave early so the class can focus on beginners.", "Slow down the entire curriculum and repeat foundational lectures for everyone.", "Differentiate the practical activities by providing extension tasks for experienced staff while offering targeted support and scaffolding to beginners.", "Replace practical tasks with an advanced theoretical presentation for the whole group."], "correctAnswer": "C", "explanation": "Differentiated instruction is the professional standard for managing mixed-ability cohorts. It engages advanced learners with deeper challenges while providing foundational scaffolding to struggling beginners. Differentiated Instruction = Tailoring learning activities to varying participant readiness levels.", "category": "Mixed-Ability Facilitation", "domain": "Professional Practices", "difficulty": "Hard", "sourceType": "Main Exam 2"}, {"id": 252, "question": "During a small-group strategy session, a trainer notices that one trainee has not spoken or contributed to group discussions all morning. What is the MOST appropriate initial action for the trainer?", "options": ["Call out the trainee publicly and demand an immediate answer to a complex question.", "Observe group dynamics, approach the trainee privately during a breakout, and offer a low-pressure entry point or smaller pairing.", "Assign a failing participation grade to the silent trainee immediately.", "Ignore the quiet trainee completely and focus exclusively on vocal participants."], "correctAnswer": "B", "explanation": "A professional trainer handles passive or silent trainees by investigating privately, avoiding public embarrassment, and creating supportive, lower-stakes participation structures (e.g., pairs). Silent Trainee = Engage privately and lower social anxiety/barriers.", "category": "Managing Silent Trainees", "domain": "Professional Practices", "difficulty": "Medium", "sourceType": "Main Exam 2"}, {"id": 253, "question": "In a live training workshop, one participant repeatedly interrupts the trainer, dominates group conversations, and dismisses the comments of fellow trainees. What should the trainer do FIRST?", "options": ["Firmly re-establish ground rules for equal participation and politely redirect discussion to allow other trainees to speak.", "End the session immediately and report the participant to senior management.", "Argue with the participant in front of the group to assert authority.", "Ignore the behavior completely and hope other trainees intervene."], "correctAnswer": "A", "explanation": "Disruptive, dominant behaviors should be addressed by reaffirming group norms and actively redirecting speaking opportunities to other participants. Dominant Trainee = Re-establish ground rules and redirect conversation assertively.", "category": "Classroom Management", "domain": "Professional Practices", "difficulty": "Medium", "sourceType": "Main Exam 2"}, {"id": 254, "question": "During an all-day technical seminar, trainees display clear signs of physical fatigue and loss of focus shortly after lunch. Which facilitation strategy would be MOST effective to re-engage the group?", "options": ["Read directly from text-dense slides at a faster pace to finish early.", "Administer an unannounced, high-stakes written examination.", "Cancel the remaining practical exercises and assign them as homework.", "Incorporate a brief energizing activity, shift to an interactive group task, or take a short physical movement break."], "correctAnswer": "D", "explanation": "Post-lunch fatigue (\"circadian dip\") is best mitigated through active facilitation shift, physical movement, interactive tasks, or brief energetic breaks. Fatigue/Lethargy = Active facilitation, movement, and group interaction.", "category": "Trainee Engagement", "domain": "Professional Practices", "difficulty": "Medium", "sourceType": "Main Exam 2"}, {"id": 255, "question": "While monitoring breakout groups during a communication skills workshop, a trainer hears a group discussing unrelated weekend plans instead of their assigned case study. What is the BEST course of action?", "options": ["Immediately dismiss the group from the workshop.", "Walk over to the group, ask a targeted question related to the case study scenario, and guide them back on task.", "Reprimand the group loudly in front of the entire workshop room.", "Allow them to continue off-topic since breakout sessions are unsupervised time."], "correctAnswer": "B", "explanation": "Active facilitation involves circulating during small group activities and using guiding questions to redirect off-topic groups subtly and constructively. Off-topic Groups = Gently redirect using task-focused questioning.", "category": "Group Work Management", "domain": "Professional Practices", "difficulty": "Medium", "sourceType": "Main Exam 2"}, {"id": 256, "question": "A trainee approaches the trainer during a morning break and requests permission to leave the afternoon session early due to urgent workplace demands. How should the trainer handle this request professionally?", "options": ["Grant permission unconditionally without discussing missed content or organizational guidelines.", "Clarify attendance policies, explain the impact of missing core competencies, and discuss options for catching up on missed material or rescheduling.", "Refuse to speak with the trainee and immediately report them for misconduct.", "Publicly announce the trainee's personal situation to the entire cohort."], "correctAnswer": "B", "explanation": "Trainers must maintain professional policy boundaries while demonstrating empathy, clarifying missing content impact, and offering catch-up options. Schedule Exceptions = Balanced adherence to policy + clear options for competency coverage.", "category": "Trainer Management Scenarios", "domain": "Professional Practices", "difficulty": "Medium", "sourceType": "Main Exam 2"}, {"id": 257, "question": "A trainer wants to prepare customer support representatives to handle emotionally charged, angry client interactions. The trainer wants participants to practice interpersonal communication, active listening, and conflict de-escalation in realistic interpersonal roles. Which training method is MOST suitable?", "options": ["Role Play", "Independent Reading", "Technical Lecture", "Case Study Demonstration"], "correctAnswer": "A", "explanation": "Role play is the ideal training method for practicing interpersonal skills, emotional management, communication, and conflict de-escalation in a safe environment where trainees take on specific roles. Role Play = Interpersonal roles and communication practice; Simulation = System/task technical reproduction.", "category": "Training Methods", "domain": "Professional Practices", "difficulty": "Easy", "sourceType": "Main Exam 2"}, {"id": 258, "question": "A trainer needs to facilitate a discussion among 24 trainees to build consensus on a new corporate policy. To ensure maximum individual participation, the trainer starts by having trainees work individually, then pair up to merge ideas, then join groups of four, and finally present unified findings to the whole class. Which training method is being utilized?", "options": ["Simulation", "Fishbowl Discussion", "Snowball Technique (Pyramid Discussion)", "Jigsaw Method"], "correctAnswer": "C", "explanation": "The Snowball (or Pyramid) technique builds participation progressively: Individual → Pairs → Small Groups (Fours) → Whole Class. This ensures every individual formulates thoughts before sharing in expanding groups. Snowball = Individual → Pair → Quad → Plenary consolidation.", "category": "Training Methods", "domain": "Professional Practices", "difficulty": "Hard", "sourceType": "Main Exam 2"}, {"id": 259, "question": "An industrial training instructor is preparing operators to manage high-risk chemical plant emergency procedures where real-world errors would cause severe physical danger and financial loss. Which training method is MOST appropriate?", "options": ["Role Play", "Lecture", "High-Fidelity Simulation", "Group Dialogue"], "correctAnswer": "C", "explanation": "Simulations replicate complex operational systems or environments, allowing trainees to practice dangerous tasks safely without real-world risk or harm. Simulation = Safe realistic practice of procedural/technical tasks.", "category": "Training Methods", "domain": "Professional Practices", "difficulty": "Medium", "sourceType": "Main Exam 2"}, {"id": 260, "question": "A virtual trainer is facilitating an online synchronous workshop on project risk management. To promote collaborative peer problem-solving in smaller groups of four participants, which technology-enabled facilitation method should the trainer use?", "options": ["Asynchronous Discussion Board", "Breakout Rooms", "Main Room Broadcast", "Automated Survey Poll"], "correctAnswer": "B", "explanation": "Breakout rooms in synchronous web platforms allow large cohorts to divide into small collaborative working groups for peer problem-solving. Breakout Rooms = Small group collaboration in online synchronous environments.", "category": "Virtual Facilitation", "domain": "Professional Practices", "difficulty": "Easy", "sourceType": "Main Exam 2"}, {"id": 261, "question": "A trainer observes a trainee struggling to perform a practical machine calibration during a hands-on assessment. What type of feedback should the trainer provide to BEST support skill acquisition?", "options": ["Specific, constructive, and actionable feedback delivered immediately during or right after the task.", "General praise at the end of the month without detailing specific steps.", "Formal written reprimand sent to human resources after two weeks.", "Broad statement such as \"Try harder next time\" without technical guidance."], "correctAnswer": "A", "explanation": "Instructional feedback is most effective when it is immediate, specific, objective, and provides clear actionable steps for corrective practice. Effective Feedback = Immediate, specific, and actionable.", "category": "Instructional Feedback", "domain": "Professional Practices", "difficulty": "Medium", "sourceType": "Main Exam 2"}, {"id": 262, "question": "An instructional team needs to evaluate trainees' ability to deliver an effective 10-minute professional sales pitch. Which assessment method is MOST valid and objective for this scenario?", "options": ["A 50-question multiple-choice theory test.", "A performance-based assessment using a standardized scoring rubric with clear criteria.", "A peer survey asking if participants liked the presenter.", "An essay explaining the theory of sales psychology."], "correctAnswer": "B", "explanation": "Performance-based assessment directly evaluates a trainee's execution of a real-world task (e.g., delivering a pitch) measured against objective rubric standards. Performance-Based = Evaluating authentic skill execution with rubrics. [Note: Source listed answer as D, but explanation/correct_answer_text clearly describe option B; corrected to B for internal consistency.]", "category": "Performance Assessment", "domain": "Professional Practices", "difficulty": "Medium", "sourceType": "Main Exam 2"}, {"id": 263, "question": "During a multi-day training program, formative quiz results reveal that 70% of trainees failed to grasp a core financial formula introduced in Module 2. What should the trainer do before proceeding to Module 3?", "options": ["Skip the remaining financial modules and move to soft skills.", "Ignore the quiz results and proceed strictly according to the original schedule.", "Adjust the instructional plan to re-teach the financial formula using alternative explanations and practical re-engagement.", "Fail all 70% of trainees immediately without remedial instruction."], "correctAnswer": "C", "explanation": "Formative assessment data is intended to inform instruction. When a vast majority (70%) fails a concept, the trainer must re-teach using altered instructional strategies before moving to dependent topics. Formative Data Usage = Adaptive instructional re-teaching when gaps appear.", "category": "Instructional Adaptation", "domain": "Professional Practices", "difficulty": "Hard", "sourceType": "Main Exam 2"}, {"id": 264, "question": "An organization has 60 available training days in its annual schedule. Each comprehensive professional development program requires exactly 3 full training days to complete. How many complete programs can the organization deliver?", "options": ["15 programs", "20 programs", "180 programs", "23 programs"], "correctAnswer": "B", "explanation": "$\\frac{60 \\text{ total available days}}{3 \\text{ days per program}} = 20 \\text{ complete programs}$.", "category": "Practical Calculations", "domain": "Professional Practices", "difficulty": "Easy", "sourceType": "Main Exam 2"}, {"id": 265, "question": "A training manager allocates 120 total contact hours for a specialized IT certification course. The course is structured into equal modules of 15 hours each. How many complete modules make up this certification course?", "options": ["8 modules", "10 modules", "6 modules", "12 modules"], "correctAnswer": "A", "explanation": "$\\frac{120 \\text{ total contact hours}}{15 \\text{ hours per module}} = 8 \\text{ modules}$.", "category": "Practical Calculations", "domain": "Professional Practices", "difficulty": "Easy", "sourceType": "Main Exam 2"}, {"id": 266, "question": "A trainer wants to maximize the transfer of learning from a project management course back to the trainees' actual work environments. Which post-training strategy would BEST support this objective?", "options": ["Conduct a final celebratory dinner on the last day.", "Give trainees a textbook to read at home.", "Require trainees to memorize definition lists.", "Assist trainees in creating a concrete workplace Action Plan with follow-up manager check-ins at 30 and 60 days."], "correctAnswer": "D", "explanation": "Learning transfer is heavily supported when trainees build explicit Action Plans and receive structured workplace manager support/follow-up post-training. Transfer of Learning = Action planning + supervisor follow-up back at work.", "category": "Transfer of Learning", "domain": "Professional Practices", "difficulty": "Medium", "sourceType": "Main Exam 2"}, {"id": 267, "question": "A trainer is facilitating a session where participants discuss complex ethical dilemmas in healthcare administration. The trainer wants to encourage open, non-judgmental group dialogue, active listening, and collective reflection without pushing for a single right answer. Which method is MOST appropriate?", "options": ["Formal Lecture", "Dialogue Group", "Independent Drill", "Silent Reading"], "correctAnswer": "B", "explanation": "Dialogue groups focus on open exploration, multiple perspectives, and deep reflective understanding of complex topics without forcing immediate consensus or win-lose debates. Dialogue Group = Collaborative exploration of perspectives without competitive outcome.", "category": "Training Methods", "domain": "Professional Practices", "difficulty": "Medium", "sourceType": "Main Exam 2"}, {"id": 268, "question": "A technical trainer is conducting a workshop on network cable splicing. While trainees work independently on their cables, the trainer circulates around the room, observes techniques, asks guiding questions, and offers immediate corrective adjustments. Which assessment practice is being executed?", "options": ["Diagnostic Assessment", "Formative Assessment", "Summative Certification", "Program Evaluation"], "correctAnswer": "B", "explanation": "Monitoring trainees during practical exercises, asking diagnostic questions, and providing live corrective guidance is the definition of formative assessment. Formative = Ongoing monitoring and immediate feedback during skill practice.", "category": "Assessment Practices", "domain": "Professional Practices", "difficulty": "Easy", "sourceType": "Main Exam 2"}, {"id": 269, "question": "When introducing a new automated operational workflow, several senior employees voice strong resistance, claiming their traditional manual method is superior. How should the trainer BEST respond?", "options": ["Dismiss the resistant employees from the room immediately.", "Threaten the employees with disciplinary action if they do not comply.", "Acknowledge their experience, validate their concerns, and demonstrate how the new workflow directly addresses pain points and improves efficiency.", "Cancel the new workflow implementation entirely."], "correctAnswer": "C", "explanation": "Handling organizational resistance requires validating experienced staff members' historical expertise while demonstrating clear, practical benefits of the new workflow. Managing Resistance = Empathy + Validation + Demonstrating tangible benefits.", "category": "Managing Trainee Resistance", "domain": "Professional Practices", "difficulty": "Hard", "sourceType": "Main Exam 2"}, {"id": 270, "question": "During a live classroom delivery, a trainer realizes that an unexpected lengthy discussion in the morning has left only 30 minutes for the final 60-minute topic. What is the MOST professional course of action?", "options": ["Rush through the remaining 50 slides at extreme speed without checking for understanding.", "Dismiss the class 30 minutes early without covering the core content.", "Focus on the core essential learning outcomes, streamline supporting activities, and provide supplementary digital resources for follow-up.", "Extend the training session by 2 hours without consulting trainees or organizers."], "correctAnswer": "C", "explanation": "When time constraints arise, professional trainers prioritize essential core competencies, trim lower-priority activities, and provide asynchronous follow-up materials. Time Management = Prioritizing core outcomes and providing supplementary follow-up.", "category": "Time Management", "domain": "Professional Practices", "difficulty": "Hard", "sourceType": "Main Exam 2"}, {"id": 271, "question": "At the conclusion of a intensive 3-day training seminar, the trainer conducts a structured debriefing session. What is the PRIMARY purpose of a post-training debrief with trainees?", "options": ["To assign final letter grades publicly.", "To collect physical room keys and equipment.", "To consolidate key insights, reinforce major learning outcomes, address remaining questions, and reflect on practical application.", "To lecture trainees on their attendance discipline."], "correctAnswer": "C", "explanation": "Structured debriefing consolidates learning, reinforces key concepts, resolves lingering ambiguities, and bridges learning to practical workplace execution. Post-Training Debrief = Consolidation, reflection, and transfer bridge.", "category": "Training Debriefing", "domain": "
