<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ETEC Master Exam Trainer</title>
<meta name="theme-color" content="#0D1230">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="description" content="Interactive ETEC trainer/instructor exam prep app — practice questions, mock exams, revision notes, weak-area analysis, spaced practice and progress tracking.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;600&display=swap" rel="stylesheet">
<style>
  /* ===== Design tokens ===== */
  :root{
    --bg:#FFFFFF;
    --surface:#FFFFFF;
    --surface-2:#F4F5F9;
    --sidebar:#161E54;
    --sidebar-hover:#1C2460;
    --sidebar-text:#C9CCE0;
    --sidebar-text-active:#FFFFFF;
    --border:#DCDEE8;
    --border-strong:#C3C7DC;
    --ink:#161E54;
    --ink-muted:#5C6287;
    --ink-faint:#8B90AC;
    --navy:#161E54;
    --navy-strong:#10153F;
    --navy-tint:#FFECEC;
    --brand-green:#1E7A4C;
    --brand-teal:#5C6287;
    --brand-blue:#161E54;
    --brand-indigo:#10153F;
    --gold:#8A5A00;
    --gold-bg:#FBF1DA;
    --gold-border:#EBD39B;
    --good:#1E7A4C;
    --good-bg:#E4F5EA;
    --good-border:#B7E4C7;
    --bad:#A8201A;
    --bad-bg:#FBEAE8;
    --bad-border:#F0C2BD;
    --shadow-sm:0 1px 2px rgba(22,30,84,0.07);
    --shadow-md:0 6px 20px rgba(22,30,84,0.12);
    --focus-ring:0 0 0 3px rgba(22,30,84,0.35);
    --radius-sm:6px;
    --radius-md:10px;
    --radius-lg:16px;
    --font-display:"Source Serif 4", Georgia, "Times New Roman", serif;
    --font-body:"IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --font-mono:"IBM Plex Mono", "SF Mono", Consolas, monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#11173F;
      --surface:#161E54;
      --surface-2:#1C2460;
      --sidebar:#0D1230;
      --sidebar-hover:#1C2460;
      --sidebar-text:#C9CCE0;
      --sidebar-text-active:#FFFFFF;
      --border:#3A4275;
      --border-strong:#4A5290;
      --ink:#FFFFFF;
      --ink-muted:#C9CCE0;
      --ink-faint:#8488AE;
      --navy:#1C2460;
      --navy-strong:#242E78;
      --navy-tint:#FFECEC;
      --brand-green:#5FD39A;
      --brand-teal:#C9CCE0;
      --brand-blue:#1C2460;
      --brand-indigo:#242E78;
      --gold:#F2B33D;
      --gold-bg:rgba(242,179,61,0.14);
      --gold-border:rgba(242,179,61,0.35);
      --good:#5FD39A;
      --good-bg:rgba(95,211,154,0.14);
      --good-border:rgba(95,211,154,0.35);
      --bad:#FF8A80;
      --bad-bg:rgba(255,138,128,0.14);
      --bad-border:rgba(255,138,128,0.35);
      --shadow-sm:0 1px 2px rgba(0,0,0,0.3);
      --shadow-md:0 10px 30px rgba(0,0,0,0.45);
    }
  }
  :root[data-theme="dark"]{
    --bg:#11173F;
    --surface:#161E54;
    --surface-2:#1C2460;
    --sidebar:#0D1230;
    --sidebar-hover:#1C2460;
    --sidebar-text:#C9CCE0;
    --sidebar-text-active:#FFFFFF;
    --border:#3A4275;
    --border-strong:#4A5290;
    --ink:#FFFFFF;
    --ink-muted:#C9CCE0;
    --ink-faint:#8488AE;
    --navy:#1C2460;
    --navy-strong:#242E78;
    --navy-tint:#FFECEC;
    --brand-green:#5FD39A;
    --brand-teal:#C9CCE0;
    --brand-blue:#1C2460;
    --brand-indigo:#242E78;
    --gold:#F2B33D;
    --gold-bg:rgba(242,179,61,0.14);
    --gold-border:rgba(242,179,61,0.35);
    --good:#5FD39A;
    --good-bg:rgba(95,211,154,0.14);
    --good-border:rgba(95,211,154,0.35);
    --bad:#FF8A80;
    --bad-bg:rgba(255,138,128,0.14);
    --bad-border:rgba(255,138,128,0.35);
    --shadow-sm:0 1px 2px rgba(0,0,0,0.3);
    --shadow-md:0 10px 30px rgba(0,0,0,0.45);
  }

  *,*::before,*::after{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    font-size:15px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{font-family:var(--font-display);font-weight:600;margin:0;text-wrap:balance;color:var(--ink);}
  p{margin:0;}
  button{font-family:inherit;color:inherit;}
  .num{font-family:var(--font-mono);font-variant-numeric:tabular-nums;}
  a{color:inherit;}
  ::selection{background:var(--navy-tint);color:var(--navy);}
  :focus-visible{outline:none;box-shadow:var(--focus-ring);border-radius:var(--radius-sm);}

  /* ===== App shell ===== */
  #app{display:flex;min-height:100vh;}

  .sidebar{
    width:248px;flex:0 0 248px;background:var(--sidebar);color:var(--sidebar-text);
    display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;
  }
  .sidebar-brand{padding:20px 20px 16px;border-bottom:1px solid rgba(255,255,255,0.08);}
  .sidebar-brand .mark{
    display:flex;align-items:center;gap:10px;
  }
  .sidebar-brand .mark-badge{
    width:auto;height:48px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
  }
  .sidebar-brand .mark-badge img{width:auto;height:100%;display:block;}
  .sidebar-brand .name{font-family:var(--font-display);font-weight:600;font-size:15.5px;color:#fff;line-height:1.25;}
  .sidebar-brand .sub{font-size:10.5px;letter-spacing:0.06em;text-transform:uppercase;color:var(--sidebar-text);margin-top:2px;}

  .sidebar-ring{padding:16px 20px;border-bottom:1px solid rgba(255,255,255,0.08);display:flex;align-items:center;gap:12px;}
  .ring-wrap{position:relative;width:52px;height:52px;flex:0 0 auto;}
  .ring-wrap svg{transform:rotate(-90deg);}
  .ring-label{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:12px;font-weight:600;color:#fff;}
  .ring-caption .t1{font-size:12px;color:#fff;font-weight:600;}
  .ring-caption .t2{font-size:11px;color:var(--sidebar-text);margin-top:1px;}

  nav.sidebar-nav{padding:10px 12px;display:flex;flex-direction:column;gap:2px;flex:1;}
  .nav-item{
    display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:8px;font-size:13.5px;
    font-weight:500;cursor:pointer;color:var(--sidebar-text);background:transparent;border:1px solid transparent;
    text-align:left;width:100%;
  }
  .nav-item .ic{width:17px;height:17px;flex:0 0 auto;opacity:0.9;}
  .nav-item:hover{background:var(--sidebar-hover);color:#fff;}
  .nav-item.active{background:var(--sidebar-hover);color:#fff;border-color:rgba(255,255,255,0.12);box-shadow:inset 2px 0 0 var(--navy-strong-active,#FF5151);}
  .nav-item.active{position:relative;}
  .nav-item.active::before{content:"";position:absolute;left:-12px;top:6px;bottom:6px;width:3px;background:#FF5151;border-radius:0 3px 3px 0;}
  .nav-section-label{font-size:10px;text-transform:uppercase;letter-spacing:0.08em;color:var(--ink-faint);padding:14px 12px 4px;color:#5A6C8C;}

  .sidebar-foot{padding:14px 20px 18px;border-top:1px solid rgba(255,255,255,0.08);font-size:11px;color:var(--sidebar-text);}
  .sidebar-foot button{background:transparent;border:1px solid rgba(255,255,255,0.18);color:var(--sidebar-text);padding:6px 10px;border-radius:7px;font-size:11.5px;cursor:pointer;width:100%;margin-top:8px;}
  .sidebar-foot button:hover{color:#fff;border-color:rgba(255,255,255,0.35);}

  .menu-btn{display:none;align-items:center;justify-content:center;width:40px;height:40px;flex:0 0 auto;margin-right:10px;border-radius:9px;border:1px solid var(--border-strong,#ccc);background:var(--surface,transparent);color:inherit;font-size:20px;line-height:1;cursor:pointer;}
  .main{flex:1;min-width:0;display:flex;flex-direction:column;}
  .topbar{
    position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--border);
    display:flex;align-items:center;gap:14px;padding:12px 26px;
  }
  .topbar h1{font-size:19px;}
  .topbar .crumb{font-size:12px;color:var(--ink-muted);margin-top:1px;}
  .topbar-spacer{flex:1;}
  .search-box{
    display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--border);
    border-radius:8px;padding:7px 12px;min-width:220px;
  }
  .search-box input{border:none;background:transparent;outline:none;color:var(--ink);font-size:13px;width:100%;font-family:var(--font-body);}
  .search-box svg{flex:0 0 auto;color:var(--ink-muted);}
  .streak-chip{display:flex;align-items:center;gap:6px;background:var(--gold-bg);border:1px solid var(--gold-border);color:var(--gold);padding:6px 11px;border-radius:20px;font-size:12.5px;font-weight:600;}

  .view{padding:24px 26px 60px;max-width:1180px;}
  .view.wide{max-width:none;}

  /* ===== Generic building blocks ===== */
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);}
  .card-pad{padding:20px;}
  .grid{display:grid;gap:16px;}
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;}
  .stat-tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:14px 16px;}
  .stat-tile .label{font-size:11px;text-transform:uppercase;letter-spacing:0.05em;color:var(--ink-muted);font-weight:600;}
  .stat-tile .value{font-family:var(--font-mono);font-size:26px;font-weight:600;margin-top:6px;color:var(--ink);}
  .stat-tile .value.good{color:var(--good);}
  .stat-tile .value.bad{color:var(--bad);}
  .stat-tile .sub{font-size:11.5px;color:var(--ink-faint);margin-top:3px;}

  .section-title{display:flex;align-items:baseline;justify-content:space-between;margin:28px 0 14px;}
  .section-title h2{font-size:16.5px;}
  .section-title .hint{font-size:12px;color:var(--ink-muted);}
  .view > .section-title:first-child{margin-top:0;}

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 16px;border-radius:8px;
    font-size:13.5px;font-weight:600;cursor:pointer;border:1px solid transparent;line-height:1.2;white-space:nowrap;
  }
  .btn-primary{background:var(--navy);color:#fff;}
  .btn-primary:hover{background:var(--navy-strong);}
  :root[data-theme="dark"] .btn-primary, @media (prefers-color-scheme:dark){.btn-primary{color:#FFFFFF;}}
  .btn-ghost{background:transparent;border-color:var(--border-strong);color:var(--ink);}
  .btn-ghost:hover{background:var(--surface-2);}
  .btn-soft{background:var(--navy-tint);color:var(--navy);border-color:transparent;}
  .btn-danger{background:transparent;border-color:var(--bad-border);color:var(--bad);}
  .btn-danger:hover{background:var(--bad-bg);}
  .btn:disabled{opacity:0.45;cursor:not-allowed;}
  .btn-sm{padding:6px 11px;font-size:12.5px;border-radius:7px;}
  .icon-btn{background:transparent;border:1px solid var(--border-strong);border-radius:7px;width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink-muted);}
  .icon-btn:hover{background:var(--surface-2);color:var(--ink);}
  .icon-btn.on{background:var(--gold-bg);border-color:var(--gold-border);color:var(--gold);}

  .pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:600;}
  .pill-navy{background:var(--navy-tint);color:var(--navy);}
  .pill-good{background:var(--good-bg);color:var(--good);border:1px solid var(--good-border);}
  .pill-bad{background:var(--bad-bg);color:var(--bad);border:1px solid var(--bad-border);}
  .pill-gold{background:var(--gold-bg);color:var(--gold);border:1px solid var(--gold-border);}
  .pill-muted{background:var(--surface-2);color:var(--ink-muted);}

  select,input[type="text"]{
    font-family:var(--font-body);background:var(--surface);border:1px solid var(--border-strong);color:var(--ink);
    border-radius:7px;padding:8px 11px;font-size:13px;
  }

  /* Question card */
  .qcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);padding:26px 28px;}
  .qcard-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px;}
  .qcard-counter{font-family:var(--font-mono);font-size:12.5px;color:var(--ink-muted);}
  .qcard .stem{font-family:var(--font-display);font-size:19px;line-height:1.45;color:var(--ink);margin:2px 0 22px;text-wrap:balance;}
  .options{display:flex;flex-direction:column;gap:10px;}
  .option{
    display:flex;align-items:flex-start;gap:12px;padding:13px 15px;border:1.5px solid var(--border-strong);
    border-radius:10px;cursor:pointer;background:var(--surface);text-align:left;width:100%;
  }
  .option:hover:not(.locked){border-color:var(--navy);background:var(--navy-tint);}
  .option:hover:not(.locked) .txt{color:var(--navy);}
  .option .letter{
    font-family:var(--font-mono);font-weight:600;font-size:12.5px;width:24px;height:24px;border-radius:6px;
    background:var(--surface-2);color:var(--ink-muted);display:flex;align-items:center;justify-content:center;flex:0 0 auto;margin-top:1px;
  }
  .option .txt{flex:1;font-size:14.5px;padding-top:1px;}
  .option.selected{border-color:var(--navy);background:var(--navy-tint);}
  .option.selected .txt{color:var(--navy);}
  .option.selected .letter{background:var(--navy);color:#fff;}
  .option.correct{border-color:var(--good-border);background:var(--good-bg);}
  .option.correct .letter{background:var(--good);color:#fff;}
  .option.incorrect{border-color:var(--bad-border);background:var(--bad-bg);}
  .option.incorrect .letter{background:var(--bad);color:#fff;}
  .option.locked{cursor:default;}
  .option.locked:not(.correct):not(.incorrect):not(.selected){opacity:0.6;}

  .feedback-banner{display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:10px;font-weight:600;font-size:14px;margin-top:20px;}
  .feedback-banner.good{background:var(--good-bg);color:var(--good);border:1px solid var(--good-border);}
  .feedback-banner.bad{background:var(--bad-bg);color:var(--bad);border:1px solid var(--bad-border);}
  .feedback-block{margin-top:14px;padding:14px 16px;background:var(--surface-2);border-radius:10px;font-size:13.5px;color:var(--ink);}
  .feedback-block + .feedback-block{margin-top:10px;}
  .feedback-block .k{font-size:10.5px;text-transform:uppercase;letter-spacing:0.06em;font-weight:700;color:var(--ink-muted);margin-bottom:4px;}

  .qcard-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px;padding-top:18px;border-top:1px solid var(--border);}
  .confidence-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;}
  .confidence-row button{flex:1;min-width:110px;}

  /* Revision cards */
  .rev-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:18px 20px;}
  .rev-card h3{font-size:15px;margin-bottom:8px;}
  .rev-card .memory{margin-top:10px;font-size:12px;color:var(--navy);background:var(--navy-tint);display:inline-block;padding:4px 10px;border-radius:6px;font-weight:600;}
  .flow{display:flex;flex-direction:column;gap:0;}
  .flow-step{display:flex;align-items:center;gap:12px;padding:11px 14px;background:var(--surface-2);border-radius:9px;border:1px solid var(--border);}
  .flow-step .n{font-family:var(--font-mono);font-weight:700;color:var(--navy);width:20px;}
  .flow-step .t{font-weight:600;font-size:13.5px;}
  .flow-step .d{font-size:12px;color:var(--ink-muted);margin-top:1px;}
  .flow-arrow{text-align:center;color:var(--ink-faint);font-size:14px;padding:2px 0;}
  .flow-step.callout{background:var(--gold-bg);border-color:var(--gold-border);}
  .flow-step.callout .n{color:var(--gold);}

  .pyramid{display:flex;flex-direction:column;gap:6px;align-items:stretch;}
  .pyr-level{padding:14px 18px;border-radius:9px;border:1px solid var(--border);background:var(--surface-2);}
  .pyr-level .lv{font-family:var(--font-mono);font-size:11px;color:var(--ink-muted);}
  .pyr-level .name{font-family:var(--font-display);font-weight:600;font-size:15px;margin-top:2px;}
  .pyr-level .q{font-size:12.5px;color:var(--ink-muted);margin-top:2px;}
  .pyr-level:nth-child(1){background:var(--navy-tint);}
  .pyr-level:nth-child(1) .lv,.pyr-level:nth-child(1) .q{color:#5C6287;}
  .pyr-level:nth-child(1) .name{color:#161E54;}

  .trap-pair{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:stretch;}
  .trap-side{background:var(--surface-2);border-radius:10px;padding:14px 16px;}
  .trap-side h4{font-size:13.5px;margin-bottom:5px;}
  .trap-side p{font-size:13px;color:var(--ink-muted);}
  .trap-vs{align-self:center;font-family:var(--font-mono);font-size:11px;color:var(--ink-faint);font-weight:700;}

  .flash-stage{display:flex;flex-direction:column;align-items:center;gap:18px;}
  .flash-card{width:100%;max-width:480px;min-height:230px;perspective:1200px;cursor:pointer;}
  .flash-inner{position:relative;width:100%;display:grid;transition:transform .5s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d;}
  .flash-card.flipped .flash-inner{transform:rotateY(180deg);}
  .flash-face{grid-area:1/1;min-height:230px;backface-visibility:hidden;border-radius:16px;border:1px solid var(--border);
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:26px;box-shadow:var(--shadow-md);}
  .flash-front{background:var(--surface);}
  .flash-back{background:var(--navy);color:#fff;transform:rotateY(180deg);}
  .flash-face .tag{font-size:10.5px;text-transform:uppercase;letter-spacing:0.08em;color:var(--ink-faint);margin-bottom:12px;}
  .flash-back .tag{color:rgba(255,255,255,0.65);}
  .flash-face .txt{font-family:var(--font-display);font-size:19px;font-weight:600;line-height:1.4;white-space:pre-line;}
  .flash-face .hint{margin-top:14px;font-size:11.5px;color:var(--ink-faint);}
  @media (prefers-reduced-motion:reduce){.flash-inner{transition:none;}}

  .nav-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px;}
  .nav-grid button{
    aspect-ratio:1;border-radius:7px;border:1px solid var(--border-strong);background:var(--surface);
    font-family:var(--font-mono);font-size:12px;cursor:pointer;color:var(--ink-muted);
  }
  .nav-grid button.answered{background:var(--navy-tint);color:var(--navy);border-color:var(--navy);}
  .nav-grid button.flagged{background:var(--gold-bg);color:var(--gold);border-color:var(--gold-border);}
  .nav-grid button.current{outline:2px solid var(--navy);outline-offset:1px;}

  .modal-overlay{position:fixed;inset:0;background:rgba(8,16,32,0.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
  .modal{background:var(--surface);border-radius:var(--radius-lg);padding:26px;max-width:420px;width:100%;box-shadow:var(--shadow-md);border:1px solid var(--border);}
  .modal h3{font-size:17px;margin-bottom:10px;}
  .modal p{font-size:13.5px;color:var(--ink-muted);margin-bottom:20px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;}

  .toast{position:fixed;bottom:22px;right:22px;background:var(--navy-strong);color:#fff;padding:12px 18px;border-radius:10px;font-size:13px;font-weight:600;box-shadow:var(--shadow-md);z-index:200;}

  .empty{padding:40px 20px;text-align:center;color:var(--ink-muted);}
  .empty svg{margin-bottom:10px;opacity:0.5;}

  .disclaimer{margin-top:36px;padding:14px 18px;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;font-size:11.5px;color:var(--ink-muted);line-height:1.5;}

  table.data{width:100%;border-collapse:collapse;font-size:13px;}

  // ---------- Translating ----------
  var CACHE = {};
  function trs(s){
    if(typeof s !== "string") return s;
    var m = /^(\s*)([\s\S]*?)(\s*)$/.exec(s);
    var core = m[2];
    if(!core || !/[A-Za-z]/.test(core)) return s;
    core = core.replace(/\s+/g, " ");
    var out = CACHE[core];
    if(out === undefined){
      out = null;
      if(Object.prototype.hasOwnProperty.call(D, core)) out = D[core];
      else for(var i = 0; i < P.length; i++){
        var r = P[i][0].exec(core);
        if(r){ var v = P[i][1](r); if(v !== null && v !== undefined){ out = v; break; } }
      }
      CACHE[core] = out === null ? false : out;
    } else if(out === false){ out = null; }
    return out === null ? s : m[1] + out + m[3];
  }
  // Public helper used by the app (chart labels etc.): translates in Arabic mode, returns the text unchanged otherwise.
  window.tr = function(s){ return LANG === "ar" ? trs(s) : s; };

  var SKIP = "script,style,textarea,#cert-wrap,[data-no-i18n],.stem,.option .txt";
  var DIRSEL = ".stem,.option .txt,.ct,.rev-card,.flash-face .txt,.flash-face .hint,.trap-side,.pyr-level,.flow-step .t,.bar-row .name,table.data td:first-child,.expl-cell,input.cert-name-input,#pf-name,#pf-org,#pf-city";
  var ATTRS = ["placeholder", "title", "aria-label", "alt"];
  var REC = new WeakMap();      // text node -> { en, out }
  var AREC = new WeakMap();     // element -> { attr: { en, out } }

  function skipped(node){
    var el = node.nodeType === 1 ? node : node.parentElement;

  function xText(n){
    var cur = n.nodeValue, rec = REC.get(n);
    if(rec){
      if(cur === rec.out){
        if(LANG === "ar") return;
        n.nodeValue = rec.en; REC.delete(n); return;
      }
      REC.delete(n);

  function ad(s){
    if(!/\d/.test(s) || s.indexOf("@") !== -1 || /v\d/.test(s)) return s;

  function xAttr(el, name){
    if(!el.hasAttribute(name)) return;
    var cur = el.getAttribute(name), map = AREC.get(el), rec = map && map[name];

        if(LANG === "ar") return;
        el.setAttribute(name, rec.en); delete map[name]; return;
      }
      delete map[name];
    }
    if(LANG !== "ar") return;
    if(el.closest && el.closest("[data-no-i18n]")) return;
    var out = trs(cur);
    if(out !== cur){
      if(!map){ map = {}; AREC.set(el, map); }
      map[name] = { en: cur, out: out };
      el.setAttribute(name, out);
    }
  }
  function mark(root){
    var list = [];
    if(root.nodeType === 1){ if(root.matches(DIRSEL)) list.push(root); }
    if(root.querySelectorAll) list.push.apply(list, root.querySelectorAll(DIRSEL));
    list.forEach(function(el){ if(!el.hasAttribute("dir")) el.setAttribute("dir", "auto"); });
    var mails = root.nodeType === 1 ? [root] : [];
    if(root.querySelectorAll) mails.push.apply(mails, root.querySelectorAll('input[type="email"],.auth-code'));
    mails.forEach(function(el){ if(el.matches && el.matches('input[type="email"],.auth-code') && !el.hasAttribute("dir")) el.setAttribute("dir", "ltr"); });

    if(root.nodeType !== 1) return;

    if(LANG === "ar") mark(root);
  }

  // ---------- Switching ----------

<script>
const QUESTIONS = [{"id":1,"question":"A trainer is conducting a hands-on workshop in a computer lab. Trainees frequently discuss ideas, ask questions, observe demonstrations, and interact with the trainer. Which seating arrangement is most appropriate?","options":["Traditional rows facing the instructor and screen","U-shaped seating with all computers around the walls","Small groups of four facing each other","Circular seating arrangement"],"correctAnswer":"B","explanation":"A U-shape keeps every screen visible to the trainer, supports eye contact and discussion, and leaves the centre free for demonstrations. Rows block interaction and hide screens, small groups of four make it hard for the trainer to see every screen, and a circle cannot work when the computers must stay along the walls.","category":"Training Environment","difficulty":"Medium","sourceType":"Source Question","domain":"Professional Practices"},{"id":2,"question":"During a training session, several trainees ask to leave 30 minutes before the session ends because they have completed their work. What is the best response by the trainer?","options":["Allow everyone to leave immediately","Explain that trainees should remain until the scheduled end unless official permission has been granted, and provide a meaningful extension activity","Ignore their request","End the class early for everyone"],"correctAnswer":"B","explanation":"Trainees stay until the scheduled end unless they have official permission (Standard 6.2: discipline and responsibility), and meaningful extension work keeps early finishers learning. Letting everyone go breaks the schedule, ignoring the request wastes their time and leaves the issue unresolved, and ending the class for everyone punishes the trainees who still need the time.","category":"Trainer Skills & Classroom Management","difficulty":"Medium","sourceType":"Source Question","domain":"Professional Practices"},{"id":3,"question":"Which type of training can be completed at any time and from anywhere?","options":["Synchronous training","Face-to-face training","Asynchronous training","Classroom instruction"],"correctAnswer":"C","explanation":"Asynchronous training is self-paced, so learners can study at any time and from anywhere. Synchronous training needs everyone online together at a set time, and face-to-face and classroom instruction need everyone in the same place at the same time.","category":"Digital Learning","difficulty":"Easy","sourceType":"Source Question","domain":"Future Skills"},{"id":4,"question":"A graph of training hours and employee productivity shows both variables increasing together, with r close to +1. Which description is best?","options":["Positive correlation","Causation","Negative correlation","No correlation"],"correctAnswer":"A","explanation":"Both variables rise together and r is close to +1, so the relationship is a strong positive correlation. Negative correlation would show one rising as the other falls, and r near 0 would mean no correlation. 'Causation' is the trap: correlation alone cannot prove that training caused the productivity increase, because another factor could explain both.","category":"Statistics","difficulty":"Hard","sourceType":"Source Question","domain":"Professional Practices"},{"id":5,"question":"A trainer notices that one participant has remained silent throughout the session but appears attentive and completes written activities. What is the most appropriate action?","options":["Ask the participant to give an immediate presentation to the whole class","Ignore the participant completely","Gradually encourage participation with simple questions and small-group activities","Warn that the participant's evaluation will be affected"],"correctAnswer":"C","explanation":"A silent but attentive trainee who completes written work is engaged, so draw them in gradually with simple questions and small-group activities. Forcing an immediate presentation creates anxiety, ignoring them wastes the engagement, and threatening their evaluation damages trust and treats quietness as misconduct.","category":"Trainer Skills & Classroom Management","difficulty":"Medium","sourceType":"Source Question","domain":"Future Skills"},{"id":6,"question":"In an online training session, breakout rooms are used for participants to discuss short case studies and later present their findings. What is the primary purpose?","options":["Reduce interaction","Increase participation and collaborative learning","Eliminate the trainer's role","Reduce trainees' responsibility"],"correctAnswer":"B","explanation":"Breakout rooms put trainees in small groups to discuss and then present, which increases participation and collaborative learning. They do not reduce interaction, remove the trainer's role (the trainer still sets tasks and monitors) or reduce trainees' responsibility.","category":"Digital Learning","difficulty":"Medium","sourceType":"Source Question","domain":"Future Skills"},{"id":7,"question":"What is the primary purpose of Microsoft Power BI?","options":["Create word-processing documents","Analyze and visualize data through interactive dashboards","Edit videos","Design websites"],"correctAnswer":"B","explanation":"Power BI is a business-intelligence tool that analyses data and presents it in interactive dashboards. A word processor creates documents, a video editor edits video, and a website builder designs sites, so none of them analyses and visualises data.","category":"AI & Digital Tools","difficulty":"Easy","sourceType":"Source Question","domain":"Future Skills"},{"id":8,"question":"Which source is most appropriate for finding peer-reviewed educational research?","options":["Google Search","Google Scholar","YouTube","Britannica Encyclopedia"],"correctAnswer":"B","explanation":"Google Scholar indexes scholarly and peer-reviewed literature. A general Google search and YouTube return mixed-quality content with no review process, and Britannica is a reputable encyclopaedia but not peer-reviewed research.","category":"AI & Digital Tools","difficulty":"Easy","sourceType":"Source Question","domain":"Future Skills"},{"id":9,"question":"A trainer asks trainees to act out a scenario involving an angry customer and a customer-service employee, then discuss their performance. Which instructional method best describes this?","options":["Role play","Interactive lecture","Self-learning","Pre-test"],"correctAnswer":"A","explanation":"Acting out a scenario between an angry customer and an employee, then discussing the performance, is role play, which practises interpersonal skills in a safe setting. An interactive lecture is trainer-led, self-learning is independent, and a pre-test is an assessment, not a method.","category":"Training Methods","difficulty":"Medium","sourceType":"Source Question","domain":"Professional Practices"},{"id":10,"question":"A group of trainees reports that a 5-hour daily schedule is reducing their focus and participation and requests a 3-hour schedule. What should the trainer do first?","options":["Reject the request because the schedule was approved","Discuss the request, analyze its impact on training objectives, and adjust the schedule if effectiveness can be maintained","Immediately remove activities","End the programme"],"correctAnswer":"B","explanation":"Take the request seriously: discuss it, analyse its effect on the training objectives, and adjust the schedule if effectiveness can be maintained. Rejecting it because the schedule was approved ignores a genuine problem, removing activities immediately acts without analysis, and ending the programme is disproportionate.","category":"Trainer Skills & Classroom Management","difficulty":"Medium","sourceType":"Source Question","domain":"Future Skills"},{"id":11,"question":"When is a diagnostic analysis conducted?","options":["Before the training program","At the start only after instruction begins","During the training program","After the training program"],"correctAnswer":"A","explanation":"Diagnostic analysis comes before training so you can find needs, gaps and learner characteristics and plan from them. Doing it after instruction has begun, during it, or after it would be formative or summative assessment instead.","category":"Assessment","difficulty":"Easy","sourceType":"Source Question","domain":"Professional Knowledge"},{"id":12,"question":"Participants each write one sentence, pass the paper to the next participant, who adds another sentence, and continue until everyone contributes. Which strategy is being used?","options":["Brainstorming","Snowball","Demonstration","Role play"],"correctAnswer":"B","explanation":"The keyed answer is Snowball. Caution: many sources define Snowball as individual work, then pairs, then groups that grow larger, not as passing one paper around and adding sentences. Brainstorming collects ideas, a demonstration shows a procedure, and role play acts out a situation. Learn the question as keyed, and confirm the definition in your ETEC material before the exam.","category":"Training Methods","difficulty":"Medium","sourceType":"Source Question","domain":"Professional Practices"},{"id":13,"question":"A trainer is delivering professional development to participants with extensive experience and specialized knowledge. The goal is knowledge sharing, discussion, and exchange of professional experiences. Which method is most appropriate?","options":["Buzz Group","Dialogue Group","Lecture","Demonstration"],"correctAnswer":"B","explanation":"A Dialogue Group suits experienced professionals because it is built on discussion and exchange of expertise. A buzz group is a short, quick discussion that does not allow depth, and a lecture and a demonstration are one-way, so they do not draw on the participants' experience.","category":"Training Methods","difficulty":"Medium","sourceType":"Source Question","domain":"Professional Practices"},{"id":14,"question":"A trainee says a discussion topic makes them uncomfortable and they do not wish to participate. What should the trainer do?","options":["Force participation","Ask the trainee to leave","Listen respectfully, consider the concern, and provide a suitable alternative while maintaining the learning objective","Ignore the concern"],"correctAnswer":"C","explanation":"Listen respectfully, consider the concern and offer a suitable alternative that still meets the learning objective. Forcing participation disrespects the trainee, asking them to leave is disproportionate, and ignoring the concern damages trust.","category":"Trainer Skills & Classroom Management","difficulty":"Medium","sourceType":"Source Question","domain":"Future Skills"},{"id":15,"question":"A trainer wants to organize online course materials, upload resources, track progress, and conduct online assessments. Which platform should be used?","options":["Video conferencing software","Learning Management System (LMS)","Word-processing software","Database management system"],"correctAnswer":"B","explanation":"An LMS (Learning Management System) is the platform built to host course materials, track each trainee's progress and run online assessments, which is exactly what the trainer needs. Video conferencing delivers live sessions only. A word processor creates documents, and a database stores data but has no teaching or tracking tools.","category":"LMS & Educational Technology","difficulty":"Medium","sourceType":"Source Question","domain":"Future Skills"},{"id":16,"question":"A trainer teaches one classroom session each week while trainees complete online quizzes and assignments through an LMS. This is an example of:","options":["Distance learning","Blended learning","Classroom learning only","Demonstration"],"correctAnswer":"B","explanation":"One weekly face-to-face session plus online quizzes and assignments on an LMS mixes classroom and online delivery, which is blended learning. Distance learning has no classroom element, classroom-only has no online element, and a demonstration is a teaching technique, not a delivery mode.","category":"Digital Learning","difficulty":"Medium","sourceType":"Source Question","domain":"Future Skills"},{"id":17,"question":"At the end of a course, trainees complete a practical test to demonstrate the knowledge and skills they gained. Which Kirkpatrick level is being evaluated?","options":["Reaction","Learning","Behaviour","Results"],"correctAnswer":"B","explanation":"A practical test at the end of the course measures the knowledge and skills gained, which is Kirkpatrick Level 2: Learning. Reaction (Level 1) is satisfaction, Behaviour (Level 3) is on-the-job application later, and Results (Level 4) is organisational impact.","category":"Kirkpatrick","difficulty":"Hard","sourceType":"Source Question","domain":"Professional Knowledge"},{"id":18,"question":"Which four elements make up the training ecosystem?","options":["Trainer, trainees, learning environment, and training resources","Trainer, trainees, training budget, and marketing","Learning objectives, examinations, and certificates","Training content, attendance, and finance"],"correctAnswer":"A","explanation":"The training ecosystem is the trainer, the trainees, the learning environment and the training resources. Budget, marketing, examinations, certificates, attendance and finance are administrative or business functions, not the core learning elements.","category":"Professional Practice","difficulty":"Easy","sourceType":"Source Question","domain":"Professional Knowledge"},{"id":19,"question":"Which resource is most appropriate for supporting independent learning after a training program?","options":["Course notes","PowerPoint slides","References and educational links","Daily attendance sheet"],"correctAnswer":"C","explanation":"References and educational links point trainees to further reading so they can keep studying alone after the course. Course notes and slides summarise what was taught rather than extending it, and a daily attendance sheet is administrative.","category":"Professional Practice","difficulty":"Easy","sourceType":"Source Question","domain":"Professional Knowledge"},{"id":20,"question":"A trainer discovers that some participants already know the topic while others are beginners. What is the BEST response?","options":["Teach only the advanced trainees","Ignore the differences","Differentiate activities according to trainees' needs","Cancel the session"],"correctAnswer":"C","explanation":"When some trainees already know the topic and others are beginners, differentiate: match tasks, support and challenge to each trainee's needs. Teaching only the advanced group leaves the beginners behind, ignoring the differences fails both groups, and cancelling the session solves nothing.","category":"Differentiation","difficulty":"Medium","sourceType":"Source Question","domain":"Professional Knowledge"},{"id":21,"question":"A participant is distracted and talking to another participant. The trainer wants to regain attention without embarrassment. What should the trainer do?","options":["Publicly ask the participant to stop","Use a discreet hand gesture or non-verbal cue","Stop the activity and criticize the behaviour to the class","Ask another participant to intervene"],"correctAnswer":"B","explanation":"A discreet hand gesture or non-verbal cue regains attention without embarrassment. Publicly asking the trainee to stop or criticising the behaviour to the class humiliates them and disrupts everyone, and asking another participant to intervene creates peer conflict.","category":"Trainer Skills & Classroom Management","difficulty":"Medium","sourceType":"Source Question","domain":"Future Skills"},{"id":22,"question":"Which statistical measure is most appropriate for determining how much trainees' scores vary around the mean?","options":["Arithmetic mean","Standard deviation","Median","Mode"],"correctAnswer":"B","explanation":"Standard deviation measures how far scores spread around the mean. Mean, median and mode describe the centre of the data, not how much it varies.","category":"Statistics","difficulty":"Medium","sourceType":"Source Question","domain":"Professional Practices"},{"id":23,"question":"If the standard deviation of trainees' scores is close to zero, this indicates:","options":["A large gap in trainee levels","High similarity and closeness among trainee levels","Excessive difficulty of the test","Most trainees failed"],"correctAnswer":"B","explanation":"A standard deviation near zero means almost no spread: scores sit very close to the mean, so trainees are at very similar levels. A large gap in levels would give a high SD, and an SD value says nothing about test difficulty or how many failed.","category":"Statistics","difficulty":"Medium","sourceType":"Source Question","domain":"Professional Practices"},{"id":24,"question":"Which learning theory states that learners build new knowledge based on existing knowledge and previous experience?","options":["Behaviourism","Constructivism","Operant conditioning","Social learning"],"correctAnswer":"B","explanation":"Constructivism holds that learners actively build new knowledge on top of what they already know and have experienced. Behaviourism and operant conditioning focus on observable behaviour shaped by consequences. Social learning focuses on observing and imitating others.","category":"Learning Theories","difficulty":"Easy","sourceType":"Source Question","domain":"Professional Knowledge"},{"id":25,"question":"A trainee learns a procedure by observing an experienced colleague, modelling the steps, and imitating the performance. Which theory best explains this?","options":["Bandura's Social Learning Theory","Constructivism","CIRO","Kirkpatrick"],"correctAnswer":"A","explanation":"Learning a procedure by watching an experienced colleague, modelling the steps and imitating them is Bandura's Social Learning Theory. Constructivism builds on prior knowledge, and CIRO and Kirkpatrick evaluate training rather than explain how people learn.","category":"Learning Theories","difficulty":"Medium","sourceType":"Source Question","domain":"Professional Knowledge"},{"id":26,"question":"Which sequence correctly represents Kolb's Experiential Learning Cycle?","options":["Concrete Experience → Reflective Observation → Abstract Conceptualisation → Active Experimentation","Experience → Evaluation → Reaction → Results","Analysis → Design → Development → Evaluation","Observation → Reinforcement → Punishment → Outcome"],"correctAnswer":"A","explanation":"Kolb's cycle runs Concrete Experience, Reflective Observation, Abstract Conceptualisation, Active Experimentation (do, reflect, think, try). Option B is a mix of evaluation terms, option C is ADDIE with a stage missing, and option D mixes behaviourist terms.","category":"Learning Theories","difficulty":"Easy","sourceType":"Source Question","domain":"Professional Knowledge"},{"id":27,"question":"A trainer praises a trainee for correct performance, making the trainee more likely to repeat the behaviour. Which concept is illustrated?","options":["Positive reinforcement","Punishment","Diagnostic assessment","Reflective observation"],"correctAnswer":"A","explanation":"Praise that makes correct behaviour more likely to be repeated is positive reinforcement. Punishment would reduce behaviour, diagnostic assessment is a pre-training check, and reflective observation is a stage in Kolb's cycle.","category":"Learning Theories","difficulty":"Medium","sourceType":"Source Question","domain":"Professional Knowledge"},{"id":28,"question":"Which learning theory focuses on changes in observable behaviour and the effects of reinforcement and consequences?","options":["Constructivism","Behaviourism","Experiential learning","Humanism"],"correctAnswer":"B","explanation":"Behaviourism focuses on observable behaviour shaped by reinforcement and consequences. Constructivism and humanism focus on internal meaning-making and the whole learner, and experiential learning centres on reflecting on experience.","category":"Learning Theories","difficulty":"Easy","sourceType":"Source Question","domain":"Professional Knowledge"},{"id":29,"question":"Which theorist is strongly associated with operant conditioning?","options":["Bandura","Skinner","Kolb","Kirkpatrick"],"correctAnswer":"B","explanation":"B. F. Skinner developed operant conditioning: behaviour is shaped by its consequences (reinforcement and punishment). Bandura is linked to social learning (observation and modelling), Kolb to the experiential learning cycle, and Kirkpatrick to training evaluation, not learning theory.","category":"Learning Theories","difficulty":"Easy","sourceType":"Source Question","domain":"Professional Knowledge"},{"id":30,"question":"What does C represent in the CIRO evaluation model?","options":["Content","Context","Competence","Communication"],"correctAnswer":"B","explanation":"In CIRO, C = Context: the training needs, objectives and organisational situation that justify the training. 'Content', 'Competence' and 'Communication' are plausible-sounding words that are not part of the model. Memory aid: Context, Input, Reaction, Outcome.","category":"CIRO","difficulty":"Hard","sourceType":"Source Question","domain":"Professional Knowledge"},{"id":31,"question":"What does I represent in CIRO?","options":["Instruction","Input","Implementation","Interaction"],"correctAnswer":"B","explanation":"In CIRO, I = Input: the design, resources and delivery strategy chosen for the training. 'Instruction', 'Implementation' and 'Interaction' look similar but are not CIRO terms. Memory aid: Context, Input, Reaction, Outcome.","category":"CIRO","difficulty":"Hard","sourceType":"Source Question","domain":"Professional Knowledge"},{"id":32,"question":"What does R represent in CIRO?","options":["Results","Reaction","Reflection","Reinforcement"],"correctAnswer":"B","explanation":"In CIRO, R = Reaction: how participants respond to the training. 'Results' is a trap, since CIRO's final letter is Outcome, not Results (Results is Kirkpatrick Level 4). Reflection and Reinforcement are not part of the model.","category":"CIRO","difficulty":"Hard","sourceType":"Source Question","domain":"Professional Knowledge"},{"id":33,"question":"What does O represent in CIRO?","options":["Objective","Organisation","Outcome","Observation"],"correctAnswer":"C","explanation":"In CIRO, O = Outcome: the results of training at individual, team or organisational level. Objective, Organisation and Observation are not CIRO terms. Memory aid: Context, Input, Reaction, Outcome. Note that some sources say 'Output', but your study guide uses Outcome.","category":"CIRO","difficulty":"Hard","sourceType":"Source Question","domain":"Professional Knowledge"},{"id":34,"question":"What is the first stage of the ADDIE model?","options":["Analysis","Design","Development","Implementation"],"correctAnswer":"A","explanation":"ADDIE begins with Analysis: you identify the audience, the performance gap and the constraints before designing anything. Design, Development and Implementation all depend on what the analysis finds, so starting there risks solving the wrong problem.","category":"ADDIE","difficulty":"Easy","sourceType":"Source Question","domain":"Professional Knowledge"},{"id":35,"question":"Which sequence correctly represents ADDIE?","options":["Analysis → Design → Development → Implementation → Evaluation","Analysis → Development → Design → Implementation → Evaluation","Design → Analysis → Implementation → Development → Evaluation","Analysis → Design → Implementation → Development → Evaluation"],"correctAnswer":"A","explanation":"The order is Analysis, Design, Development, Implementation, Evaluation. Each stage feeds the next: you cannot develop materials before designing them, or implement before they exist. Options B, C and D each swap two stages.","category":"ADDIE","difficulty":"Easy","sourceType":"Source Question","domain":"Professional Knowledge"},{"id":36,"question":"Which ADDIE stage focuses on reviewing training effectiveness?","options":["Analysis","Design","Implementation","Evaluation"],"correctAnswer":"D","explanation":"Evaluation is the ADDIE stage that reviews how effective the training was and feeds improvements back. Analysis finds needs, Design plans the course and Implementation delivers it, so none of them judges effectiveness.","category":"ADDIE","difficulty":"Easy","sourceType":"Source Question","domain":"Professional Knowledge"},{"id":37,"question":"Immediately after training, participants are asked whether they liked the training. Which Kirkpatrick level is measured?","options":["Reaction","Learning","Behaviour","Results"],"correctAnswer":"A","explanation":"Asking whether participants liked the training, straight after it, measures Level 1: Reaction. Learning (Level 2) tests knowledge or skill gained, Behaviour (Level 3) looks at on-the-job change, and Results (Level 4) looks at organisational impact.","category":"Kirkpatrick","difficulty":"Medium","sourceType":"Source Question","domain":"Professional Knowledge"},{"id":38,"question":"Three months after training, supervisors check whether employees are applying their new skills at work. Which Kirkpatrick level is measured?","options":["Reaction","Learning","Behaviour","Results"],"correctAnswer":"C","explanation":"Supervisors checking three months later whether staff apply the new skills at work is Level 3: Behaviour. Learning is measured at the end of the course, Reaction right after it, and Results looks at organisational impact such as productivity.","category":"Kirkpatrick","difficulty":"Hard","sourceType":"Source Question","domain":"Professional Knowledge"},{"id":39,"question":"An organisation measures the impact of training on productivity and organisational performance. Which Kirkpatrick level is measured?","options":["Reaction","Learning","Behaviour","Results"],"correctAnswer":"D","explanation":"Productivity and organisational performance are Level 4: Results, the business impact of the training. Reaction is satisfaction, Learning is knowledge or skill gained, and Behaviour is workplace application.","category":"Kirkpatrick","difficulty":"Easy","sourceType":"Source Question","domain":"Professional Knowledge"},{"id":40,"question":"Trainees reacted positively to a programme, but evidence shows they did not acquire the required knowledge and skills. Which Kirkpatrick level is the main problem?","options":["Reaction","Learning","Behaviour","Results"],"correctAnswer":"B","explanation":"Positive reactions without the required knowledge and skills mean Level 1 succeeded but Level 2 (Learning) failed. Behaviour and Results cannot be achieved if the learning never happened. This is the exam trap: a happy trainee does not prove learning.","category":"Kirkpatrick","difficulty":"Hard","sourceType":"Source Question","domain":"Professional Knowledge"},{"id":41,"question":"A trainer needs to deliver a large amount of knowledge to a very large audience in a short period. Which method is most appropriate?","options":["Role play","Lecture","Simulation","Individual coaching"],"correctAnswer":"B","explanation":"A lecture delivers a large amount of content to a large audience in a short time. Role play, simulation and individual coaching are interactive or personal methods that do not scale to a very large group in limited time.","category":"Training Methods","difficulty":"Medium","sourceType":"Source Question","domain":"Professional Practices"},{"id":42,"question":"Trainees need to practise a realistic high-risk workplace task in a controlled environment. Which method is most appropriate?","options":["Lecture","Role play","Simulation","Brainstorming"],"correctAnswer":"C","explanation":"Simulation gives realistic practice of a high-risk task in a controlled setting, so mistakes carry no real-world cost. A lecture only explains, role play centres on interpersonal situations, and brainstorming generates ideas.","category":"Training Methods","difficulty":"Medium","sourceType":"Source Question","domain":"Professional Practices"},{"id":43,"question":"Which assessment is carried out during training to monitor progress, provide feedback, and improve learning?","options":["Diagnostic assessment","Formative assessment","Outcome evaluation","Reaction evaluation"],"correctAnswer":"B","explanation":"Formative assessment happens during training to monitor progress, give feedback and improve learning. Diagnostic comes before training, outcome evaluation looks at results afterwards, and reaction evaluation measures satisfaction.","category":"Assessment","difficulty":"Easy","sourceType":"Source Question","domain":"Professional Knowledge"},{"id":44,"question":"How is a practical project, in which trainees produce a piece of work to show their knowledge and skills, generally classified?","options":["Performance-based assessment","Reaction evaluation","Diagnostic analysis","Attendance assessment"],"correctAnswer":"A","explanation":"A project in which trainees produce a piece of work to show their knowledge and skills is performance-based assessment, which measures the ability to apply skills in a realistic context. A reaction evaluation measures satisfaction, diagnostic analysis happens before training, and attendance is not an assessment of learning.","category":"Assessment","difficulty":"Medium","sourceType":"Source Question","domain":"Professional Knowledge"},{"id":45,"question":"Which link format indicates a secure website connection?","options":["http://","https://","ftp://","file://"],"correctAnswer":"B","explanation":"https:// means the connection is encrypted (SSL/TLS), so data cannot easily be read in transit. http:// is unencrypted. ftp:// and file:// are file-transfer and local-file protocols and say nothing about a site being secure.","category":"AI & Digital Tools","difficulty":"Easy","sourceType":"Source Question","domain":"Future Skills"},{"id":46,"question":"You have 60 training days and each programme lasts 3 days. How many complete programmes can you deliver?","options":["15","18","20","30"],"correctAnswer":"C","explanation":"60 days divided by 3 days per programme gives 20 complete programmes. 15 would need 4-day programmes, 18 does not divide evenly and 30 would need 2-day programmes. Check the division by multiplying back: 20 × 3 = 60.","category":"Statistics","difficulty":"Hard","sourceType":"Source Question","domain":"Professional Practices"},{"id":47,"question":"Which of the following cannot be used to generate images, videos or other multimedia content?","options":["Hugging Face","An AI image tool","An AI video tool","SQL Server"],"correctAnswer":"D","explanation":"SQL Server is a database management system and cannot generate images, video or other multimedia. Hugging Face (an AI model platform) and AI image and video tools can. Read the word 'cannot' carefully.","category":"AI & Digital Tools","difficulty":"Hard","sourceType":"Source Question","domain":"Future Skills"},{"id":48,"question":"A trainer wants to identify the skills an organisation will need in the future. Which focus is most appropriate?","options":["Future capability and skills requirements","Current attendance only","Classroom furniture","Past trainee satisfaction only"],"correctAnswer":"A","explanation":"To find the skills the organisation will need in future, the analysis must look forward at future capability and skills requirements. Current attendance, classroom furniture and past satisfaction describe the present or the past.","category":"Training Needs Analysis","difficulty":"Medium","sourceType":"Source Question","domain":"Professional Practices"},{"id":49,"question":"A trainer has both experienced trainees and beginners in one group. Which response best matches the source's mixed-ability focus?","options":["Use the same advanced task without support","Differentiate tasks and support according to trainee needs","Teach only beginners","Cancel group work"],"correctAnswer":"B","explanation":"With beginners and experienced trainees together, differentiate tasks and support to each trainee's needs so both groups progress. The same advanced task with no support loses the beginners, teaching only beginners bores the experts, and cancelling group work removes useful peer learning.","category":"Differentiation","difficulty":"Medium","sourceType":"Source Question","domain":"Professional Knowledge"},{"id":50,"question":"Which situation best represents synchronous online training?","options":["A live virtual class attended by trainer and trainees at the same time","Recorded videos watched at different times","Self-paced modules","Independent reading"],"correctAnswer":"A","explanation":"A live virtual class where trainer and trainees take part at the same time is synchronous. Recorded videos, self-paced modules and independent reading are all asynchronous, because learners work at different times.","category":"Digital Learning","difficulty":"Easy","sourceType":"Source Question","domain":"Future Skills"},{"id":51,"question":"A trainer wants learners to connect a new safety concept to incidents they have previously experienced. Which theory best supports this approach?","options":["Constructivism","Behaviourism","Kirkpatrick","CIRO"],"correctAnswer":"A","explanation":"Linking a new safety concept to incidents the learners have already experienced is building on prior knowledge, which is the core of Constructivism. Behaviourism is about shaping behaviour with consequences. Kirkpatrick and CIRO are evaluation models, not learning theories.","category":"Learning Theories","difficulty":"Medium","sourceType":"Practice Variation","domain":"Professional Knowledge"},{"id":52,"question":"A trainer demonstrates a task while trainees watch and then copy the procedure. Which theory is most directly represented?","options":["Bandura's Social Learning Theory","ADDIE","CIRO","Diagnostic assessment"],"correctAnswer":"A","explanation":"Watching a demonstration and then copying it is observation, modelling and imitation, which is Bandura's Social Learning Theory. ADDIE is a design process, CIRO an evaluation model, and diagnostic assessment a pre-training test, so none describes how people learn by watching.","category":"Learning Theories","difficulty":"Medium","sourceType":"Practice Variation","domain":"Professional Knowledge"},{"id":53,"question":"After performing a task, trainees discuss what happened, develop a principle, then try an improved approach. Which model best fits?","options":["Kolb's Experiential Learning Cycle","Kirkpatrick","ADDIE","CIRO"],"correctAnswer":"A","explanation":"Experience, then reflection, then forming a principle, then trying again is Kolb's cycle (Do, Reflect, Think, Try). Kirkpatrick and CIRO evaluate training, and ADDIE designs it; none of them describes a learner's own learning cycle.","category":"Learning Theories","difficulty":"Medium","sourceType":"Practice Variation","domain":"Professional Knowledge"},{"id":54,"question":"A reward is given every time a trainee follows the correct procedure, and correct performance increases. Which principle is operating?","options":["Reinforcement","Punishment","Reaction","Outcome"],"correctAnswer":"A","explanation":"A reward given every time the correct behaviour occurs, which increases that behaviour, is reinforcement (operant conditioning). Punishment would reduce behaviour. 'Reaction' and 'Outcome' are evaluation-model terms, not learning principles.","category":"Learning Theories","difficulty":"Medium","sourceType":"Practice Variation","domain":"Professional Knowledge"},{"id":55,"question":"A trainer wants to know trainees' knowledge gaps before designing activities. What should be used?","options":["Diagnostic assessment","Formative assessment","Reaction survey","Results evaluation"],"correctAnswer":"A","explanation":"Diagnostic assessment is used before instruction to find out what trainees already know and where their gaps are. Formative assessment happens during training, a reaction survey measures satisfaction afterwards, and results evaluation measures impact much later.","category":"Assessment","difficulty":"Medium","sourceType":"Practice Variation","domain":"Professional Knowledge"},{"id":56,"question":"During a lesson, a trainer uses short checks and feedback to adjust instruction. What is this?","options":["Formative assessment","Diagnostic analysis","Results evaluation","Final attendance"],"correctAnswer":"A","explanation":"Short checks and feedback during a lesson, used to adjust teaching, are formative assessment. Diagnostic analysis happens before training, results evaluation after it, and a final attendance record is not an assessment of learning.","category":"Assessment","difficulty":"Medium","sourceType":"Practice Variation","domain":"Professional Knowledge"},{"id":57,"question":"A trainee completes a practical task at course end to show what was learned. Which Kirkpatrick level?","options":["Learning","Reaction","Behaviour","Results"],"correctAnswer":"A","explanation":"A practical task at the end of the course shows what trainees have learned, which is Level 2: Learning. Reaction measures opinions, Behaviour measures on-the-job change weeks later, and Results measures organisational impact.","category":"Kirkpatrick","difficulty":"Medium","sourceType":"Practice Variation","domain":"Professional Knowledge"},{"id":58,"question":"A manager checks six weeks later whether trained staff use the procedure at work. Which Kirkpatrick level?","options":["Behaviour","Learning","Reaction","Results"],"correctAnswer":"A","explanation":"Checking weeks later whether staff use the procedure at work is Level 3: Behaviour (transfer to the job). Learning is measured at the end of the course, Reaction right after it, and Results is about organisational outcomes.","category":"Kirkpatrick","difficulty":"Hard","sourceType":"Practice Variation","domain":"Professional Knowledge"},{"id":59,"question":"A company compares productivity before and after training. Which Kirkpatrick level?","options":["Results","Reaction","Learning","Behaviour"],"correctAnswer":"A","explanation":"Comparing productivity before and after training measures organisational impact, which is Level 4: Results. The other levels look at opinions, learning and on-the-job behaviour, not at business metrics.","category":"Kirkpatrick","difficulty":"Easy","sourceType":"Practice Variation","domain":"Professional Knowledge"},{"id":60,"question":"A satisfaction form asks whether trainees found the course useful and engaging. Which Kirkpatrick level?","options":["Reaction","Learning","Behaviour","Results"],"correctAnswer":"A","explanation":"A satisfaction form on whether the course was useful and engaging measures participants' immediate response, which is Level 1: Reaction. It says nothing about what they learned, what they do at work, or business results.","category":"Kirkpatrick","difficulty":"Medium","sourceType":"Practice Variation","domain":"Professional Knowledge"},{"id":61,"question":"Which item comes directly after Analysis in ADDIE?","options":["Design","Development","Implementation","Evaluation"],"correctAnswer":"A","explanation":"Design comes directly after Analysis: once the needs are known, you plan objectives, structure and methods. Development builds materials from the design, Implementation delivers them, and Evaluation reviews the result.","category":"ADDIE","difficulty":"Easy","sourceType":"Practice Variation","domain":"Professional Knowledge"},{"id":62,"question":"Which item comes directly after Design in ADDIE?","options":["Development","Analysis","Evaluation","Reaction"],"correctAnswer":"A","explanation":"Development comes directly after Design: the blueprint is turned into real materials and activities. Analysis comes before Design, Evaluation is last, and 'Reaction' belongs to CIRO and Kirkpatrick, not ADDIE.","category":"ADDIE","difficulty":"Hard","sourceType":"Practice Variation","domain":"Professional Knowledge"},{"id":63,"question":"Which item comes directly after Development in ADDIE?","options":["Implementation","Evaluation","Analysis","Input"],"correctAnswer":"A","explanation":"Implementation follows Development: once materials are built, the course is delivered. Evaluation comes after delivery, Analysis is first, and 'Input' is a CIRO term, not an ADDIE stage.","category":"ADDIE","difficulty":"Easy","sourceType":"Practice Variation","domain":"Professional Knowledge"},{"id":64,"question":"Which item comes directly after Implementation in ADDIE?","options":["Evaluation","Design","Development","Context"],"correctAnswer":"A","explanation":"Evaluation follows Implementation: you judge effectiveness after the training has been delivered. Design and Development come earlier, and 'Context' is a CIRO term, not an ADDIE stage.","category":"ADDIE","difficulty":"Easy","sourceType":"Practice Variation","domain":"Professional Knowledge"},{"id":65,"question":"Which CIRO component concerns trainees' immediate response to training?","options":["Reaction","Context","Input","Outcome"],"correctAnswer":"A","explanation":"Reaction (R) is the CIRO component about how trainees respond to the training right away. Outcome concerns eventual results, Context concerns needs, and Input concerns design and resources.","category":"CIRO","difficulty":"Medium","sourceType":"Practice Variation","domain":"Professional Knowledge"},{"id":66,"question":"Which CIRO component concerns the eventual effects of training?","options":["Outcome","Input","Context","Reaction"],"correctAnswer":"A","explanation":"Outcome (O) is the CIRO component about the eventual effects of training. Reaction is the immediate response, Context is the situation and needs, and Input is the design and resources.","category":"CIRO","difficulty":"Easy","sourceType":"Practice Variation","domain":"Professional Knowledge"},{"id":67,"question":"A trainer needs small online groups to solve cases together. Which tool feature is most appropriate?","options":["Breakout rooms","Recording","Mute all","File archive"],"correctAnswer":"A","explanation":"Breakout rooms split an online session into small groups so trainees can work through a case together. Recording captures the session, 'mute all' silences participants, and a file archive stores documents; none of these supports small-group problem solving.","category":"Training Methods","difficulty":"Medium","sourceType":"Practice Variation","domain":"Professional Practices"},{"id":68,"question":"Trainees attend a live online workshop at 10:00 a.m. together. What mode is this?","options":["Synchronous","Asynchronous","Self-paced only","Face-to-face"],"correctAnswer":"A","explanation":"A live online workshop where everyone attends at the same time is synchronous. Asynchronous means different times, self-paced is not time-fixed, and face-to-face means in the same physical place.","category":"Digital Learning","difficulty":"Medium","sourceType":"Practice Variation","domain":"Future Skills"},{"id":69,"question":"Trainees watch recordings and complete tasks whenever convenient. What mode is this?","options":["Asynchronous","Synchronous","Face-to-face","Demonstration"],"correctAnswer":"A","explanation":"Watching recordings and completing tasks whenever convenient is asynchronous: no shared time is needed. Synchronous requires the same time, face-to-face requires the same place, and a demonstration is a method, not a mode.","category":"Digital Learning","difficulty":"Medium","sourceType":"Practice Variation","domain":"Future Skills"},{"id":70,"question":"A course combines weekly classroom teaching with LMS quizzes. What mode is this?","options":["Blended learning","Asynchronous only","Classroom only","Simulation"],"correctAnswer":"A","explanation":"Weekly classroom teaching combined with LMS quizzes mixes face-to-face and online learning, so it is blended. Asynchronous-only and classroom-only each have just one component, and simulation is a method.","category":"Digital Learning","difficulty":"Easy","sourceType":"Practice Variation","domain":"Future Skills"},{"id":71,"question":"Which platform best supports resources, progress tracking and online assessments?","options":["Learning Management System","Word processor","Video editor","Database only"],"correctAnswer":"A","explanation":"An LMS hosts resources, tracks progress and runs online assessments in one place. A word processor, video editor or database alone cannot manage learners or deliver assessments.","category":"LMS & Educational Technology","difficulty":"Easy","sourceType":"Practice Variation","domain":"Future Skills"},{"id":72,"question":"A trainer needs scholarly educational articles. Which source best matches the screenshot?","options":["Google Scholar","YouTube","General web search","Attendance records"],"correctAnswer":"A","explanation":"Google Scholar searches scholarly articles and academic sources, which suits research. YouTube and general web search return mixed-quality content, and attendance records are not a research source.","category":"AI & Digital Tools","difficulty":"Medium","sourceType":"Practice Variation","domain":"Future Skills"},{"id":73,"question":"A trainer needs an interactive dashboard to visualize training data. Which tool matches the screenshot?","options":["Microsoft Power BI","Word processor","Video editor","Website builder"],"correctAnswer":"A","explanation":"Microsoft Power BI builds interactive dashboards to analyse and visualise data such as training figures. A word processor, video editor or website builder is not designed for data analysis.","category":"AI & Digital Tools","difficulty":"Hard","sourceType":"Practice Variation","domain":"Future Skills"},{"id":74,"question":"Scores are tightly clustered around the average. What should you expect?","options":["A low standard deviation","A high standard deviation","No mean","A negative correlation"],"correctAnswer":"A","explanation":"When scores cluster tightly around the mean, the spread is small, so the standard deviation is low. A high SD would mean widely scattered scores, and correlation describes the relationship between two variables, not spread.","category":"Statistics","difficulty":"Easy","sourceType":"Practice Variation","domain":"Professional Practices"},{"id":75,"question":"Scores are widely spread around the average. Which measure would reflect that spread?","options":["Standard deviation","Mode only","Median only","Attendance rate"],"correctAnswer":"A","explanation":"Standard deviation measures how far scores spread around the mean, so it is the right measure here. Mode and median describe typical values, not spread, and an attendance rate is unrelated.","category":"Statistics","difficulty":"Hard","sourceType":"Practice Variation","domain":"Professional Practices"},{"id":76,"question":"As training hours rise, productivity also tends to rise. What relationship is described?","options":["Positive correlation","Negative correlation","No correlation","Mode"],"correctAnswer":"A","explanation":"When one variable rises as another rises (hours and productivity), the relationship is a positive correlation. A negative correlation means one rises as the other falls, no correlation means no pattern, and mode is an average, not a relationship.","category":"Statistics","difficulty":"Easy","sourceType":"Practice Variation","domain":"Professional Practices"},{"id":77,"question":"A positive correlation by itself proves that more training caused higher productivity. Which statement is best?","options":["No; correlation and causation are different","Yes, always","Only if the mean is high","Only if SD is zero"],"correctAnswer":"A","explanation":"Correlation shows that two variables move together, but not that one causes the other: a third factor, such as motivation, could drive both. Always means 'proves cause', and a high mean or zero SD has no bearing on causation.","category":"Statistics","difficulty":"Easy","sourceType":"Practice Variation","domain":"Professional Practices"},{"id":78,"question":"A shy but attentive trainee avoids whole-class speaking. Which first response best matches the screenshot?","options":["Use simple questions and small-group participation","Force an immediate presentation","Ignore them permanently","Threaten their grade"],"correctAnswer":"A","explanation":"For a shy but attentive trainee, start with low-pressure steps such as simple questions and small-group work. Forcing a presentation, ignoring them or threatening their grade increases anxiety and disengages them.","category":"Trainer Skills & Classroom Management","difficulty":"Medium","sourceType":"Practice Variation","domain":"Future Skills"},{"id":79,"question":"A distracted trainee is talking while the trainer explains. What is the least embarrassing first intervention?","options":["A discreet non-verbal cue","Public criticism","Stopping the whole session","Peer confrontation"],"correctAnswer":"A","explanation":"A discreet non-verbal cue (eye contact, a gesture, moving closer) corrects the behaviour without embarrassing the trainee or disrupting the class. Public criticism humiliates, stopping the whole session punishes everyone, and peer confrontation escalates the problem.","category":"Trainer Skills & Classroom Management","difficulty":"Medium","sourceType":"Practice Variation","domain":"Future Skills"},{"id":80,"question":"A trainee objects to a discussion topic for personal comfort reasons. What is the best response?","options":["Respectfully consider an alternative that maintains the objective","Force participation","Dismiss the concern","Remove the trainee"],"correctAnswer":"A","explanation":"Respectfully considering an alternative that still meets the learning objective balances the trainee's comfort with the course aims. Forcing participation or dismissing the concern is disrespectful, and removing the trainee is disproportionate.","category":"Trainer Skills & Classroom Management","difficulty":"Medium","sourceType":"Practice Variation","domain":"Future Skills"},{"id":81,"question":"Experienced professionals need structured exchange of expertise. Which method fits best?","options":["Dialogue Group","Lecture","Demonstration","Pre-test"],"correctAnswer":"A","explanation":"A Dialogue Group fits experienced professionals because it is built around structured exchange of expertise. A lecture and a demonstration are trainer-led and one-way, and a pre-test is an assessment, not a method.","category":"Training Methods","difficulty":"Easy","sourceType":"Practice Variation","domain":"Professional Practices"},{"id":82,"question":"Participants build a written response by successively adding contributions to the same paper. Which strategy?","options":["Snowball","Role play","Lecture","Simulation"],"correctAnswer":"A","explanation":"The keyed answer is Snowball, where participants build a written response by adding contributions in turn. Caution: your bank defines Snowball two ways. Question 258 uses individual work, then pairs, then groups of four, then the whole class, which is the more widely used definition. Role play acts out a situation, a lecture is trainer-delivered, and a simulation recreates a realistic task. Confirm the definition in your ETEC material before the exam.","category":"Training Methods","difficulty":"Medium","sourceType":"Practice Variation","domain":"Professional Practices"},{"id":83,"question":"Trainees practise a customer complaint by acting as customer and employee. Which method?","options":["Role play","Simulation","Lecture","Diagnostic assessment"],"correctAnswer":"A","explanation":"Acting as customer and employee is role play, which practises interpersonal situations. Simulation recreates a realistic task or environment, a lecture only transmits information, and diagnostic assessment is a pre-training check.","category":"Training Methods","difficulty":"Medium","sourceType":"Practice Variation","domain":"Professional Practices"},{"id":84,"question":"Trainees practise a dangerous operational procedure without real-world consequences. Which method?","options":["Simulation","Role play","Lecture","Dialogue Group"],"correctAnswer":"A","explanation":"Practising a dangerous procedure without real-world consequences is simulation, which recreates realistic tasks in a controlled setting. Role play centres on interpersonal roles, a lecture does not practise anything, and a dialogue group is a discussion.","category":"Training Methods","difficulty":"Medium","sourceType":"Practice Variation","domain":"Professional Practices"},{"id":85,"question":"A trainer has 500 participants and limited time to transmit substantial theoretical content. Which method?","options":["Lecture","Role play","Individual coaching","Snowball"],"correctAnswer":"A","explanation":"A lecture is the only option that transmits a lot of theory to 500 people in limited time. Role play, individual coaching and snowball do not scale to that size.","category":"Training Methods","difficulty":"Medium","sourceType":"Practice Variation","domain":"Professional Practices"},{"id":86,"question":"A trainer adds group tasks to increase trainee involvement. What is the primary purpose?","options":["Enhance interaction and participation","Reduce learning objectives","Eliminate assessment","Shorten all sessions"],"correctAnswer":"A","explanation":"Group tasks increase interaction and participation, which raises involvement. They do not reduce objectives, replace assessment or exist to shorten sessions.","category":"Training Methods","difficulty":"Medium","sourceType":"Practice Variation","domain":"Professional Practices"},{"id":87,"question":"Which resource best supports continued independent learning after the programme?","options":["References and educational links","Attendance sheet","Room plan","Name badges"],"correctAnswer":"A","explanation":"References and educational links give trainees material to keep studying independently after the course ends. An attendance sheet, room plan and name badges are administrative items with no learning content.","category":"Professional Practice","difficulty":"Easy","sourceType":"Practice Variation","domain":"Professional Knowledge"},{"id":88,"question":"Which set matches the training ecosystem in the screenshot?","options":["Trainer, trainees, learning environment, training resources","Trainer, marketing, finance, certificates","Objectives, attendance, finance, exams","Budget, marketing, attendance, certificates"],"correctAnswer":"A","explanation":"The training ecosystem is the trainer, the trainees, the learning environment and the training resources. Marketing, finance, budgets and certificates are administrative or business functions, not core parts of the learning ecosystem.","category":"Professional Practice","difficulty":"Hard","sourceType":"Practice Variation","domain":"Professional Knowledge"},{"id":89,"question":"A mixed-ability group includes beginners and experts. What should the trainer do?","options":["Differentiate activities according to needs","Ignore differences","Teach experts only","Cancel the session"],"correctAnswer":"A","explanation":"In a mixed-ability group, differentiating tasks, support and challenge to each learner's level lets everyone progress. Ignoring differences, teaching only the experts or cancelling the session fails the rest of the group.","category":"Differentiation","difficulty":"Medium","sourceType":"Practice Variation","domain":"Professional Knowledge"},{"id":90,"question":"Trainees request a shorter daily schedule because focus is declining. What should happen first?","options":["Discuss and analyze impact on objectives before adjusting","Reject automatically","Remove content immediately","End the programme"],"correctAnswer":"A","explanation":"When trainees report falling focus, the first step is to discuss it and analyse the impact on the learning objectives before changing anything. Rejecting automatically, cutting content or ending the programme are reactions ma
