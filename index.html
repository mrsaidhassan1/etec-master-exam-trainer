<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ETEC Master Exam Trainer</title>
<meta name="description" content="Interactive ETEC trainer/instructor exam prep app — practice questions, mock exams, revision notes, weak-area analysis, spaced practice and progress tracking.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ===== Design tokens ===== */
  :root{
    --bg:#FFFFFF;
    --surface:#FFFFFF;
    --surface-2:#F4F5F9;
    --sidebar:#161E54;
    --sidebar-hover:#1C2460;
    --sidebar-text:#C9CCE0;
    --sidebar-text-active:#FFFFFF;
    --border:#DCDEE8;
    --border-strong:#C3C7DC;
    --ink:#161E54;
    --ink-muted:#5C6287;
    --ink-faint:#8B90AC;
    --navy:#161E54;
    --navy-strong:#10153F;
    --navy-tint:#FFECEC;
    --brand-green:#1E7A4C;
    --brand-teal:#5C6287;
    --brand-blue:#161E54;
    --brand-indigo:#10153F;
    --gold:#8A5A00;
    --gold-bg:#FBF1DA;
    --gold-border:#EBD39B;
    --good:#1E7A4C;
    --good-bg:#E4F5EA;
    --good-border:#B7E4C7;
    --bad:#A8201A;
    --bad-bg:#FBEAE8;
    --bad-border:#F0C2BD;
    --shadow-sm:0 1px 2px rgba(22,30,84,0.07);
    --shadow-md:0 6px 20px rgba(22,30,84,0.12);
    --focus-ring:0 0 0 3px rgba(22,30,84,0.35);
    --radius-sm:6px;
    --radius-md:10px;
    --radius-lg:16px;
    --font-display:"Source Serif 4", Georgia, "Times New Roman", serif;
    --font-body:"IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --font-mono:"IBM Plex Mono", "SF Mono", Consolas, monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#11173F;
      --surface:#161E54;
      --surface-2:#1C2460;
      --sidebar:#0D1230;
      --sidebar-hover:#1C2460;
      --sidebar-text:#C9CCE0;
      --sidebar-text-active:#FFFFFF;
      --border:#3A4275;
      --border-strong:#4A5290;
      --ink:#FFFFFF;
      --ink-muted:#C9CCE0;
      --ink-faint:#8488AE;
      --navy:#1C2460;
      --navy-strong:#242E78;
      --navy-tint:#FFECEC;
      --brand-green:#5FD39A;
      --brand-teal:#C9CCE0;
      --brand-blue:#1C2460;
      --brand-indigo:#242E78;
      --gold:#F2B33D;
      --gold-bg:rgba(242,179,61,0.14);
      --gold-border:rgba(242,179,61,0.35);
      --good:#5FD39A;
      --good-bg:rgba(95,211,154,0.14);
      --good-border:rgba(95,211,154,0.35);
      --bad:#FF8A80;
      --bad-bg:rgba(255,138,128,0.14);
      --bad-border:rgba(255,138,128,0.35);
      --shadow-sm:0 1px 2px rgba(0,0,0,0.3);
      --shadow-md:0 10px 30px rgba(0,0,0,0.45);
    }
  }
  :root[data-theme="dark"]{
    --bg:#11173F;
    --surface:#161E54;
    --surface-2:#1C2460;
    --sidebar:#0D1230;
    --sidebar-hover:#1C2460;
    --sidebar-text:#C9CCE0;
    --sidebar-text-active:#FFFFFF;
    --border:#3A4275;
    --border-strong:#4A5290;
    --ink:#FFFFFF;
    --ink-muted:#C9CCE0;
    --ink-faint:#8488AE;
    --navy:#1C2460;
    --navy-strong:#242E78;
    --navy-tint:#FFECEC;
    --brand-green:#5FD39A;
    --brand-teal:#C9CCE0;
    --brand-blue:#1C2460;
    --brand-indigo:#242E78;
    --gold:#F2B33D;
    --gold-bg:rgba(242,179,61,0.14);
    --gold-border:rgba(242,179,61,0.35);
    --good:#5FD39A;
    --good-bg:rgba(95,211,154,0.14);
    --good-border:rgba(95,211,154,0.35);
    --bad:#FF8A80;
    --bad-bg:rgba(255,138,128,0.14);
    --bad-border:rgba(255,138,128,0.35);
    --shadow-sm:0 1px 2px rgba(0,0,0,0.3);
    --shadow-md:0 10px 30px rgba(0,0,0,0.45);
  }

  *,*::before,*::after{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    font-size:15px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{font-family:var(--font-display);font-weight:600;margin:0;text-wrap:balance;color:var(--ink);}
  p{margin:0;}
  button{font-family:inherit;color:inherit;}
  .num{font-family:var(--font-mono);font-variant-numeric:tabular-nums;}
  a{color:inherit;}
  ::selection{background:var(--navy-tint);}
  :focus-visible{outline:none;box-shadow:var(--focus-ring);border-radius:var(--radius-sm);}

  /* ===== App shell ===== */
  #app{display:flex;min-height:100vh;}

  .sidebar{
    width:248px;flex:0 0 248px;background:var(--sidebar);color:var(--sidebar-text);
    display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;
  }
  .sidebar-brand{padding:20px 20px 16px;border-bottom:1px solid rgba(255,255,255,0.08);}
  .sidebar-brand .mark{
    display:flex;align-items:center;gap:10px;
  }
  .sidebar-brand .mark-badge{
    width:auto;height:48px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
  }
  .sidebar-brand .mark-badge img{width:auto;height:100%;display:block;}
  .sidebar-brand .name{font-family:var(--font-display);font-weight:600;font-size:15.5px;color:#fff;line-height:1.25;}
  .sidebar-brand .sub{font-size:10.5px;letter-spacing:0.06em;text-transform:uppercase;color:var(--sidebar-text);margin-top:2px;}

  .sidebar-ring{padding:16px 20px;border-bottom:1px solid rgba(255,255,255,0.08);display:flex;align-items:center;gap:12px;}
  .ring-wrap{position:relative;width:52px;height:52px;flex:0 0 auto;}
  .ring-wrap svg{transform:rotate(-90deg);}
  .ring-label{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:12px;font-weight:600;color:#fff;}
  .ring-caption .t1{font-size:12px;color:#fff;font-weight:600;}
  .ring-caption .t2{font-size:11px;color:var(--sidebar-text);margin-top:1px;}

  nav.sidebar-nav{padding:10px 12px;display:flex;flex-direction:column;gap:2px;flex:1;}
  .nav-item{
    display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:8px;font-size:13.5px;
    font-weight:500;cursor:pointer;color:var(--sidebar-text);background:transparent;border:1px solid transparent;
    text-align:left;width:100%;
  }
  .nav-item .ic{width:17px;height:17px;flex:0 0 auto;opacity:0.9;}
  .nav-item:hover{background:var(--sidebar-hover);color:#fff;}
  .nav-item.active{background:var(--sidebar-hover);color:#fff;border-color:rgba(255,255,255,0.12);box-shadow:inset 2px 0 0 var(--navy-strong-active,#FF5151);}
  .nav-item.active{position:relative;}
  .nav-item.active::before{content:"";position:absolute;left:-12px;top:6px;bottom:6px;width:3px;background:#FF5151;border-radius:0 3px 3px 0;}
  .nav-section-label{font-size:10px;text-transform:uppercase;letter-spacing:0.08em;color:var(--ink-faint);padding:14px 12px 4px;color:#5A6C8C;}

  .sidebar-foot{padding:14px 20px 18px;border-top:1px solid rgba(255,255,255,0.08);font-size:11px;color:var(--sidebar-text);}
  .sidebar-foot button{background:transparent;border:1px solid rgba(255,255,255,0.18);color:var(--sidebar-text);padding:6px 10px;border-radius:7px;font-size:11.5px;cursor:pointer;width:100%;margin-top:8px;}
  .sidebar-foot button:hover{color:#fff;border-color:rgba(255,255,255,0.35);}

  .main{flex:1;min-width:0;display:flex;flex-direction:column;}
  .topbar{
    position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--border);
    display:flex;align-items:center;gap:14px;padding:12px 26px;
  }
  .topbar h1{font-size:19px;}
  .topbar .crumb{font-size:12px;color:var(--ink-muted);margin-top:1px;}
  .topbar-spacer{flex:1;}
  .search-box{
    display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--border);
    border-radius:8px;padding:7px 12px;min-width:220px;
  }
  .search-box input{border:none;background:transparent;outline:none;color:var(--ink);font-size:13px;width:100%;font-family:var(--font-body);}
  .search-box svg{flex:0 0 auto;color:var(--ink-muted);}
  .streak-chip{display:flex;align-items:center;gap:6px;background:var(--gold-bg);border:1px solid var(--gold-border);color:var(--gold);padding:6px 11px;border-radius:20px;font-size:12.5px;font-weight:600;}

  .view{padding:24px 26px 60px;max-width:1180px;}
  .view.wide{max-width:none;}

  /* ===== Generic building blocks ===== */
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);}
  .card-pad{padding:20px;}
  .grid{display:grid;gap:16px;}
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;}
  .stat-tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:14px 16px;}
  .stat-tile .label{font-size:11px;text-transform:uppercase;letter-spacing:0.05em;color:var(--ink-muted);font-weight:600;}
  .stat-tile .value{font-family:var(--font-mono);font-size:26px;font-weight:600;margin-top:6px;color:var(--ink);}
  .stat-tile .value.good{color:var(--good);}
  .stat-tile .value.bad{color:var(--bad);}
  .stat-tile .sub{font-size:11.5px;color:var(--ink-faint);margin-top:3px;}

  .section-title{display:flex;align-items:baseline;justify-content:space-between;margin:28px 0 14px;}
  .section-title h2{font-size:16.5px;}
  .section-title .hint{font-size:12px;color:var(--ink-muted);}
  .view > .section-title:first-child{margin-top:0;}

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 16px;border-radius:8px;
    font-size:13.5px;font-weight:600;cursor:pointer;border:1px solid transparent;line-height:1.2;white-space:nowrap;
  }
  .btn-primary{background:var(--navy);color:#fff;}
  .btn-primary:hover{background:var(--navy-strong);}
  :root[data-theme="dark"] .btn-primary, @media (prefers-color-scheme:dark){.btn-primary{color:#FFFFFF;}}
  .btn-ghost{background:transparent;border-color:var(--border-strong);color:var(--ink);}
  .btn-ghost:hover{background:var(--surface-2);}
  .btn-soft{background:var(--navy-tint);color:var(--navy);border-color:transparent;}
  .btn-danger{background:transparent;border-color:var(--bad-border);color:var(--bad);}
  .btn-danger:hover{background:var(--bad-bg);}
  .btn:disabled{opacity:0.45;cursor:not-allowed;}
  .btn-sm{padding:6px 11px;font-size:12.5px;border-radius:7px;}
  .icon-btn{background:transparent;border:1px solid var(--border-strong);border-radius:7px;width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink-muted);}
  .icon-btn:hover{background:var(--surface-2);color:var(--ink);}
  .icon-btn.on{background:var(--gold-bg);border-color:var(--gold-border);color:var(--gold);}

  .pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:600;}
  .pill-navy{background:var(--navy-tint);color:var(--navy);}
  .pill-good{background:var(--good-bg);color:var(--good);border:1px solid var(--good-border);}
  .pill-bad{background:var(--bad-bg);color:var(--bad);border:1px solid var(--bad-border);}
  .pill-gold{background:var(--gold-bg);color:var(--gold);border:1px solid var(--gold-border);}
  .pill-muted{background:var(--surface-2);color:var(--ink-muted);}

  select,input[type="text"]{
    font-family:var(--font-body);background:var(--surface);border:1px solid var(--border-strong);color:var(--ink);
    border-radius:7px;padding:8px 11px;font-size:13px;
  }

  /* Question card */
  .qcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);padding:26px 28px;}
  .qcard-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px;}
  .qcard-counter{font-family:var(--font-mono);font-size:12.5px;color:var(--ink-muted);}
  .qcard .stem{font-family:var(--font-display);font-size:19px;line-height:1.45;color:var(--ink);margin:2px 0 22px;text-wrap:balance;}
  .options{display:flex;flex-direction:column;gap:10px;}
  .option{
    display:flex;align-items:flex-start;gap:12px;padding:13px 15px;border:1.5px solid var(--border-strong);
    border-radius:10px;cursor:pointer;background:var(--surface);text-align:left;width:100%;
  }
  .option:hover:not(.locked){border-color:var(--navy);background:var(--navy-tint);}
  .option .letter{
    font-family:var(--font-mono);font-weight:600;font-size:12.5px;width:24px;height:24px;border-radius:6px;
    background:var(--surface-2);color:var(--ink-muted);display:flex;align-items:center;justify-content:center;flex:0 0 auto;margin-top:1px;
  }
  .option .txt{flex:1;font-size:14.5px;padding-top:1px;}
  .option.selected{border-color:var(--navy);background:var(--navy-tint);}
  .option.selected .letter{background:var(--navy);color:#fff;}
  .option.correct{border-color:var(--good-border);background:var(--good-bg);}
  .option.correct .letter{background:var(--good);color:#fff;}
  .option.incorrect{border-color:var(--bad-border);background:var(--bad-bg);}
  .option.incorrect .letter{background:var(--bad);color:#fff;}
  .option.locked{cursor:default;}
  .option.locked:not(.correct):not(.incorrect):not(.selected){opacity:0.6;}

  .feedback-banner{display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:10px;font-weight:600;font-size:14px;margin-top:20px;}
  .feedback-banner.good{background:var(--good-bg);color:var(--good);border:1px solid var(--good-border);}
  .feedback-banner.bad{background:var(--bad-bg);color:var(--bad);border:1px solid var(--bad-border);}
  .feedback-block{margin-top:14px;padding:14px 16px;background:var(--surface-2);border-radius:10px;font-size:13.5px;color:var(--ink);}
  .feedback-block + .feedback-block{margin-top:10px;}
  .feedback-block .k{font-size:10.5px;text-transform:uppercase;letter-spacing:0.06em;font-weight:700;color:var(--ink-muted);margin-bottom:4px;}

  .qcard-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px;padding-top:18px;border-top:1px solid var(--border);}
  .confidence-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;}
  .confidence-row button{flex:1;min-width:110px;}

  /* Revision cards */
  .rev-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:18px 20px;}
  .rev-card h3{font-size:15px;margin-bottom:8px;}
  .rev-card .memory{margin-top:10px;font-size:12px;color:var(--navy);background:var(--navy-tint);display:inline-block;padding:4px 10px;border-radius:6px;font-weight:600;}
  .flow{display:flex;flex-direction:column;gap:0;}
  .flow-step{display:flex;align-items:center;gap:12px;padding:11px 14px;background:var(--surface-2);border-radius:9px;border:1px solid var(--border);}
  .flow-step .n{font-family:var(--font-mono);font-weight:700;color:var(--navy);width:20px;}
  .flow-step .t{font-weight:600;font-size:13.5px;}
  .flow-step .d{font-size:12px;color:var(--ink-muted);margin-top:1px;}
  .flow-arrow{text-align:center;color:var(--ink-faint);font-size:14px;padding:2px 0;}
  .flow-step.callout{background:var(--gold-bg);border-color:var(--gold-border);}
  .flow-step.callout .n{color:var(--gold);}

  .pyramid{display:flex;flex-direction:column;gap:6px;align-items:stretch;}
  .pyr-level{padding:14px 18px;border-radius:9px;border:1px solid var(--border);background:var(--surface-2);}
  .pyr-level .lv{font-family:var(--font-mono);font-size:11px;color:var(--ink-muted);}
  .pyr-level .name{font-family:var(--font-display);font-weight:600;font-size:15px;margin-top:2px;}
  .pyr-level .q{font-size:12.5px;color:var(--ink-muted);margin-top:2px;}
  .pyr-level:nth-child(1){background:var(--navy-tint);}

  .trap-pair{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:stretch;}
  .trap-side{background:var(--surface-2);border-radius:10px;padding:14px 16px;}
  .trap-side h4{font-size:13.5px;margin-bottom:5px;}
  .trap-side p{font-size:13px;color:var(--ink-muted);}
  .trap-vs{align-self:center;font-family:var(--font-mono);font-size:11px;color:var(--ink-faint);font-weight:700;}

  .flash-stage{display:flex;flex-direction:column;align-items:center;gap:18px;}
  .flash-card{width:100%;max-width:480px;min-height:230px;perspective:1200px;cursor:pointer;}
  .flash-inner{position:relative;width:100%;display:grid;transition:transform .5s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d;}
  .flash-card.flipped .flash-inner{transform:rotateY(180deg);}
  .flash-face{grid-area:1/1;min-height:230px;backface-visibility:hidden;border-radius:16px;border:1px solid var(--border);
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:26px;box-shadow:var(--shadow-md);}
  .flash-front{background:var(--surface);}
  .flash-back{background:var(--navy);color:#fff;transform:rotateY(180deg);}
  .flash-face .tag{font-size:10.5px;text-transform:uppercase;letter-spacing:0.08em;color:var(--ink-faint);margin-bottom:12px;}
  .flash-back .tag{color:rgba(255,255,255,0.65);}
  .flash-face .txt{font-family:var(--font-display);font-size:19px;font-weight:600;line-height:1.4;white-space:pre-line;}
  .flash-face .hint{margin-top:14px;font-size:11.5px;color:var(--ink-faint);}
  @media (prefers-reduced-motion:reduce){.flash-inner{transition:none;}}

  .nav-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px;}
  .nav-grid button{
    aspect-ratio:1;border-radius:7px;border:1px solid var(--border-strong);background:var(--surface);
    font-family:var(--font-mono);font-size:12px;cursor:pointer;color:var(--ink-muted);
  }
  .nav-grid button.answered{background:var(--navy-tint);color:var(--navy);border-color:var(--navy);}
  .nav-grid button.flagged{background:var(--gold-bg);color:var(--gold);border-color:var(--gold-border);}
  .nav-grid button.current{outline:2px solid var(--navy);outline-offset:1px;}

  .modal-overlay{position:fixed;inset:0;background:rgba(8,16,32,0.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
  .modal{background:var(--surface);border-radius:var(--radius-lg);padding:26px;max-width:420px;width:100%;box-shadow:var(--shadow-md);border:1px solid var(--border);}
  .modal h3{font-size:17px;margin-bottom:10px;}
  .modal p{font-size:13.5px;color:var(--ink-muted);margin-bottom:20px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;}

  .toast{position:fixed;bottom:22px;right:22px;background:var(--navy-strong);color:#fff;padding:12px 18px;border-radius:10px;font-size:13px;font-weight:600;box-shadow:var(--shadow-md);z-index:200;}

  .empty{padding:40px 20px;text-align:center;color:var(--ink-muted);}
  .empty svg{margin-bottom:10px;opacity:0.5;}

  .disclaimer{margin-top:36px;padding:14px 18px;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;font-size:11.5px;color:var(--ink-muted);line-height:1.5;}

  table.data{width:100%;border-collapse:collapse;font-size:13px;}
  table.data th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:0.04em;color:var(--ink-muted);padding:8px 10px;border-bottom:1px solid var(--border);}
  table.data td{padding:10px 10px;border-bottom:1px solid var(--border);vertical-align:top;}
  table.data tr:last-child td{border-bottom:none;}
  .table-wrap{overflow-x:auto;}

  .bar-row{display:grid;grid-template-columns:170px 1fr 50px;gap:12px;align-items:center;padding:8px 0;}
  .bar-row .name{font-size:13px;font-weight:500;}
  .bar-track{height:9px;background:var(--surface-2);border-radius:6px;overflow:hidden;}
  .bar-fill{height:100%;border-radius:6px;background:var(--navy);}
  .bar-row .pct{font-family:var(--font-mono);font-size:12.5px;text-align:right;color:var(--ink-muted);}

  .chip-row{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{padding:6px 13px;border-radius:20px;border:1px solid var(--border-strong);font-size:12.5px;font-weight:600;cursor:pointer;background:var(--surface);color:var(--ink-muted);}
  .chip.on{background:var(--navy);border-color:var(--navy);color:#fff;}

  .progress-hero{display:flex;align-items:center;gap:26px;flex-wrap:wrap;}
  .progress-bar-wrap{flex:1;min-width:220px;}
  .progress-bar-track{height:14px;background:var(--surface-2);border-radius:8px;overflow:hidden;border:1px solid var(--border);}
  .progress-bar-fill{height:100%;background:linear-gradient(90deg,var(--navy),var(--navy-strong));border-radius:8px;}
  .readiness-badge{padding:10px 18px;border-radius:12px;font-weight:700;font-size:14px;text-align:center;min-width:150px;}

  .two-col{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;}
  @media (max-width:900px){
    .two-col{grid-template-columns:1fr;}
    .trap-pair{grid-template-columns:1fr;}
    .trap-vs{display:none;}
  }
  @media (max-width:760px){
    #app{flex-direction:column;}
    .sidebar{position:relative;width:100%;flex:none;height:auto;}
    nav.sidebar-nav{flex-direction:row;flex-wrap:wrap;}
    .search-box{min-width:0;}
    .view{padding:18px 16px 50px;}
    .qcard{padding:18px 16px;}
  }
</style>
</head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
const QUESTIONS = [{"id": 1, "question": "A trainer is conducting a hands-on workshop in a computer lab. Trainees frequently discuss ideas, ask questions, observe demonstrations, and interact with the trainer. Which seating arrangement is most appropriate?", "options": ["Traditional rows facing the instructor and screen", "U-shaped seating with all computers around the walls", "Small groups of four facing each other", "Circular seating arrangement"], "correctAnswer": "B", "explanation": "A U-shape keeps every screen visible to the trainer, supports eye contact and discussion, and leaves the centre free for demonstrations. Rows hide screens and a circle removes the computers.", "category": "Training Environment", "difficulty": "Medium", "sourceType": "Source Question", "domain": "Professional Practices"}, {"id": 2, "question": "During a training session, several trainees ask to leave 30 minutes before the session ends because they have completed their work. What is the best response by the trainer?", "options": ["Allow everyone to leave immediately", "Explain that trainees should remain until the scheduled end unless official permission has been granted, and provide a meaningful extension activity", "Ignore their request", "End the class early for everyone"], "correctAnswer": "B", "explanation": "Trainees stay until the scheduled end unless officially permitted (Standard 6.2: discipline and responsibility). Meaningful extension work keeps early finishers learning.", "category": "Trainer Skills & Classroom Management", "difficulty": "Medium", "sourceType": "Source Question", "domain": "Professional Practices"}, {"id": 3, "question": "Which type of training can be completed at any time and from anywhere?", "options": ["Synchronous training", "Face-to-face training", "Asynchronous training", "Classroom instruction"], "correctAnswer": "C", "explanation": "Asynchronous training lets learners study at any time and from anywhere. Synchronous and classroom formats need everyone present together.", "category": "Digital Learning", "difficulty": "Easy", "sourceType": "Source Question", "domain": "Future Skills"}, {"id": 4, "question": "A graph of training hours and employee productivity shows both variables increasing together, with r close to +1. Which description is best?", "options": ["Positive correlation", "Causation", "Negative correlation", "No correlation"], "correctAnswer": "A", "explanation": "Both variables rise together, so r close to +1 is a positive correlation. A correlation does not prove that one causes the other.", "category": "Statistics", "difficulty": "Hard", "sourceType": "Source Question", "domain": "Professional Practices"}, {"id": 5, "question": "A trainer notices that one participant has remained silent throughout the session but appears attentive and completes written activities. What is the most appropriate action?", "options": ["Ask the participant to give an immediate presentation to the whole class", "Ignore the participant completely", "Gradually encourage participation with simple questions and small-group activities", "Warn that the participant's evaluation will be affected"], "correctAnswer": "C", "explanation": "A silent but attentive trainee is best drawn in gradually with low-pressure tasks. Forcing a presentation or threatening their grade damages trust (Standard 9).", "category": "Trainer Skills & Classroom Management", "difficulty": "Medium", "sourceType": "Source Question", "domain": "Future Skills"}, {"id": 6, "question": "In an online training session, breakout rooms are used for participants to discuss short case studies and later present their findings. What is the primary purpose?", "options": ["Reduce interaction", "Increase participation and collaborative learning", "Eliminate the trainer's role", "Reduce trainees' responsibility"], "correctAnswer": "B", "explanation": "Breakout rooms create small-group interaction, which raises participation and collaborative learning.", "category": "Digital Learning", "difficulty": "Medium", "sourceType": "Source Question", "domain": "Future Skills"}, {"id": 7, "question": "What is the primary purpose of Microsoft Power BI?", "options": ["Create word-processing documents", "Analyze and visualize data through interactive dashboards", "Edit videos", "Design websites"], "correctAnswer": "B", "explanation": "Power BI turns data into interactive dashboards and visual reports. It is not a word processor, video editor or website builder.", "category": "AI & Digital Tools", "difficulty": "Easy", "sourceType": "Source Question", "domain": "Future Skills"}, {"id": 8, "question": "Which source is most appropriate for finding peer-reviewed educational research?", "options": ["Google Search", "Google Scholar", "YouTube", "Britannica Encyclopedia"], "correctAnswer": "B", "explanation": "Google Scholar searches academic, peer-reviewed literature. General search, YouTube and encyclopaedias are not peer-reviewed.", "category": "AI & Digital Tools", "difficulty": "Easy", "sourceType": "Source Question", "domain": "Future Skills"}, {"id": 9, "question": "A trainer asks trainees to act out a scenario involving an angry customer and a customer-service employee, then discuss their performance. Which instructional method best describes this?", "options": ["Role play", "Interactive lecture", "Self-learning", "Pre-test"], "correctAnswer": "A", "explanation": "Role play has trainees act out realistic interpersonal roles and then discuss the performance.", "category": "Training Methods", "difficulty": "Medium", "sourceType": "Source Question", "domain": "Professional Practices"}, {"id": 10, "question": "A group of trainees reports that a 5-hour daily schedule is reducing their focus and participation and requests a 3-hour schedule. What should the trainer do first?", "options": ["Reject the request because the schedule was approved", "Discuss the request, analyze its impact on training objectives, and adjust the schedule if effectiveness can be maintained", "Immediately remove activities", "End the programme"], "correctAnswer": "B", "explanation": "Take the request seriously: discuss it, analyse its effect on the objectives, then adjust if effectiveness is kept. Automatic refusal and automatic cutting are both unprofessional.", "category": "Trainer Skills & Classroom Management", "difficulty": "Medium", "sourceType": "Source Question", "domain": "Future Skills"}, {"id": 11, "question": "When is a diagnostic analysis conducted?", "options": ["Before the training program", "At the start only after instruction begins", "During the training program", "After the training program"], "correctAnswer": "A", "explanation": "Diagnostic assessment happens before training to find needs, gaps and learner characteristics.", "category": "Assessment", "difficulty": "Easy", "sourceType": "Source Question", "domain": "Professional Knowledge"}, {"id": 12, "question": "Participants each write one sentence, pass the paper to the next participant, who adds another sentence, and continue until everyone contributes. Which strategy is being used?", "options": ["Brainstorming", "Snowball", "Demonstration", "Role play"], "correctAnswer": "B", "explanation": "Keyed as in the original question set. Note: many sources define the Snowball technique as individual → pairs → groups (as in Exam 2 Q30). Confirm which meaning your ETEC material uses.", "category": "Training Methods", "difficulty": "Medium", "sourceType": "Source Question", "domain": "Professional Practices"}, {"id": 13, "question": "A trainer is delivering professional development to participants with extensive experience and specialized knowledge. The goal is knowledge sharing, discussion, and exchange of professional experiences. Which method is most appropriate?", "options": ["Buzz Group", "Dialogue Group", "Lecture", "Demonstration"], "correctAnswer": "B", "explanation": "A Dialogue Group suits experienced professionals exchanging expertise. Lecture and demonstration are one-way, and a buzz group is a short quick discussion.", "category": "Training Methods", "difficulty": "Medium", "sourceType": "Source Question", "domain": "Professional Practices"}, {"id": 14, "question": "A trainee says a discussion topic makes them uncomfortable and they do not wish to participate. What should the trainer do?", "options": ["Force participation", "Ask the trainee to leave", "Listen respectfully, consider the concern, and provide a suitable alternative while maintaining the learning objective", "Ignore the concern"], "correctAnswer": "C", "explanation": "Listen, respect the concern, and offer an alternative that still meets the learning objective. Forcing, ignoring or removing the trainee is unprofessional.", "category": "Trainer Skills & Classroom Management", "difficulty": "Medium", "sourceType": "Source Question", "domain": "Future Skills"}, {"id": 15, "question": "A trainer wants to organize online course materials, upload resources, track progress, and conduct online assessments. Which platform should be used?", "options": ["Video conferencing software", "Learning Management System (LMS)", "Word-processing software", "Database management system"], "correctAnswer": "B", "explanation": "An LMS hosts materials, tracks progress and runs online assessments.", "category": "LMS & Educational Technology", "difficulty": "Medium", "sourceType": "Source Question", "domain": "Future Skills"}, {"id": 16, "question": "A trainer teaches one classroom session each week while trainees complete online quizzes and assignments through an LMS. This is an example of:", "options": ["Distance learning", "Blended learning", "Classroom learning only", "Demonstration"], "correctAnswer": "B", "explanation": "Weekly classroom teaching combined with online LMS work is blended learning.", "category": "Digital Learning", "difficulty": "Medium", "sourceType": "Source Question", "domain": "Future Skills"}, {"id": 17, "question": "At the end of a course, trainees complete a practical test to demonstrate the knowledge and skills they gained. Which Kirkpatrick level is being evaluated?", "options": ["Reaction", "Learning", "Behaviour", "Results"], "correctAnswer": "B", "explanation": "A practical test of knowledge and skills gained is Kirkpatrick Level 2 – Learning.", "category": "Kirkpatrick", "difficulty": "Hard", "sourceType": "Source Question", "domain": "Professional Knowledge"}, {"id": 18, "question": "Which four elements make up the training ecosystem?", "options": ["Trainer, trainees, learning environment, and training resources", "Trainer, trainees, training budget, and marketing", "Learning objectives, examinations, and certificates", "Training content, attendance, and finance"], "correctAnswer": "A", "explanation": "The training ecosystem is made up of the trainer, the trainees, the learning environment and the training resources.", "category": "Professional Practice", "difficulty": "Easy", "sourceType": "Source Question", "domain": "Professional Knowledge"}, {"id": 19, "question": "Which resource is most appropriate for supporting independent learning after a training program?", "options": ["Course notes", "PowerPoint slides", "References and educational links", "Daily attendance sheet"], "correctAnswer": "C", "explanation": "References and educational links support independent study after the programme. Notes and slides summarise the course, and attendance sheets are administrative.", "category": "Professional Practice", "difficulty": "Easy", "sourceType": "Source Question", "domain": "Professional Knowledge"}, {"id": 20, "question": "A trainer discovers that some participants already know the topic while others are beginners. What is the BEST response?", "options": ["Teach only the advanced trainees", "Ignore the differences", "Differentiate activities according to trainees' needs", "Cancel the session"], "correctAnswer": "C", "explanation": "Mixed prior knowledge calls for differentiation: tasks and support matched to need. Teaching one group only, or ignoring the differences, fails the other group.", "category": "Differentiation", "difficulty": "Medium", "sourceType": "Source Question", "domain": "Professional Knowledge"}, {"id": 21, "question": "A participant is distracted and talking to another participant. The trainer wants to regain attention without embarrassment. What should the trainer do?", "options": ["Publicly ask the participant to stop", "Use a discreet hand gesture or non-verbal cue", "Stop the activity and criticize the behaviour to the class", "Ask another participant to intervene"], "correctAnswer": "B", "explanation": "A discreet non-verbal cue regains attention without embarrassment. Public criticism damages rapport.", "category": "Trainer Skills & Classroom Management", "difficulty": "Medium", "sourceType": "Source Question", "domain": "Future Skills"}, {"id": 22, "question": "Which statistical measure is most appropriate for determining how much trainees' scores vary around the mean?", "options": ["Arithmetic mean", "Standard deviation", "Median", "Mode"], "correctAnswer": "B", "explanation": "Standard deviation measures how far scores spread around the mean. Mean, median and mode describe the centre.", "category": "Statistics", "difficulty": "Medium", "sourceType": "Source Question", "domain": "Professional Practices"}, {"id": 23, "question": "If the standard deviation of trainees' scores is close to zero, this indicates:", "options": ["A large gap in trainee levels", "High similarity and closeness among trainee levels", "Excessive difficulty of the test", "Most trainees failed"], "correctAnswer": "B", "explanation": "A standard deviation near zero means scores are tightly clustered, so trainees are at very similar levels.", "category": "Statistics", "difficulty": "Medium", "sourceType": "Source Question", "domain": "Professional Practices"}, {"id": 24, "question": "Which learning theory states that learners build new knowledge based on existing knowledge and previous experience?", "options": ["Behaviourism", "Constructivism", "Operant conditioning", "Social learning"], "correctAnswer": "B", "explanation": "Constructivism: learners build new knowledge on prior knowledge and experience.", "category": "Learning Theories", "difficulty": "Easy", "sourceType": "Source Question", "domain": "Professional Knowledge"}, {"id": 25, "question": "A trainee learns a procedure by observing an experienced colleague, modelling the steps, and imitating the performance. Which theory best explains this?", "options": ["Bandura's Social Learning Theory", "Constructivism", "CIRO", "Kirkpatrick"], "correctAnswer": "A", "explanation": "Bandura's Social Learning Theory: learning by observing, modelling and imitating.", "category": "Learning Theories", "difficulty": "Medium", "sourceType": "Source Question", "domain": "Professional Knowledge"}, {"id": 26, "question": "Which sequence correctly represents Kolb's Experiential Learning Cycle?", "options": ["Concrete Experience → Reflective Observation → Abstract Conceptualisation → Active Experimentation", "Experience → Evaluation → Reaction → Results", "Analysis → Design → Development → Evaluation", "Observation → Reinforcement → Punishment → Outcome"], "correctAnswer": "A", "explanation": "Kolb: Concrete Experience, Reflective Observation, Abstract Conceptualisation, Active Experimentation (do, reflect, think, try).", "category": "Learning Theories", "difficulty": "Easy", "sourceType": "Source Question", "domain": "Professional Knowledge"}, {"id": 27, "question": "A trainer praises a trainee for correct performance, making the trainee more likely to repeat the behaviour. Which concept is illustrated?", "options": ["Positive reinforcement", "Punishment", "Diagnostic assessment", "Reflective observation"], "correctAnswer": "A", "explanation": "Praise that makes correct behaviour more likely to recur is positive reinforcement.", "category": "Learning Theories", "difficulty": "Medium", "sourceType": "Source Question", "domain": "Professional Knowledge"}, {"id": 28, "question": "Which learning theory focuses on changes in observable behaviour and the effects of reinforcement and consequences?", "options": ["Constructivism", "Behaviourism", "Experiential learning", "Humanism"], "correctAnswer": "B", "explanation": "Behaviourism studies observable behaviour shaped by reinforcement and consequences.", "category": "Learning Theories", "difficulty": "Easy", "sourceType": "Source Question", "domain": "Professional Knowledge"}, {"id": 29, "question": "Which theorist is strongly associated with operant conditioning?", "options": ["Bandura", "Skinner", "Kolb", "Kirkpatrick"], "correctAnswer": "B", "explanation": "Skinner is the theorist associated with operant conditioning.", "category": "Learning Theories", "difficulty": "Easy", "sourceType": "Source Question", "domain": "Professional Knowledge"}, {"id": 30, "question": "What does C represent in the CIRO evaluation model?", "options": ["Content", "Context", "Competence", "Communication"], "correctAnswer": "B", "explanation": "CIRO: C = Context (needs, objectives and the organisational situation).", "category": "CIRO", "difficulty": "Hard", "sourceType": "Source Question", "domain": "Professional Knowledge"}, {"id": 31, "question": "What does I represent in CIRO?", "options": ["Instruction", "Input", "Implementation", "Interaction"], "correctAnswer": "B", "explanation": "CIRO: I = Input (design, resources and strategy).", "category": "CIRO", "difficulty": "Hard", "sourceType": "Source Question", "domain": "Professional Knowledge"}, {"id": 32, "question": "What does R represent in CIRO?", "options": ["Results", "Reaction", "Reflection", "Reinforcement"], "correctAnswer": "B", "explanation": "CIRO: R = Reaction (participants' response to the training).", "category": "CIRO", "difficulty": "Hard", "sourceType": "Source Question", "domain": "Professional Knowledge"}, {"id": 33, "question": "What does O represent in CIRO?", "options": ["Objective", "Organisation", "Outcome", "Observation"], "correctAnswer": "C", "explanation": "CIRO: O = Outcome (results at individual, team or organisational level, as worded in your study guide; some sources say Output).", "category": "CIRO", "difficulty": "Hard", "sourceType": "Source Question", "domain": "Professional Knowledge"}, {"id": 34, "question": "What is the first stage of the ADDIE model?", "options": ["Analysis", "Design", "Development", "Implementation"], "correctAnswer": "A", "explanation": "ADDIE starts with Analysis: identify needs, audience and constraints.", "category": "ADDIE", "difficulty": "Easy", "sourceType": "Source Question", "domain": "Professional Knowledge"}, {"id": 35, "question": "Which sequence correctly represents ADDIE?", "options": ["Analysis → Design → Development → Implementation → Evaluation", "Analysis → Development → Design → Implementation → Evaluation", "Design → Analysis → Implementation → Development → Evaluation", "Analysis → Design → Implementation → Development → Evaluation"], "correctAnswer": "A", "explanation": "ADDIE order: Analysis, Design, Development, Implementation, Evaluation.", "category": "ADDIE", "difficulty": "Easy", "sourceType": "Source Question", "domain": "Professional Knowledge"}, {"id": 36, "question": "Which ADDIE stage focuses on reviewing training effectiveness?", "options": ["Analysis", "Design", "Implementation", "Evaluation"], "correctAnswer": "D", "explanation": "Evaluation reviews how effective the training was and feeds improvements back.", "category": "ADDIE", "difficulty": "Easy", "sourceType": "Source Question", "domain": "Professional Knowledge"}, {"id": 37, "question": "Immediately after training, participants are asked whether they liked the training. Which Kirkpatrick level is measured?", "options": ["Reaction", "Learning", "Behaviour", "Results"], "correctAnswer": "A", "explanation": "Asking whether trainees liked the training is Kirkpatrick Level 1 – Reaction.", "category": "Kirkpatrick", "difficulty": "Medium", "sourceType": "Source Question", "domain": "Professional Knowledge"}, {"id": 38, "question": "Three months after training, supervisors check whether employees are applying their new skills at work. Which Kirkpatrick level is measured?", "options": ["Reaction", "Learning", "Behaviour", "Results"], "correctAnswer": "C", "explanation": "Checking on the job, weeks later, whether skills are applied is Level 3 – Behaviour.", "category": "Kirkpatrick", "difficulty": "Hard", "sourceType": "Source Question", "domain": "Professional Knowledge"}, {"id": 39, "question": "An organisation measures the impact of training on productivity and organisational performance. Which Kirkpatrick level is measured?", "options": ["Reaction", "Learning", "Behaviour", "Results"], "correctAnswer": "D", "explanation": "Impact on productivity and organisational performance is Level 4 – Results.", "category": "Kirkpatrick", "difficulty": "Easy", "sourceType": "Source Question", "domain": "Professional Knowledge"}, {"id": 40, "question": "Trainees reacted positively to a programme, but evidence shows they did not acquire the required knowledge and skills. Which Kirkpatrick level is the main problem?", "options": ["Reaction", "Learning", "Behaviour", "Results"], "correctAnswer": "B", "explanation": "Positive reactions without the intended knowledge and skills means Level 2 – Learning has failed.", "category": "Kirkpatrick", "difficulty": "Hard", "sourceType": "Source Question", "domain": "Professional Knowledge"}, {"id": 41, "question": "A trainer needs to deliver a large amount of knowledge to a very large audience in a short period. Which method is most appropriate?", "options": ["Role play", "Lecture", "Simulation", "Individual coaching"], "correctAnswer": "B", "explanation": "A lecture delivers a large amount of content to a large audience in a short time.", "category": "Training Methods", "difficulty": "Medium", "sourceType": "Source Question", "domain": "Professional Practices"}, {"id": 42, "question": "Trainees need to practise a realistic high-risk workplace task in a controlled environment. Which method is most appropriate?", "options": ["Lecture", "Role play", "Simulation", "Brainstorming"], "correctAnswer": "C", "explanation": "Simulation gives realistic practice of high-risk tasks in a controlled environment.", "category": "Training Methods", "difficulty": "Medium", "sourceType": "Source Question", "domain": "Professional Practices"}, {"id": 43, "question": "Which assessment is carried out during training to monitor progress, provide feedback, and improve learning?", "options": ["Diagnostic assessment", "Formative assessment", "Outcome evaluation", "Reaction evaluation"], "correctAnswer": "B", "explanation": "Formative assessment monitors progress during training and gives feedback to improve learning.", "category": "Assessment", "difficulty": "Easy", "sourceType": "Source Question", "domain": "Professional Knowledge"}, {"id": 44, "question": "How is a practical project, in which trainees produce a piece of work to show their knowledge and skills, generally classified?", "options": ["Performance-based assessment", "Reaction evaluation", "Diagnostic analysis", "Attendance assessment"], "correctAnswer": "A", "explanation": "A project in which trainees produce work to show knowledge and skills is performance-based assessment.", "category": "Assessment", "difficulty": "Medium", "sourceType": "Source Question", "domain": "Professional Knowledge"}, {"id": 45, "question": "Which link format indicates a secure website connection?", "options": ["http://", "https://", "ftp://", "file://"], "correctAnswer": "B", "explanation": "https:// indicates an encrypted, secure connection; http:// does not.", "category": "AI & Digital Tools", "difficulty": "Easy", "sourceType": "Source Question", "domain": "Future Skills"}, {"id": 46, "question": "You have 60 training days and each programme lasts 3 days. How many complete programmes can you deliver?", "options": ["15", "18", "20", "30"], "correctAnswer": "C", "explanation": "60 divided by 3 equals 20, matching the source.", "category": "Statistics", "difficulty": "Hard", "sourceType": "Source Question", "domain": "Professional Practices"}, {"id": 47, "question": "Which of the following cannot be used to generate images, videos or other multimedia content?", "options": ["Hugging Face", "An AI image tool", "An AI video tool", "SQL Server"], "correctAnswer": "D", "explanation": "SQL Server is a database system. It does not generate images or video, unlike generative AI tools and Hugging Face models.", "category": "AI & Digital Tools", "difficulty": "Hard", "sourceType": "Source Question", "domain": "Future Skills"}, {"id": 48, "question": "A trainer wants to identify the skills an organisation will need in the future. Which focus is most appropriate?", "options": ["Future capability and skills requirements", "Current attendance only", "Classroom furniture", "Past trainee satisfaction only"], "correctAnswer": "A", "explanation": "Future-focused analysis asks which capabilities the organisation will need (innovation, AI), not only current attendance or past satisfaction.", "category": "Training Needs Analysis", "difficulty": "Medium", "sourceType": "Source Question", "domain": "Professional Practices"}, {"id": 49, "question": "A trainer has both experienced trainees and beginners in one group. Which response best matches the source's mixed-ability focus?", "options": ["Use the same advanced task without support", "Differentiate tasks and support according to trainee needs", "Teach only beginners", "Cancel group work"], "correctAnswer": "B", "explanation": "The source raises mixed-ability management; the screenshot explicitly keys differentiation.", "category": "Differentiation", "difficulty": "Medium", "sourceType": "Source Question", "domain": "Professional Knowledge"}, {"id": 50, "question": "Which situation best represents synchronous online training?", "options": ["A live virtual class attended by trainer and trainees at the same time", "Recorded videos watched at different times", "Self-paced modules", "Independent reading"], "correctAnswer": "A", "explanation": "Synchronous means trainer and learners take part together at the same time, such as in a live virtual class.", "category": "Digital Learning", "difficulty": "Easy", "sourceType": "Source Question", "domain": "Future Skills"}, {"id": 51, "question": "A trainer wants learners to connect a new safety concept to incidents they have previously experienced. Which theory best supports this approach?", "options": ["Constructivism", "Behaviourism", "Kirkpatrick", "CIRO"], "correctAnswer": "A", "explanation": "Constructivism builds new knowledge on prior knowledge and experience.", "category": "Learning Theories", "difficulty": "Medium", "sourceType": "Practice Variation", "domain": "Professional Knowledge"}, {"id": 52, "question": "A trainer demonstrates a task while trainees watch and then copy the procedure. Which theory is most directly represented?", "options": ["Bandura's Social Learning Theory", "ADDIE", "CIRO", "Diagnostic assessment"], "correctAnswer": "A", "explanation": "Bandura emphasizes observation, modelling and imitation.", "category": "Learning Theories", "difficulty": "Medium", "sourceType": "Practice Variation", "domain": "Professional Knowledge"}, {"id": 53, "question": "After performing a task, trainees discuss what happened, develop a principle, then try an improved approach. Which model best fits?", "options": ["Kolb's Experiential Learning Cycle", "Kirkpatrick", "ADDIE", "CIRO"], "correctAnswer": "A", "explanation": "This follows experience, reflection, conceptualisation and experimentation.", "category": "Learning Theories", "difficulty": "Medium", "sourceType": "Practice Variation", "domain": "Professional Knowledge"}, {"id": 54, "question": "A reward is given every time a trainee follows the correct procedure, and correct performance increases. Which principle is operating?", "options": ["Reinforcement", "Punishment", "Reaction", "Outcome"], "correctAnswer": "A", "explanation": "The source states reinforcement increases behaviour.", "category": "Learning Theories", "difficulty": "Medium", "sourceType": "Practice Variation", "domain": "Professional Knowledge"}, {"id": 55, "question": "A trainer wants to know trainees' knowledge gaps before designing activities. What should be used?", "options": ["Diagnostic assessment", "Formative assessment", "Reaction survey", "Results evaluation"], "correctAnswer": "A", "explanation": "Diagnostic assessment is used before training to identify needs and gaps.", "category": "Assessment", "difficulty": "Medium", "sourceType": "Practice Variation", "domain": "Professional Knowledge"}, {"id": 56, "question": "During a lesson, a trainer uses short checks and feedback to adjust instruction. What is this?", "options": ["Formative assessment", "Diagnostic analysis", "Results evaluation", "Final attendance"], "correctAnswer": "A", "explanation": "Formative assessment occurs during training.", "category": "Assessment", "difficulty": "Medium", "sourceType": "Practice Variation", "domain": "Professional Knowledge"}, {"id": 57, "question": "A trainee completes a practical task at course end to show what was learned. Which Kirkpatrick level?", "options": ["Learning", "Reaction", "Behaviour", "Results"], "correctAnswer": "A", "explanation": "A practical demonstration of acquired knowledge/skills is Learning.", "category": "Kirkpatrick", "difficulty": "Medium", "sourceType": "Practice Variation", "domain": "Professional Knowledge"}, {"id": 58, "question": "A manager checks six weeks later whether trained staff use the procedure at work. Which Kirkpatrick level?", "options": ["Behaviour", "Learning", "Reaction", "Results"], "correctAnswer": "A", "explanation": "On-the-job application is Behaviour.", "category": "Kirkpatrick", "difficulty": "Hard", "sourceType": "Practice Variation", "domain": "Professional Knowledge"}, {"id": 59, "question": "A company compares productivity before and after training. Which Kirkpatrick level?", "options": ["Results", "Reaction", "Learning", "Behaviour"], "correctAnswer": "A", "explanation": "Organisational impact is Results.", "category": "Kirkpatrick", "difficulty": "Easy", "sourceType": "Practice Variation", "domain": "Professional Knowledge"}, {"id": 60, "question": "A satisfaction form asks whether trainees found the course useful and engaging. Which Kirkpatrick level?", "options": ["Reaction", "Learning", "Behaviour", "Results"], "correctAnswer": "A", "explanation": "Immediate trainee response is Reaction.", "category": "Kirkpatrick", "difficulty": "Medium", "sourceType": "Practice Variation", "domain": "Professional Knowledge"}, {"id": 61, "question": "Which item comes directly after Analysis in ADDIE?", "options": ["Design", "Development", "Implementation", "Evaluation"], "correctAnswer": "A", "explanation": "ADDIE is Analysis, Design, Development, Implementation, Evaluation.", "category": "ADDIE", "difficulty": "Easy", "sourceType": "Practice Variation", "domain": "Professional Knowledge"}, {"id": 62, "question": "Which item comes directly after Design in ADDIE?", "options": ["Development", "Analysis", "Evaluation", "Reaction"], "correctAnswer": "A", "explanation": "Development follows Design.", "category": "ADDIE", "difficulty": "Hard", "sourceType": "Practice Variation", "domain": "Professional Knowledge"}, {"id": 63, "question": "Which item comes directly after Development in ADDIE?", "options": ["Implementation", "Evaluation", "Analysis", "Input"], "correctAnswer": "A", "explanation": "Implementation follows Development.", "category": "ADDIE", "difficulty": "Easy", "sourceType": "Practice Variation", "domain": "Professional Knowledge"}, {"id": 64, "question": "Which item comes directly after Implementation in ADDIE?", "options": ["Evaluation", "Design", "Development", "Context"], "correctAnsw ategory": "Professional Values and Responsibilities", "domain": "Professional Values and Responsibilities", "difficulty": "Medium", "sourceType": "Source Question"}, {"id": 192, "question": "Using copyrighted material without permission or citation violates:", "options": ["Time management only", "Training design alignment", "Intellectual property and academic integrity", "Kirkpatrick Level 2"], "correctAnswer": "C", "explanation": "Using others' work without permission or citation breaches intellectual property and academic integrity. Standard 7.2.", "category": "Professional Values and Responsibilities", "domain": "Professional Values and Responsibilities", "difficulty": "Medium", "sourceType": "Source Question"}, {"id": 193, "question": "Fairness in evaluation means:", "options": ["Giving high scores to friends", "Changing criteria after the test", "Applying clear criteria objectively to all trainees", "Ignoring evidence"], "correctAnswer": "C", "explanation": "Fairness means applying the same clear criteria objectively to every trainee, with no favouritism. Standards 6.2 and 7.1.", "category": "Professional Values and Responsibilities", "domain": "Professional Values and Responsibilities", "difficulty": "Medium", "sourceType": "Source Question"}, {"id": 194, "question": "Confidentiality requires the trainer to:", "options": ["Publish all trainee results publicly", "Protect trainee information", "Share private data with others", "Discuss trainee weaknesses openly"], "correctAnswer": "B", "explanation": "Confidentiality means protecting trainee information and sharing it only with authorised people for a legitimate purpose. Standard 7.2.", "category": "Professional Values and Responsibilities", "domain": "Professional Values and Responsibilities", "difficulty": "Medium", "sourceType": "Source Question"}, {"id": 195, "question": "Continuous professional development means:", "options": ["The trainer stops learning after licensing", "The trainer avoids feedback", "The trainer keeps improving knowledge, skills, and professional practice", "The trainer repeats the same material forever"], "correctAnswer": "C", "explanation": "CPD is the continuing effort to improve knowledge, skills and practice, guided by reflection and feedback. Standard 8.", "category": "Professional Values and Responsibilities", "domain": "Professional Values and Responsibilities", "difficulty": "Medium", "sourceType": "Source Question"}, {"id": 196, "question": "Critical thinking helps the trainer to:", "options": ["Avoid evidence", "Memorize only", "Analyze situations and make reasoned decisions", "Ignore trainee problems"], "correctAnswer": "C", "explanation": "Official ETEC study guide practice question (Part 4 — 120 Practice MCQs). Domain: Future Skills.", "category": "Future Skills", "domain": "Future Skills", "difficulty": "Medium", "sourceType": "Source Question"}, {"id": 197, "question": "Innovation in training means:", "options": ["Changing activities randomly", "Using new or improved methods to enhance learning", "Removing assessment", "Avoiding technology"], "correctAnswer": "B", "explanation": "Official ETEC study guide practice question (Part 4 — 120 Practice MCQs). Domain: Future Skills.", "category": "Future Skills", "domain": "Future Skills", "difficulty": "Medium", "sourceType": "Source Question"}, {"id": 198, "question": "Digital skills are important because trainers need to:", "options": ["Replace all human interaction", "Avoid assessment", "Use technology effectively and safely in training and professional practice", "Ignore data security"], "correctAnswer": "C", "explanation": "Official ETEC study guide practice question (Part 4 — 120 Practice MCQs). Domain: Future Skills.", "category": "Future Skills", "domain": "Future Skills", "difficulty": "Medium", "sourceType": "Source Question"}, {"id": 199, "question": "Social-emotional skills help trainers to:", "options": ["Focus only on technical content", "Communicate, empathize, manage relationships, and support a positive environment", "Avoid interaction", "Eliminate participation"], "correctAnswer": "B", "explanation": "Official ETEC study guide practice question (Part 4 — 120 Practice MCQs). Domain: Future Skills.", "category": "Future Skills", "domain": "Future Skills", "difficulty": "Medium", "sourceType": "Source Question"}, {"id": 200, "question": "The best description of a modern trainer is:", "options": ["A speaker who only delivers information", "A facilitator of learning and designer of learning experiences", "A person who controls all discussion", "A certificate distributor"], "correctAnswer": "B", "explanation": "Official ETEC study guide practice question (Part 4 — 120 Practice MCQs). Domain: Future Skills.", "category": "Future Skills", "domain": "Future Skills", "difficulty": "Medium", "sourceType": "Source Question"}, {"id": 201, "question": "In the ARCS model, which element is most directly addressed when a trainer uses an unexpected case or question to capture trainee interest?", "options": ["Attention", "Relevance", "Confidence", "Satisfaction"], "correctAnswer": "A", "explanation": "Official ETEC study guide practice question (Part 4 — 120 Practice MCQs). Domain: Professional Knowledge.", "category": "Professional Knowledge", "domain": "Professional Knowledge", "difficulty": "Medium", "sourceType": "Source Question"}, {"id": 202, "question": "A trainee asks, “How does this course help my actual job?” Which ARCS element should the trainer strengthen first?", "options": ["Satisfaction", "Confidence", "Relevance", "Attention"], "correctAnswer": "C", "explanation": "Official ETEC study guide practice question (Part 4 — 120 Practice MCQs). Domain: Professional Knowledge.", "category": "Professional Knowledge", "domain": "Professional Knowledge", "difficulty": "Medium", "sourceType": "Source Question"}, {"id": 203, "question": "According to Self-Determination Theory, motivation is strengthened when training supports:", "options": ["Autonomy, competence, and relatedness", "Attendance, testing, and certificates", "Costs, benefits, and ROI", "Rules, penalties, and control"], "correctAnswer": "A", "explanation": "Official ETEC study guide practice question (Part 4 — 120 Practice MCQs). Domain: Professional Knowledge.", "category": "Professional Knowledge", "domain": "Professional Knowledge", "difficulty": "Medium", "sourceType": "Source Question"}, {"id": 204, "question": "In Expectancy Theory, motivation is weak if trainees believe that:", "options": ["Effort will lead to better performance", "Good performance will lead to valued outcomes", "The outcome is valuable", "Effort will not improve performance or outcomes"], "correctAnswer": "D", "explanation": "Official ETEC study guide practice question (Part 4 — 120 Practice MCQs). Domain: Professional Knowledge.", "category": "Professional Knowledge", "domain": "Professional Knowledge", "difficulty": "Medium", "sourceType": "Source Question"}, {"id": 205, "question": "Goal Setting Theory suggests that performance improves most when goals are:", "options": ["General and easy", "Specific, challenging, and supported by feedback", "Hidden from trainees", "Changed after evaluation"], "correctAnswer": "B", "explanation": "Official ETEC study guide practice question (Part 4 — 120 Practice MCQs). Domain: Professional Knowledge.", "category": "Professional Knowledge", "domain": "Professional Knowledge", "difficulty": "Medium", "sourceType": "Source Question"}, {"id": 206, "question": "Understanding by Design (UbD) is best described as:", "options": ["Starting with slides and then writing objectives", "Backward design: start with desired results and evidence, then plan learning", "A model used only for ROI calculation", "A seating arrangement method"], "correctAnswer": "B", "explanation": "Official ETEC study guide practice question (Part 4 — 120 Practice MCQs). Domain: Professional Knowledge.", "category": "Professional Knowledge", "domain": "Professional Knowledge", "difficulty": "Medium", "sourceType": "Source Question"}, {"id": 207, "question": "Merrill First Principles emphasize that effective instruction should be:", "options": ["Problem-centered with activation, demonstration, application, and integration", "Based only on lectures", "Focused only on trainee satisfaction", "Unstructured and informal"], "correctAnswer": "A", "explanation": "Official ETEC study guide practice question (Part 4 — 120 Practice MCQs). Domain: Professional Knowledge.", "category": "Professional Knowledge", "domain": "Professional Knowledge", "difficulty": "Medium", "sourceType": "Source Question"}, {"id": 208, "question": "Which of Gagne Nine Events should happen early to help trainees understand what they are expected to learn?", "options": ["Enhance retention only", "Inform learners of objectives", "Assess performance only", "Print certificates"], "correctAnswer": "B", "explanation": "Official ETEC study guide practice question (Part 4 — 120 Practice MCQs). Domain: Professional Knowledge.", "category": "Professional Knowledge", "domain": "Professional Knowledge", "difficulty": "Medium", "sourceType": "Source Question"}, {"id": 209, "question": "In Dick and Carey model, instruction is viewed mainly as:", "options": ["A collection of independent slides", "A systems approach linking goals, learners, context, instruction, assessment, and revision", "A trainer personality test", "A financial model"], "correctAnswer": "B", "explanation": "Official ETEC study guide practice question (Part 4 — 120 Practice MCQs). Domain: Professional Knowledge.", "category": "Professional Knowledge", "domain": "Professional Knowledge", "difficulty": "Medium", "sourceType": "Source Question"}, {"id": 210, "question": "A trainer removes irrelevant graphics and splits complex information into smaller steps. This mainly reduces:", "options": ["Intrinsic motivation", "Extraneous cognitive load", "Professional ethics", "Transfer support"], "correctAnswer": "B", "explanation": "Official ETEC study guide practice question (Part 4 — 120 Practice MCQs). Domain: Professional Knowledge.", "category": "Professional Knowledge", "domain": "Professional Knowledge", "difficulty": "Medium", "sourceType": "Source Question"}, {"id": 211, "question": "An assessment that asks trainees to handle a realistic workplace scenario is best described as:", "options": ["Authentic assessment", "Random assessment", "Norm-free assessment", "Attendance assessment"], "correctAnswer": "A", "explanation": "Official ETEC study guide practice question (Part 4 — 120 Practice MCQs). Domain: Professional Practices.", "category": "Professional Practices", "domain": "Professional Practices", "difficulty": "Medium", "sourceType": "Source Question"}, {"id": 212, "question": "Reliability of an evaluation tool means that it:", "options": ["Measures exactly what it should measure", "Produces consistent results under similar conditions", "Is always difficult", "Requires no criteria"], "correctAnswer": "B", "explanation": "Official ETEC study guide practice question (Part 4 — 120 Practice MCQs). Domain: Professional Knowledge.", "category": "Professional Knowledge", "domain": "Professional Knowledge", "difficulty": "Medium", "sourceType": "Source Question"}, {"id": 213, "question": "Validity of an evaluation tool means that it:", "options": ["Measures what it is intended to measure", "Gives the same score to everyone", "Is short", "Avoids evidence"], "correctAnswer": "A", "explanation": "Official ETEC study guide practice question (Part 4 — 120 Practice MCQs). Domain: Professional Knowledge.", "category": "Professional Knowledge", "domain": "Professional Knowledge", "difficulty": "Medium", "sourceType": "Source Question"}, {"id": 214, "question": "Root Cause Analysis is used to:", "options": ["Find underlying causes of a performance problem", "Select slide colors", "Increase attendance automatically", "Avoid asking stakeholders"], "correctAnswer": "A", "explanation": "Official ETEC study guide practice question (Part 4 — 120 Practice MCQs). Domain: Professional Practices.", "category": "Professional Practices", "domain": "Professional Practices", "difficulty": "Medium", "sourceType": "Source Question"}, {"id": 215, "question": "Human Performance Improvement (HPI) differs from a training-only approach because it:", "options": ["Assumes every problem is solved by a course", "Looks systemically at performance and may recommend non-training interventions", "Focuses only on learner satisfaction", "Eliminates evaluation"], "correctAnswer": "B", "explanation": "Official ETEC study guide practice question (Part 4 — 120 Practice MCQs). Domain: Professional Practices.", "category": "Professional Practices", "domain": "Professional Practices", "difficulty": "Medium", "sourceType": "Source Question"}, {"id": 216, "question": "Systems thinking in training means:", "options": ["Viewing problems as isolated events only", "Examining relationships, patterns, causes, and wider effects", "Ignoring organizational culture", "Avoiding data"], "correctAnswer": "B", "explanation": "Official ETEC study guide practice question (Part 4 — 120 Practice MCQs). Domain: Professional Knowledge.", "category": "Professional Knowledge", "domain": "Professional Knowledge", "difficulty": "Medium", "sourceType": "Source Question"}, {"id": 217, "question": "TPACK is about integrating:", "options": ["Technology, pedagogy, and content knowledge", "Training prices, attendance, and certificates", "Tests, policies, and compliance", "Time, people, and costs only"], "correctAnswer": "A", "explanation": "Official ETEC study guide practice question (Part 4 — 120 Practice MCQs). Domain: Future Skills.", "category": "Future Skills", "domain": "Future Skills", "difficulty": "Medium", "sourceType": "Source Question"}, {"id": 218, "question": "In the SAMR model, using technology to create tasks previously impossible is called:", "options": ["Substitution", "Augmentation", "Modification", "Redefinition"], "correctAnswer": "D", "explanation": "Official ETEC study guide practice question (Part 4 — 120 Practice MCQs). Domain: Future Skills.", "category": "Future Skills", "domain": "Future Skills", "difficulty": "Medium", "sourceType": "Source Question"}, {"id": 219, "question": "SCORM is mainly related to:", "options": ["E-learning content packaging and LMS interoperability", "Face-to-face seating design", "Trainer ethics code", "Classroom decoration"], "correctAnswer": "A", "explanation": "Official ETEC study guide practice question (Part 4 — 120 Practice MCQs). Domain: Future Skills.", "category": "Future Skills", "domain": "Future Skills", "difficulty": "Medium", "sourceType": "Source Question"}, {"id": 220, "question": "Professional Learning Communities are best described as:", "options": ["Individual work without sharing", "Collaborative groups using reflection, data, and shared learning for continuous improvement", "A final exam committee only", "A marketing channel"], "correctAnswer": "B", "explanation": "A professional learning community is a group that shares practice, reflects and uses data to improve training together. Standard 8.2.2.", "category": "Professional Values and Responsibilities", "domain": "Professional Values and Responsibilities", "difficulty": "Medium", "sourceType": "Source Question"}, {"id": 221, "question": "According to Standard 6.1 of the official ETEC trainer standards, a trainer's commitment to professional ethics and national regulations is primarily meant to ensure:", "options": ["Higher training fees", "Quality assurance systems in training", "Longer certificate validity periods", "Fewer required training hours"], "correctAnswer": "B", "explanation": "Additional Practice Question — not from source bank. Grounded directly in Standard 6.1: \"Commit to professional ethics, national regulations, and quality assurance systems in training.\"", "category": "Professional Values and Responsibilities", "domain": "Professional Values and Responsibilities", "difficulty": "Medium", "sourceType": "Additional Practice Question"}, {"id": 222, "question": "Standard 6.2 requires a trainer to be aware of which of the following in all their practices?", "options": ["Only their personal duties, not their rights", "Rights, duties, discipline, and responsibilities", "Only the training entity's holiday schedule", "Marketing procedures for new courses"], "correctAnswer": "B", "explanation": "Additional Practice Question — not from source bank. Grounded directly in Standard 6.2: \"Be aware of rights, duties, discipline, and responsibilities in all practices.\"", "category": "Professional Values and Responsibilities", "domain": "Professional Values and Responsibilities", "difficulty": "Medium", "sourceType": "Additional Practice Question"}, {"id": 223, "question": "Standard 7.1 (commitment to citizenship values) is meant to apply to a trainer's:", "options": ["Personal finances only", "All professional relationships and practices", "Only their relationship with the training entity's owner", "Only fully online training sessions"], "correctAnswer": "B", "explanation": "Additional Practice Question — not from source bank. Grounded directly in Standard 7.1: \"Commit to citizenship values in all professional relationships and practices.\"", "category": "Professional Values and Responsibilities", "domain": "Professional Values and Responsibilities", "difficulty": "Medium", "sourceType": "Additional Practice Question"}, {"id": 224, "question": "Which pair of values does Standard 7.2 require a trainer to commit to in all their practices?", "options": ["Marketing and sales technique", "Scientific integrity and confidentiality", "Punctuality and attendance only", "Creativity and innovation"], "correctAnswer": "B", "explanation": "Additional Practice Question — not from source bank. Grounded directly in Standard 7.2: \"Commit to scientific integrity and confidentiality in all practices.\"", "category": "Professional Values and Responsibilities", "domain": "Professional Values and Responsibilities", "difficulty": "Medium", "sourceType": "Additional Practice Question"}, {"id": 225, "question": "A trainer keeps trainee assessment records private and never shares them without proper authorization. This mainly reflects the domain of:", "options": ["Professional Knowledge", "Professional Practices", "Professional Values and Responsibilities", "Future Skills"], "correctAnswer": "C", "explanation": "Additional Practice Question — not from source bank. Confidentiality is named explicitly under the official definition of the Professional Values and Responsibilities domain.", "category": "Professional Values and Responsibilities", "domain": "Professional Values and Responsibilities", "difficulty": "Easy", "sourceType": "Additional Practice Question"}, {"id": 226, "question": "Standard 8.1 describes continuous professional development mainly as:", "options": ["Pursuing knowledge, training, and labor market developments and updates", "Repeating the same training content every year without change", "Avoiding the use of any new teaching tools", "Waiting for the training entity to assign development activities"], "correctAnswer": "A", "explanation": "Additional Practice Question — not from source bank. Grounded directly in Standard 8.1: \"Pursue knowledge, training, and labor market developments and updates.\"", "category": "Professional Values and Responsibilities", "domain": "Professional Values and Responsibilities", "difficulty": "Medium", "sourceType": "Additional Practice Question"}, {"id": 227, "question": "Standard 8.2 expects a trainer to develop professionally mainly by:", "options": ["Working in isolation from other trainers", "Conducting research and participating in professional learning activities and communities", "Focusing only on administrative paperwork", "Avoiding feedback from trainees and colleagues"], "correctAnswer": "B", "explanation": "Additional Practice Question — not from source bank. Grounded directly in Standard 8.2: \"Conduct research and participate in professional learning activities and communities.\"", "category": "Professional Values and Responsibilities", "domain": "Professional Values and Responsibilities", "difficulty": "Medium", "sourceType": "Additional Practice Question"}, {"id": 228, "question": "Per Standard 8.3, a trainer's professional development plan should be prepared and followed up mainly based on:", "options": ["Randomly chosen topics with no analysis", "Feedback and practice analysis", "Trainee attendance numbers only", "The training center's marketing calendar"], "correctAnswer": "B", "explanation": "Additional Practice Question — not from source bank. Grounded directly in Standard 8.3: \"Prepare, employ, and follow up professional development plans based on feedback and practice analysis.\"", "category": "Professional Values and Responsibilities", "domain": "Professional Values and Responsibilities", "difficulty": "Medium", "sourceType": "Additional Practice Question"}, {"id": 229, "question": "A trainer is designing a leadership module for senior supervisors. Instead of delivering a standard lecture on project management principles, the trainer asks participants to analyze a real, failed project from their own department and construct a new workflow based on their past operational experience. Which learning theory is the trainer primarily applying?", "options": ["Behaviourism", "Cognitivism", "Constructivism", "Social Learning Theory"], "correctAnswer": "C", "explanation": "Constructivism asserts that learners build new knowledge upon their existing knowledge and prior experiences rather than passively receiving information. By analyzing past operational failures and constructing new workflows, trainees actively construct understanding. Constructivism = Building knowledge from experience; Behaviourism = Stimulus-response conditioning; Cognitivism = Internal mental processing.", "category": "Learning Theories", "domain": "Professional Knowledge", "difficulty": "Medium", "sourceType": "Main Exam 2"}, {"id": 230, "question": "During a safety training session for technical staff, a trainer demonstrates the exact procedure for calibrating heavy machinery. The trainees observe the demonstration, rehearse the steps mentally, and then successfully perform the calibration under supervision. According to Bandura’s Social Learning Theory, which sequence BEST represents the process demonstrated in this scenario?", "options": ["Observation → Modelling → Imitation", "Conditioning → Reinforcement → Retention", "Concrete Experience → Abstract Thinking → Testing", "Context → Input → Reaction"], "correctAnswer": "A", "explanation": "Bandura’s Social Learning Theory emphasizes that learning occurs through observing others, modeling their behavior, and imitating the observed actions. Bandura = Observation + Modelling + Imitation.", "category": "Social Learning Theory", "domain": "Professional Knowledge", "difficulty": "Medium", "sourceType": "Main Exam 2"}, {"id": 231, "question": "A trainer utilizes an automated quiz system where trainees immediately receive positive verbal feedback and extra practice points each time they select a correct answer, leading to an increase in desired study habits. In Skinner’s Behaviourist framework, this instructional technique relies on:", "options": ["Negative Reinforcement", "Positive Reinforcement", "Positive Punishment", "Extinction"], "correctAnswer": "B", "explanation": "In Skinner’s Operant Conditioning, positive reinforcement involves presenting a rewarding stimulus (praise/points) immediately following a desired behavior to increase the frequency of that behavior. Positive Reinforcement = Adding a pleasant stimulus to increase behavior.", "category": "Behaviourism", "domain": "Professional Knowledge", "difficulty": "Easy", "sourceType": "Main Exam 2"}, {"id": 232, "question": "A group of trainees completes a complex data analysis exercise. Before moving to new theoretical content, the trainer asks them to write a journal entry reflecting on what challenges they encountered, what strategies worked, and how their thinking changed during the exercise. According to Kolb’s Experiential Learning Cycle, which stage are the trainees experiencing?", "options": ["Concrete Experience", "Abstract Conceptualisation", "Active Experimentation", "Reflective Observation"], "correctAnswer": "D", "explanation": "Kolb’s Experiential Learning Cycle consists of four stages: Concrete Experience (doing), Reflective Observation (reflecting on the experience), Abstract Conceptualisation (learning from the experience/theorizing), and Active Experimentation (trying out what was learned). Reflecting on challenges and changed thinking fits Reflective Observation. Concrete = Do; Reflective = Observe/Reflect; Abstract = Think/Theorize; Active = Test/Apply.", "category": "Experiential Learning", "domain": "Professional Knowledge", "difficulty": "Medium", "sourceType": "Main Exam 2"}, {"id": 233, "question": "Following a session on customer service protocols, trainees are given a new, unscripted scenario and instructed to test out different communication strategies to see which yields the highest customer satisfaction score. In Kolb’s model, this activity corresponds to:", "options": ["Concrete Experience", "Reflective Observation", "Active Experimentation", "Abstract Conceptualisation"], "correctAnswer": "C", "explanation": "Active Experimentation in Kolb's model involves applying theories or new ideas to real-world situations or new practical tests to see how they function. Active Experimentation = Testing new strategies in practical scenarios.", "category": "Experiential Learning", "domain": "Professional Knowledge", "difficulty": "Medium", "sourceType": "Main Exam 2"}, {"id": 234, "question": "An organization is updating its adult learning strategy. The instructional designer insists that adult learners must be involved in the pl
