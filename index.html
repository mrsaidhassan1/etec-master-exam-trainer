Professional Practices", "difficulty": "Medium", "sourceType": "Main Exam 2"}, {"id": 272, "question": "A trainer receives the confidential assessment scores and performance records of a cohort of trainees. A department manager who is not involved in the training program asks the trainer to share the full grade spreadsheet via informal messaging. What should the trainer do?", "options": ["Send the full spreadsheet immediately to build good workplace relations.", "Decline the request politely, adhering to data privacy rules and official organizational protocol regarding personal assessment data.", "Post the grade spreadsheet publicly on the company intranet board.", "Delete all assessment records so no one can access them."], "correctAnswer": "B", "explanation": "Trainers are ethically bound to protect trainee assessment data and privacy, sharing records only through authorized official channels with legitimate stakeholders. Confidentiality = Protecting personal learner assessment data from unauthorized access.", "category": "Data Privacy & Ethics", "domain": "Professional Values and Responsibilities", "difficulty": "Medium", "sourceType": "Main Exam 2"}, {"id": 273, "question": "During a practical assessment, a trainer notices that a close personal friend participating in the course made several critical errors on a required task. How should the trainer evaluate the performance?", "options": ["Objectively grade the performance according to the established rubric, maintaining absolute professional impartiality and fairness.", "Ignore the errors and award a perfect score due to their personal friendship.", "Mark all other trainees down so the friend receives the highest relative rank.", "Pass the friend but refuse to provide any written performance feedback."], "correctAnswer": "A", "explanation": "Trainers must maintain professional objectivity and eliminate personal bias, evaluating all trainees strictly according to established assessment criteria regardless of personal relationships. Impartiality = Objective application of criteria free from personal bias.", "category": "Impartiality & Fairness", "domain": "Professional Values and Responsibilities", "difficulty": "Medium", "sourceType": "Main Exam 2"}, {"id": 274, "question": "A trainer is designing training materials for a diverse international cohort representing various cultural backgrounds and physical abilities. What principle should guide the trainer’s material design?", "options": ["Universal design, cultural sensitivity, equity, and respect for learner differences.", "Relying exclusively on colloquial idioms and localized cultural jokes.", "Using small, unreadable font sizes and non-accessible media formats.", "Designing content strictly for the majority demographic group."], "correctAnswer": "A", "explanation": "Professional standards mandate inclusive instructional design that respects cultural diversity, provides accessibility, and ensures equitable learning opportunities. Equity & Inclusion = Respect for diversity and accessible material design.", "category": "Inclusion & Diversity", "domain": "Professional Values and Responsibilities", "difficulty": "Easy", "sourceType": "Main Exam 2"}, {"id": 275, "question": "A trainee privately confides in the trainer that personal stressors at home are severely impacting their concentration during practical exercises. How should the trainer respond professionally?", "options": ["Share the trainee's personal story with the entire class as an example of stress management.", "Listen empathetically, maintain strict confidentiality, and offer guidance on available organizational support services or reasonable course accommodations.", "Tell the trainee that personal problems have no place in training and command them to leave.", "Ignore the trainee completely and walk away."], "correctAnswer": "B", "explanation": "Trainers should handle personal disclosures with professional empathy and strict confidentiality, guiding trainees toward official support channels. Supportive Conduct = Empathetic, confidential handling + referral to support services.", "category": "Trainee Support & Ethics", "domain": "Professional Values and Responsibilities", "difficulty": "Medium", "sourceType": "Main Exam 2"}, {"id": 276, "question": "A trainer is preparing a presentation deck for an upcoming commercial workshop. The trainer finds a comprehensive diagram and theoretical framework in a published textbook. How should the trainer handle this intellectual property?", "options": ["Copy the diagram directly into the presentation without attribution, claiming original authorship.", "Appropriately cite the source, respect copyright requirements, and obtain necessary permissions before commercial distribution.", "Alter the background colors of the image and pretend it is original work.", "Never use any visual diagrams in training presentations."], "correctAnswer": "B", "explanation": "Academic and professional integrity requires trainers to respect intellectual property rights, attribute copyrighted models properly, and adhere to usage permissions. Intellectual Property = Proper citation and respect for copyright.", "category": "Intellectual Property", "domain": "Professional Values and Responsibilities", "difficulty": "Easy", "sourceType": "Main Exam 2"}, {"id": 277, "question": "A trainer is invited to join a social messaging group created by trainees for informal weekend socializing during an ongoing multi-week course. How should the trainer maintain appropriate professional boundaries?", "options": ["Join every social event and share personal confidential work matters with trainees.", "Maintain professional boundaries, politely clarifying that communication channels should remain focused on professional and learning-related support.", "Use the social channel to criticize organizational management.", "Block all trainees from sending any official course-related emails."], "correctAnswer": "B", "explanation": "Trainers must maintain professional boundaries, avoiding informal situations that could create conflicts of interest or perceived favoritism. Professional Boundaries = Maintaining professional limits in trainer-trainee relationships.", "category": "Professional Boundaries", "domain": "Professional Values and Responsibilities", "difficulty": "Medium", "sourceType": "Main Exam 2"}, {"id": 278, "question": "During a group exercise, two trainees engage in a heated personal argument regarding workplace responsibilities, disturbing the surrounding groups. What action should the trainer take FIRST?", "options": ["Intervene calmly, de-escalate the tension, separate the individuals if necessary, and re-focus their discussion on the professional exercise guidelines.", "Side with whichever trainee has higher corporate seniority.", "Join the argument and express personal frustration.", "Cancel the entire workshop for all participants immediately."], "correctAnswer": "A", "explanation": "When interpersonal conflicts erupt, trainers must intervene promptly and neutrally, de-escalate emotional tension, and restore a safe, professional learning environment. Conflict De-escalation = Neutral, prompt intervention focused on safety and task re-alignment.", "category": "Conflict Resolution", "domain": "Professional Values and Responsibilities", "difficulty": "Hard", "sourceType": "Main Exam 2"}, {"id": 279, "question": "An experienced trainer completes a training delivery and notices that several trainees struggled with a newly introduced digital tool. What reflects a commitment to continuous professional development (CPD)?", "options": ["Blame the trainees for lacking technical intelligence and repeat the exact same lesson next time.", "Reflect on instructional delivery, seek feedback from peers, and refine facilitation strategies for future sessions.", "Avoid using digital tools in all future training sessions.", "File a formal complaint against the software manufacturer."], "correctAnswer": "B", "explanation": "Continuous Professional Development (CPD) relies on reflective practice, peer review, and continuous adaptation to improve instructional effectiveness. CPD = Self-reflection + feedback integration + continuous instructional improvement.", "category": "Continuous Professional Dev.", "domain": "Professional Values and Responsibilities", "difficulty": "Easy", "sourceType": "Main Exam 2"}, {"id": 280, "question": "Before administering a high-stakes practical certification exam, what is the trainer’s ethical responsibility regarding grading criteria?", "options": ["Keep the grading rubric completely secret so trainees are surprised.", "Change the passing score after the exam is finished without telling anyone.", "Clearly communicate the assessment objectives, performance criteria, and grading rubrics to trainees prior to the evaluation.", "Ensure that at least 50% of trainees fail the assessment regardless of performance."], "correctAnswer": "C", "explanation": "Assessment fairness requires transparency; trainees must know the evaluative criteria, standards, and rubrics before undertaking assessments. Transparency = Sharing assessment expectations and rubrics in advance.", "category": "Assessment Integrity", "domain": "Professional Values and Responsibilities", "difficulty": "Medium", "sourceType": "Main Exam 2"}, {"id": 281, "question": "A trainee submits a post-course evaluation containing harsh, critical comments about the trainer's instructional pacing. How should the professional trainer process this feedback?", "options": ["Contact the trainee to confront and argue with them directly.", "Analyze the feedback objectively, identify potential areas for instructional improvement, and maintain professional composure.", "File a lawsuit against the trainee for defamation.", "Discard all negative evaluations and keep only positive ones."], "correctAnswer": "B", "explanation": "Professional trainers view evaluation feedback objectively as valuable data for continuous self-improvement rather than personal attacks. Constructive Processing = Analyzing feedback objectively for professional growth.", "category": "Processing Feedback", "domain": "Professional Values and Responsibilities", "difficulty": "Medium", "sourceType": "Main Exam 2"}, {"id": 282, "question": "A trainee with a mobility impairment registers for a hands-on technical workshop located in a facility without ramp access. What should the training organizer do?", "options": ["Cancel the trainee's registration immediately.", "Tell the trainee to arrange their own equipment transport.", "Proactively make necessary accessibility accommodations or relocate the session to an accessible facility to ensure equitable participation.", "Require the trainee to complete an unrelated theoretical essay at home instead."], "correctAnswer": "C", "explanation": "Organizational and trainer ethics require providing physical and instructional accessibility accommodations to ensure equitable learning access for all participants. Accessibility = Removing physical/instructional barriers for trainees with disabilities.", "category": "Accessibility & Equity", "domain": "Professional Values and Responsibilities", "difficulty": "Hard", "sourceType": "Main Exam 2"}, {"id": 283, "question": "An instructor is asked by a corporate client to skip mandatory safety compliance modules in order to shorten the course length by two hours. What should the instructor do?", "options": ["Agree immediately without informing the safety board.", "Politely refuse to compromise core safety standards, explaining the legal, ethical, and professional necessity of completing mandatory compliance content.", "Skip the modules and forge trainees' completion signatures.", "Leave the training room and abandon the assignment without notice."], "correctAnswer": "B", "explanation": "Trainers must uphold compliance, safety, and ethical standards, refusing client or management requests to eliminate essential mandatory safety components. Uncompromising Integrity = Upholding professional compliance and safety mandates.", "category": "Compliance & Ethics", "domain": "Professional Values and Responsibilities", "difficulty": "Hard", "sourceType": "Main Exam 2"}, {"id": 284, "question": "When reporting final course outcomes and attendance metrics to an organizational oversight board, what value must the assessment specialist uphold?", "options": ["Subjectivity and flattering exaggeration.", "Honesty, accuracy, and reporting data integrity without manipulation.", "Selectively omitting scores of low-performing employees.", "Fabricating high attendance numbers to secure future funding."], "correctAnswer": "B", "explanation": "Evaluation reporting requires uncompromising data integrity, accurate metrics, and transparent communication of true training outcomes. Reporting Integrity = Honest and unmanipulated representation of data.", "category": "Reporting Integrity", "domain": "Professional Values and Responsibilities", "difficulty": "Easy", "sourceType": "Main Exam 2"}, {"id": 285, "question": "During a open discussion on leadership styles, a trainee expresses an opinion that differs significantly from the trainer's personal view. What is the MOST appropriate professional response?", "options": ["Ridicule the trainee's opinion in front of the group.", "Respect the trainee's perspective, encourage constructive dialogue, and evaluate ideas based on evidence and objective merits.", "Expel the trainee from the classroom for disrespect.", "Immediately change the subject and refuse to let anyone else speak."], "correctAnswer": "B", "explanation": "Respect for trainees involves fostering an open intellectual environment where differing viewpoints are discussed respectfully and evaluated objectively. Respect for Trainees = Encouraging open, respectful intellectual dialogue.", "category": "Respecting Diversity of Thought", "domain": "Professional Values and Responsibilities", "difficulty": "Medium", "sourceType": "Main Exam 2"}, {"id": 286, "question": "A trainer faces unexpected equipment failure ten minutes before a major presentation to executive stakeholders. What behavior demonstrates professional decorum and resilience?", "options": ["Panic, shout at facility staff, and cancel the event.", "Maintain emotional composure, activate a contingency delivery plan, and proceed professionally using alternative instructional resources.", "Blame the audience for arriving on time.", "Sit quietly and wait for someone else to fix the problem without communicating."], "correctAnswer": "B", "explanation": "Professional resilience entails remaining calm during unexpected technical failures and seamlessly shifting to backup instructional contingency plans. Resilience = Composure + executing backup contingency plans smoothly.", "category": "Professional Resilience", "domain": "Professional Values and Responsibilities", "difficulty": "Medium", "sourceType": "Main Exam 2"}, {"id": 287, "question": "Two trainers are co-facilitating a large corporate leadership seminar. During a break, one trainer notices that the co-facilitator missed a crucial compliance procedure during their demonstration. How should this be addressed?", "options": ["Interrupt and humiliate the co-facilitator publicly in front of the participants.", "Discuss the omission privately and respectfully during the break, collaborating on a smooth way to clarify the procedure upon resuming.", "Ignore the compliance error completely, putting trainees at risk.", "Report the co-facilitator to corporate legal authorities without speaking to them first."], "correctAnswer": "B", "explanation": "Peer collaboration requires professional respect and mutual support; corrections should be handled privately and constructively to maintain instructional coherence and mutual dignity. Co-Facilitation Ethics = Private, respectful peer collaboration and mutual support.", "category": "Peer Collaboration Ethics", "domain": "Professional Values and Responsibilities", "difficulty": "Hard", "sourceType": "Main Exam 2"}, {"id": 288, "question": "An organization needs to deliver compliance training to 500 geographically dispersed employees working across multiple time zones. The learners require the flexibility to complete training modules at their own speed while maintaining busy operational shifts. Which delivery modality is MOST appropriate?", "options": ["Synchronous Classroom Seminars", "Asynchronous Online Learning", "Daily Live Video Webinars", "In-Person Workshops"], "correctAnswer": "B", "explanation": "Asynchronous learning allows self-paced study across different geographical locations and time zones, fitting around shift schedules. Asynchronous = Different times / self-paced learning flexibility.", "category": "Digital Delivery Modalities", "domain": "Future Skills", "difficulty": "Easy", "sourceType": "Main Exam 2"}, {"id": 289, "question": "A corporate learning team designs a leadership program that combines self-paced digital modules on basic theories with live, interactive synchronous virtual workshops for role-playing and executive coaching. Which instructional model is being implemented?", "options": ["Blended Learning", "Pure Asynchronous Learning", "Rote Distance Education", "Traditional Apprenticeship"], "correctAnswer": "A", "explanation": "Blended learning strategically integrates self-paced digital online content with live face-to-face or virtual synchronous sessions. Blended Learning = Combining digital asynchronous + live synchronous components.", "category": "Blended Learning", "domain": "Future Skills", "difficulty": "Easy", "sourceType": "Main Exam 2"}, {"id": 290, "question": "A training director wants to monitor learner completion rates, track assessment scores across regional branches, and automatically trigger reminders for overdue compliance certifications. Which digital system is BEST suited for these functions?", "options": ["Power BI Data Engine", "Learning Management System (LMS)", "Video Editing Suite", "Desktop Publishing Application"], "correctAnswer": "B", "explanation": "An LMS is an enterprise software platform designed specifically to deliver, track, document, and report educational courses and compliance progress. LMS = Managing, tracking, and reporting digital learning activities.", "category": "Educational Platforms (LMS)", "domain": "Future Skills", "difficulty": "Easy", "sourceType": "Main Exam 2"}, {"id": 291, "question": "A learning analytics team wants to aggregate training data from multiple corporate systems, create interactive visual dashboards, and analyze high-level trends in skill acquisition for executive leadership. Which tool is MOST suitable?", "options": ["Microsoft Word", "Power BI", "Google Scholar", "Virtual Breakout Rooms"], "correctAnswer": "B", "explanation": "Power BI is a data visualization software tool used to aggregate, analyze, and render dynamic visual analytics dashboards for enterprise data. Power BI = Advanced data visualization and analytics dashboard generation.", "category": "Data Visualization Tools", "domain": "Future Skills", "difficulty": "Medium", "sourceType": "Main Exam 2"}, {"id": 292, "question": "When sourcing external web-based resources and reference materials for an online course, an instructional designer must verify security and web data integrity. Which protocol indicates a secure, encrypted website connection?", "options": ["HTTP://", "HTTPS://", "FTP://", "SMTP://"], "correctAnswer": "B", "explanation": "HTTPS (Hypertext Transfer Protocol Secure) indicates that the communication protocol is encrypted using TLS/SSL for secure web data transmission. HTTPS = Encrypted secure web protocol.", "category": "Digital Security Protocols", "domain": "Future Skills", "difficulty": "Easy", "sourceType": "Main Exam 2"}, {"id": 293, "question": "An instructional designer is researching recent peer-reviewed empirical studies on cognitive load theory to ensure a new digital curriculum is grounded in modern evidence-based research. Which digital search tool is MOST specialized for retrieving scholarly academic literature?", "options": ["Commercial Search Engines", "Google Scholar", "Social Media Feeds", "Public Micro-blogs"], "correctAnswer": "B", "explanation": "Google Scholar is a specialized web search engine that indexes the full text or metadata of scholarly literature across publishing formats and disciplines. Google Scholar = Academic research and peer-reviewed literature retrieval.", "category": "Digital Research Literacy", "domain": "Future Skills", "difficulty": "Easy", "sourceType": "Main Exam 2"}, {"id": 294, "question": "A trainer uses a Generative Artificial Intelligence (AI) tool to help create diverse, complex workplace scenario prompts for an ethics workshop. What is an essential professional responsibility when using AI-generated content in course design?", "options": ["Copy and paste all AI output directly without verification or human review.", "Review, fact-check, curate, and refine AI-generated content to ensure accuracy, contextual relevance, and freedom from bias.", "Claim that the AI output was written by a famous academic scholar.", "Avoid using AI tools under any circumstances because they are illegal."], "correctAnswer": "B", "explanation": "Responsible use of AI requires human-in-the-loop validation, fact-checking, and editorial oversight to ensure accuracy and contextual appropriateness. AI Ethics = Human validation, fact-checking, and curation of output.", "category": "AI Ethics in Design", "domain": "Future Skills", "difficulty": "Hard", "sourceType": "Main Exam 2"}, {"id": 295, "question": "An online training course utilizes an AI-driven adaptive learning engine. How does an adaptive learning platform primarily benefit individual trainees?", "options": ["By replacing human trainers entirely and eliminating assessments.", "By dynamically adjusting content difficulty, learning pathways, and feedback based on the trainee's real-time performance data.", "By forcing all learners to move at the exact same fixed pace regardless of ability.", "By automatically issuing legal certifications without testing."], "correctAnswer": "B", "explanation": "Adaptive AI platforms personalize instruction by analyzing real-time learner response data and dynamically altering learning paths and task difficulty. Adaptive Learning = Personalizing pathways dynamically based on real-time learner data.", "category": "Adaptive AI Learning", "domain": "Future Skills", "difficulty": "Medium", "sourceType": "Main Exam 2"}, {"id": 296, "question": "An instructional designer wants to produce rapid, bite-sized visual explainers and interactive micro-learning modules for smartphone users. Which digital tool category is MOST appropriate?", "options": ["Heavy Database Software", "Multimedia Generation and Micro-learning Tools", "Spreadsheet Calculators", "Command-Line Editors"], "correctAnswer": "B", "explanation": "Micro-learning and multimedia generation software specialize in creating short, mobile-optimized visual assets, interactive videos, and bite-sized learning objects. Micro-learning Tools = Mobile-optimized, bite-sized visual content creation.", "category": "Micro-learning Tools", "domain": "Future Skills", "difficulty": "Medium", "sourceType": "Main Exam 2"}, {"id": 297, "question": "A virtual trainer notices declining participation during 2-hour synchronous online sessions. Which digital tool strategy would BEST restore active engagement?", "options": ["Turn off trainee chat features and prohibit questions.", "Integrate interactive real-time polling, whiteboards, and short breakout room exercises every 10–15 minutes.", "Extend the lecture duration to 3 hours without breaks.", "Play a pre-recorded audio file while turning off the video feed."], "correctAnswer": "B", "explanation": "Synchronous virtual engagement requires frequent active learner touchpoints (polling, whiteboards, breakout activities) every 10–15 minutes to sustain focus. Virtual Engagement = Interspersing frequent active digital interactions into lectures.", "category": "Virtual Classroom Engagement", "domain": "Future Skills", "difficulty": "Hard", "sourceType": "Main Exam 2"}, {"id": 298, "question": "An analytics report generated by a Learning Management System reveals that 80% of trainees drop out of an asynchronous video course during 30-minute lecture videos, but 95% complete 5-minute interactive video clips. What analysis and redesign strategy should the instructional designer apply?", "options": ["Make the videos longer and add mandatory attendance checks.", "Remove all video content and rely exclusively on text documents.", "Chunk lengthy content into short, micro-learning video segments interspersed with quick formative knowledge checks.", "Raise the course fees to force trainees to finish."], "correctAnswer": "C", "explanation": "Analytics showing drop-off during long videos indicate cognitive overload. Instructional design best practice dictates chunking content into short micro-learning modules. Micro-learning Chunking = Breaking long media into short segments with integrated checks.", "category": "Learning Analytics", "domain": "Future Skills", "difficulty": "Hard", "sourceType": "Main Exam 2"}, {"id": 299, "question": "A trainer handling digital trainee records, contact details, and test scores must store and transmit these records securely over digital networks. Which cybersecurity practice is MOST essential?", "options": ["Storing passwords on public sticky notes near shared computers.", "Encrypting sensitive data files and utilizing secure, authenticated organizational platforms.", "Sending unencrypted personal identification data via public Wi-Fi networks.", "Sharing account login credentials with external third-party vendors."], "correctAnswer": "B", "explanation": "Data protection in education requires encryption, secure authenticated platforms, and adherence to cybersecurity data management standards. Data Security = Encryption and secure authenticated access controls.", "category": "Cybersecurity in Education", "domain": "Future Skills", "difficulty": "Medium", "sourceType": "Main Exam 2"}, {"id": 300, "question": "A remote training program requires trainees located in four different countries to collaborate on a joint technical research report across different time zones. Which combination of digital tools is MOST effective?", "options": ["Physical mail and printed paper.", "Asynchronous cloud-based collaborative documents and project management workspaces.", "Mandatory daily 4-hour live phone calls at 2:00 AM local time.", "Individual offline notebooks without digital sharing."], "correctAnswer": "B", "explanation": "Cross-time-zone international collaboration relies on asynchronous cloud platforms (e.g., shared docs, task boards) allowing continuous contribution without forcing extreme live hours. Cross-Time-Zone Collaboration = Asynchronous cloud-based collaborative tools.", "category": "Digital Collaboration", "domain": "Future Skills", "difficulty": "Medium", "sourceType": "Main Exam 2"}, {"id": 301, "question": "An organization is undergoing digital transformation and requires employees to adapt rapidly to automated tools, analyze digital data, and collaborate virtually. What core future workforce capability is being prioritized?", "options": ["Manual Rote Processing", "Digital Literacy and Reskilling", "Paper-based Filing Operations", "Isolated Individual Work"], "correctAnswer": "B", "explanation": "Digital transformation requires workers to continually acquire digital literacy, master automated systems, and engage in continuous digital reskilling. Future Workforce = Continuous digital reskilling and technological adaptability.", "category": "Workforce Reskilling", "domain": "Future Skills", "difficulty": "Easy", "sourceType": "Main Exam 2"}, {"id": 302, "question": "During a live online webinar, a trainer wants to perform an instantaneous formative check to see if participants understand a complex technical concept before moving forward. Which digital tool feature is MOST rapid and effective?", "options": ["Sending a physical paper test via postal service.", "Launching a live 1-question digital poll with real-time aggregated results.", "Assigning a 2,000-word written essay due next week.", "Scheduling individual video interviews for the following day."], "correctAnswer": "B", "explanation": "Instantaneous digital polling provides immediate real-time aggregated feedback on participant understanding during live synchronous virtual instruction. Real-Time Checking = Live digital polls during synchronous sessions.", "category": "Interactive Digital Tools", "domain": "Future Skills", "difficulty": "Medium", "sourceType": "Main Exam 2"}, {"id": 303, "question": "A corporate training unit is transitioning from static PDF manuals to interactive, gamified digital learning experiences. What is the PRIMARY instructional benefit of adopting these modern digital learning technologies?", "options": ["Increasing instructional costs and delivery complexity.", "Enhancing learner engagement, active participation, retention, and immediate feedback loops.", "Eliminating the need for clear learning objectives.", "Ensuring trainees spend more time reading passive text."], "correctAnswer": "B", "explanation": "Interactive and gamified educational technologies boost learner motivation, foster active learning, improve cognitive retention, and provide immediate formative feedback. EdTech Benefits = Active engagement, enhanced retention, and immediate feedback.", "category": "Educational Technology Impact", "domain": "Future Skills", "difficulty": "Medium", "sourceType": "Main Exam 2"}];

  { front: "Best response to a silent-but-attentive trainee?", back: "Gradually encourage participation through simple questions and small groups", note: "" },
  { front: "Best response to a distracted trainee?", back: "Use discreet non-verbal cues before public correction", note: "" },
  { front: "Best response to a mixed-ability group?", back: "Differentiate activities according to trainee needs", note: "" },
  { front: "What does Knowles' andragogy emphasize about adult learning?", back: "Relevant, practical, problem-centered learning that uses prior experience and supports autonomy.", note: "Adults ask: Why does this matter to me?  [Professional Knowledge]" },
  { front: "Why should a trainer invite adults to connect a new procedure with previous work experience?", back: "Prior experience is a resource for adult learning.", note: "Start with experience.  [Professional Knowledge]" },
  { front: "Which learning theory emphasizes observable behavior, reinforcement, repetition, and practice?", back: "Behaviorism.", note: "Behaviorism: observe the behavior.  [Professional Knowledge]" },
  { front: "A trainer praises correct safety performance, and trainees repeat it more often. Which principle is illustrated?", back: "Reinforcement in Skinner's operant conditioning.", note: "Reinforcement increases; punishment decreases.  [Professional Knowledge]" },
  { front: "Which theory focuses on attention, memory, information processing, and organization?", back: "Cognitivism.", note: "Cognition: how information is processed.  [Professional Knowledge]" },
  { front: "Which theory explains building new knowledge on existing knowledge and experience?", back: "Constructivism.", note: "Build new understanding on what is known.  [Professional Knowledge]" },
  { front: "A trainee observes an expert and then imitates the demonstrated procedure. Which theory applies?", back: "Bandura's Social Learning Theory.", note: "Bandura: watch a model.  [Professional Knowledge]" },
  { front: "What is the sequence of Kolb's Experiential Learning Cycle?", back: "Concrete Experience, Reflective Observation, Abstract Conceptualization, Active Experimentation.", note: "Do, reflect, think, try.  [Professional Knowledge]" },
  { front: "After a practical exercise, trainees discuss what happened and what they noticed. Which Kolb stage is this?", back: "Reflective Observation.", note: "Looking back means reflection.  [Professional Knowledge]" },
  { front: "Trainees derive a general principle from their reflections on a task. Which Kolb stage is this?", back: "Abstract Conceptualization.", note: "A lesson formed is a concept.  [Professional Knowledge]" },
  { front: "A trainee tests a lesson learned in a new workplace situation. Which Kolb stage applies?", back: "Active Experimentation.", note: "Try the idea.  [Professional Knowledge]" },
  { front: "Why can an overly complex simulation weaken learning?", back: "It can overload working memory.", note: "Challenge should not become overload.  [Professional Knowledge]" },
  { front: "A beginner struggles with a dense explanation. What changes can reduce extraneous cognitive load?", back: "Remove unnecessary detail, split content into manageable parts, and use clear examples.", note: "Remove clutter; sequence clearly.  [Professional Knowledge]" },
  { front: "What three actions define self-regulated learning in the study guide?", back: "Plan, monitor, and evaluate one's own learning.", note: "Plan, monitor, evaluate.  [Professional Knowledge]" },
  { front: "What trainee differences should inform a trainer's understanding of learning needs?", back: "Age-related characteristics, individual differences, backgrounds, prior experience, and learning styles.", note: "Know the trainees before choosing support.  [Professional Knowledge]" },
  { front: "What does Keller's ARCS Motivation Model stand for?", back: "Attention, Relevance, Confidence, Satisfaction.", note: "ARCS: interest, purpose, belief, reward.  [Professional Knowledge]" },
  { front: "Which three needs support motivation in Self-Determination Theory?", back: "Autonomy, competence, and relatedness.", note: "Choice, capability, connection.  [Professional Knowledge]" },
  { front: "What links drive motivation in Vroom's Expectancy Theory as described in the guide?", back: "Effort leads to performance; performance leads to outcomes; those outcomes are valued.", note: "Effort to performance to valued outcome.  [Professional Knowledge]" },
  { front: "What kinds of goals support performance in Goal Setting Theory?", back: "Specific, challenging, accepted goals combined with feedback.", note: "Clear challenge plus feedback.  [Professional Knowledge]" },
  { front: "What are Learning Outcomes in the official terminology?", back: "Statements of the knowledge, skills, and values trainees should know, understand, do, and practice after training.", note: "Know, understand, do, practice.  [Professional Knowledge]" },
  { front: "What components make up Training Experiences?", back: "Training content, strategies, activities, and evaluations directed toward learning outcomes.", note: "Content, strategy, activity, evaluation.  [Professional Knowledge]" },
  { front: "What are Supporting Materials, and what are some official examples?", back: "Materials that assist training delivery, such as images, instructional videos, and simulations.", note: "Materials support learning delivery.  [Professional Knowledge]" },
  { front: "What does ADDIE stand for?", back: "Analysis, Design, Development, Implementation, Evaluation.", note: "Analyze before designing.  [Professional Knowledge]" },
  { front: "How do ADDIE Design and Development differ?", back: "Design specifies the learning plan; Development produces the materials and tools.", note: "Design specifies; Development produces.  [Professional Knowledge]" },
  { front: "Is ADDIE Evaluation limited to a final check after delivery?", back: "No. Evaluation can be formative during the process and summative after implementation.", note: "Evaluate during and after.  [Professional Knowledge]" },
  { front: "What is the sequence in Understanding by Design (UbD)?", back: "Identify desired results, determine acceptable evidence, then plan learning experiences and instruction.", note: "Results, evidence, experiences.  [Professional Knowledge]" },
  { front: "How does the Dick and Carey Systems Approach view instruction?", back: "As an integrated system connecting goals, learners, context, activities, assessment, and revision.", note: "Connected parts form a system.  [Professional Knowledge]" },
  { front: "What does Merrill's First Principles of Instruction emphasize?", back: "Problem-centered instruction with activation, demonstration, application, and integration.", note: "Activate, demonstrate, apply, integrate.  [Professional Knowledge]" },
  { front: "What are Gagne's Nine Events of Instruction, in order?", back: "Gain attention; inform learners of objectives; stimulate recall; present content; provide guidance; elicit performance; provide feedback; assess performance; enhance retention and transfer.", note: "Attention and recall prepare; practice and transfer consolidate.  [Professional Knowledge]" },
  { front: "How does the official glossary define E-Training?", back: "Training using ICT tools and applications to access and interact with content, trainers, and trainees, synchronously or asynchronously.", note: "ICT enables access and interaction.  [Professional Knowledge]" },
  { front: "Trainer and trainees join a live online class together. What training pattern is this?", back: "Synchronous online training.", note: "Synchronous: same time.  [Professional Knowledge]" },
  { front: "Trainees access recorded materials at different times and work at their own pace. What pattern is this?", back: "Asynchronous online training.", note: "Asynchronous: different times.  [Professional Knowledge]" },
  { front: "What is blended training in the study guide?", back: "A combination of face-to-face and online learning.", note: "Blend in-person and online.  [Professional Knowledge]" },
  { front: "Which two forms of direct training are named in Standard 2.1.1?", back: "Theoretical and practical training.", note: "Direct training includes theory and practice.  [Professional Knowledge]" },
  { front: "What factors should guide selection of a training method?", back: "Learning outcomes, trainee characteristics, skill complexity, time, resources, delivery mode, and the type of change required.", note: "Outcome first; method follows.  [Professional Knowledge]" },
  { front: "Which method suits introducing substantial theoretical information to a very large audience in limited time?", back: "Lecture or interactive lecture.", note: "Efficient information is not proof of skill.  [Professional Knowledge]" },
  { front: "Trainees rehearse a difficult customer conversation by acting as customer and employee. Which method is this?", back: "Role play.", note: "Act a role to practise interaction.  [Professional Knowledge]" },
  { front: "Which method lets trainees practise a realistic hazardous task in a controlled setting?", back: "Simulation.", note: "Realistic practice, controlled risk.  [Professional Knowledge]" },
  { front: "What is a case study especially useful for?", back: "Realistic analysis, decision-making, and applying concepts to a context.", note: "Analyze the case.  [Professional Knowledge]" },
  { front: "How do problem-based and project-based learning differ in emphasis?", back: "Problem-based learning emphasizes solving realistic problems and justifying decisions; project-based learning emphasizes producing an applied output.", note: "Problem: justify a solution. Project: produce an output.  [Professional Knowledge]" },
  { front: "How does coaching differ from mentoring in the study guide?", back: "Coaching gives personalized performance support; mentoring gives experienced guidance for development and professional growth.", note: "Coach performance; mentor development.  [Professional Knowledge]" },
  { front: "When is diagnostic evaluation used, and what does it identify?", back: "Before training, to identify starting knowledge, strengths, and gaps.", note: "Diagnostic: starting point.  [Professional Knowledge]" },
  { front: "What is the purpose of formative evaluation?", back: "Monitor progress during training and improve learning while it is happening.", note: "Formative: improve during learning.  [Professional Knowledge]" },
  { front: "What does final or summative evaluation judge?", back: "Achievement of learning outcomes at the end of training.", note: "Final: judge achievement.  [Professional Knowledge]" },
  { front: "How do validity and reliability differ?", back: "Validity concerns measuring what is intended; reliability concerns consistent results under similar conditions.", note: "Valid: right target. Reliable: consistent result.  [Professional Knowledge]" },
  { front: "How does a rubric differ from a checklist?", back: "A rubric defines criteria and performance levels; a checklist records whether specified steps or behaviors are present.", note: "Rubric: quality levels. Checklist: present or absent.  [Professional Knowledge]" },
  { front: "How do performance-based and competency-based assessment differ in emphasis?", back: "Performance-based assessment tests skill application; competency-based assessment judges demonstration against a required competency standard.", note: "Performance applies; competency meets a standard.  [Professional Knowledge]" },
  { front: "What are Kirkpatrick's Four Levels of Training Evaluation?", back: "Reaction, Learning, Behavior, Results.", note: "Like it, learn it, use it, impact it.  [Professional Knowledge]" },
  { front: "What does CIRO stand for?", back: "Context, Input, Reaction, Outcome.", note: "The R is Reaction.  [Professional Knowledge]" },
  { front: "Which two labels distinguish CIPP from CIRO after Context and Input?", back: "CIPP uses Process and Product; CIRO uses Reaction and Outcome.", note: "CIPP: Process/Product. CIRO: Reaction/Outcome.  [Professional Knowledge]" },
  { front: "What is a training need?", back: "A gap between current and desired performance that training can address.", note: "A gap must be trainable.  [Professional Practices]" },
  { front: "Employees know a procedure but cannot follow it because equipment is unavailable. What should the trainer recommend first?", back: "Address the equipment or resource problem.", note: "Fix the cause of the gap.  [Professional Practices]" },
  { front: "What does organizational-level needs analysis examine?", back: "Strategy, overall performance, KPIs, quality, complaints, productivity, and strategic goals.", note: "Organization: the wider performance picture.  [Professional Practices]" },
  { front: "What does task/job-level needs analysis examine?", back: "Duties, competencies, procedures, standards, and expected performance for a role.", note: "Task: what the job requires.  [Professional Practices]" },
  { front: "What does individual-level needs analysis compare?", back: "Each person's performance with the expected standard.", note: "Individual: who needs what?  [Professional Practices]" },
  { front: "Which methods can provide evidence for Training Needs Analysis?", back: "Observation, interviews, questionnaires, focus groups, performance data, skills-gap analysis, document review, and stakeholder input.", note: "Use evidence from more than one angle.  [Professional Practices]" },
  { front: "How does Root Cause Analysis extend Performance Gap Analysis?", back: "Gap analysis compares actual and desired performance; root cause analysis investigates the underlying causes.", note: "Gap asks what differs; root cause asks why.  [Professional Practices]" },
  { front: "What should a comprehensive training plan establish under Standard 3.1?", back: "Needs and objectives, prospects and challenges, emergency alternatives, priorities, implementation methods, and achievement indicators.", note: "Needs, priorities, methods, indicators.  [Professional Practices]" },
  { front: "A practical session depends on equipment that may fail. What should be planned beforehand?", back: "An alternative method for the emergency situation that still supports the intended outcomes.", note: "Plan the alternative before the disruption.  [Professional Practices]" },
  { front: "A trainer starts making slides before investigating the performance problem. Which ADDIE step has been skipped?", back: "Analysis.", note: "Needs before slides.  [Professional Practices]" },
  { front: "Why can Human Performance Improvement recommend solutions other than training?", back: "It examines performance problems systemically.", note: "Training is one possible intervention.  [Professional Practices]" },
  { front: "What must be aligned when designing training experiences?", back: "Learning outcomes, content, strategies, activities, resources, and evaluation tools, informed by trainee needs and labor market requirements.", note: "Outcome, activity, evidence must connect.  [Professional Practices]" },
  { front: "Which two wider aims should high-expectation learning outcomes support?", back: "Future skills and employability.", note: "Future skills support future work.  [Professional Practices]" },
  { front: "What does Employability mean in the official glossary?", back: "Knowledge, skills, and values that qualify a trainee for a paid job.", note: "Knowledge, skills, values for work.  [Professional Practices]" },
  { front: "Why is 'identify three hazards' more useful as an objective than 'understand safety'?", back: "It describes an observable, measurable action.", note: "Choose an action you can observe.  [Professional Practices]" },
  { front: "What is the sequence of Bloom's Revised Taxonomy?", back: "Remember, Understand, Apply, Analyze, Evaluate, Create.", note: "Recall to creation.  [Professional Practices]" },
  { front: "An outcome requires trainees to perform a procedure. What evidence should the trainer design for?", back: "A practical demonstration or performance task that measures the procedure.", note: "A performance outcome needs performance evidence.  [Professional Practices]" },
  { front: "What resources should be identified when designing training?", back: "Core and supplementary resources, supporting materials, and necessary equipment.", note: "Plan essentials and enrichment.  [Professional Practices]" },
  { front: "A trainer knows the desired outcome. In UbD, what should be decided before choosing activities?", back: "Acceptable evidence that the outcome has been achieved.", note: "Evidence before activities.  [Professional Practices]" },
  { front: "What is transfer of training, and what design choices support it?", back: "Applying learning at work; practical job-related tasks, managerial support, follow-up, and feedback support transfer.", note: "Learn it, then use it at work.  [Professional Practices]" },
  { front: "What elements belong in a training session plan?", back: "Objectives, content, time allocation, methods, activities, supporting materials, and evaluation tools.", note: "Plan content, time, practice, evidence.  [Professional Practices]" },
  { front: "How does the official concept of Well-Being relate to the training environment?", back: "A safe, stimulating environment supports knowledge, abilities, social relationships, and confidence in expressing ideas.", note: "Safety and confidence support participation.  [Professional Practices]" },
  { front: "A planned practical activity presents an unmanaged safety risk. What should guide the trainer's response?", back: "Apply occupational and health safety practices before proceeding with the activity.", note: "Safe practice comes before task completion.  [Professional Practices]" },
  { front: "What learner behaviors should a stimulating environment encourage under Standard 4.1?", back: "Research, active learning, innovation, collaboration, and positive participation.", note: "Engage trainees in doing and investigating.  [Professional Practices]" },
  { front: "A trainee rarely speaks in whole-group discussion. What supportive approaches does the guide suggest?", back: "Low-pressure questions, pair work, and small-group activities.", note: "Start small to build participation.  [Professional Practices]" },
  { front: "A trainee repeatedly dominates discussion. How can the trainer respond constructively?", back: "Give the trainee a useful role while politely managing participation time.", note: "Channel participation and protect time.  [Professional Practices]" },
  { front: "A trainee doubts that the course is useful. What is the recommended response?", back: "Listen, acknowledge concerns, and connect the training to practical benefits.", note: "Listen, acknowledge, connect to work.  [Professional Practices]" },
  { front: "What should the opening of a training session clarify?", back: "Objectives, relevance, expectations, and ground rules.", note: "Purpose and expectations first.  [Professional Practices]" },
  { front: "What kind of learning should trainee-centered strategies support under Indicator 4.2.1?", back: "Continuous self-learning.", note: "Support learning beyond the session.  [Professional Practices]" },
  { front: "A group includes beginners and experienced trainees. What should guide activity adaptation?", back: "Different abilities, tendencies, and needs while maintaining the targeted learning outcomes.", note: "Adapt the route to the outcome.  [Professional Practices]" },
  { front: "Why should practical training activities align with the labor market?", back: "To facilitate transfer of training impact.", note: "Practise what work requires.  [Professional Practices]" },
  { front: "A trainer has strong activities but repeatedly runs out of time. Which implementation requirement needs attention?", back: "Organize and manage activities according to a timed training plan.", note: "Good activities still need time control.  [Professional Practices]" },
  { front: "What should the closing of a session accomplish?", back: "Summarize learning, check understanding, and link training to application.", note: "Summarize, check, apply.  [Professional Practices]" },
  { front: "With 60 available training days and 3 days per program, how many programs fit if there are no gaps or overlaps?", back: "20 programs.", note: "Total days divided by days per program.  [Professional Practices]" },
  { front: "Which evaluation types provide information before, during, and at the end of training?", back: "Diagnostic, formative, and final evaluation, respectively.", note: "Before, during, final.  [Professional Practices]" },
  { front: "A mid-session check reveals a common misunderstanding. What should the trainer do with this evidence?", back: "Adjust instruction and provide feedback while learning is still in progress.", note: "Use the evidence now.  [Professional Practices]" },
  { front: "Why include tools that let trainees self-evaluate and track progress?", back: "To support continuous development and awareness of their own performance.", note: "Trainees should see their own progress.  [Professional Practices]" },
  { front: "What is the purpose of continuous feedback under Indicator 5.1.3?", back: "Guide the development of trainee performance.", note: "Feedback guides the next improvement.  [Professional Practices]" },
  { front: "A trainee completes a practical project demonstrating knowledge and skills. What type of assessment evidence is this?", back: "Performance-based assessment evidence.", note: "A practical output shows performance.  [Professional Practices]" },
  { front: "Trainees rate a course highly. Does this establish that they learned the required skills?", back: "No. It establishes positive reaction, not necessarily learning.", note: "Liking is not proof of learning.  [Professional Practices]" },
  { front: "A before-and-after test shows increased knowledge. Which Kirkpatrick level is being examined?", back: "Learning.", note: "Gains in knowledge mean Learning.  [Professional Practices]" },
  { front: "A follow-up observation checks whether employees apply training on the job. Which Kirkpatrick level is this?", back: "Behavior.", note: "On-the-job use means Behavior.  [Professional Practices]" },
  { front: "A training evaluation examines organizational productivity and error rates. Which Kirkpatrick level is its focus?", back: "Results.", note: "Organizational impact means Results.  [Professional Practices]" },
  { front: "What should the trainer do with evaluation data before drawing conclusions?", back: "Collect and organize the data and results, using available electronic training management systems.", note: "Organize before interpreting.  [Professional Practices]" },
  { front: "What should a documented training evaluation report lead to?", back: "Recommendations to improve trainees' future opportunities and training programs.", note: "Report findings to guide improvement.  [Professional Practices]" },
  { front: "What is the Phillips ROI formula in the study guide?", back: "ROI = (Program Benefits - Program Costs) / Program Costs x 100.", note: "Net benefit divided by cost, times 100.  [Professional Practices]" },
  { front: "A program has monetary benefits of 150,000 and costs of 100,000 in the same currency. What is its ROI?", back: "50%.", note: "Subtract costs before dividing.  [Professional Practices]" },
  { front: "Which evaluation model in the guide extends attention beyond the organization to societal impact?", back: "Kaufman Model.", note: "Kaufman looks beyond the organization.  [Professional Practices]" },
  { front: "Which evaluation model emphasizes alignment with organizational strategic priorities?", back: "Anderson Model.", note: "Anderson: strategic alignment.  [Professional Practices]" },
  { front: "A report claims organizational improvement based only on satisfaction forms. What is the weakness?", back: "The evidence measures Reaction but the conclusion claims Results.", note: "Match the claim to the evidence.  [Professional Practices]" },
  { front: "What ethical framework must trainers commit to under Indicator 6.1.1?", back: "The Professional Training Code of Ethics.", note: "Ethics applies throughout practice.  [Professional Values and Responsibilities]" },
  { front: "What does Indicator 6.1.2 require concerning training policies and regulations?", back: "Abide by the policies and regulations governing training in all practices.", note: "Professional practice follows governing rules.  [Professional Values and Responsibilities]" },
  { front: "What is the trainer's responsibility toward quality assurance?", back: "Abide by quality assurance systems and procedures in training.", note: "Quality needs a consistent process.  [Professional Values and Responsibilities]" },
  { front: "A shortcut conflicts with the Professional Training Code of Ethics but would save time. What should guide the decision?", back: "Maintain commitment to the Code of Ethics.", note: "Use ethics as the decision boundary.  [Professional Values and Responsibilities]" },
  { front: "A trainer delivers strong sessions but skips the required quality assurance process. Which responsibility is unmet?", back: "Compliance with quality assurance systems and procedures under 6.1.3.", note: "Good outcomes and sound processes both matter.  [Professional Values and Responsibilities]" },
  { front: "How do the three trainer levels broadly progress in the official standards?", back: "Level 1 applies basic knowledge and skills; Level 2 applies advanced skills and shares with colleagues; Level 3 produces knowledge and develops and trains trainers.", note: "Apply, share, develop others.  [Professional Values and Responsibilities]" },
  { front: "What does Standard 6.2 require trainers to understand and respect?", back: "Professional rights, duties, discipline, and responsibilities.", note: "Rights come with duties.  [Professional Values and Responsibilities]" },
  { front: "What behaviors demonstrate diligence under Indicator 6.2.2?", back: "Taking responsibility, managing training, and completing tasks on time.", note: "Own the task and meet the time.  [Professional Values and Responsibilities]" },
  { front: "A trainer repeatedly submits required work late despite agreed deadlines. Which indicator is directly relevant?", back: "6.2.2: diligence, responsibility, training management, and timely task completion.", note: "Responsibility includes timeliness.  [Professional Values and Responsibilities]" },
  { front: "A trainer delegates an activity and then ignores whether it is completed. What professional principle should guide follow-up?", back: "Responsibility for managing training and completing assigned duties.", note: "Delegation still needs follow-through.  [Professional Values and Responsibilities]" },
  { front: "When resolving a disagreement about a trainer's duties, what should be considered alongside the duties?", back: "The trainer's professional rights.", note: "Consider both sides of responsibility.  [Professional Values and Responsibilities]" },
  { front: "What national commitment is stated in Indicator 7.1.1?", back: "Loyalty and devotion to country and leadership in professional practices.", note: "7.1 includes citizenship values.  [Professional Values and Responsibilities]" },
  { front: "Which forms of diversity does Indicator 7.1.2 explicitly name?", back: "Cultural, social, and economic diversity.", note: "Culture, society, economic background.  [Professional Values and Responsibilities]" },
  { front: "Trainees express different cultural viewpoints during a relevant discussion. What professional values should the trainer demonstrate?", back: "Tolerance, moderation, acceptance of others, and respect for diversity.", note: "Respect differences in professional dialogue.  [Professional Values and Responsibilities]" },
  { front: "Which three expectations guide treatment of trainees under Indicator 7.1.3?", back: "Objectivity, fairness, and equal opportunity.", note: "Objective, fair, open opportunity.  [Professional Values and Responsibilities]" },
  { front: "A trainer prefers one trainee personally. How should that affect evaluation decisions?", back: "It should not replace objective, fair treatment.", note: "Judge performance, not preference.  [Professional Values and Responsibilities]" },
  { front: "Only the most confident trainees are offered development opportunities. Which value should prompt a review?", back: "Equal opportunity.", note: "Visibility is not entitlement.  [Professional Values and Responsibilities]" },
  { front: "How do respecting diversity and ensuring fairness complement each other?", back: "Respecting diversity recognizes different backgrounds; fairness and equal opportunity guide how trainees are treated.", note: "Respect differences; treat people fairly.  [Professional Values and Responsibilities]" },
  { front: "What does Indicator 7.2.1 require alongside integrity?", back: "Disclosure of conflicts of interest.", note: "Integrity includes disclosure.  [Professional Values and Responsibilities]" },
  { front: "A trainer recommends a provider in which the trainer has a personal financial interest. What action does the standard require?", back: "Disclose the conflict of interest.", note: "Make the competing interest visible.  [Professional Values and Responsibilities]" },
  { front: "What responsibility applies to training entity property and resources?", back: "Preserve them and use them fairly.", note: "Preserve and use fairly.  [Professional Values and Responsibilities]" },
  { front: "One group receives exclusive access to shared training equipment without a training-related reason. Which responsibility is relevant?", back: "Fair use of training entity property and resources.", note: "Shared resources require fair use.  [Professional Values and Responsibilities]" },
  { front: "What must a trainer respect when using another person's training materials?", back: "Copyright and intellectual property principles.", note: "Respect ownership of ideas and materials.  [Professional Values and Responsibilities]" },
  { front: "A trainer presents a colleague's materials as the trainer's own work. Which responsibilities are implicated?", back: "Scientific integrity and respect for copyright and intellectual property.", note: "Do not claim someone else's work as yours.  [Professional Values and Responsibilities]" },
  { front: "What two protections are explicitly paired in Indicator 7.2.4?", back: "Confidentiality and data security.", note: "Protect privacy and protect data.  [Professional Values and Responsibilities]" },
  { front: "A trainer plans to publish named individual evaluation results in an unrestricted group. What responsibility should guide reconsideration?", back: "Confidentiality and data security.", note: "A result can still be confidential.  [Professional Values and Responsibilities]" },
  { front: "Why is keeping trainee files confidential insufficient if the files are stored insecurely?", back: "The standard requires both confidentiality and data security.", note: "Confidential intent needs secure handling.  [Professional Values and Responsibilities]" },
  { front: "A trainer is asked to alter evaluation results to make a program appear more successful. Which principle should govern the response?", back: "Scientific integrity: preserve an honest account of the evidence.", note: "Report the evidence honestly.  [Professional Values and Responsibilities]" },
  { front: "A trainer evaluates a close associate and recognizes a competing personal interest. What should happen before relying on an apparently impartial judgment?", back: "Disclose the conflict and apply the relevant professional procedures for fair evaluation.", note: "Disclosure supports objectivity.  [Professional Values and Responsibilities]" },
  { front: "What kinds of updates should trainers follow under Indicator 8.1.1?", back: "Knowledge, specialization, and training developments and updates.", note: "Follow developments and use them.  [Professional Values and Responsibilities]" },
  { front: "A trainer reads new professional material but never applies it. What additional step does 8.1.1 require?", back: "Employ relevant developments in improving training.", note: "Learning should inform practice.  [Professional Values and Responsibilities]" },
  { front: "What should trainers do with future labor market trends and needs?", back: "Anticipate and analyze them, then employ the findings in training.", note: "Anticipate, analyze, apply.  [Professional Values and Responsibilities]" },
  { front: "A role is changing and new competencies are becoming necessary. What professional development response fits 8.1.2?", back: "Analyze the emerging labor market needs and use them to develop training.", note: "Future work should inform today's development.  [Professional Values and Responsibilities]" },
  { front: "How does Level 2 extend following training and specialization developments under 8.1.1?", back: "It includes sharing those developments with colleagues.", note: "Use the update and share it.  [Professional Values and Responsibilities]" },
  { front: "What should training-related research and studies address under 8.2.1?", back: "Major training difficulties and issues, with solutions to resolve them.", note: "Investigate a problem to improve practice.  [Professional Values and Responsibilities]" },
  { front: "What characterizes a Professional Learning Community (PLC)?", back: "Collaboration, shared learning, reflection, evidence use, and continuous improvement.", note: "Learn together and improve together.  [Professional Values and Responsibilities]" },
  { front: "A trainer belongs to a PLC but never contributes or interacts. What does 8.2.2 call for?", back: "Participation and interaction in professional learning activities and communities.", note: "Participate, not merely belong.  [Professional Values and Responsibilities]" },
  { front: "Several cohorts struggle with the same training task. What development activity fits 8.2.1?", back: "Investigate the recurring difficulty through a study aimed at finding solutions.", note: "Turn a repeated difficulty into a research question.  [Professional Values and Responsibilities]" },
  { front: "What additional research role appears at Level 3 under 8.2.1?", back: "Lead research teams, evaluate investigative studies, and propose innovative solutions to training issues.", note: "Level 3 develops the work of others.  [Professional Values and Responsibilities]" },
  { front: "How can data teams support professional learning?", back: "Use data to identify gaps, monitor progress, and improve practices.", note: "Use data to focus improvement.  [Professional Values and Responsibilities]" },
  { front: "What should self-reflection help a trainer identify?", back: "Goals and priorities for professional development.", note: "Reflect to select a development priority.  [Professional Values and Responsibilities]" },
  { front: "Whose feedback should inform professional development needs under 8.3.2?", back: "Trainees' and stakeholders' feedback on training practices.", note: "Listen to those affected by the practice.  [Professional Values and Responsibilities]" },
  { front: "What should a personal professional development plan aim to improve?", back: "Training practice, informed by needs and feedback and checked through achievement indicators.", note: "A plan needs a goal and evidence.  [Professional Values and Responsibilities]" },
  { front: "What should trainers use to monitor their professional self-development plans?", back: "Evaluation tools.", note: "Measure your own development too.  [Professional Values and Responsibilities]" },
  { front: "Trainee feedback repeatedly identifies unclear explanations. What should a trainer do next?", back: "Analyze the feedback, identify a development priority, and incorporate it into a professional development plan.", note: "Feedback becomes a development goal.  [Professional Values and Responsibilities]" },

// ================= Core state / storage =================
const STORAGE_KEY = "etecMasterTrainer_v1";
const TOTAL_Q = QUESTIONS.length;
const CATEGORIES = Array.from(new Set(QUESTIONS.map(q => q.category)));
const QMAP = {}; QUESTIONS.forEach(q => QMAP[q.id] = q);

function todayStr(){ return new Date().toISOString().slice(0,10); }

function defaultState(){
  return {
    answers: {},        // qid -> {selected, correct, confidence, lastAt, attempts:[{selected,correct,at}]}
    bookmarks: {},       // qid -> {important:bool, reviewLater:bool, difficult:bool}
    mistakeStatus: {},   // qid -> 'active' | 'learned'
    review: {},          // qid -> {bucket:'today'|'soon'|'mastered', dangerous:bool}
    mockAttempts: [],    // {id, mode, dateStarted, dateFinished, correct, incorrect, unanswered, total, pct, timeTakenSec, topicBreakdown, answers:{qid:{selected,flagged}}}
    sessionHistory: [],  // {date, type, pct, count}
    streak: { lastActiveDate: null, current: 0, best: 0 },
    daily: { lastDate: null, streak: 0, best: 0, history: [] }, // history: {date, pct}
    lastSessionScore: null,
    bestMockScore: null,
    learnOrder: null,
    learnIndex: 0
  };
}

let STATE = loadState();

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultState();
    const parsed = JSON.parse(raw);
    return Object.assign(defaultState(), parsed);
  }catch(e){ return defaultState(); }
}
function saveState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE)); }catch(e){}
}

function resetAllProgress(){
  STATE = defaultState();
  saveState();
}

// ================= Utilities =================
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function fmtTime(sec){
  sec = Math.max(0, Math.round(sec));
  const m = Math.floor(sec/60), s = sec%60;
  return String(m).padStart(2,"0") + ":" + String(s).padStart(2,"0");
}
function fmtDate(iso){
  if(!iso) return "—";
  const d = new Date(iso);
  return d.toLocaleDateString(undefined, {month:"short", day:"numeric", year:"numeric"});
}
function pct(n,d){ return d>0 ? Math.round((n/d)*100) : 0; }

// Per-question runtime shuffle cache (so options stay stable while the question is on screen,
// but reshuffle is fresh every time a new question instance is served)
const optionShuffleCache = {};
function getShuffledOptions(q, freshKey){
  const key = q.id + "::" + freshKey;
  if(!optionShuffleCache[key]){
    const idxs = shuffle([0,1,2,3]);
    optionShuffleCache[key] = idxs;
  }
  const idxs = optionShuffleCache[key];
  const letters = ["A","B","C","D"];
  return idxs.map((origIdx,i) => ({
    text: q.options[origIdx],
    letter: letters[i],
    origLetter: letters[origIdx],
    isCorrect: letters[origIdx] === q.correctAnswer
  }));
}

// ================= Derived stats =================
function getLatestOutcome(qid){
  const a = STATE.answers[qid];
  if(!a) return null;
  return a.correct;
}
function attemptedIds(){ return Object.keys(STATE.answers).map(Number); }
function computeOverall(){
  const ids = attemptedIds();
  const attempted = ids.length;
  const correct = ids.filter(id => getLatestOutcome(id) === true).length;
  const incorrect = attempted - correct;
  return { attempted, correct, incorrect, pct: pct(correct, attempted) };
}
function computeCategoryStats(){
  const out = {};
  CATEGORIES.forEach(cat => {
    const qs = QUESTIONS.filter(q => q.category === cat);
    const ids = qs.map(q=>q.id).filter(id => STATE.answers[id]);
    const correct = ids.filter(id => getLatestOutcome(id) === true).length;
    out[cat] = { total: qs.length, attempted: ids.length, correct, pct: pct(correct, ids.length) };
  });
  return out;
}
function strongestWeakest(){
  const cs = computeCategoryStats();
  const withData = Object.entries(cs).filter(([,v]) => v.attempted >= 2);
  if(withData.length === 0) return { strongest: "—", weakest: "—" };
  const sorted = withData.sort((a,b) => b[1].pct - a[1].pct);
  return { strongest: sorted[0][0], weakest: sorted[sorted.length-1][0] };
}
function readinessLabel(){
  const { attempted, pct: overallPct } = computeOverall();
  if(attempted < 10) return { label: "Low", note: "Answer at least 10 questions to unlock a readiness estimate." };
  if(overallPct >= 90) return { label: "Exam Ready", note: "Excellent accuracy across attempted questions." };
  if(overallPct >= 80) return { label: "Very Good", note: "Strong performance — polish remaining weak areas." };
  if(overallPct >= 70) return { label: "Good", note: "Solid base — keep drilling weaker topics." };
  if(overallPct >= 60) return { label: "Developing", note: "Making progress — more mock practice recommended." };
  return { label: "Low", note: "Needs more preparation before sitting the exam." };
}
function readinessColorVar(label){
  if(label === "Exam Ready") return "good";
  if(label === "Very Good") return "good";
  if(label === "Good") return "navy";
  if(label === "Developing") return "gold";
  return "bad";
}
function classify(scorePct){
  if(scorePct >= 90) return "Excellent / Exam Ready";
  if(scorePct >= 80) return "Very Good";
  if(scorePct >= 70) return "Good";
  if(scorePct >= 60) return "Developing";
  return "Needs More Preparation";
}

// Spaced-repetition bucket update
function updateReviewBucket(qid, correct, confidence){
  let bucket;
  if(!correct) bucket = "today";
  else if(confidence === "guessing" || confidence === "not-sure" || !confidence) bucket = "soon";
  else bucket = "mastered";
  const dangerous = (!correct && confidence === "very-sure");
  STATE.review[qid] = { bucket, dangerous, lastConfidence: confidence || null };
}
function reviewBuckets(){
  const out = { today: [], soon: [], mastered: [] };
  Object.entries(STATE.review).forEach(([qid, v]) => {
    if(out[v.bucket]) out[v.bucket].push(Number(qid));
  });
  return out;
}
function dangerousIds(){
  return Object.entries(STATE.review).filter(([,v]) => v.dangerous).map(([qid]) => Number(qid));
}

// Study streak (calendar-day based, any activity counts)
function touchStreak(){
  const today = todayStr();
  const s = STATE.streak;
  if(s.lastActiveDate === today) return;
  const yest = new Date(Date.now() - 86400000).toISOString().slice(0,10);
  if(s.lastActiveDate === yest) s.current += 1;
  else s.current = 1;
  s.best = Math.max(s.best, s.current);
  s.lastActiveDate = today;
}

// Record a completed study session (practice / mock / daily) into history + mistakes/answers
function recordAnswer(qid, selectedLetter, confidence){
  const q = QMAP[qid];
  const correct = selectedLetter === q.correctAnswer;
  const prev = STATE.answers[qid];
  const attempts = prev ? prev.attempts.slice() : [];
  attempts.push({ selected: selectedLetter, correct, at: Date.now() });
  STATE.answers[qid] = { selected: selectedLetter, correct, confidence: confidence || null, lastAt: Date.now(), attempts };
  if(!correct) STATE.mistakeStatus[qid] = "active";
  else if(STATE.mistakeStatus[qid] === "active") { /* leave history, but it's no longer "current" wrong */ }
  updateReviewBucket(qid, correct, confidence);
  touchStreak();
  saveState();
}
function wrongAttemptCount(qid){
  const a = STATE.answers[qid];
  if(!a) return 0;
  return a.attempts.filter(x => !x.correct).length;
}
function activeMistakes(){
  return Object.keys(STATE.answers)
    .map(Number)
    .filter(id => STATE.answers[id].correct === false && STATE.mistakeStatus[id] !== "learned");
}
function learnedMistakes(){
  return Object.keys(STATE.mistakeStatus).map(Number).filter(id => STATE.mistakeStatus[id] === "learned");
}

function toggleBookmark(qid, kind){
  const b = STATE.bookmarks[qid] || { important:false, reviewLater:false, difficult:false };
  b[kind] = !b[kind];
  STATE.bookmarks[qid] = b;
  saveState();
}
function isBookmarked(qid, kind){
  return !!(STATE.bookmarks[qid] && STATE.bookmarks[qid][kind]);
}

function logSession(type, correct, total){
  STATE.sessionHistory.push({ date: todayStr(), type, pct: pct(correct,total), count: total });
  if(STATE.sessionHistory.length > 200) STATE.sessionHistory.shift();
  STATE.lastSessionScore = pct(correct,total);
  saveState();
}

let SEARCH_QUERY = "";
let SUBVIEW = null;

function renderView(){
  const el = document.getElementById("view");
  if(!el) return;
  el.classList.toggle("wide", SUBVIEW === "mock-session");
  if(SUBVIEW === "search"){ el.innerHTML = renderSearchResults(); attachSearchHandlers(); return; }
  if(SUBVIEW === "study"){ el.innerHTML = renderStudyScreen(); attachStudyHandlers(); return; }
  if(SUBVIEW === "mock-session"){ el.innerHTML = renderMockSession(); attachMockSessionHandlers(); return; }
  if(SUBVIEW === "mock-result"){ el.innerHTML = renderMockResult(); attachMockResultHandlers(); return; }
  const renderers = {
    dashboard: renderDashboard,
    learn: renderLearn,
    practice: renderPracticeHome,
    mock: renderMockHome,
    weak: renderWeakAreas,
    revision: renderRevision,
    flashcards: renderFlashcards,
    mistakes: renderMistakes,
    saved: renderSaved,
    analytics: renderAnalytics,
    rapid: renderRapidReview,
    traps: renderExamTraps
  };
  const fn = renderers[ROUTE] || renderDashboard;
  el.innerHTML = fn();
  if(typeof (window["after_"+ROUTE]) === "function") window["after_"+ROUTE]();
}

function render(){
  renderShell();
  renderView();
}

// ================= Modal / Toast =================
function openModal(opts){
  const root = document.getElementById("modal-root");
  root.innerHTML =
    '<div class="modal-overlay" id="modal-overlay">' +
      '<div class="modal">' +
        '<h3>'+escapeHtml(opts.title)+'</h3>' +
        '<p>'+opts.body+'</p>' +
        '<div class="modal-actions">' +
          '<button class="btn btn-ghost" id="modal-cancel">'+(opts.cancelLabel||"Cancel")+'</button>' +
          '<button class="btn '+(opts.danger?"btn-danger":"btn-primary")+'" id="modal-confirm">'+(opts.confirmLabel||"Confirm")+'</button>' +
        '</div>' +
      '</div>' +
    '</div>';
  document.getElementById("modal-cancel").addEventListener("click", closeModal);
  document.getElementById("modal-overlay").addEventListener("click", function(e){ if(e.target.id==="modal-overlay") closeModal(); });
  document.getElementById("modal-confirm").addEventListener("click", function(){ closeModal(); opts.onConfirm && opts.onConfirm(); });
}
function closeModal(){ document.getElementById("modal-root").innerHTML = ""; }

let toastTimer = null;
function toast(msg){
  const root = document.getElementById("toast-root");
  root.innerHTML = '<div class="toast">'+escapeHtml(msg)+'</div>';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ root.innerHTML = ""; }, 2600);
}

function renderDashboard(){
  const overall = computeOverall();
  const coverage = pct(overall.attempted, TOTAL_Q);
  const { strongest, weakest } = strongestWeakest();
  const readiness = readinessLabel();
  const rColor = readinessColorVar(readiness.label);
  const rq = reviewBuckets();
  const bestMock = STATE.bestMockScore;
  const recent = STATE.lastSessionScore;

  return (
    '<div class="progress-hero card card-pad">' +
      '<div class="progress-bar-wrap">' +
        '<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;">' +
          '<h2 style="font-size:15px;">ETEC Preparation Progress</h2>' +
          '<span class="num" style="font-weight:700;font-size:18px;">'+coverage+'%</span>' +
        '</div>' +
        '<div class="progress-bar-track"><div class="progress-bar-fill" style="width:'+coverage+'%"></div></div>' +
        '<div style="margin-top:8px;font-size:12px;color:var(--ink-muted);">'+overall.attempted+' of '+TOTAL_Q+' questions attempted at least once</div>' +
      '</div>' +
      '<div class="readiness-badge" style="background:var(--'+rColor+'-bg);color:var(--'+rColor+');border:1px solid var(--'+rColor+'-border, var(--'+rColor+'));">' +
        '<div style="font-size:10.5px;text-transform:uppercase;letter-spacing:0.05em;opacity:0.85;margin-bottom:4px;">Ready for Exam</div>' +
        '<div style="font-size:17px;">'+readiness.label+'</div>' +
      '</div>' +
    '</div>' +

    '<div class="stat-grid" style="margin-top:16px;">' +
      statTile("Total Questions", TOTAL_Q, "") +
      statTile("Attempted", overall.attempted, pct(overall.attempted,TOTAL_Q)+"% coverage") +
      statTile("Correct", overall.correct, "", "good") +
      statTile("Incorrect", overall.incorrect, "", overall.incorrect>0?"bad":"") +
      statTile("Overall Accuracy", overall.pct+"%", "") +
      statTile("Study Streak", STATE.streak.current+" days", "Best: "+STATE.streak.best) +
      statTile("Questions Remaining", TOTAL_Q-overall.attempted, "") +
      statTile("Strongest Topic", strongest, "", "good") +
      statTile("Weakest Topic", weakest, "", weakest!=="—"?"bad":"") +

          quickAction("book","Learn Mode","Study one question at a time with full explanations.", "learn") +
          quickAction("target","Practice","Choose a count and topic, get instant feedback.", "practice") +

function statTile(label, value, sub, cls){
