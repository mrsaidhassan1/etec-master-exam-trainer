de without evidence.","category":"Trainer Skills & Classroom Management","difficulty":"Hard","sourceType":"Practice Variation","domain":"Future Skills"},{"id":91,"question":"Trainees finish early but the official session has not ended. What is the best response?","options":["Keep to policy and provide meaningful extension work","Dismiss everyone","Ignore them","End all future sessions early"],"correctAnswer":"A","explanation":"Keeping to the official session time while giving early finishers meaningful extension work respects policy and keeps them learning. Dismissing them breaks the schedule, and ignoring them wastes their time.","category":"Statistics","difficulty":"Medium","sourceType":"Practice Variation","domain":"Professional Practices"},{"id":92,"question":"For an interactive computer-lab workshop requiring trainer visibility and discussion, which seating arrangement is keyed in the screenshot?","options":["U-shaped seating","Traditional rows","Circle without computers","Random seating"],"correctAnswer":"A","explanation":"U-shaped seating gives the trainer visibility of every screen and supports discussion, which suits a computer-lab workshop. Rows block interaction, a circle without computers does not fit the task, and random seating has no purpose.","category":"Training Environment","difficulty":"Medium","sourceType":"Practice Variation","domain":"Professional Practices"},{"id":93,"question":"Which secure link prefix appears in the remembered ETEC material?","options":["https://","http://","ftp://","file://"],"correctAnswer":"A","explanation":"https:// is the secure format: it encrypts data in transit. http:// is unencrypted. ftp:// and file:// are file-transfer and local-file protocols, not secure web prefixes.","category":"AI & Digital Tools","difficulty":"Easy","sourceType":"Practice Variation","domain":"Future Skills"},{"id":94,"question":"Which is NOT identified as an AI multimedia-generation tool in the remembered question?","options":["SQL Server","Hugging Face","AI image generator","AI video generator"],"correctAnswer":"A","explanation":"SQL Server is a database management system, not a tool for generating images, video or other media. Hugging Face (an AI model platform) and AI image and video generators are all AI multimedia tools. Read the word NOT carefully.","category":"AI & Digital Tools","difficulty":"Easy","sourceType":"Practice Variation","domain":"Future Skills"},{"id":95,"question":"An organisation wants to prepare for future innovation and AI implementation. What should its training analysis identify?","options":["Future skills requirements","Only current attendance","Only trainee satisfaction","Only classroom capacity"],"correctAnswer":"A","explanation":"To prepare for future innovation and AI, the training analysis should identify the future skills the organisation will need, not just today's position. Current attendance, trainee satisfaction and classroom capacity describe the present and say nothing about upcoming capability gaps.","category":"Training Needs Analysis","difficulty":"Easy","sourceType":"Practice Variation","domain":"Professional Practices"},{"id":96,"question":"Which phrase best summarizes Constructivism for exam revision?","options":["Previous knowledge","Observation and modelling","Reinforcement and punishment","Organisational results"],"correctAnswer":"A","explanation":"Constructivism is summarised by 'previous knowledge': learners build new understanding on what they already know. Observation and modelling is Bandura, reinforcement and punishment is Skinner, and organisational results is Kirkpatrick Level 4.","category":"Learning Theories","difficulty":"Easy","sourceType":"Practice Variation","domain":"Professional Knowledge"},{"id":97,"question":"Which phrase best summarizes Bandura for exam revision?","options":["Observation and modelling","Previous knowledge","Training outcomes","Diagnostic testing"],"correctAnswer":"A","explanation":"Bandura is summarised by observation, modelling and imitation (Social Learning Theory). 'Previous knowledge' is Constructivism, training outcomes belong to evaluation models, and diagnostic testing is an assessment type.","category":"Learning Theories","difficulty":"Easy","sourceType":"Practice Variation","domain":"Professional Knowledge"},{"id":98,"question":"Which phrase best summarizes Behaviourism for exam revision?","options":["Observable behaviour","Previous knowledge","Professional dialogue","Learning environment"],"correctAnswer":"A","explanation":"Behaviourism defines learning through observable behaviour, shaped by stimulus and response. 'Previous knowledge' is Constructivism, and professional dialogue and learning environment are unrelated to the theory.","category":"Learning Theories","difficulty":"Easy","sourceType":"Practice Variation","domain":"Professional Knowledge"},{"id":99,"question":"Which phrase best summarizes Skinner for exam revision?","options":["Reinforcement and punishment","Experience and reflection","Context and input","Reaction and results"],"correctAnswer":"A","explanation":"Skinner is summarised by reinforcement and punishment (operant conditioning). Experience and reflection is Kolb, context and input is CIRO, and reaction and results are evaluation-model terms.","category":"Learning Theories","difficulty":"Easy","sourceType":"Practice Variation","domain":"Professional Knowledge"},{"id":100,"question":"Which memory aid matches Kolb in the source?","options":["Do → Reflect → Think → Try","Analyse → Design → Develop → Implement","React → Learn → Behave → Result","Context → Input → React → Outcome"],"correctAnswer":"A","explanation":"Kolb's cycle is Do (concrete experience), Reflect, Think (form concepts), Try (experiment). Option B is ADDIE, C is Kirkpatrick, and D is CIRO.","category":"Learning Theories","difficulty":"Easy","sourceType":"Practice Variation","domain":"Professional Knowledge"},{"id":101,"question":"What is the main purpose of professional standards for trainers?","options":["To set training prices","To improve trainer quality and professional practices","To increase the number of training hours","To standardize certificate designs"],"correctAnswer":"B","explanation":"The professional standards describe what a trainer should know, do and value, so their main purpose is to raise trainer quality and professional practice. They do not set prices, increase training hours or standardise certificate design.","category":"Professional Values and Responsibilities","domain":"Professional Values and Responsibilities","difficulty":"Medium","sourceType":"Source Question"},{"id":102,"question":"Which set correctly represents the four main domains of trainer standards?","options":["Planning, marketing, delivery, sales","Finance, HR, accounting, technology","Professional knowledge, professional practices, professional values and responsibilities, future skills","Attendance, certificates, rooms, trainers"],"correctAnswer":"C","explanation":"The four domains are Professional Knowledge, Professional Practices, Professional Values and Responsibilities, and Future Skills. The other sets mix in marketing, finance, administration or certificate items that are not part of the standards. Memory aid: K · P · V · F.","category":"Professional Knowledge","domain":"Professional Knowledge","difficulty":"Medium","sourceType":"Source Question"},{"id":103,"question":"Which trainer task is related to defining the scope, objectives, and priorities of training?","options":["License issuance","Training planning","Training center approval","Program marketing"],"correctAnswer":"B","explanation":"Defining the scope, objectives and priorities of training is training planning, the first of the four core trainer tasks (plan, design, implement, evaluate and report). Licence issuance, centre approval and marketing are not trainer tasks in the standards.","category":"Professional Practices","domain":"Professional Practices","difficulty":"Medium","sourceType":"Source Question"},{"id":104,"question":"Designing training experiences means:","options":["Preparing attendance sheets only","Choosing slide colors","Designing activities, materials, and evaluation tools aligned with learning outcomes","Printing certificates"],"correctAnswer":"C","explanation":"Designing training experiences means designing activities, materials and evaluation tools that are aligned with the learning outcomes. Attendance sheets, slide colours and printing certificates are administrative or cosmetic tasks, not design.","category":"Professional Practices","domain":"Professional Practices","difficulty":"Medium","sourceType":"Source Question"},{"id":105,"question":"Delivering training in a safe, motivating, and positive environment is part of:","options":["Financial planning","Professional practices","Marketing strategy","Administrative registration"],"correctAnswer":"B","explanation":"Delivering training in a safe, motivating and positive environment is part of Professional Practices (the implement task). Financial planning, marketing and registration are administrative areas outside the trainer's four domains.","category":"Professional Practices","domain":"Professional Practices","difficulty":"Medium","sourceType":"Source Question"},{"id":106,"question":"Which of the following is a professional responsibility of the trainer?","options":["Ignoring trainee needs","Using copied material without citation","Protecting trainee data and confidentiality","Avoiding feedback"],"correctAnswer":"C","explanation":"Protecting trainee data and confidentiality is a core professional responsibility (Standards 6.2 and 7.2). Ignoring trainee needs, using copied material without citation, and avoiding feedback all breach professional responsibilities.","category":"Professional Values and Responsibilities","domain":"Professional Values and Responsibilities","difficulty":"Medium","sourceType":"Source Question"},{"id":107,"question":"Critical thinking, problem solving, and decision making are part of:","options":["Future skills","Summative assessment only","Attendance management","Kirkpatrick Level 1 only"],"correctAnswer":"A","explanation":"Critical thinking, problem solving and decision making belong to Future Skills (Standard 10.1). Summative assessment, attendance management and Kirkpatrick Level 1 are unrelated to these skills.","category":"Future Skills","domain":"Future Skills","difficulty":"Medium","sourceType":"Source Question"},{"id":108,"question":"A trainer analyzes trainee characteristics before the program. This reflects:","options":["Marketing skills","Professional knowledge","Graphic design skills","Facility management"],"correctAnswer":"B","explanation":"Analysing trainee characteristics before the programme shows Professional Knowledge: knowing your trainees. It is not a marketing, graphic design or facility-management skill.","category":"Professional Knowledge","domain":"Professional Knowledge","difficulty":"Medium","sourceType":"Source Question"},{"id":109,"question":"Which practice reflects good training design?","options":["Starting without objectives","Using lecture only in all situations","Aligning objectives, activities, and evaluation tools","Ignoring evaluation results"],"correctAnswer":"C","explanation":"Good design aligns objectives, activities and evaluation tools so each supports the others. Starting without objectives, using lectures for every situation and ignoring evaluation results all break that alignment.","category":"Professional Practices","domain":"Professional Practices","difficulty":"Medium","sourceType":"Source Question"},{"id":110,"question":"Preparing reports on training results is part of:","options":["Room selection","Training evaluation","Administrative registration","Program promotion"],"correctAnswer":"B","explanation":"Preparing reports on training results belongs to training evaluation, the fourth core trainer task (evaluate and report). Room selection, registration and promotion are administrative or marketing tasks.","category":"Professional Practices","domain":"Professional Practices","difficulty":"Medium","sourceType":"Source Question"},{"id":111,"question":"The best definition of a training need is:","options":["Any employee desire to attend a course","The number of programs delivered in a year","A gap between current and desired performance that can be addressed through training","The annual leave plan"],"correctAnswer":"C","explanation":"A training need is a gap between current and desired performance that training can address. An employee's wish to attend, the number of programmes delivered or the leave plan are not performance gaps.","category":"Professional Knowledge","domain":"Professional Knowledge","difficulty":"Medium","sourceType":"Source Question"},{"id":112,"question":"If poor performance is caused by lack of resources, the best solution is usually:","options":["More training only","A final test","Addressing the resource problem","A longer lecture"],"correctAnswer":"C","explanation":"When poor performance is caused by lack of resources, fix the resource problem: training cannot compensate for missing tools or materials. More training, a final test or a longer lecture treat the wrong cause. This is why root cause analysis comes before training.","category":"Professional Practices","domain":"Professional Practices","difficulty":"Medium","sourceType":"Source Question"},{"id":113,"question":"Organizational-level needs analysis focuses mainly on:","options":["Training room colors","Organizational strategy and overall performance indicators","One trainee preference","Certificate design"],"correctAnswer":"B","explanation":"Organisational-level needs analysis looks at strategy and overall performance indicators such as KPIs, quality and productivity. Room colours, one trainee's preference and certificate design are not organisational performance measures.","category":"Professional Knowledge","domain":"Professional Knowledge","difficulty":"Medium","sourceType":"Source Question"},{"id":114,"question":"Task-level needs analysis focuses on:","options":["Number of trainees only","Trainer satisfaction","Competencies and tasks required for a job","Break time"],"correctAnswer":"C","explanation":"Task-level analysis looks at the competencies and tasks a specific job requires. The number of trainees, trainer satisfaction and break time say nothing about what the job demands.","category":"Professional Knowledge","domain":"Professional Knowledge","difficulty":"Medium","sourceType":"Source Question"},{"id":115,"question":"Individual-level needs analysis focuses on:","options":["Each person's performance compared with required standards","Strategy only","Annual budget","Institutional accreditation"],"correctAnswer":"A","explanation":"Individual-level analysis compares each person's performance with the required standard. Strategy belongs to the organisational level, and budget and accreditation are institutional matters.","category":"Professional Knowledge","domain":"Professional Knowledge","difficulty":"Medium","sourceType":"Source Question"},{"id":116,"question":"Which tool is suitable for collecting quantitative data from a large group?","options":["One informal interview","Closed-ended questionnaires","Random observation","Undocumented discussion"],"correctAnswer":"B","explanation":"Closed-ended questionnaires give numerical data from many respondents quickly, which is quantitative data. One informal interview, random observation and undocumented discussion cannot produce reliable numbers from a large group.","category":"Professional Practices","domain":"Professional Practices","difficulty":"Medium","sourceType":"Source Question"},{"id":117,"question":"In-depth interviews are useful when the trainer wants to:","options":["Collect numbers only","Prevent participants from speaking","Understand detailed causes behind performance gaps","Measure attendance only"],"correctAnswer":"C","explanation":"In-depth interviews explore the detailed causes behind performance gaps, which numbers alone cannot show. They are not for collecting numbers only, preventing people from speaking or measuring attendance.","category":"Professional Practices","domain":"Professional Practices","difficulty":"Medium","sourceType":"Source Question"},{"id":118,"question":"Observation is more reliable when it is:","options":["Random and undocumented","Based only on personal impression","Done long after training without evidence","Based on a checklist and clear criteria"],"correctAnswer":"D","explanation":"Observation is more reliable when it uses a checklist and clear criteria, so different observers record the same things. Random, undocumented or impression-based observation and observation done long after training have no consistent evidence.","category":"Professional Practices","domain":"Professional Practices","difficulty":"Medium","sourceType":"Source Question"},{"id":119,"question":"Performance data analysis may include:","options":["Slide colors","Break schedules","KPIs, complaints, errors, and productivity","Informal opinions only"],"correctAnswer":"C","explanation":"Performance data analysis uses measurable indicators such as KPIs, complaints, errors and productivity. Slide colours, break schedules and informal opinions alone are not performance data.","category":"Professional Practices","domain":"Professional Practices","difficulty":"Medium","sourceType":"Source Question"},{"id":120,"question":"Skills gap analysis means:","options":["Comparing rooms with trainers","Comparing current skills with required skills","Measuring satisfaction only","Selecting the most experienced trainer"],"correctAnswer":"B","explanation":"Skills gap analysis compares current skills with required skills to find what is missing. It does not compare rooms with trainers, measure only satisfaction or select a trainer.","category":"Professional Knowledge","domain":"Professional Knowledge","difficulty":"Medium","sourceType":"Source Question"},{"id":121,"question":"ADDIE consists of:","options":["Attendance, Test, Certificate, Report, Closure","Analysis, Design, Development, Implementation, Evaluation","Sales, Marketing, Delivery, Collection, Evaluation","Introduction, Explanation, Example, Question, Closing"],"correctAnswer":"B","explanation":"ADDIE stands for Analysis, Design, Development, Implementation, Evaluation. The other options are made-up sequences from administration, sales or lesson structure.","category":"Professional Knowledge","domain":"Professional Knowledge","difficulty":"Medium","sourceType":"Source Question"},{"id":122,"question":"The first stage in ADDIE is:","options":["Development","Implementation","Analysis","Printing"],"correctAnswer":"C","explanation":"Analysis is the first stage of ADDIE: you identify the problem, needs, audience and constraints before building anything. Development and Implementation come later, and printing is not an ADDIE stage.","category":"Professional Knowledge","domain":"Professional Knowledge","difficulty":"Medium","sourceType":"Source Question"},{"id":123,"question":"A common training design mistake is:","options":["Identifying trainee characteristics","Preparing slides before analyzing needs","Writing measurable objectives","Selecting assessment tools"],"correctAnswer":"B","explanation":"Preparing slides before analysing needs is a classic design mistake because you may build the wrong solution. Identifying trainee characteristics, writing measurable objectives and selecting assessment tools are all good design practice.","category":"Professional Practices","domain":"Professional Practices","difficulty":"Medium","sourceType":"Source Question"},{"id":124,"question":"The Design stage in ADDIE focuses on:","options":["Training delivery only","Certificate distribution","Objectives, content, strategies, activities, and evaluation","Course fees"],"correctAnswer":"C","explanation":"The Design stage specifies objectives, content, strategies, activities and the evaluation approach. Delivery belongs to Implementation, and certificates and fees are administrative.","category":"Professional Knowledge","domain":"Professional Knowledge","difficulty":"Medium","sourceType":"Source Question"},{"id":125,"question":"The Development stage means:","options":["Analyzing the problem only","Producing materials, activities, exercises, and evaluation tools","Calculating ROI only","Selecting the venue"],"correctAnswer":"B","explanation":"Development means producing the materials, activities, exercises and evaluation tools specified in the design. Analysing the problem is Analysis, calculating ROI is evaluation, and selecting a venue is a logistics step.","category":"Professional Knowledge","domain":"Professional Knowledge","difficulty":"Medium","sourceType":"Source Question"},{"id":126,"question":"The Implementation stage means:","options":["Identifying needs only","Writing the final report only","Delivering training and managing the learning session","Designing the logo"],"correctAnswer":"C","explanation":"Implementation means delivering the training and managing the learning session. Identifying needs is Analysis, a final report belongs to Evaluation, and designing a logo is unrelated.","category":"Professional Knowledge","domain":"Professional Knowledge","difficulty":"Medium","sourceType":"Source Question"},{"id":127,"question":"Evaluation in ADDIE:","options":["Happens only at the end","Is unrelated to training","Can be formative during design and summative after implementation","Measures trainer satisfaction only"],"correctAnswer":"C","explanation":"In ADDIE, evaluation can be formative during design and development and summative after implementation. It is not limited to the end, not unrelated to training, and not only about trainer satisfaction.","category":"Professional Knowledge","domain":"Professional Knowledge","difficulty":"Medium","sourceType":"Source Question"},{"id":128,"question":"A good training objective should be:","options":["General and unmeasurable","Long and vague","Based only on trainer preference","Clear, measurable, and linked to a specific outcome"],"correctAnswer":"D","explanation":"A good objective is clear, measurable and linked to a specific outcome, so you can check whether it was achieved. General, vague or preference-based objectives cannot be assessed.","category":"Professional Practices","domain":"Professional Practices","difficulty":"Medium","sourceType":"Source Question"},{"id":129,"question":"Which objective is best written?","options":["Introduce trainees to quality","Improve quality culture","Talk about quality generally","By the end of the session, the trainee will explain three key benefits of quality"],"correctAnswer":"D","explanation":"'By the end of the session, the trainee will explain three key benefits of quality' names who, when, an observable action and a measurable number. 'Introduce', 'improve culture' and 'talk about' describe activity or vague aims that cannot be measured.","category":"Professional Practices","domain":"Professional Practices","difficulty":"Medium","sourceType":"Source Question"},{"id":130,"question":"Training design alignment means:","options":["Slides are visually attractive only","Objectives, activities, and evaluation tools are consistent","Training duration is long","More trainees attend"],"correctAnswer":"B","explanation":"Alignment means objectives, activities and evaluation tools are consistent with each other, so what you teach is what you assess. Attractive slides, long duration and large attendance say nothing about alignment.","category":"Professional Practices","domain":"Professional Practices","difficulty":"Medium","sourceType":"Source Question"},{"id":131,"question":"One principle of adult learning is that adults:","options":["Prefer content unrelated to their work","Should not participate in discussion","Learn better when training is linked to real problems","Learn best through memorization only"],"correctAnswer":"C","explanation":"Adults learn better when training is linked to real problems from their work. Content unrelated to their work, no discussion and memorisation alone ignore adult learning principles (andragogy).","category":"Professional Knowledge","domain":"Professional Knowledge","difficulty":"Medium","sourceType":"Source Question"},{"id":132,"question":"Andragogy is mainly associated with:","options":["Child discipline","Adult learning","Financial reporting","Room management"],"correctAnswer":"B","explanation":"Andragogy is the theory of adult learning (Knowles). It is not about child discipline, financial reporting or room management.","category":"Professional Knowledge","domain":"Professional Knowledge","difficulty":"Medium","sourceType":"Source Question"},{"id":133,"question":"Adults are more motivated when:","options":["They are treated as passive learners","Their experience is ignored","They understand why the learning is important","The trainer controls everything"],"correctAnswer":"C","explanation":"Adults are more motivated when they understand why the learning is important. Treating them as passive learners, ignoring their experience or having the trainer control everything reduces motivation.","category":"Professional Knowledge","domain":"Professional Knowledge","difficulty":"Medium","sourceType":"Source Question"},{"id":134,"question":"Kolb experiential learning cycle begins with:","options":["Final exam","Concrete experience","Certificate issuance","ROI calculation"],"correctAnswer":"B","explanation":"Kolb's cycle begins with concrete experience, followed by reflective observation, abstract conceptualisation and active experimentation. A final exam, a certificate or ROI calculation are not stages.","category":"Professional Knowledge","domain":"Professional Knowledge","difficulty":"Medium","sourceType":"Source Question"},{"id":135,"question":"In Kolb model, reflecting on an experience is called:","options":["Abstract testing","Final evaluation","Reflective observation","Administrative review"],"correctAnswer":"C","explanation":"Reflecting on an experience is Reflective Observation, the second stage of Kolb's cycle. The other options are not Kolb stages.","category":"Professional Knowledge","domain":"Professional Knowledge","difficulty":"Medium","sourceType":"Source Question"},{"id":136,"question":"Behaviorism focuses mainly on:","options":["Organizational strategy","Observable behavior, reinforcement, and practice","Intellectual property","Emotional intelligence only"],"correctAnswer":"B","explanation":"Behaviourism focuses on observable behaviour, reinforcement and practice. Organisational strategy, intellectual property and emotional intelligence are different topics.","category":"Professional Knowledge","domain":"Professional Knowledge","difficulty":"Medium","sourceType":"Source Question"},{"id":137,"question":"Constructivism emphasizes:","options":["Passive reception of information","Punishment as the main learning method","Building knowledge through experience and interaction","Ignoring prior experience"],"correctAnswer":"C","explanation":"Constructivism emphasises building knowledge through experience and interaction, on top of prior knowledge. Passive reception, punishment and ignoring prior experience contradict it.","category":"Professional Knowledge","domain":"Professional Knowledge","difficulty":"Medium","sourceType":"Source Question"},{"id":138,"question":"Social learning theory emphasizes:","options":["Learning without interaction","Financial analysis","Learning through observation and modeling","Summative grading only"],"correctAnswer":"C","explanation":"Social learning theory (Bandura) emphasises learning through observation and modelling, and it requires interaction. Learning without interaction, financial analysis or summative grading are not the theory.","category":"Professional Knowledge","domain":"Professional Knowledge","difficulty":"Medium","sourceType":"Source Question"},{"id":139,"question":"Cognitivism is concerned with:","options":["Room arrangement only","Attention, memory, information processing, and cognitive load","Course pricing","Trainer licensing only"],"correctAnswer":"B","explanation":"Cognitivism is concerned with attention, memory, information processing and cognitive load. Room arrangement, pricing and licensing are unrelated.","category":"Professional Knowledge","domain":"Professional Knowledge","difficulty":"Medium","sourceType":"Source Question"},{"id":140,"question":"Cognitive load becomes a problem when:","options":["Objectives are clear","Activities are aligned","Content is too complex for the trainee's current level","Feedback is constructive"],"correctAnswer":"C","explanation":"Cognitive load becomes a problem when content is too complex for the trainee's current level. Clear objectives, aligned activities and constructive feedback reduce overload.","category":"Professional Knowledge","domain":"Professional Knowledge","difficulty":"Medium","sourceType":"Source Question"},{"id":141,"question":"The most suitable method for practicing customer service conversations is:","options":["Lecture only","Reading policy documents silently","Role play","Final certificate distribution"],"correctAnswer":"C","explanation":"Role play lets trainees practise customer-service conversations by acting them out. Lecture, silent reading and certificate distribution give no conversation practice.","category":"Professional Practices","domain":"Professional Practices","difficulty":"Medium","sourceType":"Source Question"},{"id":142,"question":"Case studies are useful because they:","options":["Remove trainee participation","Connect learning to realistic situations","Replace all assessment","Focus only on theory"],"correctAnswer":"B","explanation":"Case studies connect learning to realistic situations so trainees can analyse and apply concepts. They increase participation, they do not replace assessment, and they are not theory-only.","category":"Professional Knowledge","domain":"Professional Knowledge","difficulty":"Medium","sourceType":"Source Question"},{"id":143,"question":"Simulation is most appropriate when the goal is to:","options":["Avoid interaction","Measure satisfaction only","Practice performance in a realistic but safe environment","Deliver large amounts of theory quickly"],"correctAnswer":"C","explanation":"Simulation lets trainees practise performance in a realistic but safe environment. It is interactive, it does more than measure satisfaction, and it is not for delivering theory quickly (that is lecture).","category":"Professional Practices","domain":"Professional Practices","difficulty":"Medium","sourceType":"Source Question"},{"id":144,"question":"Lecture is most suitable when:","options":["The goal is to master a complex physical skill","A large amount of information must be introduced in limited time","The trainer wants no interaction","Workplace application is directly observed"],"correctAnswer":"B","explanation":"A lecture suits introducing a large amount of information in limited time. It is poor for mastering a physical skill, it involves little interaction, and it does not allow workplace application to be observed.","category":"Professional Practices","domain":"Professional Practices","difficulty":"Medium","sourceType":"Source Question"},{"id":145,"question":"Brainstorming is used mainly to:","options":["Measure ROI","Issue licenses","Generate ideas","Calculate attendance"],"correctAnswer":"C","explanation":"Brainstorming generates ideas. It does not measure ROI, issue licences or calculate attendance.","category":"Professional Practices","domain":"Professional Practices","difficulty":"Medium","sourceType":"Source Question"},{"id":146,"question":"Problem-based learning is best when trainees need to:","options":["Memorize definitions only","Solve realistic problems and apply knowledge","Avoid discussion","Listen passively"],"correctAnswer":"B","explanation":"Problem-based learning suits trainees who must solve realistic problems and apply knowledge. Memorising definitions, avoiding discussion or listening passively are the opposite.","category":"Professional Practices","domain":"Professional Practices","difficulty":"Medium","sourceType":"Source Question"},{"id":147,"question":"Coaching is usually:","options":["A final exam","A room arrangement method","A personalized development method focused on performance improvement","A financial evaluation tool"],"correctAnswer":"C","explanation":"Coaching is a personalised development method focused on improving performance. It is not an exam, a room-arrangement method or a financial tool.","category":"Professional Practices","domain":"Professional Practices","difficulty":"Medium","sourceType":"Source Question"},{"id":148,"question":"Mentoring usually involves:","options":["Anonymous surveys only","Guidance from a more experienced person","Lecture slides only","Certificate printing"],"correctAnswer":"B","explanation":"Mentoring involves guidance from a more experienced person, often over a longer period. Anonymous surveys, lecture slides and certificate printing are not mentoring.","category":"Professional Practices","domain":"Professional Practices","difficulty":"Medium","sourceType":"Source Question"},{"id":149,"question":"When choosing a training method, the trainer should mainly consider:","options":["The easiest method for the trainer only","The number of slides","Learning outcomes, trainee characteristics, time, and resources","The certificate design"],"correctAnswer":"C","explanation":"Choose a method based on learning outcomes, trainee characteristics, time and resources. The trainer's convenience, the number of slides or certificate design are not valid criteria.","category":"Professional Practices","domain":"Professional Practices","difficulty":"Medium","sourceType":"Source Question"},{"id":150,"question":"If the objective is skill application, the least suitable method alone is:","options":["Simulation","Role play","Practice activity","Lecture"],"correctAnswer":"D","explanation":"Lecture alone is the least suitable for skill application, because skills need practice and feedback. Simulation, role play and practice activities all let trainees apply the skill.","category":"Professional Practices","domain":"Professional Practices","difficulty":"Medium","sourceType":"Source Question"},{"id":151,"question":"A training session plan should include:","options":["Only the trainer's biography","Objectives, content, activities, time, methods, materials, and evaluation tools","Only course fees","Only attendance records"],"correctAnswer":"B","explanation":"A session plan includes objectives, content, activities, timing, methods, materials and evaluation tools. A trainer biography, fees or attendance records alone do not plan a session.","category":"Professional Practices","domain":"Professional Practices","difficulty":"Medium","sourceType":"Source Question"},{"id":152,"question":"The opening of a training session should usually:","options":["Start with a final exam","Clarify objectives and engage trainees","Ignore trainee expectations","Discuss unrelated topics"],"correctAnswer":"B","explanation":"A good opening clarifies objectives and engages trainees. Starting with a final exam, ignoring expectations or discussing unrelated topics wastes the most attentive minutes.","category":"Professional Practices","domain":"Professional Practices","difficulty":"Medium","sourceType":"Source Question"},{"id":153,"question":"Ground rules are useful because they:","options":["Prevent all questions","Replace learning outcomes","Clarify expected behavior and support a respectful environment","Eliminate assessment"],"correctAnswer":"C","explanation":"Ground rules clarify expected behaviour and support a respectful environment. They do not prevent questions, replace learning outcomes or eliminate assessment.","category":"Professional Practices","domain":"Professional Practices","difficulty":"Medium","sourceType":"Source Question"},{"id":154,"question":"A talkative trainee should preferably be handled by:","options":["Ignoring them completely","Embarrassing them publicly","Giving them a constructive role while managing time politely","Ending the session"],"correctAnswer":"C","explanation":"Handle a talkative trainee by giving them a constructive role (for example note-taker or group reporter) while managing time politely. Ignoring them lets them dominate, embarrassing them publicly damages rapport, and ending the session punishes everyone.","category":"Professional Practices","domain":"Professional Practices","difficulty":"Medium","sourceType":"Source Question"},{"id":155,"question":"A passive trainee can be encouraged through:","options":["Public criticism","Ignoring them","Low-pressure questions and small group activities","Removing activities"],"correctAnswer":"C","explanation":"Low-pressure questions and small-group activities draw a passive trainee in gradually. Public criticism, ignoring them or removing activities increases anxiety or removes the chance to participate.","category":"Professional Practices","domain":"Professional Practices","difficulty":"Medium","sourceType":"Source Question"},{"id":156,"question":"Effective training environment management includes:","options":["Silence only","Trainer-centered control only","Time management, participation, safety, and respect","Avoiding feedback"],"correctAnswer":"C","explanation":"Effective environment management covers time management, participation, safety and respect. Silence only, trainer-centred control only and avoiding feedback all reduce learning.","category":"Professional Practices","domain":"Professional Practices","difficulty":"Medium","sourceType":"Source Question"},{"id":157,"question":"U-shaped seating arrangement often supports:","options":["Isolation","No discussion","Hidden participation","Eye contact and interaction"],"correctAnswer":"D","explanation":"A U-shaped arrangement supports eye contact and interaction because everyone can see each other and the trainer. It does not isolate trainees, prevent discussion or hide participation.","category":"Professional Practices","domain":"Professional Practices","difficulty":"Medium","sourceType":"Source Question"},{"id":158,"question":"Constructive feedback should be:","options":["General and personal","Delayed without reason","Specific, respectful, and improvement-oriented","Focused on embarrassment"],"correctAnswer":"C","explanation":"Constructive feedback is specific, respectful and focused on improvement. General or personal comments, unexplained delays and embarrassment do not help the trainee improve.","category":"Professional Practices","domain":"Professional Practices","difficulty":"Medium","sourceType":"Source Question"},{"id":159,"question":"Active learning means:","options":["Trainees only listen","The trainer reads slides","Trainees participate, apply, discuss, and reflect","No activities are used"],"correctAnswer":"C","explanation":"Active learning means trainees participate, apply, discuss and reflect. Only listening, a trainer reading slides, or having no activities is passive.","category":"Professional Knowledge","domain":"Professional Knowledge","difficulty":"Medium","sourceType":"Source Question"},{"id":160,"question":"A trainer who adjusts activities based on trainee needs is demonstrating:","options":["Lack of planning","Flexibility and responsiveness","Poor ethics","No assessment"],"correctAnswer":"B","explanation":"Adjusting activities to trainee needs shows flexibility and responsiveness. It is a sign of good planning and ethics, not a lack of planning or assessment.","category":"Professional Practices","domain":"Professional Practices","difficulty":"Medium","sourceType":"Source Question"},{"id":161,"question":"Diagnostic evaluation or assessment is used:","options":["Only after certification","Before training","Only months after training","To calculate ROI only"],"correctAnswer":"B","explanation":"Diagnostic assessment is used before training to find the starting level, prior knowledge and gaps. After certification or months later would be too late to plan from, and ROI is a different evaluation.","category":"Professional Knowledge","domain":"Professional Knowledge","difficulty":"Medium","sourceType":"Source Question"},{"id":162,"question":"Formative evaluation or assessment is used:","options":["Only at the end","During training to monitor and improve learning","Only before training","Only for financial returns"],"correctAnswer":"B","explanation":"Formative assessment happens during training to monitor progress and improve learning while it is still happening. 'Only at the end' describes summative, and 'before training' describes diagnostic.","category":"Professional Knowledge","domain":"Professional Knowledge","difficulty":"Medium","sourceType":"Source Question"},{"id":163,"question":"Final or summative evaluation or assessment is used:","options":["Before training only","During coffee breaks","At the end to judge achievement of outcomes","To select the trainer"],"correctAnswer":"C","explanation":"Summative (final) assessment is used at the end to judge achievement of the outcomes. Before training is diagnostic, and it has nothing to do with coffee breaks or selecting the trainer.","category":"Professional Knowledge","domain":"Professional Knowledge","difficulty":"Medium","sourceType":"Source Question"},{"id":164,"question":"Assessment mainly focuses on:","options":["Program marketing only","Trainer salary","Trainee learning or performance","Room rental"],"correctAnswer":"C","explanation":"Assessment mainly focuses on trainee learning or performance. Marketing, trainer salary and room rental are not assessment topics. Do not confuse it with evaluation, which judges the programme.","category":"Professional Knowledge","domain":"Professional Knowledge","difficulty":"Medium","sourceType":"Source Question"},{"id":165,"question":"Evaluation mainly focuses on:","options":["Trainee name spelling only","Training program quality, effectiveness, and impact","Attendance list formatting","Lunch quality only"],"correctAnswer":"B","explanation":"Evaluation focuses on programme quality, effectiveness and impact. Name spelling, list formatting and lunch quality are trivial details, and trainee learning is the focus of assessment.","category":"Professional Knowledge","domain":"Professional Knowledge","difficulty":"Medium","sourceType":"Source Question"},{"id":166,"question":"Performance-based assessment measures:","options":["Satisfaction only","Ability to apply skills in a realistic context","Attendance only","Course cost only"],"correctAnswer":"B","explanation":"Performance-based assessment measures the ability to apply skills in a realistic context. Satisfaction, attendance and course cost measure other things.","category":"Professional Knowledge","domain":"Professional Knowledge","difficulty":"Medium","sourceType":"Source Question"},{"id":167,"question":"A rubric is used to:","options":["Replace objectives","Market the program","Clarify performance criteria and scoring levels","Calculate ROI only"],"correctAnswer":"C","explanation":"A rubric clarifies performance criteria and scoring levels, which makes marking consistent. It does not replace objectives, market the programme or calculate ROI.","category":"Professional Knowledge","domain":"Professional Knowledge","difficulty":"Medium","sourceType":"Source Question"},{"id":168,"question":"A pre-test and post-test can help measure:","options":["Room quality","Trainer personality only","Learning improvement","Certificate design"],"correctAnswer":"C","explanation":"A pre-test and post-test measure learning improvement by comparing scores before and after. They say nothing about room quality, trainer personality or certificate design.","category":"Professional Knowledge","domain":"Professional Knowledge","difficulty":"Medium","sourceType":"Source Question"},{"id":169,"question":"An observation checklist is best used to:","options":["Measure feelings only","Replace all training activities","Record specific behaviors or skills during performance","Issue licenses"],"correctAnswer":"C","explanation":"An observation checklist records specific behaviours or skills during performance. It is not for feelings, replacing training activities or issuing licences.","category":"Professional Knowledge","domain":"Professional Knowledge","difficulty":"Medium","sourceType":"Source Question"},{"id":170,"question":"Evaluation tools should be aligned with:","options":["Trainer preference only","Room size","Learning outcomes","Course title only"],"correctAnswer":"C","explanation":"Evaluation tools should be aligned with the learning outcomes, so they measure what the course set out to teach. Trainer preference, room size and course title are not valid anchors.","category":"Professional Practices","domain":"Professional Practices","difficulty":"Medium","sourceType":"Source Question"},{"id":171,"question":"Kirkpatrick Level 1 measures:","options":["Learning","Reaction","Behavior","Results"],"correctAnswer":"B","explanation":"Level 1 is Reaction: how participants respond to the training. Learning is Level 2, Behaviour is Level 3 and Results is Level 4.","category":"Professional Knowledge","domain":"Professional Knowledge","difficulty":"Medium","sourceType":"Source Question"},{"id":172,"question":"Kirkpatrick Level 2 measures:","options":["Reaction","ROI","Learning","Room satisfaction only"],"correctAnswer":"C","explanation":"Level 2 is Learning: knowledge, skills or attitudes gained. Reaction is Level 1, and ROI is the extra level that Phillips adds, not a Kirkpatrick level.","category":"Professional Knowledge","domain":"Professional Knowledge","difficulty":"Medium","sourceType":"Source Question"},{"id":173,"question":"Kirkpatrick Level 3 measures:","options":["Immediate satisfaction only","Behavior or workplace application","Certificate completion","Training cost"],"correctAnswer":"B","explanation":"Level 3 is Behaviour: whether trainees apply what they learned at work. Immediate satisfaction is Level 1, and certificate completion and training cost do not measure workplace application.","category":"Professional Knowledge","domain":"Professional Knowledge","difficulty":"Medium","sourceType":"Source Question"},{"id":174,"question":"Kirkpatrick Level 4 measures:","options":["Trainer biography","Slide quality only","Organizational results","Attendance only"],"correctAnswer":"C","explanation":"Level 4 is Results: organisational impact such as productivity, quality or safety. Trainer biography, slide quality and attendance say nothing about organisational results.","category":"Professional Knowledge","domain":"Professional Knowledge","difficulty":"Medium","sourceType":"Source Question"},{"id":175,"question":"A satisfaction survey immediately after training mainly measures:","options":["Learning","Behavior","Reaction","Results"],"correctAnswer":"C","explanation":"A satisfaction survey right after training measures Reaction (Level 1). It cannot show learning, behaviour change or results, because a happy trainee does not prove any of them.","category":"Professional Knowledge","domain":"Professional Knowledge","difficulty":"Medium","sourceType":"Source Question"},{"id":176,"question":"A test before and after training mainly measures:","options":["Reaction","Learning","Results only","ROI only"],"correctAnswer":"B","explanation":"A test before and after training measures Learning (Level 2) by showing improvement. Reaction measures opinions, and results and ROI look at organisational and financial impact.","category":"Professional Knowledge","domain":"Professional Knowledge","difficulty":"Medium","sourceType":"Source Question"},{"id":177,"question":"Supervisor observation after training mainly measures:","options":["Reaction only","Room quality","Behavior or application","Registration accuracy"],"correctAnswer":"C","explanation":"A supervisor observing staff after training measures Behaviour or application on the job (Level 3). Reaction is immediate satisfaction, and room quality and registration accuracy are unrelated.","category":"Professional Knowledge","domain":"Professional Knowledge","difficulty":"Medium","sourceType":"Source Question"},{"id":178,"question":"Increased productivity after training is an example of:","options":["Reaction","Results","Attendance","Certificate quality"],"correctAnswer":"B","explanation":"Increased productivity after training is an organisational result (Level 4). Reaction is opinion, and attendance and certificate quality are not impact measures.","category":"Professional Knowledge","domain":"Professional Knowledge","difficulty":"Medium","sourceType":"Source Question"},{"id":179,"question":"Phillips ROI adds which level to Kirkpatrick?","options":["Room design","Return on investment","Trainer satisfaction","Attendance confirmation"],"correctAnswer":"B","explanation":"Phillips adds Return on Investment as a fifth level to Kirkpatrick's four, converting impact into financial terms. Room design, trainer satisfaction and attendance confirmation are not levels.","category":"Professional Knowledge","domain":"Professional Knowledge","difficulty":"Medium","sourceType":"Source Question"},{"id":180,"question":"ROI is calculated as:","options":["Costs divided by attendance","Satisfaction divided by learning","Number of trainees multiplied by hours","Program benefits minus costs, divided by costs, multiplied by 100"],"correctAnswer":"D","explanation":"ROI = (programme benefits − programme costs) ÷ programme costs × 100. The other options are meaningless ratios.","category":"Professional Knowledge","domain":"Professional Knowledge","difficulty":"Medium","sourceType":"Source Question"},{"id":181,"question":"Transfer of learning means:","options":["Moving trainees to another room","Applying what was learned in the workplace or real context","Translating materials","Changing the trainer"],"correctAnswer":"B","explanation":"Transfer of learning means applying what was learned in the workplace or real context. It is not about moving rooms, translating materials or changing trainers.","category":"Professional Knowledge","domain":"Professional Knowledge","difficulty":"Medium","sourceType":"Source Question"},{"id":182,"question":"Transfer of learning improves when:","options":["Training is unrelated to work","Feedback is absent","Managers support application after training","Trainees are not followed up"],"correctAnswer":"C","explanation":"Transfer improves when managers support application after training. Unrelated training, absent feedback and no follow-up all reduce it.","category":"Professional Practices","domain":"Professional Practices","difficulty":"Medium","sourceType":"Source Question"},{"id":183,"question":"A practical action plan after training supports:","options":["Certificate printing","Transfer of learning","Attendance counting","Course marketing"],"correctAnswer":"B","explanation":"A practical action plan after training helps trainees apply what they learned, which supports transfer of learning. It does not relate to certificate printing, attendance counting or marketing.","category":"Professional Practices","domain":"Professional Practices","difficulty":"Medium","sourceType":"Source Question"},{"id":184,"question":"One barrier to transfer of learning is:","options":["Clear objectives","Practical activities","Follow-up feedback","Lack of workplace support"],"correctAnswer":"D","explanation":"Lack of workplace support is a barrier to transfer: trainees cannot use new skills if the job environment does not allow it. Clear objectives, practical activities and follow-up feedback help transfer.","category":"Professional Practices","domain":"Professional Practices","difficulty":"Medium","sourceType":"Source Question"},{"id":185,"question":"Synchronous online training means:","options":["Self-paced training only","Printed training","Live online training","No trainer involvement"],"correctAnswer":"C","explanation":"Synchronous online training is live online training with real-time interaction. Self-paced training is asynchronous, printed training is not online, and a synchronous session still involves a trainer.","category":"Future Skills","domain":"Future Skills","difficulty":"Medium","sourceType":"Source Question"},{"id":186,"question":"Asynchronous online training means:","options":["Face-to-face training only","Self-paced training that does not require live attendance","Training without content","Training without assessment"],"correctAnswer":"B","explanation":"Asynchronous training is self-paced and does not require live attendance. Face-to-face is a different mode, and asynchronous courses still have content and should include assessment.","category":"Future Skills","domain":"Future Skills","difficulty":"Medium","sourceType":"Source Question"},{"id":187,"question":"Blended training means:","options":["Lecture only","Online exams only","A combination of face-to-face and online training","Group work only"],"correctAnswer":"C","explanation":"Blended training combines face-to-face and online learning. Lecture only, online exams only and group work only are single-method options.","category":"Future Skills","domain":"Future Skills","difficulty":"Medium","sourceType":"Source Question"},{"id":188,"question":"Good asynchronous e-training should include:","options":["Long text-heavy content only","No assessment","Short modules, interaction, feedback, and clear navigation","No structure"],"correctAnswer":"C","explanation":"Good asynchronous e-training uses short modules, interaction, feedback and clear navigation. Long text-heavy content, no assessment and no structure lead to drop-out.","category":"Future Skills","domain":"Future Skills","difficulty":"Medium","sourceType":"Source Question"},{"id":189,"question":"A common risk in asynchronous training is:","options":["Too much eye contact","Lower engagement due to lack of live social interaction","Excessive room interaction","Overuse of physical materials"],"correctAnswer":"B","explanation":"The common risk in asynchronous training is lower engagement because there is no live social interaction. Too much eye contact, excessive room interaction and overuse of physical materials are not risks of online self-paced study.","category":"Future Skills","domain":"Future Skills","difficulty":"Medium","sourceType":"Source Question"},{"id":190,"question":"Digital tools in training can be used for:","options":["Replacing objectives","Interaction, evaluation, communication, and tracking progress","Eliminating feedback","Avoiding trainer responsibility"],"correctAnswer":"B","explanation":"Digital tools support interaction, evaluation, communication and tracking progress. They do not replace objectives, eliminate feedback or remove the trainer's responsibility.","category":"Future Skills","domain":"Future Skills","difficulty":"Medium","sourceType":"Source Question"},{"id":191,"question":"Which behavior violates professional ethics?","options":["Respecting trainee opinions","Sharing trainee personal data without permission","Giving constructive feedback","Protecting confidentiality"],"correctAnswer":"B","explanation":"Sharing trainees' personal data without permission breaches confidentiality, a core ethical duty (Standards 6.1 and 7.2). Respecting opinions, giving constructive feedback and protecting confidentiality are ethical behaviours.","category":"Professional Values and Responsibilities","domain":"Professional Values and Responsibilities","difficulty":"Medium","sourceType":"Source Question"},{"id":192,"question":"Using copyrighted material without permission or citation violates:","options":["Time management only","Training design alignment","Intellectual property and academic integrity","Kirkpatrick Level 2"],"correctAnswer":"C","explanation":"Using copyrighted material without permission or citation breaches intellectual property and academic integrity (Standard 7.2). Time management, design alignment and Kirkpatrick Level 2 are unrelated.","category":"Professional Values and Responsibilities","domain":"Professional Values and Responsibilities","difficulty":"Medium","sourceType":"Source Question"},{"id":193,"question":"Fairness in evaluation means:","options":["Giving high scores to friends","Changing criteria after the test","Applying clear criteria objectively to all trainees","Ignoring evidence"],"correctAnswer":"C","explanation":"Fairness means applying clear criteria objectively to all trainees. Favouring friends, changing criteria after the test or ignoring evidence is bias (Standards 6.2 and 7.1).","category":"Professional Values and Responsibilities","domain":"Professional Values and Responsibilities","difficulty":"Medium","sourceType":"Source Question"},{"id":194,"question":"Confidentiality requires the trainer to:","options":["Publish all trainee results publicly","Protect trainee information","Share private data with others","Discuss trainee weaknesses openly"],"correctAnswer":"B","explanation":"Confidentiality means protecting trainee information and sharing it only with authorised people for a legitimate purpose. Publishing results, sharing private data or discussing weaknesses openly breaches it (Standard 7.2).","category":"Professional Values and Responsibilities","domain":"Professional Values and Responsibilities","difficulty":"Medium","sourceType":"Source Question"},{"id":195,"question":"Continuous professional development means:","options":["The trainer stops learning after licensing","The trainer avoids feedback","The trainer keeps improving knowledge, skills, and professional practice","The trainer repeats the same material forever"],"correctAnswer":"C","explanation":"CPD is the continuing effort to improve knowledge, skills and practice, guided by reflection and feedback (Standard 8). Stopping after licensing, avoiding feedback or repeating the same material forever is the opposite.","category":"Professional Values and Responsibilities","domain":"Professional Values and Responsibilities","difficulty":"Medium","sourceType":"Source Question"},{"id":196,"question":"Critical thinking helps the trainer to:","options":["Avoid evidence","Memorize only","Analyze situations and make reasoned decisions","Ignore trainee problems"],"correctAnswer":"C","explanation":"Critical thinking helps the trainer analyse situations and make reasoned, evidence-based decisions. It does not mean avoiding evidence, memorising only or ignoring problems.","category":"Future Skills","domain":"Future Skills","difficulty":"Medium","sourceType":"Source Question"},{"id":197,"question":"Innovation in training means:","options":["Changing activities randomly","Using new or improved methods to enhance learning","Removing assessment","Avoiding technology"],"correctAnswer":"B","explanation":"Innovation means using new or improved methods to enhance learning. Random changes, removing assessment or avoiding technology is not innovation.","category":"Future Skills","domain":"Future Skills","difficulty":"Medium","sourceType":"Source Question"},{"id":198,"question":"Digital skills are important because trainers need to:","options":["Replace all human interaction","Avoid assessment","Use technology effectively and safely in training and professional practice","Ignore data security"],"correctAnswer":"C","explanation":"Digital skills let trainers use technology effectively and safely in training and professional practice. They do not replace human interaction, avoid assessment or ignore data security.","category":"Future Skills","domain":"Future Skills","difficulty":"Medium","sourceType":"Source Question"},{"id":199,"question":"Social-emotional skills help trainers to:","options":["Focus only on technical content","Communicate, empathize, manage relationships, and support a positive environment","Avoid interaction","Eliminate participation"],"correctAnswer":"B","explanation":"Social-emotional skills help trainers communicate, empathise, manage relationships and support a positive environment (Standard 9). Focusing only on technical content, avoiding interaction or eliminating participation would damage the learning climate.","category":"Future Skills","domain":"Future Skills","difficulty":"Medium","sourceType":"Source Question"},{"id":200,"question":"The best description of a modern trainer is:","options":["A speaker who only delivers information","A facilitator of learning and designer of learning experiences","A person who controls all discussion","A certificate distributor"],"correctAnswer":"B","explanation":"A modern trainer facilitates learning and designs learning experiences, rather than only delivering information. A speaker who only presents, a person who controls all discussion, or a certificate distributor describes outdated or administrative roles.","category":"Future Skills","domain":"Future Skills","difficulty":"Medium","sourceType":"Source Question"},{"id":201,"question":"In the ARCS model, which element is most directly addressed when a trainer uses an unexpected case or question to capture trainee interest?","options":["Attention","Relevance","Confidence","Satisfaction"],"correctAnswer":"A","explanation":"Using an unexpected case or question to capture interest addresses Attention, the first ARCS element. Relevance links content to the job, Confidence builds belief in success, and Satisfaction gives reinforcement and accomplishment.","category":"Professional Knowledge","domain":"Professional Knowledge","difficulty":"Medium","sourceType":"Source Question"},{"id":202,"question":"A trainee asks, “How does this course help my actual job?” Which ARCS element should the trainer strengthen first?","options":["Satisfaction","Confidence","Relevance","Attention"],"correctAnswer":"C","explanation":"A trainee asking how the course helps their actual job is asking about Relevance, so strengthen that first by linking content to their work. Attention is about interest, Confidence about belief in success, and Satisfaction about reward.","category":"Professional Knowledge","domain":"Professional Knowledge","difficulty":"Medium","sourceType":"Source Question"},{"id":203,"question":"According to Self-Determination Theory, motivation is strengthened when training supports:","options":["Autonomy, competence, and relatedness","Attendance, testing, and certificates","Costs, benefits, and ROI","Rules, penalties, and control"],"correctAnswer":"A","explanation":"Self-Determination Theory says motivation is strengthened by supporting autonomy (choice), competence (mastery) and relatedness (connection). Attendance and certificates, costs and ROI, and rules and penalties are external controls that do not build intrinsic motivation.","category":"Professional Knowledge","domain":"Professional Knowledge","difficulty":"Medium","sourceType":"Source Question"},{"id":204,"question":"In Expectancy Theory, motivation is weak if trainees believe that:","options":["Effort will lead to better performance","Good performance will lead to valued outcomes","The outcome is valuable","Effort will not improve performance or outcomes"],"correctAnswer":"D","explanation":"In Expectancy Theory motivation is weak when trainees believe effort will not improve performance or outcomes. Options A, B and C are all beliefs that would increase motivation.","category":"Professional Knowledge","domain":"Professional Knowledge","difficulty":"Medium","sourceType":"Source Question"},{"id":205,"question":"Goal Setting Theory suggests that performance improves most when goals are:","options":["General and easy","Specific, challenging, and supported by feedback","Hidden from trainees","Changed after evaluation"],"correctAnswer":"B","explanation":"Goal Setting Theory says performance improves most when goals are specific, challenging and supported by feedback. General and easy goals do not stretch performance, hidden goals cannot guide effort, and changing goals after evaluation removes their purpose.","category":"Professional Knowledge","domain":"Professional Knowledge","difficulty":"Medium","sourceType":"Source Question"},{"id":206,"question":"Understanding by Design (UbD) is best described as:","options":["Starting with slides and then writing objectives","Backward design: start with desired results and evidence, then plan learning","A model used only for ROI calculation","A seating arrangement method"],"correctAnswer":"B","explanation":"Understanding by Design is backward design: start with the desired results, decide the evidence of learning, then plan the learning. Starting with slides reverses it, and it is not an ROI model or a seating method.","category":"Professional Knowledge","domain":"Professional Knowledge","difficulty":"Medium","sourceType":"Source Question"},{"id":207,"question":"Merrill First Principles emphasize that effective instruction should be:","options":["Problem-centered with activation, demonstration, application, and integration","Based only on lectures","Focused only on trainee satisfaction","Unstructured and informal"],"correctAnswer":"A","explanation":"Merrill's First Principles say effective instruction is problem-centred and follows activation, demonstration, application and integration. Lecture-only, satisfaction-only or unstructured teaching does not fit.","category":"Professional Knowledge","domain":"Professional Knowledge","difficulty":"Medium","sourceType":"Source Question"},{"id":208,"question":"Which of Gagne Nine Events should happen early to help trainees understand what they are expected to learn?","options":["Enhance retention only","Inform learners of objectives","Assess performance only","Print certificates"],"correctAnswer":"B","explanation":"Informing learners of the objectives is the Gagné event that comes early and tells trainees what they are expected to learn. Enhancing retention comes late, assessing performance comes late, and printing certificates is not an event.","category":"Professional Knowledge","domain":"Professional Knowledge","difficulty":"Medium","sourceType":"Source Question"},{"id":209,"question":"In Dick and Carey model, instruction is viewed mainly as:","options":["A collection of independent slides","A systems approach linking goals, learners, context, instruction, assessment, and revision","A trainer personality test","A financial model"],"correctAnswer":"B","explanation":"Dick and Carey is a systems approach that links goals, learners, context, instruction, assessment and revision. It does not treat instruction as independent slides, a personality test or a financial model.","category":"Professional Knowledge","domain":"Professional Knowledge","difficulty":"Medium","sourceType":"Source Question"},{"id":210,"question":"A trainer removes irrelevant graphics and splits complex information into smaller steps. This mainly reduces:","options":["Intrinsic motivation","Extraneous cognitive load","Professional ethics","Transfer support"],"correctAnswer":"B","explanation":"Removing irrelevant graphics and splitting complex information into steps reduces extraneous cognitive load, the unnecessary mental effort caused by poor presentation. It does not target intrinsic motivation, ethics or transfer support.","category":"Professional Knowledge","domain":"Professional Knowledge","difficulty":"Medium","sourceType":"Source Question"},{"id":211,"question":"An assessment that asks trainees to handle a realistic workplace scenario is best described as:","options":["Authentic assessment","Random assessment","Norm-free assessment","Attendance assessment"],"correctAnswer":"A","explanation":"A task that asks trainees to handle a realistic workplace scenario is authentic assessment, which evaluates performance through realistic tasks. Random, 'norm-free' and attendance assessment are not recognised types for this.","category":"Professional Practices","domain":"Professional Practices","difficulty":"Medium","sourceType":"Source Question"},{"id":212,"question":"Reliability of an evaluation tool means that it:","options":["Measures exactly what it should measure","Produces consistent results under similar conditions","Is always difficult","Requires no criteria"],"correctAnswer":"B","explanation":"Reliability means the tool produces consistent results under similar conditions. 'Measures what it should' is validity, and a reliable tool is not necessarily difficult or criteria-free.","category":"Professional Knowledge","domain":"Professional Knowledge","difficulty":"Medium","sourceType":"Source Question"},{"id":213,"question":"Validity of an evaluation tool means that it:","options":["Measures what it is intended to measure","Gives the same score to everyone","Is short","Avoids evidence"],"correctAnswer":"A","explanation":"Validity means the tool measures what it is intended to measure. Giving the same score to everyone, being short or avoiding evidence are not validity. Do not confuse it with reliability (consistency).","category":"Professional Knowledge","domain":"Professional Knowledge","difficulty":"Medium","sourceType":"Source Question"},{"id":214,"question":"Root Cause Analysis is used to:","options":["Find underlying causes of a performance problem","Select slide colors","Increase attendance automatically","Avoid asking stakeholders"],"correctAnswer":"A","explanation":"Root cause analysis finds the underlying causes of a performance problem rather than treating symptoms. It has nothing to do with slide colours, automatic attendance gains, or avoiding stakeholders (who should be asked).","category":"Professional Practices","domain":"Professional Practices","difficulty":"Medium","sourceType":"Source Question"},{"id":215,"question":"Human Performance Improvement (HPI) differs from a training-only approach because it:","options":["Assumes every problem is solved by a course","Looks systemically at performance and may recommend non-training interventions","Focuses only on learner satisfaction","Eliminates evaluation"],"correctAnswer":"B","explanation":"HPI looks systemically at performance and may recommend non-training interventions such as job aids, process redesign or incentives. A training-only approach assumes every problem needs a course. HPI does not focus only on satisfaction or eliminate evaluation.","category":"Professional Practices","domain":"Professional Practices","difficulty":"Medium","sourceType":"Source Question"},{"id":216,"question":"Systems thinking in training means:","options":["Viewing problems as isolated events only","Examining relationships, patterns, causes, and wider effects","Ignoring organizational culture","Avoiding data"],"correctAnswer":"B","explanation":"Systems thinking examines relationships, patterns, causes and wider effects. Viewing problems as isolated events, ignoring organisational culture and avoiding data are the opposite.","category":"Professional Knowledge","domain":"Professional Knowledge","difficulty":"Medium","sourceType":"Source Question"},{"id":217,"question":"TPACK is about integrating:","options":["Technology, pedagogy, and content knowledge","Training prices, attendance, and certificates","Tests, policies, and compliance","Time, people, and costs only"],"correctAnswer":"A","explanation":"TPACK integrates Technology, Pedagogy and Content Knowledge: effective technology use requires understanding all three together. The other options mix in prices, policies or resources.","category":"Future Skills","domain":"Future Skills","difficulty":"Medium","sourceType":"Source Question"},{"id":218,"question":"In the SAMR model, using technology to create tasks previously impossible is called:","options":["Substitution","Augmentation","Modification","Redefinition"],"correctAnswer":"D","explanation":"In SAMR (Substitution, Augmentation, Modification, Redefinition), using technology to create tasks previously impossible is Redefinition, the highest level. Substitution swaps tools, Augmentation adds functionality, and Modification redesigns the task.","category":"Future Skills","domain":"Future Skills","difficulty":"Medium","sourceType":"Source Question"},{"id":219,"question":"SCORM is mainly related to:","options":["E-learning content packaging and LMS interoperability","Face-to-face seating design","Trainer ethics code","Classroom decoration"],"correctAnswer":"A","explanation":"SCORM is a standard for packaging e-learning content so it works across learning management systems (interoperability). It has no connection to seating, ethics or classroom decoration.","category":"Future Skills","domain":"Future Skills","difficulty":"Medium","sourceType":"Source Question"},{"id":220,"question":"Professional Learning Communities are best described as:","options":["Individual work without sharing","Collaborative groups using reflection, data, and shared learning for continuous improvement","A final exam committee only","A marketing channel"],"correctAnswer":"B","explanation":"A professional learning community is a collaborative group that uses reflection, data and shared learning for continuous improvement (Standard 8.2.2). Working alone, an exam committee or a marketing channel is not one.","category":"Professional Values and Responsibilities","domain":"Professional Values and Responsibilities","difficulty":"Medium","sourceType":"Source Question"},{"id":221,"question":"According to Standard 6.1 of the official ETEC trainer standards, a trainer's commitment to professional ethics and national regulations is primarily meant to ensure:","options":["Higher training fees","Quality assurance systems in training","Longer certificate validity periods","Fewer required training hours"],"correctAnswer":"B","explanation":"Standard 6.1 commits the trainer to professional ethics, national regulations and quality assurance systems, so its purpose is quality assurance in training. It does not concern fees, certificate validity or required hours.","category":"Professional Values and Responsibilities","domain":"Professional Values and Responsibilities","difficulty":"Medium","sourceType":"Additional Practice Question"},{"id":222,"question":"Standard 6.2 requires a trainer to be aware of which of the following in all their practices?","options":["Only their personal duties, not their rights","Rights, duties, discipline, and responsibilities","Only the training entity's holiday schedule","Marketing procedures for new courses"],"correctAnswer":"B","explanation":"Standard 6.2 requires awareness of rights, duties, discipline and responsibilities in all practices. Knowing only duties but not rights, the entity's holiday schedule or marketing procedures is not what it asks.","category":"Professional Values and Responsibilities","domain":"Professional Values and Responsibilities","difficulty":"Medium","sourceType":"Additional Practice Question"},{"id":223,"question":"Standard 7.1 (commitment to citizenship values) is meant to apply to a trainer's:","options":["Personal finances only","All professional relationships and practices","Only their relationship with the training entity's owner","Only fully online training sessions"],"correctAnswer":"B","explanation":"Standard 7.1 applies citizenship values to all professional relationships and practices. It is not limited to personal finances, one relationship or online sessions.","category":"Professional Values and Responsibilities","domain":"Professional Values and Responsibilities","difficulty":"Medium","sourceType":"Additional Practice Question"},{"id":224,"question":"Which pair of values does Standard 7.2 require a trainer to commit to in all their practices?","options":["Marketing and sales technique","Scientific integrity and confidentiality","Punctuality and attendance only","Creativity and innovation"],"correctAnswer":"B","explanation":"Standard 7.2 requires commitment to scientific integrity and confidentiality in all practices. Marketing technique, punctuality alone and creativity are not named in it.","category":"Professional Values and Responsibilities","domain":"Professional Values and Responsibilities","difficulty":"Medium","sourceType":"Additional Practice Question"},{"id":225,"question":"A trainer keeps trainee assessment records private and never shares them without proper authorization. This mainly reflects the domain of:","options":["Professional Knowledge","Professional Practices","Professional Values and Responsibilities","Future Skills"],"correctAnswer":"C","explanation":"Keeping assessment records private and sharing them only with authorisation reflects confidentiality, which belongs to Professional Values and Responsibilities (Standard 7.2). Knowledge is about theory, Practices about planning and delivery, and Future Skills about thinking and social skills.","category":"Professional Values and Responsibilities","domain":"Professional Values and Responsibilities","difficulty":"Easy","sourceType":"Additional Practice Question"},{"id":226,"question":"Standard 8.1 describes continuous professional development mainly as:","options":["Pursuing knowledge, training, and labor market developments and updates","Repeating the same training content every year without change","Avoiding the use of any new teaching tools","Waiting for the training entity to assign development activities"],"correctAnswer":"A","explanation":"Standard 8.1 describes CPD as pursuing knowledge, training and labour-market developments and updates. Repeating content every year, avoiding new tools and waiting to be assigned activities are the opposite of continuous development.","category":"Professional Values and Responsibilities","domain":"Professional Values and Responsibilities","difficulty":"Medium","sourceType":"Additional Practice Question"},{"id":227,"question":"Standard 8.2 expects a trainer to develop professionally mainly by:","options":["Working in isolation from other trainers","Conducting research and participating in professional learning activities and communities","Focusing only on administrative paperwork","Avoiding feedback from trainees and colleagues"],"correctAnswer":"B","explanation":"Standard 8.2 expects a trainer to conduct research and take part in professional learning activities and communities. Working in isolation, focusing on paperwork or avoiding feedback blocks development.","category":"Professional Values and Responsibilities","domain":"Professional Values and Responsibilities","difficulty":"Medium","sourceType":"Additional Practice Question"},{"id":228,"question":"Per Standard 8.3, a trainer's professional development plan should be prepared and followed up mainly based on:","options":["Randomly chosen topics with no analysis","Feedback and practice analysis","Trainee attendance numbers only","The training center's marketing calendar"],"correctAnswer":"B","explanation":"Standard 8.3 says a development plan is prepared and followed up based on feedback and analysis of practice. Random topics, attendance numbers or a marketing calendar do not identify real development needs.","category":"Professional Values and Responsibilities","domain":"Professional Values and Responsibilities","difficulty":"Medium","sourceType":"Additional Practice Question"},{"id":229,"question":"A trainer is designing a leadership module for senior supervisors. Instead of delivering a standard lecture on project management principles, the trainer asks participants to analyze a real, failed project from their own department and construct a new workflow based on their past operational experience. Which learning theory is the trainer primarily applying?","options":["Behaviourism","Cognitivism","Constructivism","Social Learning Theory"],"correctAnswer":"C","explanation":"Asking senior supervisors to analyse a failed project from their own department and build a new workflow from their experience is Constructivism: learners build knowledge on prior experience. Behaviourism shapes behaviour with consequences, Cognitivism focuses o
