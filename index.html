in with a long theory lecture and leave safety until later","Let trainees explore the machines alone to build confidence first"],"correctAnswer":"B","explanation":"Safety comes first: brief trainees on rules and hazards and check the equipment before anyone uses it. Skipping the briefing, leaving safety until after theory, or letting trainees explore alone exposes them to avoidable risk. (Standard 4.1.4)","category":"Training Environment & Delivery","domain":"Professional Practices","difficulty":"Easy","sourceType":"Standards Question"},{"id":322,"question":"A trainer asks trainees to investigate a problem and propose creative solutions. Which aim does this support?","options":["Motivating inquiry, active learning and innovation","Encouraging passive listening so that content is covered quickly","Reducing participation so that the trainer keeps control of pace","Replacing assessment with informal chat at the end of the day"],"correctAnswer":"A","explanation":"Investigating a problem and proposing creative solutions motivates inquiry, active learning and innovation. Passive listening, reduced participation and replacing assessment with chat do the opposite or avoid the aim. (Standard 4.1.2)","category":"Training Environment & Delivery","domain":"Professional Practices","difficulty":"Medium","sourceType":"Standards Question"},{"id":323,"question":"Which activity best encourages collaboration and positive relationships?","options":["Mixed-ability team tasks with a shared goal","Silent individual reading with no discussion during the session","A lecture of the usual length followed by an open question","Competition between individuals with no shared goal or teamwork"],"correctAnswer":"A","explanation":"Mixed-ability team tasks with a shared goal build teamwork and positive relationships. Silent reading, a lecture with one question and individual competition do not require trainees to work together. (Standard 4.1.3)","category":"Training Environment & Delivery","domain":"Professional Practices","difficulty":"Medium","sourceType":"Standards Question"},{"id":324,"question":"Which design choice best helps training transfer to the job?","options":["Abstract theory presented in detail, with practice left for later","Practical tasks linked to real workplace situations","Longer slide decks covering more content in each session","Entertaining games that are unrelated to workplace tasks"],"correctAnswer":"B","explanation":"Practical tasks linked to real workplace situations help training transfer to the job. Abstract theory with practice left for later, longer slide decks and unrelated games do not connect learning to work.","category":"Training Environment & Delivery","domain":"Professional Practices","difficulty":"Medium","sourceType":"Standards Question"},{"id":325,"question":"Why should a trainer vary the activities within one session?","options":["To reach trainees with different abilities, interests and needs","To fill the available time without preparing further content","To make assessment unnecessary for the quicker trainees","To avoid detailed planning by changing activity every few minutes"],"correctAnswer":"A","explanation":"Varying activities reaches trainees with different abilities, interests and needs. Filling time, avoiding assessment and skipping planning are not valid reasons, and changing activity every few minutes without a plan is poor design. (Standard 4.2.2)","category":"Training Environment & Delivery","domain":"Professional Practices","difficulty":"Medium","sourceType":"Standards Question"},{"id":326,"question":"Which activity encourages trainees to check their own progress?","options":["A self-assessment checklist against the outcomes","An attendance sheet signed at the start of each session","Ranking trainees publicly from highest to lowest score","The trainer's private marking, shared only at the end"],"correctAnswer":"A","explanation":"A self-assessment checklist against the outcomes lets trainees check their own progress. An attendance sheet records presence, public ranking creates pressure, and private marking shared only at the end gives them no chance to self-check. (Standard 5.1.2)","category":"Evaluation & Reporting","domain":"Professional Practices","difficulty":"Easy","sourceType":"Standards Question"},{"id":327,"question":"Which feedback best guides a trainee's future performance?","options":["A single final mark returned with no comment at the end","General praise such as 'well done' given to the whole group","Specific, ongoing comments on what to keep and what to improve","Detailed feedback returned several weeks after the activity"],"correctAnswer":"C","explanation":"Specific, ongoing comments on what to keep and what to improve guide future performance. A single mark with no comment, general praise for the group, or feedback weeks late cannot direct improvement. (Standard 5.1.3)","category":"Evaluation & Reporting","domain":"Professional Practices","difficulty":"Medium","sourceType":"Standards Question"},{"id":328,"question":"A trainer exports LMS assessment data to see which outcomes trainees find hardest. This is mainly:","options":["Designing an icebreaker for the start of the next session","Marketing the course to future trainees using the results","Collecting and analysing evaluation data","Booking rooms and resources for the next programme"],"correctAnswer":"C","explanation":"Exporting LMS assessment data to see which outcomes trainees find hardest is collecting and analysing evaluation data. It is not about an icebreaker, marketing or booking rooms.","category":"Evaluation & Reporting","domain":"Professional Practices","difficulty":"Medium","sourceType":"Standards Question"},{"id":329,"question":"Which of these belongs in an evaluation report?","options":["Only the names of trainees and the dates of attendance","Only the trainer's personal opinions about the course","Findings, interpretation and recommendations for improvement","Only the cost of the room and the catering used"],"correctAnswer":"C","explanation":"An evaluation report documents findings, interprets them and gives recommendations for improvement. A list of names and attendance dates, personal opinions or the room and catering cost do not document results. (Standard 5.2.3)","category":"Evaluation & Reporting","domain":"Professional Practices","difficulty":"Medium","sourceType":"Standards Question"},{"id":330,"question":"Diagnostic, formative and summative assessment take place, in that order:","options":["At the end, before and during training, in that order","Only at the end of training, when marks are final","Before, during and at the end of training","During, after and before training, in that order"],"correctAnswer":"C","explanation":"Diagnostic assessment comes before training, formative during it, and summative at the end. Option A reverses the order, B ignores the first two types, and D scrambles the sequence. (Standard 5.1.1)","category":"Evaluation & Reporting","domain":"Professional Practices","difficulty":"Medium","sourceType":"Standards Question"},{"id":331,"question":"Why are several assessment tools used within one programme?","options":["To avoid giving feedback until the programme has ended","To measure different outcomes and levels of performance","To collect less evidence so that reporting is quicker","To make the course longer and give trainees more to do"],"correctAnswer":"B","explanation":"Different tools measure different outcomes and levels of performance, giving a fuller picture. Using several tools is not meant to delay feedback, collect less evidence or lengthen the course. (Standard 5.1)","category":"Evaluation & Reporting","domain":"Professional Practices","difficulty":"Medium","sourceType":"Standards Question"},{"id":332,"question":"Which action shows that a trainer applies the code of ethics?","options":["Ignoring organisational policies when they slow the course down","Treating all trainees fairly and keeping assessments honest","Publishing every trainee's marks on an open noticeboard","Favouring trainees who agree with the trainer's own views"],"correctAnswer":"B","explanation":"Applying the code of ethics means treating all trainees fairly and keeping assessments honest. Ignoring policies, publishing marks publicly (a confidentiality breach) and favouring trainees who agree with you all violate it. (Standard 6.1.1)","category":"Ethics & Quality Assurance","domain":"Professional Values and Responsibilities","difficulty":"Medium","sourceType":"Standards Question"},{"id":333,"question":"Quality assurance in training means:","options":["Applying systems and procedures that keep standards consistent and improving","Reducing the number of course hours to cut running costs","Testing trainees only once, at the end of the programme","Ignoring feedback unless a formal complaint is made"],"correctAnswer":"A","explanation":"Quality assurance means applying systems and procedures that keep standards consistent and improving. Cutting hours, testing once and ignoring feedback unless there is a formal complaint all reduce quality. (Standard 6.1.3)","category":"Ethics & Quality Assurance","domain":"Professional Values and Responsibilities","difficulty":"Medium","sourceType":"Standards Question"},{"id":334,"question":"A trainer often arrives late and misses deadlines. Which professional value is affected?","options":["Discipline and responsibility","Generosity towards colleagues and visitors","Respect for national symbols and ceremonies","Creativity in the design of lesson materials"],"correctAnswer":"A","explanation":"Arriving late and missing deadlines breaches discipline and responsibility, meaning finishing tasks on time. Generosity, respect for national ceremonies and creativity in design are different values. (Standard 6.2.2)","category":"Ethics & Quality Assurance","domain":"Professional Values and Responsibilities","difficulty":"Easy","sourceType":"Standards Question"},{"id":335,"question":"Which is a trainee's right that the trainer must respect?","options":["Seeing the personal data and results of other trainees","Choosing their own marks after the assessment is complete","Fair treatment and clear information about how they will be assessed","Skipping any assessment they dislike without consequences"],"correctAnswer":"C","explanation":"Trainees have the right to fair treatment and clear information on how they will be assessed. They do not have the right to see other trainees' personal data, set their own marks or skip assessments without consequence. (Standard 6.2.1)","category":"Ethics & Quality Assurance","domain":"Professional Values and Responsibilities","difficulty":"Medium","sourceType":"Standards Question"},{"id":336,"question":"A new regulation changes how training records must be kept. What should the trainer do?","options":["Keep using the old method because it has always worked","Wait for trainees to ask about the change in practice","Follow the regulation and update practice and records","Ignore it until an audit or inspection takes place"],"correctAnswer":"C","explanation":"A new regulation must be followed, with practice and records updated to match. Keeping the old method, waiting to be asked or ignoring it until an audit leaves the trainer non-compliant. (Standard 6.1.2)","category":"Ethics & Quality Assurance","domain":"Professional Values and Responsibilities","difficulty":"Medium","sourceType":"Standards Question"},{"id":337,"question":"How can a trainer show responsible citizenship through training?","options":["Put personal views above regulations when they conflict","Avoid any discussion of values to prevent disagreement","Respect national values and regulations, and prepare trainees to contribute to the community","Treat regulations as optional guidance for experienced trainers"],"correctAnswer":"C","explanation":"Responsible citizenship in training means respecting national values and regulations and preparing trainees to contribute to the community. Putting personal views above regulations, avoiding values entirely, or treating regulations as optional does not. (Standard 7.1)","category":"Citizenship, Integrity & Confidentiality","domain":"Professional Values and Responsibilities","difficulty":"Medium","sourceType":"Standards Question"},{"id":338,"question":"A trainer copies a colleague's worksheet and presents it as their own. Which value is breached?","options":["Academic integrity and intellectual property","Teamwork and shared responsibility","Hospitality towards visitors and guests","Punctuality and reliable timekeeping"],"correctAnswer":"A","explanation":"Copying a colleague's worksheet and presenting it as your own breaches academic integrity and intellectual-property principles. Teamwork, hospitality and punctuality are not the values involved. (Standard 7.2)","category":"Citizenship, Integrity & Confidentiality","domain":"Professional Values and Responsibilities","difficulty":"Medium","sourceType":"Standards Question"},{"id":339,"question":"Which practice breaches confidentiality?","options":["Sharing results only with the trainee concerned","Keeping records in secure systems with restricted access","Discussing a trainee's results with colleagues who have no need to know","Protecting digital files with passwords and encryption"],"correctAnswer":"C","explanation":"Discussing a trainee's results with colleagues who have no need to know breaches confidentiality. Sharing results only with the trainee, secure records with restricted access, and passwords or encryption all protect it. (Standard 7.2.4)","category":"Citizenship, Integrity & Confidentiality","domain":"Professional Values and Responsibilities","difficulty":"Medium","sourceType":"Standards Question"},{"id":340,"question":"In a heated discussion, which response best shows moderation?","options":["Allow all views, keep to evidence, and insist on respectful language","Let the loudest participant decide the direction of the discussion","Ban the topic so that no disagreement can arise","Ridicule the most extreme view so that others stay quiet"],"correctAnswer":"A","explanation":"Moderation means allowing views, keeping to evidence and insisting on respectful language. Letting the loudest person decide, banning topics or ridiculing views are not moderation. (Standard 7.1.2)","category":"Citizenship, Integrity & Confidentiality","domain":"Professional Values and Responsibilities","difficulty":"Medium","sourceType":"Standards Question"},{"id":341,"question":"What is the first step in preparing a professional development plan?","options":["Choose the cheapest available course and enrol immediately","Copy a colleague's plan and apply it without changes","Wait until a supervisor assigns a plan for the year","Analyse your own practice and evaluation feedback to identify needs"],"correctAnswer":"D","explanation":"A professional development plan starts with analysing your own practice and evaluation feedback to identify needs. Choosing the cheapest course, copying a colleague's plan or waiting to be assigned one ignores your own needs. (Standard 8.3)","category":"Professional Development","domain":"Professional Values and Responsibilities","difficulty":"Medium","sourceType":"Standards Question"},{"id":342,"question":"What is a professional learning community?","options":["A list of certificates and courses a trainer has completed","A social group of colleagues who meet only to relax","A group of professionals who share practice and learn together to improve their work","A group of trainees who attend the same class together"],"correctAnswer":"C","explanation":"A professional learning community is a group of professionals who share practice and learn together to improve their work. A list of certificates, a purely social group or a class of trainees is not one. (Standard 8.2.2)","category":"Professional Development","domain":"Professional Values and Responsibilities","difficulty":"Easy","sourceType":"Standards Question"},{"id":343,"question":"Which habit best helps a trainer keep up with developments in training and the labour market?","options":["Relying on older textbooks that are known and trusted","Avoiding new tools until the organisation requires them","Following current research, journals and market trends","Reusing the same notes every year to keep content stable"],"correctAnswer":"C","explanation":"Following current research, journals and market trends keeps a trainer current with developments in training and the labour market. Relying on old textbooks, avoiding new tools or reusing the same notes falls behind. (Standard 8.1)","category":"Professional Development","domain":"Professional Values and Responsibilities","difficulty":"Medium","sourceType":"Standards Question"},{"id":344,"question":"A trainer wants to tackle a recurring problem, such as low participation. Which action fits professional development?","options":["Wait for the problem to disappear by itself over time","Investigate the problem, test solutions and share the findings","Blame the trainees and raise the pass mark","Ignore it because every group is slightly different"],"correctAnswer":"B","explanation":"Investigating a recurring problem, testing solutions and sharing the findings is professional development in action. Waiting, blaming trainees or ignoring it leaves the problem unsolved. (Standard 8.2.1)","category":"Professional Development","domain":"Professional Values and Responsibilities","difficulty":"Hard","sourceType":"Standards Question"},{"id":345,"question":"How should a trainer monitor progress against a development plan?","options":["Never review the plan, to avoid becoming discouraged","Review indicators and evidence of progress at set intervals","Ask only the trainees, who may not know the plan","Check progress once at the end of five years"],"correctAnswer":"B","explanation":"Review indicators and evidence of progress at set intervals, so you can adjust the plan. Never reviewing it, asking only trainees who may not know the plan, or checking once after five years cannot guide development.","category":"Professional Development","domain":"Professional Values and Responsibilities","difficulty":"Medium","sourceType":"Standards Question"},{"id":346,"question":"Self-reflection supports development mainly by:","options":["Avoiding change so that practice stays consistent","Replacing all outside feedback with the trainer's own opinion","Counting attendance figures as the main measure of quality","Analysing practice and setting development goals and priorities"],"correctAnswer":"D","explanation":"Self-reflection supports development by analysing your practice and setting goals and priorities. It does not replace outside feedback, avoid change, or reduce quality to attendance figures. (Standard 8.3.1)","category":"Professional Development","domain":"Professional Values and Responsibilities","difficulty":"Medium","sourceType":"Standards Question"},{"id":347,"question":"Which source of feedback is MOST useful for identifying development needs?","options":["Anonymous social-media comments about the programme","One trainee's comment, taken as the whole picture","The trainer's own mood on the day of the session","Trainees, stakeholders and the training provider, analysed together"],"correctAnswer":"D","explanation":"The most useful feedback comes from trainees, stakeholders and the training provider, analysed together, which gives a balanced picture. Anonymous social-media comments, one trainee's remark and the trainer's mood are unreliable.","category":"Professional Development","domain":"Professional Values and Responsibilities","difficulty":"Hard","sourceType":"Standards Question"},{"id":348,"question":"A trainer wants trainees to feel understood. Which behaviour shows empathy?","options":["Listening, acknowledging feelings and responding to needs","Ignoring emotions so the session keeps to schedule","Interrupting to correct them as soon as they make a mistake","Moving quickly through the plan without pausing for reactions"],"correctAnswer":"A","explanation":"Empathy means listening, acknowledging feelings and responding to needs. Ignoring emotions, interrupting to correct, or rushing through the plan shows no understanding of the trainee. (Standard 9.3.2)","category":"Social & Emotional Skills","domain":"Future Skills","difficulty":"Medium","sourceType":"Standards Question"},{"id":349,"question":"The schedule changes at short notice. Which response shows adaptability?","options":["Stay calm, adjust the plan, and keep the learning outcomes","Cancel the session until a better time can be arranged","Blame others for the change and wait for instructions","Carry on unchanged as though nothing had happened"],"correctAnswer":"A","explanation":"Adaptability means staying calm, adjusting the plan and still meeting the learning outcomes. Cancelling, blaming others or carrying on unchanged does not respond to the change. (Standard 9.3.3)","category":"Social & Emotional Skills","domain":"Future Skills","difficulty":"Medium","sourceType":"Standards Question"},{"id":350,"question":"Which is an example of active listening?","options":["Looking away to show that the point is understood","Paraphrasing the trainee's point to confirm understanding","Finishing the trainee's sentences to save time","Checking messages while the trainee is speaking"],"correctAnswer":"B","explanation":"Active listening includes paraphrasing the trainee's point to confirm understanding. Looking away, finishing their sentences and checking messages show inattention. (Standard 9.1.1)","category":"Social & Emotional Skills","domain":"Future Skills","difficulty":"Easy","sourceType":"Standards Question"},{"id":351,"question":"A trainer wants to check that an online article is reliable. Which action is best?","options":["Trust the first search result because search engines rank by quality","Trust the best-designed page because it looks professional","Check the author, date, evidence and publisher","Trust the most-shared version because many people agree with it"],"correctAnswer":"C","explanation":"Reliability is checked by looking at the author, date, evidence and publisher. Search ranking, professional design and number of shares do not show that content is accurate. (Standards 10.1.2, 10.3.1)","category":"Thinking & Digital Skills","domain":"Future Skills","difficulty":"Medium","sourceType":"Standards Question"},{"id":352,"question":"Which practice supports safe and responsible use of digital tools in training?","options":["Installing unknown software from unverified sources for a demo","Using strong passwords and sharing content only with permission","Using one familiar password everywhere to avoid forgetting it","Posting trainees' ID numbers on a shared board for convenience"],"correctAnswer":"B","explanation":"Use strong passwords and share content only with permission. Installing unknown software, reusing one password everywhere and posting ID numbers on a shared board all put security and privacy at risk.","category":"Thinking & Digital Skills","domain":"Future Skills","difficulty":"Medium","sourceType":"Standards Question"},{"id":353,"question":"A trainer asks trainees to reflect on a past work problem before introducing a new method. Which idea does this use?","options":["Linking new learning to prior experience and reflection","Testing trainees before any teaching has taken place","Replacing experience with memorisation of the new method","Avoiding any reference to what trainees did in the past"],"correctAnswer":"A","explanation":"Asking trainees to reflect on a past work problem before introducing a new method links new learning to prior experience and reflection. Pre-testing, memorisation and ignoring past experience do not do this.","category":"Learning Theories & Trainees","domain":"Professional Knowledge","difficulty":"Medium","sourceType":"Standards Question"},{"id":354,"question":"Which is an advantage of blended training over fully online training?","options":["It combines face-to-face practice with flexible online study","It avoids assessment because trainees learn informally","It needs no technology because most work is in class","It removes the need for planning because trainees study alone"],"correctAnswer":"A","explanation":"Blended training combines face-to-face practice with flexible online study. It still needs assessment and planning, and it uses technology, so options B, C and D are wrong. (Standard 2.1)","category":"Training Modes & Strategies","domain":"Professional Knowledge","difficulty":"Medium","sourceType":"Standards Question"},{"id":355,"question":"A trainer wants to use a new digital tool in class. What should they do first?","options":["Use it live without testing, to save preparation time","Avoid any backup plan, to keep the session simple","Ask the trainees to fix any problems that appear","Test it beforehand and prepare a fallback if it fails"],"correctAnswer":"D","explanation":"Test the new tool beforehand and prepare a fallback in case it fails. Using it live untested, skipping a backup plan or asking trainees to fix problems risks the session.","category":"Thinking & Digital Skills","domain":"Future Skills","difficulty":"Medium","sourceType":"Standards Question"},{"id":356,"question":"A trainer labels three assessment moments in a course: a pre-course quiz, weekly quizzes, and a final exam. Which labels apply, in that order?","options":["Summative, diagnostic, formative","Diagnostic, summative, formative","Formative, summative, diagnostic","Diagnostic, formative, summative"],"correctAnswer":"D","explanation":"A pre-course quiz is diagnostic, weekly quizzes are formative, and the final exam is summative, so the order is Diagnostic, Formative, Summative. The other orders mismatch the purpose of each assessment moment.","category":"Professional Knowledge","domain":"Professional Knowledge","difficulty":"Medium","sourceType":"Main Exam 2"},{"id":357,"question":"A trainer must choose an assessment tool for a hands-on skill. Which is MOST appropriate, and why?","options":["A multiple-choice test, because it is quick and easy to mark","A practical observation checklist, because it measures real performance against criteria","A reflective essay, because it gives detailed written evidence","A satisfaction survey, because it shows whether trainees enjoyed it"],"correctAnswer":"B","explanation":"A practical observation checklist measures real performance against criteria, which suits a hands-on skill. A multiple-choice test, a reflective essay and a satisfaction survey measure knowledge, reflection or enjoyment, not the skill itself.","category":"Professional Knowledge","domain":"Professional Knowledge","difficulty":"Hard","sourceType":"Main Exam 2"},{"id":358,"question":"Before a hands-on workshop that uses sharp tools, which trainer action best applies occupational health and safety practice?","options":["Brief hazards and safe procedures, check protective equipment, and demonstrate correct use before practice","Assume experienced trainees need no briefing and start practising","Email written warnings after the session and check they were read","Let trainees explore the tools first and correct any mistakes afterwards"],"correctAnswer":"A","explanation":"Brief hazards and safe procedures, check protective equipment and demonstrate correct use before practice. Assuming experienced trainees need no briefing, sending written warnings afterwards and letting trainees explore first all put people at risk.","category":"Professional Practices","domain":"Professional Practices","difficulty":"Medium","sourceType":"Main Exam 2"},{"id":359,"question":"While researching for a course, an instructional designer finds a striking statistic with no author, date or source. What should they do?","options":["Use it if several social media posts repeat the same figure","Use it with a note that it is unverified, and move on","Verify it against reliable sources before using it","Use it, because it makes the lesson more convincing"],"correctAnswer":"C","explanation":"A statistic with no author, date or source should be verified against reliable sources before use. Repetition on social media does not make it true, a note saying 'unverified' is not enough, and being convincing is not accuracy.","category":"Future Skills","domain":"Future Skills","difficulty":"Medium","sourceType":"Main Exam 2"},{"id":360,"question":"A trainee becomes visibly upset after critical feedback given in front of the group. Which response best shows empathy and emotional regulation?","options":["Tell them to be less sensitive and focus on the content","Defend the feedback firmly in front of the group so others learn","Ignore the reaction and carry on to keep the session on time","Stay calm, acknowledge their feelings, and offer to talk privately"],"correctAnswer":"D","explanation":"Stay calm, acknowledge their feelings and offer to talk privately, showing empathy and emotional regulation. Telling them to be less sensitive, defending the feedback in front of the group or ignoring the reaction fails to support them.","category":"Future Skills","domain":"Future Skills","difficulty":"Medium","sourceType":"Main Exam 2"},{"id":361,"question":"A trainer's words are encouraging, but their arms are folded and their eyes stay on their notes. Which statement is MOST accurate?","options":["Non-verbal communication has little relevance in a training room","The mismatched non-verbal cues weaken the message and the trainer's credibility","Trainees will attend only to the words, so the cues do not matter","Folded arms always show confidence and strong authority"],"correctAnswer":"B","explanation":"Verbal and non-verbal messages must agree. Encouraging words with folded arms and eyes on notes send mixed signals that weaken the message and the trainer's credibility. Non-verbal communication matters, trainees do notice it, and folded arms are not a sign of confidence. (Standard 9.1.2)","category":"Future Skills","domain":"Future Skills","difficulty":"Medium","sourceType":"Main Exam 2"},{"id":362,"question":"Which of these is a recognised principle of adult learning (andragogy)?","options":["Adults need rewards for every answer to stay engaged","Adults prefer content that is unrelated to their jobs","Adults learn best when every decision is made for them","Adults are self-directed and want to know why they need to learn something"],"correctAnswer":"D","explanation":"Adults are self-directed and want to know why they need to learn something, a core andragogy principle. Rewards for every answer, job-unrelated content and decisions made for them contradict it.","category":"Learning Theories & Concepts","domain":"Professional Knowledge","difficulty":"Medium","sourceType":"Main Exam 3"},{"id":363,"question":"Which output is produced at the end of the Design stage and used in Development?","options":["A delivery report written after the course","A course blueprint or storyboard","Final trainee results and evaluation data","A needs analysis summary of the performance gap"],"correctAnswer":"B","explanation":"The Design stage ends with a course blueprint or storyboard, which Development then turns into materials. A delivery report and results come later, and a needs analysis summary is an Analysis output.","category":"Instructional Design (ADDIE)","domain":"Professional Knowledge","difficulty":"Medium","sourceType":"Main Exam 3"},{"id":364,"question":"Which feature does CIRO include that Kirkpatrick does NOT explicitly include?","options":["Behavior, which observes use of skills at work","Learning, which tests knowledge after the course","Reaction, which gathers trainee feedback after delivery","Context and Input, which look at needs and resources"],"correctAnswer":"D","explanation":"CIRO includes Context and Input, which examine needs and resources before and during training. Kirkpatrick explicitly covers Reaction, Learning, Behaviour and Results, which CIRO also covers in Reaction and Outcome.","category":"Training Evaluation Models","domain":"Professional Knowledge","difficulty":"Hard","sourceType":"Main Exam 3"},{"id":365,"question":"Which is the LEAST appropriate way to handle a trainee who keeps arriving late?","options":["Mocking them in front of colleagues","Speaking to them privately","Reminding everyone of the start time","Asking about barriers"],"correctAnswer":"A","explanation":"Mocking a late trainee in front of colleagues is public humiliation, never professional. Speaking privately, reminding everyone of the start time and asking about barriers are all appropriate. Read the word LEAST.","category":"Least Important / Least Appropriate","domain":"Professional Values and Responsibilities","difficulty":"Medium","sourceType":"Main Exam 3"},{"id":366,"question":"A TNA survey of 200 staff shows 70% are confident with the new software and 30% are not. Which response is MOST efficient?","options":["Replacing the software with something else","Targeted training for the 30% only","No action, since most are confident","A full course for all 200 staff"],"correctAnswer":"B","explanation":"The data shows the gap is the 30% who are not confident, so targeted training for them is the most efficient response. Replacing the software or training all 200 wastes effort, and taking no action leaves the gap unaddressed.","category":"Needs Analysis from Data","domain":"Professional Practices","difficulty":"Medium","sourceType":"Main Exam 3"},{"id":367,"question":"A trainee's result is judged against a fixed standard, not against other trainees' results. What is this called?","options":["Norm-referenced assessment","Criterion-referenced assessment","Self-assessment","Diagnostic assessment"],"correctAnswer":"B","explanation":"Judging a result against a fixed standard, not against other trainees, is criterion-referenced assessment. Norm-referenced ranks trainees against each other, self-assessment is done by the trainee, and diagnostic assessment happens before training.","category":"Assessment Quality","domain":"Professional Knowledge","difficulty":"Medium","sourceType":"Main Exam 3"},{"id":368,"question":"A course has two aims: (1) trainees learn product specifications at their own pace, and (2) trainees practise handling customer objections with live feedback. Which choice meets BOTH aims?","options":["Asynchronous only, with a discussion forum for questions","Face-to-face only, with no pre-work for trainees","Blended: self-paced modules plus a live practice session","Synchronous only, with the specifications read aloud"],"correctAnswer":"C","explanation":"Blended learning meets both aims: self-paced modules for product specifications plus a live practice session with feedback for objection handling. Asynchronous-only lacks live feedback, face-to-face with no pre-work loses self-paced study, and synchronous-only forces reading aloud.","category":"Learning Delivery Methods","domain":"Future Skills","difficulty":"Hard","sourceType":"Main Exam 3"},{"id":369,"question":"Which trend adapts content to each learner using data and AI?","options":["Adaptive, AI-powered learning","A single annual exam for everyone","One-size-fits-all lectures","Fixed paper timetables"],"correctAnswer":"A","explanation":"Adaptive, AI-powered learning uses learner data to adapt content to each person. A single exam, one-size-fits-all lectures and fixed paper timetables do the opposite of personalisation.","category":"Future Trends in Training","domain":"Future Skills","difficulty":"Medium","sourceType":"Main Exam 3"},{"id":370,"question":"Which activity best reflects a constructivist approach to training?","options":["Trainees analyse cases from their own workplaces and build a new procedure from them","Trainees copy a model procedure from the board word for word","Trainees listen to a lecture and take the final test straight after","Trainees repeat a drill until the trainer is satisfied with speed"],"correctAnswer":"A","explanation":"Trainees analysing cases from their own workplaces and building a new procedure is constructivist because they construct knowledge from experience. Copying from the board, listening to a lecture and repeating a drill are transmission or behaviourist approaches.","category":"Learning Theories & Concepts","domain":"Professional Knowledge","difficulty":"Medium","sourceType":"Main Exam 3"},{"id":371,"question":"Which statement about formative assessment is the LEAST accurate?","options":["It happens during training while learning is in progress","It gives feedback that trainees can act on","It helps the trainer adjust the next session","Its main purpose is to give a final grade at the end of the programme"],"correctAnswer":"D","explanation":"The LEAST accurate statement is that its main purpose is a final grade at the end: formative assessment happens during training, gives actionable feedback and helps the trainer adjust. A final grade is summative.","category":"Assessment Quality","domain":"Professional Knowledge","difficulty":"Medium","sourceType":"Main Exam 3"},{"id":372,"question":"Which statement best distinguishes training from general education?","options":["Training builds specific job-related skills and knowledge for a defined purpose","Training aims only to give general background knowledge","Training is always delivered online","Training has no objectives or assessment"],"correctAnswer":"A","explanation":"Training builds specific job-related skills and knowledge for a defined purpose. It is not only general background knowledge, not always online, and it does have objectives and assessment.","category":"Learning Theories & Concepts","domain":"Professional Knowledge","difficulty":"Easy","sourceType":"Main Exam 3"},{"id":373,"question":"A company wants employees to get quick answers on their phones while they work. Which trend is this?","options":["Residential seminars","An annual classroom course","Mobile and just-in-time learning","Printed binders for each desk"],"correctAnswer":"C","explanation":"Quick answers on phones during work is mobile and just-in-time learning, support in the flow of work. Residential seminars, annual courses and printed binders are not instant or mobile.","category":"Future Trends in Training","domain":"Future Skills","difficulty":"Hard","sourceType":"Main Exam 3"},{"id":374,"question":"Which action is the LEAST appropriate when a trainer cannot attend because of a personal issue?","options":["Arranging a replacement trainer where possible","Informing the coordinator as early as possible","Not telling anyone and failing to appear","Proposing a new date for the session"],"correctAnswer":"C","explanation":"Not telling anyone and failing to appear is the least professional option. Arranging a replacement, informing the coordinator early and proposing a new date all protect trainees. Read the word LEAST.","category":"Least Important / Least Appropriate","domain":"Professional Values and Responsibilities","difficulty":"Medium","sourceType":"Main Exam 3"},{"id":375,"question":"A survey shows 85% of trainees prefer practice to theory. Which method is best?","options":["A hands-on workshop with short theory","A three-hour lecture with slides","A long passive video marathon","A reading-only course with a final test"],"correctAnswer":"A","explanation":"With 85% preferring practice, a hands-on workshop with short theory matches the data. A three-hour lecture, a long video marathon or a reading-only course go against what trainees want.","category":"Method Selection from Data","domain":"Professional Practices","difficulty":"Medium","sourceType":"Main Exam 3"},{"id":376,"question":"To emphasise a key point, which gesture is best?","options":["Pointing at one individual in the group","Rapid, repeated waving of both hands","An open gesture between waist and shoulders","Slapping the table to get attention"],"correctAnswer":"C","explanation":"An open gesture between waist and shoulders supports the message. Pointing at an individual feels aggressive, rapid waving distracts, and slapping the table startles the audience.","category":"Hand Placement","domain":"Professional Practices","difficulty":"Medium","sourceType":"Main Exam 3"},{"id":377,"question":"When you are not gesturing, which hand position is generally recommended while presenting?","options":["Relaxed and visible, at your sides","Clasped firmly behind your back","Folded across your chest the whole time","Tucked into your pockets for comfort"],"correctAnswer":"A","explanation":"Relaxed, visible hands at your sides look confident. Clasped behind the back, folded across the chest or in pockets hide the hands and suggest nervousness or closed-off body language.","category":"Hand Placement","domain":"Professional Practices","difficulty":"Easy","sourceType":"Main Exam 3"},{"id":378,"question":"A trainer uses a vocabulary quiz to decide whether trainees can operate a machine safely. Which quality is lacking?","options":["Validity, because the quiz does not measure the skill claimed","Reliability, because the quiz was marked twice","Practicality, because quizzes are too slow to mark","Fairness, because everyone took the same quiz"],"correctAnswer":"A","explanation":"A vocabulary quiz does not measure the ability to operate a machine safely, so it lacks validity: it does not measure what it claims to. Being marked twice, being slow or everyone taking it does not address that.","category":"Assessment Quality","domain":"Professional Knowledge","difficulty":"Hard","sourceType":"Main Exam 3"},{"id":379,"question":"Trainees start packing up 20 minutes before the end, saying the content is finished. What is the BEST response?","options":["Extend the session by an hour as a punishment","Let everyone leave because the content is finished","Ignore the packing up and carry on teaching","Remind them of the end time and use the time for a summary"],"correctAnswer":"D","explanation":"Remind trainees of the end time and use the remaining time for a summary, which keeps the schedule and adds value. Punishing with extra time, letting everyone leave early or ignoring them are poor responses.","category":"Managing Training Sessions","domain":"Professional Values and Responsibilities","difficulty":"Medium","sourceType":"Main Exam 3"},{"id":380,"question":"A nervous trainer is unsure what to do with their hands at the start. Which approach is recommended?","options":["Keep them in pockets until nerves pass","Pick one neutral position and practise it","Grip the podium tightly for support until the nerves have passed","Fold them across the chest so that they are out of sight"],"correctAnswer":"B","explanation":"Choosing one neutral hand position and practising it removes the worry about where to put your hands. Pockets, gripping the podium and folded arms look nervous or closed.","category":"Hand Placement","domain":"Professional Practices","difficulty":"Hard","sourceType":"Main Exam 3"},{"id":381,"question":"A trainer's hands keep circling ('washing machine') while searching for words. What is the best correction?","options":["Fold the arms across the chest so that the hands are hidden from the audience","Pause, reset the hands, and use fewer, purposeful gestures","Grip the lectern firmly to keep them still for the rest of the session","Speak faster so nobody notices"],"correctAnswer":"B","explanation":"The best fix is to pause, reset the hands and use fewer, purposeful gestures. Hiding the hands, gripping the lectern or speaking faster does not remove the distracting habit.","category":"Hand Placement","domain":"Professional Practices","difficulty":"Hard","sourceType":"Main Exam 3"},{"id":382,"question":"What is the MOST appropriate purpose of gamification?","options":["To remove the trainer's role entirely","To raise motivation and engagement, e.g. points and badges","To shorten the legal training requirements by making the content more fun","To replace all forms of assessment because points and badges already show who has learned"],"correctAnswer":"B","explanation":"Gamification, through points and badges, raises motivation and engagement. It does not remove the trainer, shorten legal requirements or replace assessment.","category":"Future Trends in Training","domain":"Future Skills","difficulty":"Hard","sourceType":"Main Exam 3"},{"id":383,"question":"A pre-test and post-test comparison is used mainly to evaluate which Kirkpatrick level?","options":["Level 4 – Results","Level 1 – Reaction","Level 2 – Learning","Level 3 – Behavior"],"correctAnswer":"C","explanation":"A pre-test and post-test comparison measures knowledge or skill gained, which is Level 2: Learning. Level 1 is satisfaction, Level 3 is on-the-job behaviour, and Level 4 is organisational results.","category":"Training Evaluation Models","domain":"Professional Knowledge","difficulty":"Medium","sourceType":"Main Exam 3"},{"id":384,"question":"What is the main purpose of a Training Needs Analysis (TNA)?","options":["To find the gap between current and required performance and decide if training is needed","To measure how satisfied trainees were with the programme once it has finished and report the scores","To schedule the trainer's holidays and teaching hours for the year","To produce certificates and attendance records for the organisation"],"correctAnswer":"A","explanation":"A TNA finds the gap between current and required performance, its cause, and whether training is the right solution. Measuring satisfaction, scheduling or producing certificates are different tasks.","category":"Training Needs Analysis","domain":"Professional Practices","difficulty":"Easy","sourceType":"Main Exam 3"},{"id":385,"question":"What is the best eye-contact approach with a group?","options":["Staring at one friendly person throughout the whole session","Looking only at the slides","Avoiding eye contact completely by looking at the notes","Brief, natural eye contact with different people"],"correctAnswer":"D","explanation":"Brief, natural eye contact with different people shares attention around the room. Staring at one person, reading only from slides or notes, and avoiding eye contact all disconnect the trainer. Norms can vary between cultures.","category":"Non-Verbal Cues","domain":"Future Skills","difficulty":"Easy","sourceType":"Main Exam 3"},{"id":386,"question":"Attendance data: 90% on Monday, 60% on Tuesday, 40% on Wednesday (the 3 p.m. sessions). What should the trainer do first?","options":["Do nothing and wait to see what happens","Cancel the Wednesday sessions immediately because so few trainees are attending them","Blame the trainees for poor commitment and warn them about their future attendance","Investigate why attendance falls; consider rescheduling or shortening"],"correctAnswer":"D","explanation":"Falling attendance (90%, 60%, 40%) calls for finding the cause first, then considering rescheduling or shortening. Doing nothing, cancelling or blaming trainees acts without evidence.","category":"Needs Analysis from Data","domain":"Professional Practices","difficulty":"Medium","sourceType":"Main Exam 3"},{"id":387,"question":"Which factor is the LEAST relevant when selecting a delivery method?","options":["Trainees' availability and time zones","Trainees' access to technology and internet","The learning objectives of the course","The trainer's favourite font"],"correctAnswer":"D","explanation":"A trainer's favourite font has no bearing on how to deliver learning. Trainee availability, technology access and the learning objectives are all valid factors. Read the word LEAST.","category":"Least Important / Least Appropriate","domain":"Professional Knowledge","difficulty":"Medium","sourceType":"Main Exam 3"},{"id":388,"question":"A trainee who is also a friend asks for a hint about the final test. What is the best response?","options":["Give a small hint because they are a friend","Decline, and apply the same assessment rules to every trainee","Give the hint only if other trainees will not find out","Change the test to match what the friend has studied"],"correctAnswer":"B","explanation":"Decline and apply the same assessment rules to every trainee, which keeps the test fair and objective. Giving a hint, hiding it, or changing the test to suit the friend are favouritism and breach integrity. Disclose the relationship if required.","category":"Ethics & Confidentiality","domain":"Professional Values and Responsibilities","difficulty":"Medium","sourceType":"Main Exam 3"},{"id":389,"question":"A trainer's illness means a session must be rescheduled, but two trainees have exams on the proposed new date. What is the best approach?","options":["Run the session on the original date with a substitute who is not qualified in the subject","Offer alternative dates, choose the one that suits most, and share materials with those who cannot attend","Cancel the course permanently and refund everyone","Insist on the proposed date because it is already in the official schedule and trainees must adapt"],"correctAnswer":"B","explanation":"Offering alternative dates, choosing what suits most people and sharing materials with those who cannot attend is flexible and supportive. Using an unqualified substitute, cancelling permanently or insisting on a date that clashes with exams fails trainees.","category":"Managing Training Sessions","domain":"Professional Values and Responsibilities","difficulty":"Hard","sourceType":"Main Exam 3"},{"id":390,"question":"Which activity is a typical part of identifying training needs?","options":["Reviewing performance data and interviewing managers","Printing certificates for the final day of training","Choosing the colour scheme and the font for the course slides before the course","Counting the chairs and tables in the training room"],"correctAnswer":"A","explanation":"Reviewing performance data and interviewing managers are typical needs-identification activities. Printing certificates, choosing slide colours and counting chairs are not about identifying needs.","category":"Training Needs Analysis","domain":"Professional Practices","difficulty":"Medium","sourceType":"Main Exam 3"},{"id":391,"question":"Unknown people might join a public training link. Which Zoom setting MOST reduces this risk?","options":["Record the session and store it","Enable a waiting room and a passcode","Disable the chat function","Turn on virtual backgrounds for all participants"],"correctAnswer":"B","explanation":"A waiting room and a passcode control who can enter, which reduces the risk of uninvited people. Recording, disabling chat or virtual backgrounds do not stop unknown people from joining.","category":"Online Training & Digital Tools","domain":"Future Skills","difficulty":"Medium","sourceType":"Main Exam 3"},{"id":392,"question":"Which technology lets trainees practise high-risk tasks safely?","options":["Email newsletters","Audio podcasts","VR/AR simulations","PDF manuals"],"correctAnswer":"C","explanation":"VR/AR simulations allow repeatable, safe practice of high-risk tasks. Newsletters, podcasts and PDF manuals cannot let trainees practise hands-on.","category":"Future Trends in Training","domain":"Future Skills","difficulty":"Medium","sourceType":"Main Exam 3"},{"id":393,"question":"Which task is Canva MOST suited to?","options":["Securing a website with an encrypted connection","Running statistical tests on survey data","Hosting live video classes with breakout rooms","Designing infographics, posters and slides"],"correctAnswer":"D","explanation":"Canva is a design tool for infographics, posters and slides. Securing a website, running statistics and hosting live classes need other tools (security certificates, statistical software, video platforms).","category":"Online Training & Digital Tools","domain":"Future Skills","difficulty":"Easy","sourceType":"Main Exam 3"},{"id":394,"question":"A colleague asks to see a trainee's personal file 'just out of interest'. What is the MOST professional response?","options":["Show it if the colleague promises not to tell anyone","Show only the pages with the trainee's marks","Decline politely and explain the file is shared only for a legitimate, authorised purpose","Show it, since both of you work for the same centre"],"correctAnswer":"C","explanation":"Decline politely and explain that the file is shared only for a legitimate, authorised purpose. Showing it because the colleague promises silence, shows only marks, or works at the same centre does not meet the need-to-know test.","category":"Ethics & Confidentiality","domain":"Professional Values and Responsibilities","difficulty":"Medium","sourceType":"Main Exam 3"},{"id":395,"question":"Which is the BEST way to record CPD?","options":["The trainees' attendance lists for each course","A log of activities, learning and the change in practice","A list of course titles with no reflection","Memory only, with nothing written down or kept anywhere as evidence of what was learned"],"correctAnswer":"B","explanation":"A good CPD record is a log of activities, learning and the change in practice. Attendance lists, bare course titles or memory only show no learning or impact.","category":"Professional Development (CPD)","domain":"Professional Values and Responsibilities","difficulty":"Medium","sourceType":"Main Exam 3"},{"id":396,"question":"Why should a trainer avoid keeping hands in pockets while presenting?","options":["It can look nervous or too casual and limits gestures","It stops the voice from projecting properly","It prevents trainees from reading the slides","It breaks health and safety rules in training rooms"],"correctAnswer":"A","explanation":"Hands in pockets can look nervous or too casual and limit gestures. It does not affect voice projection, slide reading or health and safety rules.","category":"Hand Placement","domain":"Professional Practices","difficulty":"Medium","sourceType":"Main Exam 3"},{"id":397,"question":"In CIRO, a trainer asks: 'Were the right resources and delivery method chosen to meet the objectives?' Which component is this?","options":["Reaction","Outcome","Input","Context"],"correctAnswer":"C","explanation":"Asking whether the right resources and delivery method were chosen is about Input in CIRO (design, resources, strategy). Context is needs, Reaction is participants' response, and Outcome is eventual effects.","category":"Training Evaluation Models","domain":"Professional Knowledge","difficulty":"Medium","sourceType":"Main Exam 3"},{"id":398,"question":"In a practical test, 64 of 80 trainees pass first time. What is the pass rate, and what is the best response to the rest?","options":["16%; repeat the whole course for everyone, including those who already passed","64%; cancel the course and start the whole programme again from the beginning","80%; support or re-assessment for the 16 who did not pass","20%; take no further action at all"],"correctAnswer":"C","explanation":"64 ÷ 80 = 0.8, so the pass rate is 80%, and the best response is support or re-assessment for the 16 who did not pass. Repeating the course for all or cancelling punishes those who passed.","category":"Percentage Calculations","domain":"Professional Practices","difficulty":"Hard","sourceType":"Main Exam 3"},{"id":399,"question":"What is the BEST reason for a trainer to keep doing CPD?","options":["To reuse the same slides for another ten years","Only to collect certificates for the file","To avoid being evaluated by the organisation","To keep skills up to date and improve training quality"],"correctAnswer":"D","explanation":"The best reason for CPD is to keep skills up to date and improve training quality. Reusing slides, collecting certificates or avoiding evaluation are not valid purposes.","category":"Professional Development (CPD)","domain":"Professional Values and Responsibilities","difficulty":"Medium","sourceType":"Main Exam 3"},{"id":400,"question":"In CIRO, a company checks whether a sales course changed individual, team and company results six months later. Which component is this?","options":["Reaction","Outcome","Context","Input"],"correctAnswer":"B","explanation":"Checking whether a sales course changed individual, team and company results six months later is the Outcome component of CIRO. Reaction is immediate response, Context is needs and environment, and Input is resources and design.","category":"Training Evaluation Models","domain":"Professional Knowledge","difficulty":"Hard","sourceType":"Main Exam 3"},{"id":401,"question":"A trainee asks to leave early every day this week. What is the most professional response?","options":["Mark them absent for every session without any discussion and report the pattern to their managers","Agree without asking why they must leave","Speak privately, learn the reason, and agree a plan for missed content","Refuse loudly in front of the whole class and tell everyone that leaving early is not allowed"],"correctAnswer":"C","explanation":"Speaking privately, learning the reason and agreeing a plan for the missed content is respectful and goes through the proper channel. Marking absent without discussion, agreeing without asking, or refusing loudly in public all handle it poorly.","category":"Managing Training Sessions","domain":"Professional Values and Responsibilities","difficulty":"Hard","sourceType":"Main Exam 3"},{"id":402,"question":"At 6 a.m. a trainer learns of a family emergency and cannot deliver the 9 a.m. session. What should happen FIRST?","options":["Contact the coordinator immediately so trainees can be told","Wait until 9 a.m. to see whether things improve","Ask one of the trainees to lead the session instead","Send no message and reschedule the session later"],"correctAnswer":"A","explanation":"Contact the coordinator immediately so trainees can be told in time. Waiting until 9 a.m., sending no message or asking a trainee to lead leaves trainees and the organisation unprepared.","category":"Managing Training Sessions","domain":"Professional Values and Responsibilities","difficulty":"Medium","sourceType":"Main Exam 3"},{"id":403,"question":"Which behaviour shows active listening non-verbally?","options":["Checking notes while they speak","Interrupting to finish their sentence so the discussion moves faster","Turning away to prepare the next slide while the trainee is still talking","Facing the speaker, open posture, eye contact"],"correctAnswer":"D","explanation":"Facing the speaker, open posture and eye contact show you are listening. Checking notes, interrupting and turning away show inattention.","category":"Non-Verbal Cues","domain":"Future Skills","difficulty":"Medium","sourceType":"Main Exam 3"},{"id":404,"question":"Which data source gives the MOST objective evidence of a skill gap?","options":["Length of employment in the department","The trainer's own personal opinion","Observed performance against the required standard","Trainees' wishes for topics they might enjoy"],"correctAnswer":"C","explanation":"Observed performance against the required standard is the most objective evidence of a skill gap. Length of employment, a trainer's opinion and trainees' wishes are indirect or subjective.","category":"Training Needs Analysis","domain":"Professional Practices","difficulty":"Medium","sourceType":"Main Exam 3"},{"id":405,"question":"Which trainer behaviour best supports learning by modelling (social learning)?","options":["Describing the task once and leaving the room","Correcting errors only after the final test","Demonstrating the task correctly while explaining each step aloud","Handing out a written procedure without a demonstration"],"correctAnswer":"C","explanation":"Demonstrating the task correctly while explaining each step aloud models the behaviour for trainees to observe and imitate. Describing once and leaving, correcting errors only after the test, or giving a written procedure alone provides no model.","category":"Learning Theories & Concepts","domain":"Professional Knowledge","difficulty":"Medium","sourceType":"Main Exam 3"},{"id":406,"question":"Post-test: 30% of trainees scored below 50%, 50% scored 50–79%, and 20% scored 80% or more. What is the BEST decision?","options":["Repeat the whole course for every trainee, including those who scored well in the test","Congratulate everyone and stop the training","Remedial support for the lowest group, extension for the top group","Lower the pass standard so more trainees pass"],"correctAnswer":"C","explanation":"Differentiating by the data means remedial support for the lowest group and extension for the top group. Repeating the whole course wastes the top group's time, stopping training ignores the 30% who scored low, and lowering the pass mark hides the problem.","category":"Needs Analysis from Data","domain":"Professional Practices","difficulty":"Hard","sourceType":"Main Exam 3"},{"id":407,"question":"After a customer-care course, monthly complaints fall from 50 to 35. What is the percentage decrease?","options":["70%","35%","15%","30%"],"correctAnswer":"D","explanation":"The decrease is 50 − 35 = 15, and 15 ÷ 50 = 30%. 70% is 35 ÷ 50, 35% is the final complaint count, and 15% is the raw difference. This evidences Level 4 (Results).","category":"Percentage Calculations","domain":"Professional Practices","difficulty":"Hard","sourceType":"Main Exam 3"},{"id":408,"question":"A trainee sits with arms crossed, looking at the floor, while the trainer explains. What should the trainer conclude?","options":["It may signal disengagement, so check in or change the activity","They definitely disagree with the trainer, so the trainer should confront them at once","They are an expert, so ignore them","Non-verbal cues never matter in training"],"correctAnswer":"A","explanation":"Crossed arms and looking at the floor may signal disengagement, but cues are clues, not proof. The trainer should check in or change the activity, not confront them or ignore it.","category":"Non-Verbal Cues","domain":"Future Skills","difficulty":"Medium","sourceType":"Main Exam 3"},{"id":409,"question":"Data: 75% of trainees work in other cities and 25% work at head office. The course must be completed within a month. Which approach is MOST suitable?","options":["Weekly face-to-face sessions at head office","Mostly asynchronous online, plus a few live sessions","One live lecture at head office only","Printed manuals posted to each trainee with a deadline to return the workbook"],"correctAnswer":"B","explanation":"With 75% working in other cities, a mostly asynchronous online course with a few live sessions fits the majority within a month. Weekly head-office sessions, one live lecture or printed manuals exclude or under-serve most trainees.","category":"Delivery Mode from Data","domain":"Professional Practices","difficulty":"Medium","sourceType":"Main Exam 3"},{"id":410,"question":"A TNA shows employees know the procedure but lack the tools to follow it. What is the best conclusion?","options":["It is not a skill gap, so providing tools is better than training","Training should be run immediately to fix the procedure","The TNA should be repeated until it shows a skill gap","The employees should be replaced with more highly skilled staff who already know the tools"],"correctAnswer":"A","explanation":"Employees know the procedure but lack tools, so it is not a skill gap and providing the tools is the right fix. Training, repeating the TNA until a skill gap appears or replacing staff addresses the wrong cause.","category":"Training Needs Analysis","domain":"Professional Practices","difficulty":"Medium","sourceType":"Main Exam 3"},{"id":411,"question":"After 90 minutes of an online class, participants look fatigued. What is the best action?","options":["A 10-minute break, then a short poll or breakout","Add 20 more slides to keep them busy","Talk faster so the class finishes sooner","Disable the chat so nobody is distracted"],"correctAnswer":"A","explanation":"After 90 minutes, a 10-minute break followed by a short poll or breakout restores attention. Adding slides, talking faster or disabling chat will not reduce fatigue.","category":"Managing Training Sessions","domain":"Future Skills","difficulty":"Medium","sourceType":"Main Exam 3"},{"id":412,"question":"Which learning objective is the MOST measurable?","options":["Appreciate the value of calibration","Understand how pressure gauges work","Calibrate the pressure gauge to within 2% tolerance","Be familiar with gauge types"],"correctAnswer":"C","explanation":"'Calibrate the pressure gauge to within 2% tolerance' names an observable action and a measurable standard. 'Appreciate', 'understand' and 'be familiar with' are vague and cannot be measured.","category":"Learning Objectives","domain":"Professional Knowledge","difficulty":"Medium","sourceType":"Main Exam 3"},{"id":413,"question":"A trainee scores 90% on the end test, but six months later still uses the old method because the supervisor insists on it. Which statement is MOST accurate?","options":["Learning (Level 2) failed, because the trainee did not learn","Results (Level 4) are guaranteed, because the test score was high","Learning (Level 2) succeeded, but Behavior (Level 3) did not occur","Reaction (Level 1) failed, because the trainee disliked the course"],"correctAnswer":"C","explanation":"The trainee scored 90%, so Learning (Level 2) succeeded. They still use the old method because of the supervisor, so Behaviour (Level 3) did not occur: transfer depends on the workplace as well as the course. Results are not guaranteed by a test score, and nothing suggests the trainee disliked the course.","category":"Training Evaluation Models","domain":"Professional Knowledge","difficulty":"Hard","sourceType":"Main Exam 3"},{"id":414,"question":"Which method is MOST suitable for Level 3 (Behavior) evaluation?","options":["Workplace observation and manager feedback","The attendance register for each session","An immediate multiple-choice quiz at the end","An end-of-course satisfaction sheet handed out on day one"],"correctAnswer":"A","explanation":"Level 3 (Behaviour) is judged on the job, some time after training, through workplace observation and manager feedback. An attendance register, an immediate quiz (Level 2) and a day-one satisfaction sheet (Level 1) do not show on-the-job change.","category":"Training Evaluation Models","domain":"Professional Knowledge","difficulty":"Medium","sourceType":"Main Exam 3"},{"id":415,"question":"After a failed calibration attempt, a trainee sits quietly and works out why the readings drifted. Which stage of Kolb's cycle is this?","options":["Abstract Conceptualisation","Concrete Experience","Active Experimentation","Reflective Observation"],"correctAnswer":"D","explanation":"Sitting quietly and working out why the readings drifted is Reflective Observation, looking back on the experience. Concrete Experience was the calibration attempt, Abstract Conceptualisation forms theories, and Active Experimentation tries new ideas.","category":"Learning Theories & Concepts","domain":"Professional Knowledge","difficulty":"Medium","sourceType":"Main Exam 3"},{"id":416,"question":"Two assessors give very different marks to the same practical performance using the same checklist. Which quality of the assessment is weak?","options":["Practicality","Diagnostic value","Validity","Reliability"],"correctAnswer":"D","explanation":"Two assessors giving very different marks with the same checklist shows weak reliability, the consistency of results. Validity is measuring what is intended, practicality is ease of use, and diagnostic value is irrelevant here.","category":"Assessment Quality","domain":"Professional Knowledge","difficulty":"Hard","sourceType":"Main Exam 3"},{"id":417,"question":"Which is the LEAST effective way to evaluate Level 3 (Behavior)?","options":["Workplace observation after the course","Performance reviews some months afterwards","Interviews with managers about changes","A last-day satisfaction survey"],"correctAnswer":"D","explanation":"A last-day satisfaction survey measures Reaction (Level 1), not on-the-job behaviour, so it is the least effective for Level 3. Workplace observation, performance reviews months later and manager interviews all look at real behaviour. Read the word LEAST.","category":"Least Important / Least Appropriate","domain":"Professional Knowledge","difficulty":"Hard","sourceType":"Main Exam 3"},{"id":418,"question":"Which sequence is the most logical for a TNA?","options":["Deliver training, test learners, define the standards, then work out the causes","Define the standard, measure current performance, find the gap, analyse the cause, recommend","Select the trainer, book the venue, choose the topics, then define the needs","Design the course, deliver it, survey satisfaction, then look for any gaps in performance and decide what went wrong"],"correctAnswer":"B","explanation":"A logical TNA sequence is: define the standard, measure current performance, find the gap, analyse the cause, then recommend. Delivering training, selecting trainers or designing courses before the analysis puts the solution before the problem.","category":"Training Needs Analysis","domain":"Professional Practices","difficulty":"Hard","sourceType":"Main Exam 3"},{"id":419,"question":"During a Zoom session the trainer wants a quick, anonymous multiple-choice check of understanding. Which feature suits best?","options":["Cloud storage settings","Polling","Mute all","Virtual background"],"correctAnswer":"B","explanation":"Polling gives a quick, anonymous multiple-choice check of understanding, which is instant formative feedback. Cloud storage settings, mute all and virtual backgrounds do not collect responses.","category":"Online Training & Digital Tools","domain":"Future Skills","difficulty":"Medium","sourceType":"Main Exam 3"},{"id":420,"question":"Trainees in a remote region have unreliable internet, and live video sessions often freeze. Which adjustment is MOST appropriate?","options":["Require everyone to travel to the capital for classroom sessions","Extend each live session to four hours so nothing is missed","Move theory online for self-study and keep short live sessions","Cancel the training until internet access improves"],"correctAnswer":"C","explanation":"Move theory online for self-study and keep short live sessions: this reduces dependence on unreliable internet. Travelling to the capital, four-hour live sessions and cancelling the training are impractical or unnecessary.","category":"Learning Delivery Methods","domain":"Future Skills","difficulty":"Medium","sourceType":"Main Exam 3"},{"id":421,"question":"A trainer wants a consistent look across handouts, slides and social posts. Which Canva feature helps?","options":["Brand kit and templates","Waiting room for admitting learners","HTTPS certificate for the website","Breakout rooms for group work"],"correctAnswer":"A","explanation":"A brand kit and templates store colours, fonts and logos so handouts, slides and social posts look consistent. A waiting room, an HTTPS certificate and breakout rooms belong to other tools and do nothing for visual consistency.","category":"Online Training & Digital Tools","domain":"Future Skills","difficulty":"Medium","sourceType":"Main Exam 3"},{"id":422,"question":"Which gesture best signals openness and honesty?","options":["Hands hidden","Clenched fists","Open palms","A pointing finger"],"correctAnswer":"C","explanation":"Open palms are widely read as open and honest. Hidden hands, clenched fists and a pointing finger suggest secrecy, tension or accusation.","category":"Hand Placement","domain":"Professional Practices","difficulty":"Medium","sourceType":"Main Exam 3"},{"id":423,"question":"A survey shows 60% of trainees prefer self-paced study and 40% prefer live interaction. Which approach balances both?","options":["Fully asynchronous learning","Blended learning","Cancelling the course","Fully synchronous learning"],"correctAnswer":"B","explanation":"With 60% preferring self-paced study and 40% preferring live interaction, both needs are substantial, so a blend of both modes balances them. Fully asynchronous ignores the 40%, fully synchronous ignores the 60%, and cancelling the course solves nothing. Check how large the minority is before choosing a single mode.","category":"Delivery Mode from Data","domain":"Professional Practices","difficulty":"Medium","sourceType":"Main Exam 3"},{"id":424,"question":"Evaluation shows low trainee scores on a topic the trainer teaches. Which CPD plan is best?","options":["Focus only on the trainer's existing strengths","Target that weakness, apply it later and review results","Avoid teaching that topic again in future courses","Choose development activities completely at random"],"correctAnswer":"B","explanation":"CPD should be needs-based: target the weakness, apply it later and review the results. Focusing only on strengths, avoiding the topic or choosing activities at random does not address the evidence.","category":"Professional Development (CPD)","domain":"Professional Values and Responsibilities","difficulty":"Hard","sourceType":"Main Exam 3"},{"id":425,"question":"What is a typical limitation of fully asynchronous training?","options":["It can only be used in a classroom","Learners cannot study at their own pace","It needs every trainee to be present at the same hour","Feedback and interaction are slower because trainer and learners are not online together"],"correctAnswer":"D","explanation":"A typical limitation of fully asynchronous training is that feedback and interaction are slower, since trainer and learners are not online together. It can be used anywhere, learners do study at their own pace, and it does not need everyone present at the same hour.","category":"Training Modes & Strategies","domain":"Professional Knowledge","difficulty":"Medium","sourceType":"Main Exam 3"},{"id":426,"question":"Which hand position is the LEAST suitable while presenting?","options":["Relaxed and visible when not gesturing","Open-palm gestures","Holding a clicker lightly","Hands clasped tightly behind the back"],"correctAnswer":"D","explanation":"Hands clasped tightly behind the back hide the hands and look rigid or closed, so it is the least suitable. Relaxed visible hands, open-palm gestures and holding a clicker lightly are all fine. Read the word LEAST.","category":"Least Important / Least Appropriate","domain":"Professional Practices","difficulty":"Medium","sourceType":"Main Exam 3"},{"id":427,"question":"Which CPD approach involves a trainer examining and learning from their own sessions?","options":["Marking attendance","Booking rooms","Reflective practice","Photocopying handouts"],"correctAnswer":"C","explanation":"Reflective practice means examining and learning from your own sessions, a core CPD habit. Marking attendance, booking rooms and photocopying are routine admin tasks, not learning.","category":"Professional Development (CPD)","domain":"Professional Values and Responsibilities","difficulty":"Medium","sourceType":"Main Exam 3"},{"id":428,"question":"A trainer wants to put a diagram from a published textbook into handouts. Which action respects intellectual property?","options":["Use it freely because the handout is for training only","Redraw it slightly and present it as the trainer's own","Remove the source so that the handout looks original","Obtain permission or use it within the permitted licence, with a proper citation"],"correctAnswer":"D","explanation":"Obtain permission or use it within the permitted licence, with a proper citation. Using it freely, redrawing and claiming it as your own, or removing the source all breach intellectual property.","category":"Ethics & Confidentiality","domain":"Professional Values and Responsibilities","difficulty":"Medium","sourceType":"Main Exam 3"},{"id":429,"question":"In which ADDIE stage does a trainer enrol trainees, arrange the room and deliver the sessions?","options":["Evaluation of results","Implementation","Analysis of the audience","Design of the blueprint"],"correctAnswer":"B","explanation":"Implementation is the stage where you enrol trainees, arrange the room and deliver the sessions. Analysis studies the audience, Design makes the blueprint, and Evaluation reviews results.","category":"Instructional Design (ADDIE)","domain":"Professional Knowledge","difficulty":"Medium","sourceType":"Main Exam 3"},{"id":430,"question":"A trainer must postpone a course for personal reasons. Which message to trainees is MOST professional?","options":["A short, polite notice with a new date and an apology","A detailed account of the trainer's personal problems","A message blaming the organisation for the problem","One word: 'Cancelled', with no explanation"],"correctAnswer":"A","explanation":"A short, polite notice with a new date and an apology is clear, courteous and solution-focused, and keeps private details private. Over-sharing personal problems, blaming the organisation, or a bare 'Cancelled' is unprofessional.","category":"Managing Training Sessions","domain":"Professional Values and Responsibilities","difficulty":"Medium","sourceType":"Main Exam 3"},{"id":431,"question":"A trainer skips Analysis and starts building slides immediately. What is the MOST likely risk?","options":["Slides that are shorter than they should be","Training that misses the real performance gap","Faster delivery with no risk at all","Evaluation becoming unnecessary at the end"],"correctAnswer":"B","explanation":"Skipping Analysis risks training that misses the real performance gap, so you build the wrong solution. It does not simply make slides shorter, and it cannot be risk-free or make evaluation unnecessary.","category":"Instructional Design (ADDIE)","domain":"Professional Knowledge","difficulty":"Hard","sourceType":"Main Exam 3"},{"id":432,"question":"Which is the LEAST likely to count as CPD?","options":["Reading current research on adult learning","Attending a workshop on new methods","Repeating the same session with no feedback","Observing a colleague's session and reflecting"],"correctAnswer":"C","explanation":"Repeating the same session with no feedback involves no new learning or change, so it is the least likely to count as CPD. Reading research, attending a workshop and observing a colleague with reflection all build skills. Read the word LEAST.","category":"Least Important / Least Appropriate","domain":"Professional Values and Responsibilities","difficulty":"Medium","sourceType":"Main Exam 3"},{"id":433,"question":"A learner is asked to enter personal data on a page whose address begins with http:// (no S). What is the best advice?","options":["Avoid it, because the connection is not encrypted","Enter the data twice to be safe","Proceed if the page looks very professional","Proceed, because all web pages are secure"],"correctAnswer":"A","explanation":"Plain http:// is not encrypted, so personal data could be intercepted. Avoid it and look for https://. A professional appearance does not make a page secure, and entering the data twice makes things worse.","category":"Online Training & Digital Tools","domain":"Future Skills","difficulty":"Medium","sourceType":"Main Exam 3"},{"id":434,"question":"Forty pilots train on rotating overseas flights and can only study when they are on the ground, at unpredictable times. Which delivery method is MOST appropriate?","options":["Synchronous classroom sessions every Sunday","A one-day face-to-face seminar at head office","A live Zoom lecture at 10:00 every Monday","Asynchronous learning with online modules"],"correctAnswer":"D","explanation":"Asynchronous online modules let pilots study when they are on the ground at unpredictable times. Weekly Sunday classes, a one-day seminar and a live 10:00 Monday lecture all require fixed times and places."
