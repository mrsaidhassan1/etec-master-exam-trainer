<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ETEC Master Exam Trainer</title>
<meta name="description" content="Interactive ETEC trainer/instructor exam prep app — practice questions, mock exams, revision notes, weak-area analysis, spaced practice and progress tracking.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ===== Design tokens ===== */
  :root{
    --bg:#F3F5FA;
    --surface:#FFFFFF;
    --surface-2:#EAEEF5;
    --sidebar:#0B1E3A;
    --sidebar-hover:#132A4F;
    --sidebar-text:#B9C6DE;
    --sidebar-text-active:#FFFFFF;
    --border:#DCE2ED;
    --border-strong:#C4CCDC;
    --ink:#101B33;
    --ink-muted:#5B6479;
    --ink-faint:#8993A8;
    --navy:#123262;
    --navy-strong:#0B1E3A;
    --navy-tint:#E9EEF7;
    --gold:#9A6B0C;
    --gold-bg:#FBF1DA;
    --gold-border:#EBD39B;
    --good:#1E7A4C;
    --good-bg:#E5F5EC;
    --good-border:#B9E4CA;
    --bad:#B0362D;
    --bad-bg:#FBEAE8;
    --bad-border:#F0C2BD;
    --shadow-sm:0 1px 2px rgba(11,30,58,0.06);
    --shadow-md:0 6px 20px rgba(11,30,58,0.10);
    --focus-ring:0 0 0 3px rgba(18,50,98,0.35);
    --radius-sm:6px;
    --radius-md:10px;
    --radius-lg:16px;
    --font-display:"Source Serif 4", Georgia, "Times New Roman", serif;
    --font-body:"IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --font-mono:"IBM Plex Mono", "SF Mono", Consolas, monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0A1526;
      --surface:#111F38;
      --surface-2:#16294A;
      --sidebar:#070F1F;
      --sidebar-hover:#101F3B;
      --sidebar-text:#8FA0BC;
      --sidebar-text-active:#FFFFFF;
      --border:#22334F;
      --border-strong:#2E4166;
      --ink:#E7ECF6;
      --ink-muted:#98A6C0;
      --ink-faint:#6C7B99;
      --navy:#7FA8DE;
      --navy-strong:#A9C6EE;
      --navy-tint:#152941;
      --gold:#E5B84E;
      --gold-bg:rgba(229,184,78,0.12);
      --gold-border:rgba(229,184,78,0.35);
      --good:#4FB57F;
      --good-bg:rgba(79,181,127,0.12);
      --good-border:rgba(79,181,127,0.35);
      --bad:#E2716A;
      --bad-bg:rgba(226,113,106,0.12);
      --bad-border:rgba(226,113,106,0.35);
      --shadow-sm:0 1px 2px rgba(0,0,0,0.3);
      --shadow-md:0 10px 30px rgba(0,0,0,0.45);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0A1526;
    --surface:#111F38;
    --surface-2:#16294A;
    --sidebar:#070F1F;
    --sidebar-hover:#101F3B;
    --sidebar-text:#8FA0BC;
    --sidebar-text-active:#FFFFFF;
    --border:#22334F;
    --border-strong:#2E4166;
    --ink:#E7ECF6;
    --ink-muted:#98A6C0;
    --ink-faint:#6C7B99;
    --navy:#7FA8DE;
    --navy-strong:#A9C6EE;
    --navy-tint:#152941;
    --gold:#E5B84E;
    --gold-bg:rgba(229,184,78,0.12);
    --gold-border:rgba(229,184,78,0.35);
    --good:#4FB57F;
    --good-bg:rgba(79,181,127,0.12);
    --good-border:rgba(79,181,127,0.35);
    --bad:#E2716A;
    --bad-bg:rgba(226,113,106,0.12);
    --bad-border:rgba(226,113,106,0.35);
    --shadow-sm:0 1px 2px rgba(0,0,0,0.3);
    --shadow-md:0 10px 30px rgba(0,0,0,0.45);
  }

  *,*::before,*::after{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    font-size:15px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{font-family:var(--font-display);font-weight:600;margin:0;text-wrap:balance;color:var(--ink);}
  p{margin:0;}
  button{font-family:inherit;}
  .num{font-family:var(--font-mono);font-variant-numeric:tabular-nums;}
  a{color:inherit;}
  ::selection{background:var(--navy-tint);}
  :focus-visible{outline:none;box-shadow:var(--focus-ring);border-radius:var(--radius-sm);}

  /* ===== App shell ===== */
  #app{display:flex;min-height:100vh;}

  .sidebar{
    width:248px;flex:0 0 248px;background:var(--sidebar);color:var(--sidebar-text);
    display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;
  }
  .sidebar-brand{padding:22px 20px 16px;border-bottom:1px solid rgba(255,255,255,0.08);}
  .sidebar-brand .mark{
    display:flex;align-items:center;gap:10px;
  }
  .sidebar-brand .mark-badge{
    width:34px;height:34px;border-radius:8px;background:linear-gradient(155deg,#1E4C8A,#0B1E3A);
    display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--font-display);
    font-weight:700;font-size:16px;border:1px solid rgba(255,255,255,0.18);flex:0 0 auto;
  }
  .sidebar-brand .name{font-family:var(--font-display);font-weight:600;font-size:15.5px;color:#fff;line-height:1.25;}
  .sidebar-brand .sub{font-size:10.5px;letter-spacing:0.06em;text-transform:uppercase;color:var(--sidebar-text);margin-top:2px;}

  .sidebar-ring{padding:16px 20px;border-bottom:1px solid rgba(255,255,255,0.08);display:flex;align-items:center;gap:12px;}
  .ring-wrap{position:relative;width:52px;height:52px;flex:0 0 auto;}
  .ring-wrap svg{transform:rotate(-90deg);}
  .ring-label{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:12px;font-weight:600;color:#fff;}
  .ring-caption .t1{font-size:12px;color:#fff;font-weight:600;}
  .ring-caption .t2{font-size:11px;color:var(--sidebar-text);margin-top:1px;}

  nav.sidebar-nav{padding:10px 12px;display:flex;flex-direction:column;gap:2px;flex:1;}
  .nav-item{
    display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:8px;font-size:13.5px;
    font-weight:500;cursor:pointer;color:var(--sidebar-text);background:transparent;border:1px solid transparent;
    text-align:left;width:100%;
  }
  .nav-item .ic{width:17px;height:17px;flex:0 0 auto;opacity:0.9;}
  .nav-item:hover{background:var(--sidebar-hover);color:#fff;}
  .nav-item.active{background:var(--sidebar-hover);color:#fff;border-color:rgba(255,255,255,0.12);box-shadow:inset 2px 0 0 var(--navy-strong-active,#5C8FD6);}
  .nav-item.active{position:relative;}
  .nav-item.active::before{content:"";position:absolute;left:-12px;top:6px;bottom:6px;width:3px;background:#5C8FD6;border-radius:0 3px 3px 0;}
  .nav-section-label{font-size:10px;text-transform:uppercase;letter-spacing:0.08em;color:var(--ink-faint);padding:14px 12px 4px;color:#5A6C8C;}

  .sidebar-foot{padding:14px 20px 18px;border-top:1px solid rgba(255,255,255,0.08);font-size:11px;color:var(--sidebar-text);}
  .sidebar-foot button{background:transparent;border:1px solid rgba(255,255,255,0.18);color:var(--sidebar-text);padding:6px 10px;border-radius:7px;font-size:11.5px;cursor:pointer;width:100%;margin-top:8px;}
  .sidebar-foot button:hover{color:#fff;border-color:rgba(255,255,255,0.35);}

  .main{flex:1;min-width:0;display:flex;flex-direction:column;}
  .topbar{
    position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--border);
    display:flex;align-items:center;gap:14px;padding:12px 26px;
  }
  .topbar h1{font-size:19px;}
  .topbar .crumb{font-size:12px;color:var(--ink-muted);margin-top:1px;}
  .topbar-spacer{flex:1;}
  .search-box{
    display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--border);
    border-radius:8px;padding:7px 12px;min-width:220px;
  }
  .search-box input{border:none;background:transparent;outline:none;color:var(--ink);font-size:13px;width:100%;font-family:var(--font-body);}
  .search-box svg{flex:0 0 auto;color:var(--ink-muted);}
  .streak-chip{display:flex;align-items:center;gap:6px;background:var(--gold-bg);border:1px solid var(--gold-border);color:var(--gold);padding:6px 11px;border-radius:20px;font-size:12.5px;font-weight:600;}

  .view{padding:24px 26px 60px;max-width:1180px;}
  .view.wide{max-width:none;}

  /* ===== Generic building blocks ===== */
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);}
  .card-pad{padding:20px;}
  .grid{display:grid;gap:16px;}
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;}
  .stat-tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:14px 16px;}
  .stat-tile .label{font-size:11px;text-transform:uppercase;letter-spacing:0.05em;color:var(--ink-muted);font-weight:600;}
  .stat-tile .value{font-family:var(--font-mono);font-size:26px;font-weight:600;margin-top:6px;color:var(--ink);}
  .stat-tile .value.good{color:var(--good);}
  .stat-tile .value.bad{color:var(--bad);}
  .stat-tile .sub{font-size:11.5px;color:var(--ink-faint);margin-top:3px;}

  .section-title{display:flex;align-items:baseline;justify-content:space-between;margin:28px 0 14px;}
  .section-title h2{font-size:16.5px;}
  .section-title .hint{font-size:12px;color:var(--ink-muted);}
  .view > .section-title:first-child{margin-top:0;}

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 16px;border-radius:8px;
    font-size:13.5px;font-weight:600;cursor:pointer;border:1px solid transparent;line-height:1.2;white-space:nowrap;
  }
  .btn-primary{background:var(--navy);color:#fff;}
  .btn-primary:hover{background:var(--navy-strong);}
  :root[data-theme="dark"] .btn-primary, @media (prefers-color-scheme:dark){.btn-primary{color:#08132A;}}
  .btn-ghost{background:transparent;border-color:var(--border-strong);color:var(--ink);}
  .btn-ghost:hover{background:var(--surface-2);}
  .btn-soft{background:var(--navy-tint);color:var(--navy);border-color:transparent;}
  .btn-danger{background:transparent;border-color:var(--bad-border);color:var(--bad);}
  .btn-danger:hover{background:var(--bad-bg);}
  .btn:disabled{opacity:0.45;cursor:not-allowed;}
  .btn-sm{padding:6px 11px;font-size:12.5px;border-radius:7px;}
  .icon-btn{background:transparent;border:1px solid var(--border-strong);border-radius:7px;width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink-muted);}
  .icon-btn:hover{background:var(--surface-2);color:var(--ink);}
  .icon-btn.on{background:var(--gold-bg);border-color:var(--gold-border);color:var(--gold);}

  .pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:600;}
  .pill-navy{background:var(--navy-tint);color:var(--navy);}
  .pill-good{background:var(--good-bg);color:var(--good);border:1px solid var(--good-border);}
  .pill-bad{background:var(--bad-bg);color:var(--bad);border:1px solid var(--bad-border);}
  .pill-gold{background:var(--gold-bg);color:var(--gold);border:1px solid var(--gold-border);}
  .pill-muted{background:var(--surface-2);color:var(--ink-muted);}

  select,input[type="text"]{
    font-family:var(--font-body);background:var(--surface);border:1px solid var(--border-strong);color:var(--ink);
    border-radius:7px;padding:8px 11px;font-size:13px;
  }

  /* Question card */
  .qcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);padding:26px 28px;}
  .qcard-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px;}
  .qcard-counter{font-family:var(--font-mono);font-size:12.5px;color:var(--ink-muted);}
  .qcard .stem{font-family:var(--font-display);font-size:19px;line-height:1.45;color:var(--ink);margin:2px 0 22px;text-wrap:balance;}
  .options{display:flex;flex-direction:column;gap:10px;}
  .option{
    display:flex;align-items:flex-start;gap:12px;padding:13px 15px;border:1.5px solid var(--border-strong);
    border-radius:10px;cursor:pointer;background:var(--surface);text-align:left;width:100%;
  }
  .option:hover:not(.locked){border-color:var(--navy);background:var(--navy-tint);}
  .option .letter{
    font-family:var(--font-mono);font-weight:600;font-size:12.5px;width:24px;height:24px;border-radius:6px;
    background:var(--surface-2);color:var(--ink-muted);display:flex;align-items:center;justify-content:center;flex:0 0 auto;margin-top:1px;
  }
  .option .txt{flex:1;font-size:14.5px;padding-top:1px;}
  .option.selected{border-color:var(--navy);background:var(--navy-tint);}
  .option.selected .letter{background:var(--navy);color:#fff;}
  .option.correct{border-color:var(--good-border);background:var(--good-bg);}
  .option.correct .letter{background:var(--good);color:#fff;}
  .option.incorrect{border-color:var(--bad-border);background:var(--bad-bg);}
  .option.incorrect .letter{background:var(--bad);color:#fff;}
  .option.locked{cursor:default;}
  .option.locked:not(.correct):not(.incorrect):not(.selected){opacity:0.6;}

  .feedback-banner{display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:10px;font-weight:600;font-size:14px;margin-top:20px;}
  .feedback-banner.good{background:var(--good-bg);color:var(--good);border:1px solid var(--good-border);}
  .feedback-banner.bad{background:var(--bad-bg);color:var(--bad);border:1px solid var(--bad-border);}
  .feedback-block{margin-top:14px;padding:14px 16px;background:var(--surface-2);border-radius:10px;font-size:13.5px;color:var(--ink);}
  .feedback-block + .feedback-block{margin-top:10px;}
  .feedback-block .k{font-size:10.5px;text-transform:uppercase;letter-spacing:0.06em;font-weight:700;color:var(--ink-muted);margin-bottom:4px;}

  .qcard-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px;padding-top:18px;border-top:1px solid var(--border);}
  .confidence-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;}
  .confidence-row button{flex:1;min-width:110px;}

  /* Revision cards */
  .rev-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:18px 20px;}
  .rev-card h3{font-size:15px;margin-bottom:8px;}
  .rev-card .memory{margin-top:10px;font-size:12px;color:var(--navy);background:var(--navy-tint);display:inline-block;padding:4px 10px;border-radius:6px;font-weight:600;}
  .flow{display:flex;flex-direction:column;gap:0;}
  .flow-step{display:flex;align-items:center;gap:12px;padding:11px 14px;background:var(--surface-2);border-radius:9px;border:1px solid var(--border);}
  .flow-step .n{font-family:var(--font-mono);font-weight:700;color:var(--navy);width:20px;}
  .flow-step .t{font-weight:600;font-size:13.5px;}
  .flow-step .d{font-size:12px;color:var(--ink-muted);margin-top:1px;}
  .flow-arrow{text-align:center;color:var(--ink-faint);font-size:14px;padding:2px 0;}
  .flow-step.callout{background:var(--gold-bg);border-color:var(--gold-border);}
  .flow-step.callout .n{color:var(--gold);}

  .pyramid{display:flex;flex-direction:column;gap:6px;align-items:stretch;}
  .pyr-level{padding:14px 18px;border-radius:9px;border:1px solid var(--border);background:var(--surface-2);}
  .pyr-level .lv{font-family:var(--font-mono);font-size:11px;color:var(--ink-muted);}
  .pyr-level .name{font-family:var(--font-display);font-weight:600;font-size:15px;margin-top:2px;}
  .pyr-level .q{font-size:12.5px;color:var(--ink-muted);margin-top:2px;}
  .pyr-level:nth-child(1){background:var(--navy-tint);}

  .trap-pair{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:stretch;}
  .trap-side{background:var(--surface-2);border-radius:10px;padding:14px 16px;}
  .trap-side h4{font-size:13.5px;margin-bottom:5px;}
  .trap-side p{font-size:13px;color:var(--ink-muted);}
  .trap-vs{align-self:center;font-family:var(--font-mono);font-size:11px;color:var(--ink-faint);font-weight:700;}

  .flash-stage{display:flex;flex-direction:column;align-items:center;gap:18px;}
  .flash-card{width:100%;max-width:480px;height:230px;perspective:1200px;cursor:pointer;}
  .flash-inner{position:relative;width:100%;height:100%;transition:transform .5s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d;}
  .flash-card.flipped .flash-inner{transform:rotateY(180deg);}
  .flash-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:16px;border:1px solid var(--border);
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:26px;box-shadow:var(--shadow-md);}
  .flash-front{background:var(--surface);}
  .flash-back{background:var(--navy);color:#fff;transform:rotateY(180deg);}
  .flash-face .tag{font-size:10.5px;text-transform:uppercase;letter-spacing:0.08em;color:var(--ink-faint);margin-bottom:12px;}
  .flash-back .tag{color:rgba(255,255,255,0.65);}
  .flash-face .txt{font-family:var(--font-display);font-size:19px;font-weight:600;line-height:1.4;}
  .flash-face .hint{margin-top:14px;font-size:11.5px;color:var(--ink-faint);}
  @media (prefers-reduced-motion:reduce){.flash-inner{transition:none;}}

  .nav-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px;}
  .nav-grid button{
    aspect-ratio:1;border-radius:7px;border:1px solid var(--border-strong);background:var(--surface);
    font-family:var(--font-mono);font-size:12px;cursor:pointer;color:var(--ink-muted);
  }
  .nav-grid button.answered{background:var(--navy-tint);color:var(--navy);border-color:var(--navy);}
  .nav-grid button.flagged{background:var(--gold-bg);color:var(--gold);border-color:var(--gold-border);}
  .nav-grid button.current{outline:2px solid var(--navy);outline-offset:1px;}

  .modal-overlay{position:fixed;inset:0;background:rgba(8,16,32,0.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
  .modal{background:var(--surface);border-radius:var(--radius-lg);padding:26px;max-width:420px;width:100%;box-shadow:var(--shadow-md);border:1px solid var(--border);}
  .modal h3{font-size:17px;margin-bottom:10px;}
  .modal p{font-size:13.5px;color:var(--ink-muted);margin-bottom:20px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;}

  .toast{position:fixed;bottom:22px;right:22px;background:var(--navy-strong);color:#fff;padding:12px 18px;border-radius:10px;font-size:13px;font-weight:600;box-shadow:var(--shadow-md);z-index:200;}

  .empty{padding:40px 20px;text-align:center;color:var(--ink-muted);}
  .empty svg{margin-bottom:10px;opacity:0.5;}

  .disclaimer{margin-top:36px;padding:14px 18px;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;font-size:11.5px;color:var(--ink-muted);line-height:1.5;}

  table.data{width:100%;border-collapse:collapse;font-size:13px;}
  table.data th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:0.04em;color:var(--ink-muted);padding:8px 10px;border-bottom:1px solid var(--border);}
  table.data td{padding:10px 10px;border-bottom:1px solid var(--border);vertical-align:top;}
  table.data tr:last-child td{border-bottom:none;}
  .table-wrap{overflow-x:auto;}

  .bar-row{display:grid;grid-template-columns:170px 1fr 50px;gap:12px;align-items:center;padding:8px 0;}
  .bar-row .name{font-size:13px;font-weight:500;}
  .bar-track{height:9px;background:var(--surface-2);border-radius:6px;overflow:hidden;}
  .bar-fill{height:100%;border-radius:6px;background:var(--navy);}
  .bar-row .pct{font-family:var(--font-mono);font-size:12.5px;text-align:right;color:var(--ink-muted);}

  .chip-row{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{padding:6px 13px;border-radius:20px;border:1px solid var(--border-strong);font-size:12.5px;font-weight:600;cursor:pointer;background:var(--surface);color:var(--ink-muted);}
  .chip.on{background:var(--navy);border-color:var(--navy);color:#fff;}

  .progress-hero{display:flex;align-items:center;gap:26px;flex-wrap:wrap;}
  .progress-bar-wrap{flex:1;min-width:220px;}
  .progress-bar-track{height:14px;background:var(--surface-2);border-radius:8px;overflow:hidden;border:1px solid var(--border);}
  .progress-bar-fill{height:100%;background:linear-gradient(90deg,var(--navy),#3E6EA8);border-radius:8px;}
  .readiness-badge{padding:10px 18px;border-radius:12px;font-weight:700;font-size:14px;text-align:center;min-width:150px;}

  .two-col{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;}
  @media (max-width:900px){
    .two-col{grid-template-columns:1fr;}
    .trap-pair{grid-template-columns:1fr;}
    .trap-vs{display:none;}
  }
  @media (max-width:760px){
    #app{flex-direction:column;}
    .sidebar{position:relative;width:100%;flex:none;height:auto;}
    nav.sidebar-nav{flex-direction:row;flex-wrap:wrap;}
    .search-box{min-width:0;}
    .view{padding:18px 16px 50px;}
    .qcard{padding:18px 16px;}
  }

function defaultState(){
  return {
    answers: {},        // qid -> {selected, correct, confidence, lastAt, attempts:[{selected,correct,at}]}
    bookmarks: {},       // qid -> {important:bool, reviewLater:bool, difficult:bool}

    lastSessionScore: null,
    bestMockScore: null,
    learnOrder: null,
    learnIndex: 0
  };
}

let STATE = loadState();

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultState();
    const parsed = JSON.parse(raw);
    return Object.assign(defaultState(), parsed);
  }catch(e){ return defaultState(); }
}
function saveState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE)); }catch(e){}
}

function resetAllProgress(){
  STATE = defaultState();
  saveState();
}

// ================= Utilities =================
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function fmtTime(sec){
  sec = Math.max(0, Math.round(sec));
  const m = Math.floor(sec/60), s = sec%60;
  return String(m).padStart(2,"0") + ":" + String(s).padStart(2,"0");
}
function fmtDate(iso){
  if(!iso) return "—";
  const d = new Date(iso);
  return d.toLocaleDateString(undefined, {month:"short", day:"numeric", year:"numeric"});
}
function pct(n,d){ return d>0 ? Math.round((n/d)*100) : 0; }

// Per-question runtime shuffle cache (so options stay stable while the question is on screen,
// but reshuffle is fresh every time a new question instance is served)
const optionShuffleCache = {};
function getShuffledOptions(q, freshKey){
  const key = q.id + "::" + freshKey;
  if(!optionShuffleCache[key]){
    const idxs = shuffle([0,1,2,3]);
    optionShuffleCache[key] = idxs;
  }
  const idxs = optionShuffleCache[key];
  const letters = ["A","B","C","D"];
  return idxs.map((origIdx,i) => ({
    text: q.options[origIdx],
    letter: letters[i],
    origLetter: letters[origIdx],
    isCorrect: letters[origIdx] === q.correctAnswer
  }));
}

// ================= Derived stats =================
function getLatestOutcome(qid){
  const a = STATE.answers[qid];
  if(!a) return null;
  return a.correct;
}
function attemptedIds(){ return Object.keys(STATE.answers).map(Number); }
function computeOverall(){
  const ids = attemptedIds();
  const attempted = ids.length;
  const correct = ids.filter(id => getLatestOutcome(id) === true).length;
  const incorrect = attempted - correct;
  return { attempted, correct, incorrect, pct: pct(correct, attempted) };
}
function computeCategoryStats(){
  const out = {};
  CATEGORIES.forEach(cat => {
    const qs = QUESTIONS.filter(q => q.category === cat);
    const ids = qs.map(q=>q.id).filter(id => STATE.answers[id]);
    const correct = ids.filter(id => getLatestOutcome(id) === true).length;
    out[cat] = { total: qs.length, attempted: ids.length, correct, pct: pct(correct, ids.length) };
  });
  return out;
}
function strongestWeakest(){
  const cs = computeCategoryStats();
  const withData = Object.entries(cs).filter(([,v]) => v.attempted >= 2);
  if(withData.length === 0) return { strongest: "—", weakest: "—" };
  const sorted = withData.sort((a,b) => b[1].pct - a[1].pct);
  return { strongest: sorted[0][0], weakest: sorted[sorted.length-1][0] };
}
function readinessLabel(){
  const { attempted, pct: overallPct } = computeOverall();
  if(attempted < 10) return { label: "Low", note: "Answer at least 10 questions to unlock a readiness estimate." };
  if(overallPct >= 90) return { label: "Exam Ready", note: "Excellent accuracy across attempted questions." };
  if(overallPct >= 80) return { label: "Very Good", note: "Strong performance — polish remaining weak areas." };
  if(overallPct >= 70) return { label: "Good", note: "Solid base — keep drilling weaker topics." };
  if(overallPct >= 60) return { label: "Developing", note: "Making progress — more mock practice recommended." };
  return { label: "Low", note: "Needs more preparation before sitting the exam." };
}
function readinessColorVar(label){
  if(label === "Exam Ready") return "good";
  if(label === "Very Good") return "good";
  if(label === "Good") return "navy";
  if(label === "Developing") return "gold";
  return "bad";
}
function classify(scorePct){
  if(scorePct >= 90) return "Excellent / Exam Ready";
  if(scorePct >= 80) return "Very Good";
  if(scorePct >= 70) return "Good";
  if(scorePct >= 60) return "Developing";
  return "Needs More Preparation";
}

// Spaced-repetition bucket update
function updateReviewBucket(qid, correct, confidence){
  let bucket;
  if(!correct) bucket = "today";
  else if(confidence === "guessing" || confidence === "not-sure" || !confidence) bucket = "soon";
  else bucket = "mastered";
  const dangerous = (!correct && confidence === "very-sure");
  STATE.review[qid] = { bucket, dangerous, lastConfidence: confidence || null };
}
function reviewBuckets(){
  const out = { today: [], soon: [], mastered: [] };
  Object.entries(STATE.review).forEach(([qid, v]) => {
    if(out[v.bucket]) out[v.bucket].push(Number(qid));
  });
  return out;
}
function dangerousIds(){
  return Object.entries(STATE.review).filter(([,v]) => v.dangerous).map(([qid]) => Number(qid));
}

// Study streak (calendar-day based, any activity counts)
function touchStreak(){
  const today = todayStr();
  const s = STATE.streak;
  if(s.lastActiveDate === today) return;
  const yest = new Date(Date.now() - 86400000).toISOString().slice(0,10);
  if(s.lastActiveDate === yest) s.current += 1;
  else s.current = 1;
  s.best = Math.max(s.best, s.current);
  s.lastActiveDate = today;
}

// Record a completed study session (practice / mock / daily) into history + mistakes/answers
function recordAnswer(qid, selectedLetter, confidence){
  const q = QMAP[qid];
  const correct = selectedLetter === q.correctAnswer;
  const prev = STATE.answers[qid];
  const attempts = prev ? prev.attempts.slice() : [];
  attempts.push({ selected: selectedLetter, correct, at: Date.now() });
  STATE.answers[qid] = { selected: selectedLetter, correct, confidence: confidence || null, lastAt: Date.now(), attempts };
  if(!correct) STATE.mistakeStatus[qid] = "active";
  else if(STATE.mistakeStatus[qid] === "active") { /* leave history, but it's no longer "current" wrong */ }
  updateReviewBucket(qid, correct, confidence);
  touchStreak();
  saveState();
}
function wrongAttemptCount(qid){
  const a = STATE.answers[qid];
  if(!a) return 0;
  return a.attempts.filter(x => !x.correct).length;
}
function activeMistakes(){
  return Object.keys(STATE.answers)
    .map(Number)
    .filter(id => STATE.answers[id].correct === false && STATE.mistakeStatus[id] !== "learned");
}
function learnedMistakes(){
  return Object.keys(STATE.mistakeStatus).map(Number).filter(id => STATE.mistakeStatus[id] === "learned");
}

function toggleBookmark(qid, kind){
  const b = STATE.bookmarks[qid] || { important:false, reviewLater:false, difficult:false };
  b[kind] = !b[kind];
  STATE.bookmarks[qid] = b;
  saveState();
}
function isBookmarked(qid, kind){
  return !!(STATE.bookmarks[qid] && STATE.bookmarks[qid][kind]);
}

function logSession(type, correct, total){
  STATE.sessionHistory.push({ date: todayStr(), type, pct: pct(correct,total), count: total });
  if(STATE.sessionHistory.length > 200) STATE.sessionHistory.shift();
  STATE.lastSessionScore = pct(correct,total);
  saveState();
}

  const revKey = CATEGORY_TO_REVISION[q.category];

  let html = '<div class="qcard">';
  html += '<div class="qcard-meta">';
  html += '<span class="qcard-counter">Question '+(STUDY.index+1)+' of '+total+'</span>';
  html += '<span class="pill pill-navy">'+q.category+'</span>';
  html += '<span class="pill pill-muted">'+q.difficulty+'</span>';
  if(q.sourceType === "Practice Variation") html += '<span class="pill pill-gold">Practice Variation</span>';
  html += '<span style="flex:1;"></span>';
  html += '<button class="icon-btn '+(isBookmarked(q.id,"important")?"on":"")+'" data-bm="important" title="Mark important">★</button>';
  html += '<button class="icon-btn '+(isBookmarked(q.id,"reviewLater")?"on":"")+'" data-bm="reviewLater" title="Review later">🔖</button>';
  html += '<button class="icon-btn '+(isBookmarked(q.id,"difficult")?"on":"")+'" data-bm="difficult" title="Difficult">⚠</button>';
  html += '</div>';
  html += '<div class="stem">'+escapeHtml(q.question)+'</div>';
  html += '<div class="options">';
  opts.forEach(function(o){
    let cls = "option";
    if(STUDY.locked){
      cls += " locked";
      if(o.isCorrect) cls += " correct";
      else if(o.letter === STUDY.selectedLetter) cls += " incorrect";
    } else if(o.letter === STUDY.selectedLetter){ cls += " selected"; }
    html += '<button class="'+cls+'" data-letter="'+o.letter+'" '+(STUDY.locked?"disabled":"")+'>' +
      '<span class="letter">'+o.letter+'</span><span class="txt">'+escapeHtml(o.text)+'</span>' +
      (STUDY.locked && o.isCorrect ? '<span style="margin-left:auto;color:var(--good);font-weight:700;">✓</span>' : "") +
      (STUDY.locked && !o.isCorrect && o.letter===STUDY.selectedLetter ? '<span style="margin-left:auto;color:var(--bad);font-weight:700;">✕</span>' : "") +
    '</button>';
  });
  html += '</div>';

  if(!STUDY.locked){
    html += '<div class="qcard-actions">';
    html += '<button class="btn btn-primary" id="submit-answer" '+(STUDY.selectedLetter?"":"disabled")+'>Submit Answer</button>';
    if(STUDY.mode==="learn" && STUDY.index>0) html += '<button class="btn btn-ghost" id="prev-q">Previous</button>';
    html += '</div>';
  } else {
    const correctOpt = opts.find(function(o){ return o.isCorrect; });
    const wasCorrect = STUDY.selectedLetter === correctOpt.letter;
    html += '<div class="feedback-banner '+(wasCorrect?"good":"bad")+'">'+(wasCorrect?"✅ Correct!":"❌ Incorrect")+'</div>';
    html += '<div class="feedback-block"><div class="k">Answer</div>'+correctOpt.letter+'. '+escapeHtml(correctOpt.text)+'</div>';
    html += '<div class="feedback-block"><div class="k">Explanation</div>'+escapeHtml(q.explanation)+'</div>';
    html += '<div class="feedback-block"><div class="k">Topic / Model</div>'+q.category+'</div>';
    if(STUDY.explainMore){
      const sec = REVISION_SECTIONS.find(function(s){return s.id===revKey;});
      html += '<div class="feedback-block"><div class="k">From Revision Notes — '+(sec?sec.title:q.category)+'</div>' + renderRevisionSectionInline(sec) + '</div>';
    }

    if(STUDY.mode !== "retry"){
      html += '<div class="confidence-row" id="confidence-row">';
      html += '<div style="width:100%;font-size:11.5px;color:var(--ink-muted);margin-bottom:2px;">How confident were you? (optional)</div>';
      ["Guessing","Not Sure","Fairly Sure","Very Sure"].forEach(function(c){
        const val = c.toLowerCase().replace(" ","-");
        html += '<button class="btn btn-ghost btn-sm" data-conf="'+val+'">'+c+'</button>';
      });
      html += '</div>';
    }

    html += '<div class="qcard-actions">';
    if(STUDY.mode==="learn" && STUDY.index>0) html += '<button class="btn btn-ghost" id="prev-q">Previous</button>';
    html += '<button class="btn btn-primary" id="next-q">'+(STUDY.index+1<total?"Next Question":"Finish")+'</button>';
    html += '<button class="btn btn-soft" id="save-q">Save Question</button>';
    html += '<button class="btn btn-soft" id="add-revision">Add to Revision</button>';
    if(!STUDY.explainMore) html += '<button class="btn btn-ghost" id="explain-more">Explain More</button>';
    html += '</div>';
  }
  html += '</div>';
  return html;
}

function renderRevisionSectionInline(sec){
  if(!sec) return "No additional source material available for this topic.";
  let out = "";
  if(sec.cards) out += sec.cards.map(function(c){ return "<strong>"+escapeHtml(c.title)+"</strong> — "+escapeHtml(c.body)+(c.memory?" <em>("+escapeHtml(c.memory)+")</em>":""); }).join("<br><br>");
  if(sec.flow){
    out += (out?"<br><br>":"") + "<strong>"+(sec.flow.title||sec.title)+"</strong>: " + sec.flow.steps.join(" → ");
    if(sec.flow.memory) out += " <em>("+escapeHtml(sec.flow.memory)+")</em>";
    if(sec.flow.callout) out += "<br>"+escapeHtml(sec.flow.callout);
  }
  if(sec.pyramid) out += (out?"<br><br>":"") + sec.pyramid.map(function(p){return p.name+": "+p.q;}).join("<br>");
  return out;
}

function renderSessionSummary(){

function titleCase(s){ return s.charAt(0).toUpperCase()+s.slice(1); }

function attachStudyHandlers(){
  if(!STUDY || STUDY.done){
    const doneBtn = document.getElementById("summary-done");
    if(doneBtn) doneBtn.addEventListener("click", function(){
      const rr = STUDY.returnRoute; STUDY = null; SUBVIEW = null; navigate(rr);
    });
    const againBtn = document.getElementById("summary-again");
    if(againBtn) againBtn.addEventListener("click", function(){ STUDY=null; SUBVIEW=null; navigate("practice"); });
    return;
  }
  document.querySelectorAll(".option").forEach(function(btn){
    btn.addEventListener("click", function(){
      if(STUDY.locked) return;
      STUDY.selectedLetter = btn.getAttribute("data-letter");
      renderView();
    });
  });
  const submitBtn = document.getElementById("submit-answer");
  if(submitBtn) submitBtn.addEventListener("click", function(){
    if(!STUDY.selectedLetter) return;
    STUDY.locked = true;
    const q = currentStudyQuestion();
    const opts = getShuffledOptions(q, STUDY.freshKey);
    const chosen = opts.find(function(o){ return o.letter === STUDY.selectedLetter; });
    const correct = chosen.isCorrect;
    if(correct) STUDY.correctCount++;
    if(STUDY.mode !== "retry"){
      recordAnswer(q.id, chosen.origLetter, null);
    } else {
      recordAnswer(q.id, chosen.origLetter, null);
      if(correct) toast("Nice — marking progress on this question.");
    }
    renderView();
  });
  document.querySelectorAll("[data-conf]").forEach(function(btn){
    btn.addEventListener("click", function(){
      const q = currentStudyQuestion();
      const val = btn.getAttribute("data-conf");
      updateReviewBucket(q.id, STATE.answers[q.id].correct, val);
      STATE.answers[q.id].confidence = val;
      saveState();
      document.getElementById("confidence-row").innerHTML = '<span style="font-size:12px;color:var(--good);font-weight:600;">Noted — thanks.</span>';
    });
  });
  const explainBtn = document.getElementById("explain-more");
  if(explainBtn) explainBtn.addEventListener("click", function(){ STUDY.explainMore = true; renderView(); });
  const saveBtn = document.getElementById("save-q");
  if(saveBtn) saveBtn.addEventListener("click", function(){ toggleBookmark(currentStudyQuestion().id,"important"); toast("Saved to Important Questions."); renderView(); });
  const addRevBtn = document.getElementById("add-revision");
  if(addRevBtn) addRevBtn.addEventListener("click", function(){ toggleBookmark(currentStudyQuestion().id,"reviewLater"); toast("Added to Review Later."); renderView(); });
  document.querySelectorAll('[data-bm]').forEach(function(btn){
    btn.addEventListener("click", function(){
      toggleBookmark(currentStudyQuestion().id, btn.getAttribute("data-bm"));
      renderView();
    });
  });
  const prevBtn = document.getElementById("prev-q");
  if(prevBtn) prevBtn.addEventListener("click", function(){
    STUDY.index = Math.max(0, STUDY.index-1);
    STUDY.locked=false; STUDY.selectedLetter=null; STUDY.explainMore=false; STUDY.freshKey=newFreshKey();
    if(STUDY.mode==="learn"){ STATE.learnIndex = STUDY.index; saveState(); }
    renderView();
  });
  const nextBtn = document.getElementById("next-q");
  if(nextBtn) nextBtn.addEventListener("click", function(){
    if(STUDY.index+1 >= STUDY.ids.length){
      if(STUDY.mode==="practice" || STUDY.mode==="daily"){
        logSession(STUDY.mode, STUDY.correctCount, STUDY.ids.length);
        if(STUDY.mode==="daily"){
          const today = todayStr();
          const y = new Date(Date.now()-86400000).toISOString().slice(0,10);
          STATE.daily.streak = (STATE.daily.lastDate===y) ? STATE.daily.streak+1 : 1;
          STATE.daily.best = Math.max(STATE.daily.best, STATE.daily.streak);
          STATE.daily.lastDate = today;
          STATE.daily.history.push({date:today, pct: pct(STUDY.correctCount, STUDY.ids.length)});
          saveState();
        }
      }
      if(STUDY.mode==="learn"){ STATE.learnIndex = 0; STATE.learnOrder = shuffle(QUESTIONS.map(function(q){return q.id;})); saveState(); }
      STUDY.done = true; renderView(); return;
    }
    STUDY.index++;
    STUDY.locked=false; STUDY.selectedLetter=null; STUDY.explainMore=false; STUDY.freshKey=newFreshKey();
    if(STUDY.mode==="learn"){ STATE.learnIndex = STUDY.index; saveState(); }
    renderView();
  });
}

let mockTimerHandle = null;

function renderMockHome(){

        return '<tr><td>'+fmtDate(a.dateFinished)+'</td><td>'+MOCK_MODES[a.mode].label+'</td><td class="num">'+a.pct+'%</td><td class="num">'+a.correct+'/'+a.total+'</td><td class="num">'+fmtTime(a.timeTakenSec)+'</td><td>'+classify(a.pct)+'</td></tr>';

function after_mock(){
  document.querySelectorAll('[data-mock-start]').forEach(function(b){
    b.addEventListener("click", function(){ startMock(b.getAttribute("data-mock-start")); });
  });
}

function startMock(modeKey){
  const cfg = MOCK_MODES[modeKey];
  const ids = shuffle(QUESTIONS.map(function(q){return q.id;})).slice(0, cfg.count);
  const optionOrder = {};
  ids.forEach(function(id){ optionOrder[id] = shuffle([0,1,2,3]); });
  MOCK = {
    mode: modeKey, ids: ids, index: 0, answers: {}, optionOrder: optionOrder,
    startedAt: Date.now(), durationSec: cfg.minutes*60, remainingSec: cfg.minutes*60
  };
  SUBVIEW = "mock-session"; ROUTE = "mock"; render();
  clearInterval(mockTimerHandle);
  mockTimerHandle = setInterval(function(){
    if(!MOCK) { clearInterval(mockTimerHandle); return; }
    MOCK.remainingSec--;
    if(MOCK.remainingSec <= 0){
      clearInterval(mockTimerHandle);
      MOCK.remainingSec = 0;
      submitMock(true);
      return;
    }
    const t = document.getElementById("mock-timer");
    if(t) t.textContent = fmtTime(MOCK.remainingSec);
    if(MOCK.remainingSec <= 60 && t) t.style.color = "var(--bad)";
  }, 1000);
}

function mockOptionsFor(q){
  const idxs = MOCK.optionOrder[q.id];
  const letters = ["A","B","C","D"];
  return idxs.map(function(origIdx,i){ return { text: q.options[origIdx], letter: letters[i], origLetter: letters[origIdx] }; });
}

function renderMockSession(){
  const q = QMAP[MOCK.ids[MOCK.index]];
  const opts = mockOptionsFor(q);
  const ans = MOCK.answers[q.id] || {};
  const answeredCount = Object.keys(MOCK.answers).filter(function(id){return MOCK.answers[id].selected;}).length;

  let left = '<div class="qcard">';
  left += '<div class="qcard-meta"><span class="qcard-counter">Question '+(MOCK.index+1)+' of '+MOCK.ids.length+'</span>' +
    '<span class="pill pill-navy">'+q.category+'</span>' +
    '<span style="flex:1;"></span>' +
    '<button class="icon-btn '+(ans.flagged?"on":"")+'" id="flag-btn" title="Flag for review">🚩</button></div>';
  left += '<div class="stem">'+escapeHtml(q.question)+'</div>';
  left += '<div class="options">';
  opts.forEach(function(o){
    const cls = "option" + (ans.selected===o.letter ? " selected":"");
    left += '<button class="'+cls+'" data-letter="'+o.letter+'"><span class="letter">'+o.letter+'</span><span class="txt">'+escapeHtml(o.text)+'</span></button>';
  });
  left += '</div>';
  left += '<div class="qcard-actions">' +
    '<button class="btn btn-ghost" id="mock-prev" '+(MOCK.index===0?"disabled":"")+'>Previous</button>' +
    '<button class="btn btn-primary" id="mock-next" '+(MOCK.index===MOCK.ids.length-1?"disabled":"")+'>Next</button>' +
    '<span style="flex:1;"></span>' +
    '<button class="btn btn-danger" id="mock-submit">Submit Exam</button>' +
  '</div>';
  left += '</div>';

  let right = '<div class="card card-pad">' +
    '<div style="text-align:center;margin-bottom:14px;"><div style="font-size:11px;text-transform:uppercase;letter-spacing:0.06em;color:var(--ink-muted);">Time Remaining</div>' +
    '<div id="mock-timer" class="num" style="font-size:28px;font-weight:700;">'+fmtTime(MOCK.remainingSec)+'</div></div>' +
    '<div style="display:flex;justify-content:space-between;font-size:12px;color:var(--ink-muted);margin-bottom:10px;"><span>'+answeredCount+' answered</span><span>'+(MOCK.ids.length-answeredCount)+' remaining</span></div>' +
    '<div class="nav-grid">' +
    MOCK.ids.map(function(id,i){
      const a = MOCK.answers[id] || {};
      let cls = "";
      if(a.selected) cls += " answered";
      if(a.flagged) cls += " flagged";
      if(i===MOCK.index) cls += " current";
      return '<button class="'+cls+'" data-jump="'+i+'">'+(i+1)+'</button>';
    }).join("") +
    '</div>' +
    '<div style="display:flex;gap:10px;margin-top:14px;font-size:11.5px;color:var(--ink-muted);flex-wrap:wrap;">' +
      '<span><span style="display:inline-block;width:9px;height:9px;background:var(--navy-tint);border:1px solid var(--navy);border-radius:2px;"></span> Answered</span>' +
      '<span><span style="display:inline-block;width:9px;height:9px;background:var(--gold-bg);border:1px solid var(--gold-border);border-radius:2px;"></span> Flagged</span>' +
    '</div>' +
  '</div>';

  return '<div style="display:grid;grid-template-columns:1fr 300px;gap:18px;align-items:start;">'+left+right+'</div>';
}

function attachMockSessionHandlers(){
  const q = QMAP[MOCK.ids[MOCK.index]];
  document.querySelectorAll(".option").forEach(function(btn){
    btn.addEventListener("click", function(){
      const letter = btn.getAttribute("data-letter");
      MOCK.answers[q.id] = MOCK.answers[q.id] || {};
      MOCK.answers[q.id].selected = letter;
      renderView();
    });
  });
  const flag = document.getElementById("flag-btn");
  if(flag) flag.addEventListener("click", function(){
    MOCK.answers[q.id] = MOCK.answers[q.id] || {};
    MOCK.answers[q.id].flagged = !MOCK.answers[q.id].flagged;
    renderView();
  });
  const prev = document.getElementById("mock-prev");
  if(prev) prev.addEventListener("click", function(){ MOCK.index = Math.max(0,MOCK.index-1); renderView(); });
  const next = document.getElementById("mock-next");
  if(next) next.addEventListener("click", function(){ MOCK.index = Math.min(MOCK.ids.length-1,MOCK.index+1); renderView(); });
  document.querySelectorAll("[data-jump]").forEach(function(btn){
    btn.addEventListener("click", function(){ MOCK.index = Number(btn.getAttribute("data-jump")); renderView(); });
  });
  const submitBtn = document.getElementById("mock-submit");
  if(submitBtn) submitBtn.addEventListener("click", function(){
    const unanswered = MOCK.ids.length - Object.keys(MOCK.answers).filter(function(id){return MOCK.answers[id].selected;}).length;
    openModal({
      title: "Submit exam?",
      body: unanswered>0 ? "You have <strong>"+unanswered+"</strong> unanswered question(s). Once submitted you cannot change your answers." : "You have answered every question. Once submitted you cannot change your answers.",
      confirmLabel: "Submit Exam",
      onConfirm: function(){ submitMock(false); }
    });
  });
}

function submitMock(auto){
  clearInterval(mockTimerHandle);
  const timeTakenSec = MOCK.durationSec - MOCK.remainingSec;
  let correct=0, incorrect=0, unanswered=0;
  const topicBreakdown = {};
  MOCK.ids.forEach(function(id){
    const q = QMAP[id];
    const a = MOCK.answers[id] || {};
    topicBreakdown[q.category] = topicBreakdown[q.category] || {correct:0,total:0};
    topicBreakdown[q.category].total++;
    if(!a.selected){ unanswered++; }
    else{
      const chosen = mockOptionsFor(q).find(function(o){ return o.letter === a.selected; });
      if(chosen.origLetter === q.correctAnswer){ correct++; topicBreakdown[q.category].correct++; recordAnswer(id, chosen.origLetter, null); }
      else { incorrect++; recordAnswer(id, chosen.origLetter, null); }
    }
  });
  const total = MOCK.ids.length;
  const scorePct = pct(correct, total);
  const attempt = {
    id: "mock_"+Date.now(), mode: MOCK.mode, dateStarted: MOCK.startedAt, dateFinished: Date.now(),
    correct: correct, incorrect: incorrect, unanswered: unanswered, total: total, pct: scorePct,
    timeTakenSec: timeTakenSec, topicBreakdown: topicBreakdown, auto: !!auto
  };
  STATE.mockAttempts.push(attempt);
  STATE.bestMockScore = Math.max(STATE.bestMockScore||0, scorePct);
  logSession("mock", correct, total);
  saveState();
  MOCK.lastResult = attempt;
  SUBVIEW = "mock-result"; render();
}

  if(c) c.addEventListener("click", function(){ FLASH_FLIPPED = !FLASH_FLIPPED; renderView(); });
  const prev = document.getElementById("flash-prev");
  if(prev) prev.addEventListener("click", function(){ FLASH_INDEX=Math.max(0,FLASH_INDEX-1); FLASH_FLIPPED=false; renderView(); });
  const next = document.getElementById("flash-next");

    return item.question.toLowerCase().indexOf(q)!==-1 || item.explanation.toLowerCase().indexOf(q)!==-1 ||
      item.category.toLowerCase().indexOf(q)!==-1 || item.options.some(function(o){return o.toLowerCase().indexOf(q)!==-1;});
  }).slice(0,15);
  const revMatches = [];
  REVISION_SECTIONS.forEach(function(sec){
    const hay = (sec.title + " " + JSON.stringify(sec)).toLowerCase();
    if(hay.indexOf(q)!==-1) revMatches.push(sec);
  });
  const trapMatches = EXAM_TRAPS.filter(function(t){ return (t.a+t.aBody+t.b+t.bBody).toLowerCase().indexOf(q)!==-1; });
  const rapidMatches = RAPID_REVIEW.filter(function(r){ return (r.k+r.v).toLowerCase().indexOf(q)!==-1; });

  let html = '<div class="section-title"><h2>Search results for "'+escapeHtml(SEARCH_QUERY)+'"</h2></div>';
  if(qMatches.length===0 && revMatches.length===0 && trapMatches.length===0 && rapidMatches.length===0){
    return html + '<div class="empty">No matches in questions, revision notes, or exam traps.</div>';
  }
  if(qMatches.length){
    html += '<h3 style="font-size:13px;margin:14px 0 8px;color:var(--ink-muted);">QUESTIONS ('+qMatches.length+')</h3><div class="card card-pad">' +
      qMatches.map(function(item){ return '<div class="bar-row" style="grid-template-columns:1fr auto;cursor:pointer;" data-search-retry="'+item.id+'"><div class="name">'+escapeHtml(item.question.slice(0,110))+'</div><span class="pill pill-navy">'+item.category+'</span></div>'; }).join("") +
      '</div>';
  }
  if(revMatches.length){
    html += '<h3 style="font-size:13px;margin:14px 0 8px;color:var(--ink-muted);">CONCEPTS</h3><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr));">' +
      revMatches.map(function(sec){ return '<div class="rev-card"><h3>'+sec.title+'</h3><p style="font-size:12.5px;color:var(--ink-muted);">Open the Revision page for full notes.</p></div>'; }).join("") + '</div>';
  }
  if(rapidMatches.length){
    html += '<h3 style="font-size:13px;margin:14px 0 8px;color:var(--ink-muted);">RAPID FACTS</h3><div class="card card-pad">' +
      rapidMatches.map(function(r){ return '<div class="bar-row" style="grid-template-columns:1fr auto;"><div class="name">'+r.k+'</div><span class="pill pill-muted">'+r.v+'</span></div>'; }).join("") + '</div>';
  }
  if(trapMatches.length){
    html += '<h3 style="font-size:13px;margin:14px 0 8px;color:var(--ink-muted);">EXAM TRAPS</h3><div class="card card-pad">' +
      trapMatches.map(function(t){ return '<div class="bar-row" style="grid-template-columns:1fr auto;"><div class="name">'+t.a+' vs '+t.b+'</div></div>'; }).join("") + '</div>';
  }
  return html;
}
function attachSearchHandlers(){
  document.querySelectorAll('[data-search-retry]').forEach(function(el){
    el.addEventListener("click", function(){ SEARCH_QUERY=""; startRetry(Number(el.getAttribute("data-search-retry"))); });
  });
}

// ================= Boot =================
document.addEventListener("DOMContentLoaded", function(){
  render();
});
</script>

</body>
</html>
