function startMainExam(examKey){
  const exam = MAIN_EXAMS[examKey];
  const parts = MAIN_EXAM_STRUCTURE.map(function(p){
    const pool = exam.ids.filter(function(id){ return QMAP[id].domain === p.domain; });
    const ids = shuffle(pool.slice());
    const optionOrder = {};
    ids.forEach(function(id){ optionOrder[id] = shuffle([0,1,2,3]); });
    return {
      key: p.key, label: p.label, domain: p.domain, ids: ids, index: 0, answers: {}, optionOrder: optionOrder,
      durationSec: p.minutes*60, remainingSec: p.minutes*60, status: "pending", startedAt: null, finishedAt: null, result: null
    };
  });
  EXAM = { examKey: examKey, examTitle: exam.title, partIndex: 0, parts: parts, startedAt: Date.now(), lastResult: null };
  activateExamPart(0);
  SUBVIEW = "mock-session"; ROUTE = "mock"; render();
  track("mock_start", { mode: examKey });
}

function activateExamPart(i){
  EXAM.partIndex = i;
  const part = EXAM.parts[i];
  part.status = "active";
  part.startedAt = Date.now();
  clearInterval(examTimerHandle);
  examTimerHandle = setInterval(function(){
    if(!EXAM){ clearInterval(examTimerHandle); return; }
    const p = EXAM.parts[EXAM.partIndex];
    p.remainingSec--;
    if(p.remainingSec <= 0){
      p.remainingSec = 0;
      finishExamPart(true);
      return;
    }
    const t = document.getElementById("mock-timer");
    if(t) t.textContent = fmtTime(p.remainingSec);
    if(p.remainingSec <= 60 && t) t.style.color = "var(--bad)";
  }, 1000);
}

function currentExamPart(){ return EXAM.parts[EXAM.partIndex]; }

function examOptionsFor(part, q){
  const idxs = part.optionOrder[q.id];
  const letters = ["A","B","C","D"];
  return idxs.map(function(origIdx,i){ return { text: q.options[origIdx], letter: letters[i], origLetter: letters[origIdx] }; });
}

function renderMockSession(){
  const part = currentExamPart();
  const q = QMAP[part.ids[part.index]];
  const opts = examOptionsFor(part, q);
  const ans = part.answers[q.id] || {};
  const answeredCount = Object.keys(part.answers).filter(function(id){return part.answers[id].selected;}).length;
  const isLastPart = EXAM.partIndex === EXAM.parts.length-1;

  const stepper = '<div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;">' +
    '<span class="pill pill-navy" style="font-weight:600;">'+EXAM.examTitle+'</span>' +
    EXAM.parts.map(function(p,i){
      let pillCls = "pill-muted", suffix = " · upcoming";
      if(i < EXAM.partIndex){ pillCls = "pill-good"; suffix = " · closed"; }
      else if(i === EXAM.partIndex){ pillCls = "pill-navy"; suffix = " · in progress"; }
      return '<span class="pill '+pillCls+'">Part '+(i+1)+suffix+'</span>';
    }).join("") +
  '</div>';

  let left = '<div class="qcard">';
  left += '<div class="qcard-meta"><span class="qcard-counter">'+part.label+' — Question '+(part.index+1)+' of '+part.ids.length+'</span>' +
    '<span style="flex:1;"></span>' +
    '<button class="icon-btn '+(ans.flagged?"on":"")+'" id="flag-btn" title="Flag for review">🚩</button></div>';
  left += '<div class="stem">'+escapeHtml(q.question)+'</div>';
  left += '<div class="options">';
  opts.forEach(function(o){
    const cls = "option" + (ans.selected===o.letter ? " selected":"");
    left += '<button class="'+cls+'" data-letter="'+o.letter+'"><span class="letter">'+o.letter+'</span><span class="txt">'+escapeHtml(o.text)+'</span></button>';
  });
  left += '</div>';
  left += '<div class="qcard-actions">' +
    '<button class="btn btn-ghost" id="mock-prev" '+(part.index===0?"disabled":"")+'>Previous</button>' +
    '<button class="btn btn-primary" id="mock-next" '+(part.index===part.ids.length-1?"disabled":"")+'>Next</button>' +
    '<span style="flex:1;"></span>' +
    '<button class="btn btn-danger" id="mock-submit">'+(isLastPart ? "Submit Exam" : "Finish Part "+(EXAM.partIndex+1))+'</button>' +
  '</div>';
  left += '</div>';

  let right = '<div class="card card-pad exam-side">' +
    '<div style="text-align:center;margin-bottom:14px;"><div style="font-size:11px;text-transform:uppercase;letter-spacing:0.06em;color:var(--ink-muted);">Time Remaining — Part '+(EXAM.partIndex+1)+'</div>' +
    '<div id="mock-timer" class="num" style="font-size:28px;font-weight:700;">'+fmtTime(part.remainingSec)+'</div></div>' +
    '<div style="display:flex;justify-content:space-between;font-size:12px;color:var(--ink-muted);margin-bottom:10px;"><span>'+answeredCount+' answered</span><span>'+(part.ids.length-answeredCount)+' remaining</span></div>' +
    '<div class="nav-grid">' +
    part.ids.map(function(id,i){
      const a = part.answers[id] || {};
      let cls = "";
      if(a.selected) cls += " answered";
      if(a.flagged) cls += " flagged";
      if(i===part.index) cls += " current";
      return '<button class="'+cls+'" data-jump="'+i+'">'+(i+1)+'</button>';
    }).join("") +
    '</div>' +
    '<div class="exam-legend" style="display:flex;gap:10px;margin-top:14px;font-size:11.5px;color:var(--ink-muted);flex-wrap:wrap;">' +
      '<span><span style="display:inline-block;width:9px;height:9px;background:var(--navy-tint);border:1px solid var(--navy);border-radius:2px;"></span> Answered</span>' +
      '<span><span style="display:inline-block;width:9px;height:9px;background:var(--gold-bg);border:1px solid var(--gold-border);border-radius:2px;"></span> Flagged</span>' +

  '</div>';

  return stepper + '<div class="exam-layout" style="display:grid;grid-template-columns:1fr 300px;gap:18px;align-items:start;">'+left+right+'</div>';
}

function attachMockSessionHandlers(){
  const part = currentExamPart();
  const q = QMAP[part.ids[part.index]];
  document.querySelectorAll(".option").forEach(function(btn){
    btn.addEventListener("click", function(){
      const letter = btn.getAttribute("data-letter");
      part.answers[q.id] = part.answers[q.id] || {};
      part.answers[q.id].selected = letter;
      renderView();
    });
  });
  const flag = document.getElementById("flag-btn");
  if(flag) flag.addEventListener("click", function(){
    part.answers[q.id] = part.answers[q.id] || {};
    part.answers[q.id].flagged = !part.answers[q.id].flagged;
    renderView();
  });
  const prev = document.getElementById("mock-prev");
  if(prev) prev.addEventListener("click", function(){ part.index = Math.max(0,part.index-1); renderView(); });
  const next = document.getElementById("mock-next");
  if(next) next.addEventListener("click", function(){ part.index = Math.min(part.ids.length-1,part.index+1); renderView(); });
  document.querySelectorAll("[data-jump]").forEach(function(btn){
    btn.addEventListener("click", function(){ part.index = Number(btn.getAttribute("data-jump")); renderView(); });
  });
  const submitBtn = document.getElementById("mock-submit");
  if(submitBtn) submitBtn.addEventListener("click", function(){
    const isLastPart = EXAM.partIndex === EXAM.parts.length-1;
    const unanswered = part.ids.length - Object.keys(part.answers).filter(function(id){return part.answers[id].selected;}).length;
    openModal({
      title: isLastPart ? "Submit exam?" : "Finish "+part.label+"?",
      body: (unanswered>0 ? "You have <strong>"+unanswered+"</strong> unanswered question(s) in this part. " : "You have answered every question in this part. ") +
            (isLastPart ? "Once submitted you cannot change your answers." : "Once you finish this part you cannot go back to change your answers — the exam moves straight to the next part."),
      confirmLabel: isLastPart ? "Submit Exam" : "Finish Part",
      onConfirm: function(){ finishExamPart(false); }
    });
  });
}

function finishExamPart(auto){
  clearInterval(examTimerHandle);
  const part = currentExamPart();
  part.status = "locked";
  part.finishedAt = Date.now();
  part.timeTakenSec = part.durationSec - part.remainingSec;
  let correct=0, incorrect=0, unanswered=0;
  part.ids.forEach(function(id){
    const q = QMAP[id];
    const a = part.answers[id] || {};
    if(!a.selected){ unanswered++; }
    else{
      const chosen = examOptionsFor(part, q).find(function(o){ return o.letter === a.selected; });
      if(chosen.origLetter === q.correctAnswer){ correct++; recordAnswer(id, chosen.origLetter, null); }
      else { incorrect++; recordAnswer(id, chosen.origLetter, null); }
    }
  });
  part.result = { correct: correct, incorrect: incorrect, unanswered: unanswered, total: part.ids.length, auto: !!auto };

  if(EXAM.partIndex < EXAM.parts.length - 1){
    const finishedLabel = part.label;
    activateExamPart(EXAM.partIndex + 1);
    renderView();
    toast((auto ? "Time's up — " : "") + finishedLabel + " is now closed. Starting " + EXAM.parts[EXAM.partIndex].label + ".");
  } else {
    submitMainExam();
  }
}

function submitMainExam(){
  clearInterval(examTimerHandle);
  examSavedClear();
  let correct=0, incorrect=0, unanswered=0, total=0;
  const topicBreakdown = {};
  const partResults = EXAM.parts.map(function(part){
    correct += part.result.correct; incorrect += part.result.incorrect; unanswered += part.result.unanswered; total += part.result.total;
    topicBreakdown[part.domain] = { correct: part.result.correct, total: part.result.total };
    return { label: part.label, domain: part.domain, correct: part.result.correct, incorrect: part.result.incorrect, unanswered: part.result.unanswered, total: part.result.total, timeTakenSec: part.timeTakenSec };
  });
  const timeTakenSec = partResults.reduce(function(s,p){return s+p.timeTakenSec;},0);
  const scorePct = pct(correct, total);
  const attempt = {
    id: "mock_"+Date.now(), mode: "main", examKey: EXAM.examKey, examTitle: EXAM.examTitle, dateStarted: EXAM.startedAt, dateFinished: Date.now(),
    correct: correct, incorrect: incorrect, unanswered: unanswered, total: total, pct: scorePct,
    timeTakenSec: timeTakenSec, topicBreakdown: topicBreakdown, parts: partResults
  };
  STATE.mockAttempts.push(attempt);
  STATE.bestMockScore = Math.max(STATE.bestMockScore||0, scorePct);
  logSession("mock", correct, total);
  saveState();
  EXAM.lastResult = attempt;
  track("mock_complete", { mode: EXAM.examKey, pct: scorePct, n: total, sec: timeTakenSec, data: { correct: correct, unanswered: unanswered, domains: topicBreakdown } });
  SUBVIEW = "mock-result"; render();
}

  let out = "";

    out += '<ellipse cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" rx="7" ry="16" transform="rotate('+rot.toFixed(1)+' '+x.toFixed(1)+' '+y.toFixed(1)+')" fill="url(#cg)"/>';

}

function renderCertificate(){

    '<h2 style="font-size:16px;margin-bottom:6px;">'+(c?"Certificate holder name":"Certificate unlocked")+'</h2>' +
    '<p style="color:var(--ink-muted);font-size:13px;margin-bottom:10px;">Type your name exactly as it should appear (check the spelling).</p>' +
    '<input id="cert-name" class="cert-name-input" type="text" maxlength="40" placeholder="Full name" value="'+escapeHtml(c?c.name:"")+'"/>' +
    '<div style="margin-top:12px;"><button class="btn btn-primary" id="cert-make">'+(c?"Update name":"Create my certificate")+'</button></div>' +
  '</div>';

function after_certificate(){
  const make = document.getElementById("cert-make");
  if(make) make.addEventListener("click", function(){
    const name = (document.getElementById("cert-name").value || "").replace(/\s+/g," ").trim();
    if(!name){ toast("Please type your name first."); return; }
    const el = certEligibility();
    if(!el.eligible) return;
    STATE.certificate = { name:name, issuedAt: (STATE.certificate && STATE.certificate.issuedAt) || new Date().toISOString(), via: el.via };
    track("certificate_created", { mode: el.via });
    saveState(); renderView(); toast("Certificate ready.");
  });
  const png = document.getElementById("cert-png");
  if(png) png.addEventListener("click", function(){
    const c = STATE.certificate; if(!c) return;
    const svg = certificateSVG(c.name, c.issuedAt);
    const img = new Image();
    img.onload = function(){
      const cv = document.createElement("canvas"); cv.width = 2160; cv.height = 1562;
      cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
      cv.toBlob(function(b){
        const a = document.createElement("a");
        a.href = URL.createObjectURL(b);
        a.download = "ETEC-Certificate-"+c.name.replace(/[^A-Za-z0-9]+/g,"-").replace(/^-|-$/g,"")+".png";
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000);
      }, "image/png");
    };
    img.onerror = function(){ toast("Could not create the PNG — use Print / Save as PDF instead."); };
    img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
  });
  const pr = document.getElementById("cert-print");
  if(pr) pr.addEventListener("click", function(){ window.print(); });
}

// ================= Weak Areas =================
function renderWeakAreas(){
  const cs = computeCategoryStats();
  const rows = CATEGORIES.map(function(c){ return Object.assign({category:c}, cs[c]); })
    .sort(function(a,b){ if(a.attempted===0 && b.attempted===0) return 0; if(a.attempted===0) return 1; if(b.attempted===0) return -1; return a.pct-b.pct; });
  const weakest3 = rows.filter(function(r){return r.attempted>0;}).slice(0,3).map(function(r){return r.category;});
  const dangerous = dangerousIds();

  let html = '<div class="card card-pad">';
  html += rows.map(function(r){
    const isWeak = weakest3.indexOf(r.category)!==-1;
    const barColor = r.attempted===0 ? "var(--border-strong)" : (r.pct>=80?"var(--good)":r.pct>=60?"var(--gold)":"var(--bad)");
    return '<div class="bar-row">' +
      '<div class="name">'+r.category+(isWeak?' <span class="pill pill-bad" style="margin-left:6px;">Weak</span>':'')+'</div>' +
      '<div class="bar-track"><div class="bar-fill" style="width:'+(r.attempted?r.pct:0)+'%;background:'+barColor+';"></div></div>' +
      '<div class="pct num">'+(r.attempted? r.pct+'%' : "—")+'</div>' +
    '</div>';
  }).join("");
  html += '</div>';

  html += '<div class="section-title"><h2>Practice Your Weak Areas</h2><span class="hint">Prioritizes questions you previously answered incorrectly</span></div>';
  html += '<div class="card card-pad" style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;">' +
    '<div style="font-size:13px;color:var(--ink-muted);">Weakest topics right now: '+(weakest3.length?weakest3.join(", "):"not enough data yet")+'</div>' +
    '<button class="btn btn-primary" id="practice-weak" '+(weakest3.length===0?"disabled":"")+'>Practice Weak Areas</button>' +
  '</div>';

  if(dangerous.length>0){
    html += '<div class="section-title"><h2>⚠ Dangerous Zone</h2><span class="hint">Answered incorrectly while "Very Sure" — these need priority attention</span></div>';
    html += '<div class="card card-pad">' + dangerous.slice(0,10).map(function(id){
      const q = QMAP[id];
      return '<div class="bar-row" style="grid-template-columns:1fr auto;"><div class="name">'+escapeHtml(q.question.slice(0,90))+(q.question.length>90?"…":"")+'</div><span class="pill pill-bad">'+q.category+'</span></div>';
    }).join("") + '</div>';
  }
  return html;
}
function after_weak(){
  const b = document.getElementById("practice-weak");
  if(b) b.addEventListener("click", function(){
    const cs = computeCategoryStats();
    const weakest3 = CATEGORIES.map(function(c){return Object.assign({category:c},cs[c]);})
      .filter(function(r){return r.attempted>0;}).sort(function(a,b2){return a.pct-b2.pct;}).slice(0,3).map(function(r){return r.category;});
    let pool = activeMistakes().map(function(id){return QMAP[id];}).filter(function(q){return weakest3.indexOf(q.category)!==-1;});
    if(pool.length < 5){
      const extra = QUESTIONS.filter(function(q){ return weakest3.indexOf(q.category)!==-1 && pool.indexOf(q)===-1; });
      pool = pool.concat(shuffle(extra));
    }
    const ids = shuffle(pool.map(function(q){return q.id;})).slice(0,20);
    startPracticeSession(ids, "Weak Areas Drill");
  });
}

let FLASH_ORDER = null;

let FLASH_FLIPPED = false;
function renderFlashcards(){
  if(!FLASH_ORDER) FLASH_ORDER = shuffle(FLASHCARDS.map(function(_,i){return i;}));
  const card = FLASHCARDS[FLASH_ORDER[FLASH_INDEX]];
  return '<div class="flash-stage">' +

      '<div class="flash-inner">' +
        '<div class="flash-face flash-front"><div class="tag">'+escapeHtml(card.topic||"Question")+'</div><div class="txt">'+escapeHtml(card.front)+'</div><div class="hint">Tap to Reveal</div></div>' +
        '<div class="flash-face flash-back"><div class="tag">Answer</div><div class="txt">'+escapeHtml(card.back)+'</div>' + (card.note?'<div class="hint" style="color:rgba(255,255,255,0.75);">'+escapeHtml(card.note)+'</div>':'') + '</div>' +
      '</div>' +

    '<div style="display:flex;gap:10px;">' +
      '<button class="btn btn-ghost" id="flash-prev" '+(FLASH_INDEX===0?"disabled":"")+'>Previous</button>' +
      '<button class="btn btn-ghost" id="flash-shuffle">Shuffle</button>' +
      '<button class="btn btn-primary" id="flash-next">'+(FLASH_INDEX===FLASHCARDS.length-1?"Restart":"Next")+'</button>' +
    '</div>' +
  '</div>';
}
function after_flashcards(){
  const c = document.getElementById("flash-card");
  if(c) c.addEventListener("click", function(){ FLASH_FLIPPED = !FLASH_FLIPPED; renderView(); });
  const prev = document.getElementById("flash-prev");
  if(prev) prev.addEventListener("click", function(){ FLASH_INDEX=Math.max(0,FLASH_INDEX-1); FLASH_FLIPPED=false; renderView(); });
  const next = document.getElementById("flash-next");
  if(next) next.addEventListener("click", function(){
    if(FLASH_INDEX>=FLASHCARDS.length-1){ FLASH_INDEX=0; FLASH_ORDER=shuffle(FLASHCARDS.map(function(_,i){return i;})); }
    else FLASH_INDEX++;
    FLASH_FLIPPED=false; renderView();
  });
  const sh = document.getElementById("flash-shuffle");
  if(sh) sh.addEventListener("click", function(){ FLASH_ORDER=shuffle(FLASHCARDS.map(function(_,i){return i;})); FLASH_INDEX=0; FLASH_FLIPPED=false; renderView(); });
}

    '<div class="two-col" style="margin-top:16px;">' +
      '<div class="card card-pad"><h2 style="font-size:14.5px;margin-bottom:12px;">Score History</h2><div style="height:300px;"><canvas id="chart-history"></canvas></div></div>' +
      '<div class="card card-pad"><h2 style="font-size:14.5px;margin-bottom:12px;">Topic Radar</h2><div style="height:300px;"><canvas id="chart-radar"></canvas></div></div>' +
    '</div>';
}

function after_analytics(){
  destroyCharts();
  const overall = computeOverall();
  if(overall.attempted === 0) return;
  if(typeof Chart === "undefined"){
    document.querySelectorAll("#chart-topic, #chart-donut, #chart-history, #chart-radar").forEach(function(c){
      const wrap = c.closest("div");
      if(wrap) wrap.innerHTML = '<div class="empty" style="padding:20px 10px;">Chart library unavailable right now — your stats above are still tracked and will render here once it loads.</div>';
    });
    return;
  }
  const ink = cssVar("--ink") || "#161E54";
  const inkMuted = cssVar("--ink-muted") || "#5C6287";
  const border = cssVar("--border") || "#DCDEE8";
  const navy = cssVar("--navy") || "#161E54";
  const good = cssVar("--good") || "#1E7A4C";
  const bad = cssVar("--bad") || "#A8201A";
  const gold = cssVar("--gold") || "#8A5A00";
  Chart.defaults.font.family = (getLang()==="ar" ? "IBM Plex Sans Arabic, " : "") + "IBM Plex Sans, sans-serif";
  Chart.defaults.color = inkMuted;
  Chart.defaults.locale = getLang()==="ar" ? "ar-u-nu-arab" : undefined;

  const cs = computeCategoryStats();
  const catRows = CATEGORIES.map(function(c){ return Object.assign({category:c}, cs[c]); }).filter(function(r){return r.attempted>0;})
    .sort(function(a,b){return a.pct-b.pct;});

  const topicCanvas = document.getElementById("chart-topic");
  if(topicCanvas){
    chartInstances.topic = new Chart(topicCanvas, {
      type: "bar",
      data: {
        labels: catRows.map(function(r){return tr(r.category);}),
        datasets: [{ label:tr("Accuracy %"), data: catRows.map(function(r){return r.pct;}),
          backgroundColor: catRows.map(function(r){ return r.pct>=80?good:r.pct>=60?gold:bad; }), borderRadius:4 }]
      },
      options: { indexAxis:"y", responsive:true, maintainAspectRatio:false,
        scales:{ x:{min:0,max:100,grid:{color:border}, ticks:{color:inkMuted}}, y:{grid:{display:false}, ticks:{color:ink,font:{size:11}}} },
        plugins:{ legend:{display:false} } }
    });
  }
  const donutCanvas = document.getElementById("chart-donut");
  if(donutCanvas){
    chartInstances.donut = new Chart(donutCanvas, {
      type: "doughnut",
      data: { labels:[tr("Correct"),tr("Incorrect")], datasets:[{ data:[overall.correct, overall.incorrect], backgroundColor:[good,bad], borderWidth:0 }] },
      options: { responsive:true, maintainAspectRatio:false, plugins:{ legend:{position:"bottom", labels:{color:ink}} } }
    });
  }
  const histCanvas = document.getElementById("chart-history");
  if(histCanvas){
    const hist = STATE.sessionHistory.slice(-20);
    chartInstances.history = new Chart(histCanvas, {
      type: "line",
      data: { labels: hist.map(function(h){return fmtDate(h.date);}),
        datasets:[{ label:tr("Session score %"), data: hist.map(function(h){return h.pct;}), borderColor:navy, backgroundColor:navy, tension:0.3, pointRadius:3, fill:false }] },
      options: { responsive:true, maintainAspectRatio:false,
        scales:{ y:{min:0,max:100,grid:{color:border},ticks:{color:inkMuted}}, x:{grid:{display:false},ticks:{color:inkMuted}} },
        plugins:{ legend:{display:false} } }
    });
  }
  const radarCanvas = document.getElementById("chart-radar");
  if(radarCanvas){
    const allCats = CATEGORIES.map(function(c){ return Object.assign({category:c}, cs[c]); });
    chartInstances.radar = new Chart(radarCanvas, {
      type: "radar",
      data: { labels: allCats.map(function(r){const c = tr(r.category); return c.length>14?c.slice(0,13)+"…":c;}),
        datasets:[{ label:tr("Accuracy %"), data: allCats.map(function(r){return r.attempted? r.pct : 0;}), borderColor:navy, backgroundColor:"rgba(18,50,98,0.18)", pointBackgroundColor:navy }] },
      options: { responsive:true, maintainAspectRatio:false,
        scales:{ r:{min:0,max:100,grid:{color:border},angleLines:{color:border},pointLabels:{color:inkMuted,font:{size:9.5}},ticks:{display:false}} },
        plugins:{ legend:{display:false} } }
    });
  }
}

// ================= Search =================
function renderSearchResults(){
  const q = (SEARCH_QUERY||"").trim().toLowerCase();
  if(q.length<2) return '<div class="empty">Type at least two characters to search.</div>';
  const qMatches = QUESTIONS.filter(function(item){
    return item.question.toLowerCase().indexOf(q)!==-1 || item.explanation.toLowerCase().indexOf(q)!==-1 ||
      item.category.toLowerCase().indexOf(q)!==-1 || item.options.some(function(o){return o.toLowerCase().indexOf(q)!==-1;});
  }).slice(0,15);
  const revMatches = [];
  REVISION_SECTIONS.forEach(function(sec){
    const hay = (sec.title + " " + JSON.stringify(sec)).toLowerCase();
    if(hay.indexOf(q)!==-1) revMatches.push(sec);
  });
  const trapMatches = EXAM_TRAPS.filter(function(t){ return (t.a+t.aBody+t.b+t.bBody).toLowerCase().indexOf(q)!==-1; });
  const rapidMatches = RAPID_REVIEW.filter(function(r){ return (r.k+r.v).toLowerCase().indexOf(q)!==-1; });

  let html = '<div class="section-title"><h2>Search results for "'+escapeHtml(SEARCH_QUERY)+'"</h2></div>';
  if(qMatches.length===0 && revMatches.length===0 && trapMatches.length===0 && rapidMatches.length===0){
    return html + '<div class="empty">No matches in questions, revision notes, or exam traps.</div>';
  }
  if(qMatches.length){
    html += '<h3 style="font-size:13px;margin:14px 0 8px;color:var(--ink-muted);">QUESTIONS ('+qMatches.length+')</h3><div class="card card-pad">' +
      qMatches.map(function(item){ return '<div class="bar-row" style="grid-template-columns:1fr auto;cursor:pointer;" data-search-retry="'+item.id+'"><div class="name">'+escapeHtml(item.question.slice(0,110))+'</div><span class="pill pill-navy">'+item.category+'</span></div>'; }).join("") +
      '</div>';
  }
  if(revMatches.length){
    html += '<h3 style="font-size:13px;margin:14px 0 8px;color:var(--ink-muted);">CONCEPTS</h3><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr));">' +
      revMatches.map(function(sec){ return '<div class="rev-card"><h3>'+sec.title+'</h3><p style="font-size:12.5px;color:var(--ink-muted);">Open the Revision page for full notes.</p></div>'; }).join("") + '</div>';
  }
  if(rapidMatches.length){
    html += '<h3 style="font-size:13px;margin:14px 0 8px;color:var(--ink-muted);">RAPID FACTS</h3><div class="card card-pad">' +
      rapidMatches.map(function(r){ return '<div class="bar-row" style="grid-template-columns:1fr auto;"><div class="name">'+r.k+'</div><span class="pill pill-muted">'+r.v+'</span></div>'; }).join("") + '</div>';
  }
  if(trapMatches.length){
    html += '<h3 style="font-size:13px;margin:14px 0 8px;color:var(--ink-muted);">EXAM TRAPS</h3><div class="card card-pad">' +
      trapMatches.map(function(t){ return '<div class="bar-row" style="grid-template-columns:1fr auto;"><div class="name">'+t.a+' vs '+t.b+'</div></div>'; }).join("") + '</div>';
  }
  return html;
}
function attachSearchHandlers(){
  document.querySelectorAll('[data-search-retry]').forEach(function(el){
    el.addEventListener("click", function(){ SEARCH_QUERY=""; startRetry(Number(el.getAttribute("data-search-retry"))); });
  });
}

// ================= Boot =================
document.addEventListener("DOMContentLoaded", function(){
  if(authEnabled()){
    if(!signedIn()){ SESSION = null; saveSession(); renderSignIn(); }
    else if(!SESSION.user.profile_done) renderProfileForm(true);
    else startApp();
    return;
  }
  telemetryInit();
  render();
});
</script>
